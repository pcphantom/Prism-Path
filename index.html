<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0714">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PRISM PURGE</title>

<!-- The title artwork is the first thing the player looks at, and it is
     reached through a CSS background, which the browser cannot discover
     until it has parsed the stylesheet below. Naming it here lets the
     preload scanner start it immediately and at the priority it deserves,
     ahead of the music the title screen also asks for. -->
<link rel="preload" as="image" href="images/title_screen_bg.webp" fetchpriority="high">

<style>
  :root {
    --bg-deep: #08061199;
    --panel: rgba(24, 18, 44, 0.82);
    --panel-edge: rgba(150, 120, 255, 0.28);
    --ink: #efe9ff;
    --ink-dim: #a99fc9;
    --accent: #b07cff;
    --danger: #ff5470;
    --good: #45e08a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);

    /* The label sits beside the number rather than above it, so a stat
       box only has to be tall enough for one line of text. The goal bar
       carries a 22px icon, so it gets a couple of pixels more. Both are
       kept as small as their contents allow, because every pixel saved
       here is a pixel the nine row board gets to use. */
    /* The roomy layout, with the label sitting above the number. This is
       what the top of the screen wants to be, and on most phones there
       is height going spare to pay for it. chooseHudSize drops to the
       compact set below only when keeping this one would cost the board
       a row's worth of cell size. */
    --hud-box-height: 46px;
    --goal-box-height: 46px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #06040d;
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #app {
    isolation: isolate;
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: calc(6px + var(--safe-top)) 8px calc(6px + var(--safe-bottom)) 8px;
    gap: 6px;
  }

  /* ---------------------------------------------------------------- HUD */

  #hud {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  #topRow {
    display: flex;
    align-items: stretch;
    gap: 6px;
  }

  /* Roomy layout: the three boxes split the row evenly and each stacks
     its label above its number. */
  .stat {
    flex: 1 1 0;
    min-height: var(--hud-box-height);
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 5px 8px;
    min-width: 0;
    display: flex;
    align-items: stretch;
  }

  .statBody {
    flex: 1 1 auto;
    min-width: 0;
  }

  .stat .label {
    display: block;
    font-size: 10px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .stat .value {
    display: block;
    min-width: 0;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }

  #limitStat.alarm .value { color: var(--danger); }

  /* ------------------------------------------------- compact HUD */

  /* Worn only when the roomy layout would squeeze the board. Label and
     number go on one line, which takes 30px off the height of the top of
     the screen and hands it to the nine rows. Moves never needs room for
     more than two digits and level rarely more than three, so those two
     shrink to their contents and the score box takes what is left. */
  #app.compactHud {
    --hud-box-height: 30px;
    --goal-box-height: 32px;
  }

  #app.compactHud .stat {
    padding: 4px 7px;
    align-items: center;
    gap: 4px;
  }

  #app.compactHud .statBody {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  #app.compactHud #scoreStat { flex: 1 1 0; }
  #app.compactHud #limitStat { flex: 0 0 auto; }
  #app.compactHud #levelStat { flex: 0 0 auto; }

  /* The colon only belongs to the one line reading, so the markup does
     not carry it. */
  #app.compactHud .stat .label {
    display: inline;
    font-size: 9px;
    letter-spacing: 0.4px;
  }

  #app.compactHud .stat .label::after { content: ":"; }

  #app.compactHud .stat .value {
    display: inline-block;
    font-size: 18px;
    line-height: 1.15;
    text-overflow: clip;
  }

  /* Fixed pixels rather than ch units, because a ch shrinks along with
     the font and the box would run away from the text it is trying to
     hold. Anything longer has its text stepped down by fitValueText. */
  #app.compactHud #scoreValue { flex: 1 1 auto; }
  #app.compactHud #limitValue { flex: 0 0 auto; min-width: 22px; max-width: 26px; }
  #app.compactHud #levelValue { flex: 0 0 auto; min-width: 22px; max-width: 34px; }

  /* The level box carries the hint button on its right edge, the way
     the goal bar carries the menu button. The padding moves off the box
     and onto the text beside it, so the button can reach the edges. */
  /* The button reaches the edges of the level box with a negative
     margin, so the box keeps the padding every stat box has and the row
     is laid out exactly as it would be without a button in it. */
  #hintBtn {
    flex: 0 0 auto;
    align-self: stretch;
    width: 40px;
    margin: -5px -8px -5px 0;
    padding: 0;
    font-size: 20px;
    font-weight: bold;
    line-height: 1;
    border-radius: 0 11px 11px 0;
    border: 0;
    border-left: 1px solid var(--panel-edge);
    background: rgba(255, 255, 255, 0.07);
  }

  /* The margin has to follow the padding the compact boxes use, or the
     button stops reaching their edges. */
  #app.compactHud #hintBtn {
    width: 32px;
    margin: -4px -7px -4px 0;
    font-size: 17px;
  }

  #hintBtn:active { background: rgba(255, 255, 255, 0.16); }

  /* The bulb is drawn rather than typed, because a light that has to
     come on in yellow needs a colour something else can set. The glass
     and the two lines of the base take their colour from the button, so
     lighting it is a single property.

     The viewBox is cropped to what the artwork actually covers, stroke
     included. The 24 by 24 box the icon was drawn on wasted about a
     seventh of its width and a quarter of its height on empty margin and
     sat the bulb off centre. Cropping it fills more of the button while
     the button stays exactly the size it was. */
  #hintBtn svg {
    display: block;
    width: 27px;
    height: 27px;
    margin: 0 auto;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #app.compactHud #hintBtn svg { width: 23px; height: 23px; }

  /* Every state below is written as "#app #hintBtn", two ids deep. The
     HD chrome sets a colour on "#app.hdChrome button", which outweighs a
     plain id and used to pin the bulb to the chrome's white in every
     state: HD never dimmed it and never lit it yellow. Two ids outweigh
     the chrome, so both appearances now behave the same. */

  /* A plain white bulb with no rays while there is nothing to say, so an
     unlit bulb cannot be read as a lit one. */
  #app #hintBtn { color: var(--ink); }

  /* Visibility rather than opacity, because anything below full opacity
     puts the element on its own composited layer, and inside a fixed
     position app that leaves a seam down the edge of the screen where
     the browser fails to repaint. Visibility also holds the glyph's
     place in the box, so the bulb stays put when it lights. */
  #app #hintBtn .bulbRays { visibility: hidden; stroke: currentColor; }

  /* Lit the moment a hint is ready, which is not the same as the hint
     being drawn on the board. The player can put the trail away and the
     bulb stays on, because the suggestion is still there to ask for.

     The colour and the six rays arrive together on purpose. The rays say
     "lit" to a player who cannot tell the yellow from the white. */
  #app #hintBtn.lit { color: #ffd23f; }
  #app #hintBtn.lit .bulbRays { visibility: visible; }

  /* A solid colour, not a translucent one. Nothing in this button is
     allowed to need a layer of its own. */
  #app #hintBtn.lit .bulbGlass { fill: #5c4d1e; }

  /* Same height as the stat boxes above, so the top of the screen
     reads as one block. */
  #goalBar {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 0 0 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: var(--goal-box-height);
  }

  #goalText {
    font-size: 15px;
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    /* The icon sits on the text baseline row, so the line has to be
       tall enough to hold it without the bar growing. */
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* The gem or stone the goal is asking for, drawn by the board's own
     code. Never squashed by the flex row it sits in. */
  .goalIcon {
    flex: 0 0 auto;
    display: block;
  }

  /* Holds the icon. On Standard it is a box that fits its contents and
     changes nothing; HD turns it into a recessed socket. */
  .goalSocket {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #goalCount {
    font-size: 15px;
    font-weight: bold;
    color: var(--accent);
    flex: 0 0 auto;
  }

  #goalTrack {
    flex: 0 0 90px;
    height: 8px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }

  #goalFill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #7c5cff, #45e08a);
    transition: width 0.25s ease-out;
  }

  /* -------------------------------------------------------------- stage */

  #stage {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #board {
    display: block;
    touch-action: none;
  }

  /* ----------------------------------------------------------- controls */

  #controls {
    flex: 0 0 auto;
    display: flex;
    gap: 6px;
    align-items: stretch;
  }

  button {
    font-family: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 9px 6px;
    font-size: 12px;
    letter-spacing: 0.6px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
  }

  button:active { transform: scale(0.94); }

  .iconBtn {
    flex: 0 0 52px;
    font-size: 18px;
    padding: 8px 0;
  }

  /* Full height of the goal bar, and wide enough to hit with a
     thumb without looking. */
  #menuBtn {
    flex: 0 0 auto;
    align-self: stretch;
    width: 52px;
    padding: 0;
    font-size: 21px;
    line-height: 1;
    border-radius: 0 11px 11px 0;
    border: 0;
    border-left: 1px solid var(--panel-edge);
    background: rgba(255, 255, 255, 0.07);
  }

  #menuBtn:active { background: rgba(255, 255, 255, 0.16); }

  #controls {
    flex-direction: column;
    gap: 4px;
  }

  #chargeRow {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 2px;
  }

  #chargeLabel,
  #chargeValue {
    flex: 0 0 auto;
    font-size: 10px;
    letter-spacing: 1.2px;
    color: var(--ink-dim);
  }

  #chargeValue {
    font-weight: bold;
    color: var(--ink);
    min-width: 44px;
    text-align: right;
  }

  #chargeTrack {
    position: relative;
    flex: 1 1 auto;
    height: 14px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  #chargeFill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #7c5cff, #4fd6ff, #45e08a);
    transition: width 0.25s ease-out;
  }

  /* One notch per item, so the bar shows how close the next one is. */
  #chargeTicks {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .chargeTick {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    margin-left: -1px;
    background: rgba(10, 6, 20, 0.75);
  }

  .chargeTick.reached { background: rgba(255, 255, 255, 0.85); }

  #itemRow {
    display: flex;
    gap: 5px;
  }

  .itemBtn {
    flex: 1 1 0;
    min-width: 0;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 2px;
    opacity: 0.4;
  }

  .itemBtn .glyph { font-size: 22px; line-height: 1; }

  .itemBtn .name {
    font-size: 10px;
    line-height: 1;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* Both of these are in the markup for HD's benefit and are nothing to
     Standard. display:none rather than left alone, because .itemBtn is
     a flex column with a gap and an empty span would still buy a gap. */
  .itemBtn .cost { display: none; }
  .itemBtn .fuel { display: none; }

  .itemBtn.ready {
    opacity: 1;
    border-color: rgba(176, 124, 255, 0.6);
    background: rgba(124, 92, 255, 0.16);
  }

  .itemBtn.armed {
    opacity: 1;
    color: #fff;
    border-color: var(--good);
    background: rgba(69, 224, 138, 0.22);
    animation: pulse 1.1s ease-in-out infinite;
  }

  /* A hint pointing at an item. Cyan, because the ready state is
     already violet and the armed state is already green: with the
     charge bar full every button is lit, and the one being suggested
     has to be the one that stands out. */
  .itemBtn.hinted {
    opacity: 1;
    color: #fff;
    border-color: #4fd6ff;
    background: rgba(79, 214, 255, 0.22);
    animation: hintPulse 1.4s ease-in-out infinite;
  }

  @keyframes hintPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(79, 214, 255, 0.55); }
    50%      { box-shadow: 0 0 18px 4px rgba(79, 214, 255, 0.55); }
  }

  /* ------------------------------------------------------------ menu */

  #menuPanel {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(6, 4, 13, 0.9);
    backdrop-filter: blur(3px);

    /* Above the front end screens, which sit at 30. Settings is reached
       from the main menu as well as from a paused game, and it has to
       float over both. #stage carries no z-index of its own, so this
       number competes with the screens directly. */
    z-index: 40;
  }

  #menuPanel.hidden { display: none; }

  /* Same rule as the card: never taller than the space it is in, and
     scrolls when the list does not fit. Seven items on a short phone
     would otherwise run off the bottom. */
  #menuCard {
    width: 100%;
    max-width: 300px;
    max-height: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
    background: linear-gradient(160deg, rgba(40, 28, 74, 0.96), rgba(18, 12, 34, 0.96));
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
  }

  #menuCard h2 {
    margin: 0 0 12px 0;
    font-size: 19px;
    text-align: center;
    letter-spacing: 1px;
    color: var(--ink);
  }

  .menuItem {
    display: block;
    width: 100%;
    margin-bottom: 7px;
    padding: 11px;
    font-size: 14px;
    text-align: center;
  }

  .menuItem.danger { color: var(--danger); border-color: rgba(255, 84, 112, 0.4); }

  /* ----------------------------------------------- settings submenu */

  #menuMain.hidden, #settingsPage.hidden, #backgroundPage.hidden { display: none; }

  /* Gameplay artwork sits below the existing chrome. The stage keeps
     its stacking order so pause settings can still cover the title. */
  #gameBackdrop {
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-position: center;
    background-repeat: no-repeat;
  }

  #gameBackdrop.hidden, #backgroundError.hidden { display: none; }

  #backgroundError {
    flex: 0 0 auto;
    margin: 0;
    padding: 8px;
    color: var(--danger);
    background: var(--panel);
    font-size: 12px;
  }

  .backgroundModes {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    margin-bottom: 10px;
  }

  #backgroundPreview {
    display: block;
    width: 100%;
    height: 120px;
    object-fit: contain;
    margin-bottom: 8px;
  }

  #backgroundPreview.hidden { display: none; }
  #backgroundChoices .menuItem { min-height: 44px; }

  /* One channel per box, so the toggle and the slider that belong
     together read as a pair. */
  .settingGroup {
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    padding: 10px;
    margin-bottom: 9px;
  }

  .settingGroup .menuItem { margin-bottom: 0; }

  .sliderRow {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 10px;
  }

  .sliderLabel {
    flex: 0 0 auto;
    font-size: 10px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .sliderRow output {
    flex: 0 0 36px;
    text-align: right;
    font-size: 12px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  /* Wider than the volume readouts, because it has to say whether the
     delay is the one the player picked or the one the level chose. */
  #hintReadout { flex: 0 0 62px; }

  /* Graphics is the one setting whose name does not explain itself, so
     it gets a line under the button saying what the choice costs. */
  .settingNote {
    margin: 9px 2px 1px;
    font-size: 11px;
    line-height: 1.45;
    color: var(--ink-dim);
    text-align: center;
  }

  /* A muted channel keeps its slider on screen so the level stays
     readable, and dims it to say it is doing nothing right now. */
  .settingGroup.off .sliderRow { opacity: 0.38; }

  /* Shimmer lives in the graphics group because it only means anything
     on HD, so it sits under the graphics note and needs a gap to stand
     it off the line above. */
  #shimmerToggle { margin-top: 9px; }

  /* Standard has no shimmer to switch, so the button goes quiet. This is
     the only disabled button in the game. */
  .settingGroup .menuItem:disabled { opacity: 0.38; cursor: default; }

  input[type="range"] {
    flex: 1 1 auto;
    min-width: 0;
    height: 22px;
    margin: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid var(--panel-edge);
  }

  input[type="range"]::-webkit-slider-thumb {
    width: 18px;
    height: 18px;
    margin-top: -7px;
    border-radius: 50%;
    background: var(--accent);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 8px rgba(176, 124, 255, 0.55);
    -webkit-appearance: none;
    appearance: none;
  }

  input[type="range"]::-moz-range-track {
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid var(--panel-edge);
  }

  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 8px rgba(176, 124, 255, 0.55);
  }

  /* Printed in the settings panel when the music file will not load, so
     the player learns why it is silent instead of guessing. */
  #musicNote {
    margin: 0 0 10px 0;
    font-size: 11px;
    line-height: 1.4;
    text-align: center;
    color: var(--danger);
  }

  #musicNote.hidden { display: none; }

  #cardBtnAlt {
    width: 100%;
    margin-top: 8px;
    padding: 11px;
    font-size: 14px;
  }

  #cardBtnAlt.hidden { display: none; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(176, 124, 255, 0.5); }
    50%      { box-shadow: 0 0 16px 3px rgba(176, 124, 255, 0.5); }
  }

  /* ---------------------------------------------------------- overlays */

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(6, 4, 13, 0.86);
    backdrop-filter: blur(3px);
    z-index: 10;
  }

  #overlay.hidden { display: none; }

  /* The card is never taller than the space it sits in. Anything that
     does not fit scrolls inside it, so a long rules list can never push
     the buttons off the bottom of a phone screen. */
  #card {
    width: 100%;
    max-width: 340px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    background: linear-gradient(160deg, rgba(40, 28, 74, 0.96), rgba(18, 12, 34, 0.96));
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 20px 18px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);

    /* On a screen too short even for the shrunk down regions inside,
       the whole card scrolls. A landscape phone leaves the stage about
       180px tall, which is the case that needs this. */
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }

  /* Everything except the scrolling middle keeps its natural height. */
  #cardTitle, #cardSub, #cardStats, #cardBtn, #cardBtnAlt {
    flex: 0 0 auto;
  }

  /* The four gem colours run through the lettering. Worn by the in-run
     card and by every front end screen, so the game has one title face
     and one place to change it. */
  .gemTitle {
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff6ea9, #b07cff, #4fd6ff, #45e08a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  #cardTitle {
    font-size: 27px;
    margin: 0 0 4px 0;
  }

  #cardSub {
    font-size: 13px;
    color: var(--ink-dim);
    margin: 0 0 14px 0;
  }

  #cardBody {
    font-size: 13px;
    line-height: 1.55;
    text-align: left;
    color: #d9d2f2;
    margin-bottom: 16px;

    /* The scrolling middle. min-height lets it shrink below its content
       so overflow-y actually has something to do. */
    flex: 1 1 auto;
    min-height: 90px;
    overflow-y: auto;
    overscroll-behavior: contain;

    /* The page switches touch gestures off so drags on the board read
       cleanly. Vertical dragging has to be handed back here, or the
       rules cannot be scrolled with a finger. */
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }

  #cardBody b { color: #fff; }

  #cardBtn {
    width: 100%;
    padding: 13px;
    font-size: 16px;
    font-weight: bold;
    background: linear-gradient(90deg, #7c5cff, #b07cff);
    border-color: transparent;
  }

  #cardStats {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-bottom: 15px;
  }

  #cardStats div { text-align: center; }
  #cardStats .n { font-size: 23px; font-weight: bold; }
  #cardStats .k {
    font-size: 10px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }

  #toast {
    position: absolute;
    left: 50%;
    top: 14%;
    transform: translate(-50%, 0);
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;
    pointer-events: none;
    opacity: 0;
    z-index: 5;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    white-space: nowrap;
  }

  /* ----------------------------------------------------------- screens */

  /* The front end: main menu, mode select, mode start and the rules.

     A screen covers the whole app, which is why these are siblings of
     the HUD rather than living inside the stage the way the in-run card
     does. That difference is the point. A card belongs to a game in
     progress and deliberately leaves the HUD showing above it. A screen
     replaces the game entirely, so the HUD and the item row have no
     business being visible behind one. */
  .screen {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    justify-content: center;
    padding: calc(18px + var(--safe-top)) 16px calc(18px + var(--safe-bottom)) 16px;
    background: linear-gradient(165deg, #1a1140, #0b0719 58%, #06040d);
  }

  .screen.hidden { display: none; }

  /* The same three part shape the card uses: a head and a foot that keep
     their natural height, and a middle that shrinks and scrolls when the
     screen is too short to hold everything. A landscape phone leaves
     about 180px of height, which is the case that needs it. */
  .screenInner {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    text-align: center;
  }

  .screenTitle {
    flex: 0 0 auto;
    font-size: 32px;
    margin: 0 0 4px 0;
  }

  .screenSub {
    flex: 0 0 auto;
    font-size: 13px;
    color: var(--ink-dim);
    margin: 0 0 16px 0;
  }

  /* The scrolling middle. min-height lets it shrink below its content so
     overflow-y has something to do, and the page turns touch gestures
     off globally so vertical dragging has to be handed back here. */
  .screenBody {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }

  /* Sits below the scrolling middle and never scrolls with it, so Back
     is always where the thumb left it. */
  .screenFoot {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 12px;
  }

  /* Tall targets with a real gap between them, so a thumb cannot start a
     new run while reaching for the rules. */
  .screenBtn {
    width: 100%;
    padding: 15px 10px;
    font-size: 16px;
    letter-spacing: 0.8px;
  }

  .screenBtn.primary {
    font-weight: bold;
    background: linear-gradient(90deg, #7c5cff, #b07cff);
    border-color: transparent;
  }

  .screenBtn.hidden { display: none; }

  /* The title menu uses the artwork's dark centre for one compact group.
     Its own container tracks the game column, including desktop's width
     cap. Aspect queries preserve more of the gem frame on extreme sizes. */
  #app #mainMenuScreen {
    container: titleMenu / size;
    background: #080617;
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }

  #mainMenuScreen .titleBackdrop {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(ellipse at center, rgba(8, 6, 23, 0.48), transparent 72%),
      url("images/title_screen_bg.webp");
    background-position: center;
    background-repeat: no-repeat;
    background-size: 100% 100%, cover;
  }

  #mainMenuScreen .screenInner {
    position: relative;
    z-index: 1;
    flex: 0 0 auto;
    width: min(76%, 300px);
    max-width: none;
    margin-block: auto;
    padding-block: 12px;
  }

  #mainMenuScreen .screenTitle {
    font-size: clamp(26px, 7.5cqw, 38px);
    line-height: 1.12;
    letter-spacing: 0.5px;
    filter: drop-shadow(0 2px 5px #080617);
  }

  #app #mainMenuScreen .screenSub {
    color: #e0d9ef;
    font-size: clamp(12px, 3.2cqw, 14px);
    line-height: 1.5;
    margin: 8px 0 clamp(14px, 3cqh, 24px);
    text-shadow: 0 2px 4px #080617;
  }

  #mainMenuScreen .screenBody {
    flex: 0 0 auto;
    overflow: visible;
  }

  #mainMenuWarning:empty { display: none; }

  #mainMenuWarning:not(:empty) {
    margin-bottom: 14px;
    padding: 12px;
    border-radius: 12px;
    background: rgba(8, 6, 23, 0.94);
    text-align: left;
  }

  #mainMenuScreen .screenFoot {
    padding-top: 0;
    gap: clamp(8px, 1.4cqh, 12px);
  }

  #app #mainMenuScreen .screenBtn {
    min-height: 44px;
    padding: clamp(10px, 1.7cqh, 15px) 10px;
    font-size: clamp(14px, 3.8cqw, 16px);
    color: #f4efff;
    background: rgba(20, 14, 39, 0.92);
    border: 1px solid rgba(187, 153, 255, 0.5);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }

  #app #mainMenuScreen .screenBtn.primary {
    background: linear-gradient(100deg, #6943d6, #9b64ed);
    border-color: #c8a5ff;
    box-shadow: 0 4px 20px rgba(116, 64, 215, 0.45);
  }

  #app #mainMenuScreen .screenBtn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }

  /* Scaling the complete illustration uniformly keeps every gem's shape.
     At these ratios cover would crop away much of the surrounding frame. */
  @container titleMenu (max-aspect-ratio: 2 / 5) or (min-aspect-ratio: 4 / 5) {
    #mainMenuScreen .titleBackdrop {
      background-size: 100% 100%, contain;
    }
  }

  @container titleMenu (max-height: 450px) {
    #mainMenuScreen .screenTitle { font-size: 26px; }
    #mainMenuScreen .screenSub { margin: 4px 0 12px; }
    #mainMenuScreen .screenInner { padding-block: 4px; }
  }

  /* The one button on a screen that destroys something. */
  .screenBtn.danger {
    color: var(--danger);
    border-color: rgba(255, 84, 112, 0.42);
  }

  /* A row of choices where one is worn, side by side so the pick is read
     against the ones it was picked over. Used by the difficulty selector
     and by the setup tour. */
  .pickRow {
    display: flex;
    gap: 8px;
  }

  .pickRow.hidden { display: none; }

  .pickBtn {
    flex: 1 1 0;
    padding: 11px 4px;
    font-size: 14px;
    letter-spacing: 0.6px;
  }

  .pickBtn.picked {
    font-weight: bold;
    background: linear-gradient(90deg, #7c5cff, #b07cff);
    border-color: transparent;
    color: #fff;
  }

  /* The Custom setup screen: one row per rule, the name on the left and
     the control on the right, with a note under the rows that need one.
     The controls are the pick buttons the difficulty selector already
     uses, so the screen reads as one family. */
  .ruleRows {
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
  }

  .ruleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .ruleRow.stacked {
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }

  .ruleLabel {
    font-size: 14px;
    letter-spacing: 0.4px;
    color: var(--ink);
    flex: 1 1 auto;
  }

  .ruleControls {
    display: flex;
    gap: 6px;
    align-items: center;
    flex: 0 0 auto;
  }

  .ruleControls .pickBtn {
    flex: 0 0 auto;
    min-width: 58px;
    padding: 9px 10px;
  }

  /* Four game types is one too many for one line on a phone, so the row
     wraps two and two. */
  .ruleRow.stacked .pickRow { flex-wrap: wrap; }
  .ruleRow.stacked .pickRow .pickBtn { flex: 1 1 40%; min-width: 0; }

  /* A minus, the number, a plus. The number is wide enough for two
     digits so the buttons never shift as it changes. */
  .stepper {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .stepper .pickBtn {
    min-width: 38px;
    padding: 9px 0;
    font-size: 16px;
    line-height: 1;
  }

  .stepper .pickBtn:disabled {
    opacity: 0.32;
    cursor: default;
  }

  .stepperValue {
    min-width: 28px;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    color: var(--ink);
  }

  .ruleControls .pickBtn:disabled {
    opacity: 0.38;
    cursor: default;
  }

  .ruleNote {
    font-size: 12px;
    color: var(--ink-dim);
    line-height: 1.5;
    margin: -4px 0 0 0;
  }

  .ruleNote.hidden { display: none; }

  /* Two live pictures of the same gems under two different settings. */
  .tourPanels {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .tourPanelArt {
    display: block;
    border-radius: 8px;
  }

  .tourNav {
    display: flex;
    gap: 8px;
  }

  .tourNav .screenBtn { flex: 1 1 0; }

  /* Says what the picked difficulty actually changes, so the three words
     above are a choice and not a guess. */
  #difficultyNote {
    min-height: 30px;
    margin: 0;
  }

  /* One mode: its picture on the left, what it is on the right. */
  .modeTile {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    text-align: left;
  }

  .modeTile .modeWords {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  /* Painted by the game's own routines, so it never needs a size from
     here. Both dimensions are set on the element as it is built. */
  .modeTileArt {
    flex: 0 0 auto;
    display: block;
    border-radius: 8px;
  }

  /* The larger copy on the mode start screen, which is centred over the
     rules rather than sitting beside them. */
  .modeStartArt {
    align-self: center;
    margin-bottom: 6px;
  }

  .modeTile .modeName {
    font-size: 17px;
    letter-spacing: 0.8px;
  }

  .modeTile .modeBlurb {
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0;
    line-height: 1.4;
  }

  /* Only drawn on a mode holding a saved run, so its absence is the
     other half of the reading. */
  .modeTile .modeSaved {
    font-size: 11px;
    color: var(--good);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* The rules list and the storage warning both arrive as the same
     markup the in-run card uses, so they are styled once for both. */
  .screenBody .rule,
  #cardBody .rule {
    display: flex;
    gap: 8px;
    margin-bottom: 7px;
    align-items: baseline;
    text-align: left;
    font-size: 13px;
    line-height: 1.55;
    color: #d9d2f2;
  }

  .screenBody .rule .pip,
  #cardBody .rule .pip {
    flex: 0 0 auto;
    font-size: 14px;
  }

  .screenBody .rule b { color: #fff; }

  .screenNote.hidden { display: none; }

  .screenNote {
    font-size: 12px;
    color: var(--ink-dim);
    line-height: 1.5;
    margin: 0;
  }

  @media (min-width: 620px) {
    #app { max-width: 520px; margin: 0 auto; }
  }

  /* ================================================================
     HD CHROME

     Worn as a class on #app when Graphics is set to HD. Standard is the
     absence of it, so every rule above is left exactly as it was and
     nothing here can change how the game looks on Standard.

     The idea in one line: the interface is the setting and the gems are
     the stones, so the chrome gives up its hue. Every surface, rail and
     label here sits under 25 percent chroma. The only saturated colour
     in the whole frame is borrowed from the stone the level is asking
     for, which means the one coloured thing on screen is always
     pointing at the thing being hunted.

     That matters more than taste. Measured against the five gem hues,
     the Standard tokens land: --accent on the violet gem's exact hex,
     --good on the green gem's, --danger on the red gem's, the charge
     bar 12 degrees off violet and the hint cyan 11 degrees off blue.
     In a game where colour is the mechanic, the chrome was competing
     with the board for the same channel.

     Two house rules are kept throughout. Nothing here changes the
     height of anything, because every pixel at the top of the screen is
     a pixel the nine rows do not get. And nothing animates opacity or
     sits below full opacity, because that puts the element on its own
     composited layer and leaves a repaint seam down the edge of the
     fixed shell. The item row actually drops four such layers.
     ================================================================ */

  #app.hdChrome {
    --void:       #05040b;
    --velvet:     #0d0a18;
    --panel:      #17122b;
    --panel-lift: #201936;
    --panel-edge: rgba(214, 203, 255, 0.46);
    --rail-lo:    rgba(122, 106, 174, 0.22);
    --ink:        #f1edff;
    --ink-dim:    #9c93bd;
    --ink-faint:  #665d85;
    --fuel-off:   #2a2145;
    --fuel-on:    #cbbcf5;
    --fuel-hot:   #f5f0ff;
    --danger:     #ff4a5f;

    /* Overwritten by renderGoalLine every time the goal changes. The
       values here are the neutral the chrome wears when the goal names
       no stone, which is what a score goal does. */
    --goal-deep: #2d2748;
    --goal-core: #9c93bd;
    --goal-rim:  #d8d0f0;

    /* Everything that used to be violet now borrows. */
    --accent: var(--goal-rim);

    background: var(--void);
  }

  /* ---- surfaces: metal, which is a gradient and never a flat line ---- */

  #app.hdChrome .stat,
  #app.hdChrome #goalBar {
    background: linear-gradient(180deg, var(--panel-lift), var(--panel));
    border-top-color: var(--panel-edge);
    border-left-color: var(--rail-lo);
    border-right-color: var(--rail-lo);
    border-bottom-color: rgba(0, 0, 0, 0.5);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  /* ---- moves: warns before it shouts ----

     The number still turns red at four. The stripe starts warming at
     eight, which is far enough out to still be able to do something
     about it, and it arrives in peripheral vision rather than asking to
     be read. refreshHud sets the colour. */

  #app.hdChrome #limitStat {
    position: relative;
    padding-left: 13px;
  }

  #app.hdChrome #limitStat::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 99px;
    background: var(--limit-stripe);
    transition: background 0.3s ease;
  }

  /* ---- the goal line ---- */

  /* The stone sits in a recess, the way a stone sits in a ring. The
     socket is in the markup on Standard too, where it carries no styling
     at all and simply holds the icon where the icon already was. */
  #app.hdChrome .goalSocket {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: var(--velvet);
    box-shadow:
      inset 0 1px 3px rgba(0, 0, 0, 0.7),
      inset 0 -1px 0 rgba(255, 255, 255, 0.04);
  }

  #app.hdChrome.compactHud .goalSocket { width: 24px; height: 24px; }

  #app.hdChrome #goalTrack {
    background: var(--velvet);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
  }

  #app.hdChrome #goalFill {
    background: linear-gradient(90deg, var(--goal-deep), var(--goal-core));
    box-shadow: 0 0 8px -1px var(--goal-core);
  }

  /* ---- the two edge buttons ---- */

  #app.hdChrome #menuBtn,
  #app.hdChrome #hintBtn {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
    border-left-color: var(--rail-lo);
  }

  #app.hdChrome #menuBtn:active,
  #app.hdChrome #hintBtn:active {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
  }

  /* ---- charge: a filament, not a rainbow ----

     Standard paints charge violet to cyan to green and goal progress
     violet to green, so two bars measuring completely different things
     look nearly the same. Charge becomes one hue read as lightness,
     which leaves colour to mean progress and nothing else. */

  #app.hdChrome #chargeTrack {
    background: var(--velvet);
    border-color: rgba(0, 0, 0, 0.5);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7);
  }

  #app.hdChrome #chargeFill {
    background: linear-gradient(90deg, var(--fuel-off) 0%, var(--fuel-on) 78%, var(--fuel-hot) 100%);
    box-shadow: 0 0 10px -2px var(--fuel-on);
  }

  /* A gate per item cost. Passing one lights it, so a glance at the bar
     says what the next spend buys. */
  #app.hdChrome .chargeTick {
    top: 2px;
    bottom: 2px;
    width: 1px;
    margin-left: -0.5px;
    background: rgba(5, 4, 11, 0.9);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }

  #app.hdChrome .chargeTick.reached {
    background: var(--fuel-hot);
    box-shadow: 0 0 6px 0 var(--fuel-on);
  }

  /* ---- items: fill, never dim ----

     Standard drops an unaffordable item to 0.4 opacity, which reads as
     broken rather than as not yet, and costs a composited layer each.
     Full contrast is kept and fuel rises toward the cost instead. */

  #app.hdChrome .itemBtn {
    --fuel: 0%;
    opacity: 1;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, var(--panel-lift), var(--panel));
    border-top-color: var(--rail-lo);
    border-left-color: var(--rail-lo);
    border-right-color: var(--rail-lo);
    border-bottom-color: rgba(0, 0, 0, 0.5);
    color: var(--ink-faint);
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  #app.hdChrome .itemBtn .fuel {
    display: block;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--fuel);
    background: linear-gradient(180deg, rgba(203, 188, 245, 0.13), rgba(203, 188, 245, 0.04));
    border-top: 1px solid rgba(203, 188, 245, 0.28);
    transition: height 0.25s ease-out;
    pointer-events: none;
  }

  /* The fuel is positioned, so it would paint over static content
     whatever the markup order. The label is lifted above it. */
  #app.hdChrome .itemBtn .glyph,
  #app.hdChrome .itemBtn .name,
  #app.hdChrome .itemBtn .cost {
    position: relative;
    z-index: 1;
  }

  /* The cost moves out of the name and into the corner. */
  #app.hdChrome .itemBtn .inlineCost { display: none; }

  #app.hdChrome .itemBtn .cost {
    display: block;
    position: absolute;
    top: 3px;
    right: 6px;
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 0.4px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    transition: color 0.2s ease;
  }

  #app.hdChrome .itemBtn.ready {
    opacity: 1;
    background: linear-gradient(180deg, var(--panel-lift), var(--panel));
    border-top-color: var(--panel-edge);
    color: var(--ink);
  }

  #app.hdChrome .itemBtn.ready .cost { color: var(--fuel-on); }

  /* Armed is white and moving. Standard uses the green gem's exact hex.
     Nothing on the board is ever ringed in white, so this cannot be
     misread as a stone. */
  #app.hdChrome .itemBtn.armed {
    opacity: 1;
    color: #fff;
    background: linear-gradient(180deg, var(--panel-lift), var(--panel));
    border-color: rgba(255, 255, 255, 0.85);
    animation: hdArmed 1.2s ease-in-out infinite;
  }

  @keyframes hdArmed {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4), inset 0 0 12px -4px rgba(255, 255, 255, 0.5); }
    50%      { box-shadow: 0 0 14px 2px rgba(255, 255, 255, 0.4), inset 0 0 18px -2px rgba(255, 255, 255, 0.6); }
  }

  /* A hint is dashed and slowly pulsing on the board. It is dashed and
     slowly pulsing here too, so a hint looks like a hint wherever it
     turns up. The pulse runs on border-color rather than opacity, which
     repaints without asking for a layer. */
  #app.hdChrome .itemBtn.hinted {
    opacity: 1;
    color: var(--ink);
    background: linear-gradient(180deg, var(--panel-lift), var(--panel));
    border-color: var(--rail-lo);
    animation: none;
  }

  #app.hdChrome .itemBtn.hinted::after {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: 10px;
    border: 1px dashed rgba(255, 255, 255, 0.9);
    animation: hdHint 1.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 2;
  }

  @keyframes hdHint {
    0%, 100% { border-color: rgba(255, 255, 255, 0.32); }
    50%      { border-color: rgba(255, 255, 255, 0.95); }
  }

  /* ---- cards and menus ---- */

  #app.hdChrome #card,
  #app.hdChrome #menuCard {
    background: linear-gradient(160deg, var(--panel-lift), var(--velvet));
    border-color: var(--rail-lo);
    border-top-color: var(--panel-edge);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.7);
  }

  #app.hdChrome #menuPanel,
  #app.hdChrome #overlay {
    background: rgba(5, 4, 11, 0.9);
  }

  /* The front end drops the violet ground for the same reason the rest
     of the chrome does. A near black metal sweep, so the gem colours in
     the title are the only saturated thing on the screen. */
  #app.hdChrome .screen {
    background: linear-gradient(165deg, var(--panel), var(--velvet) 55%, var(--void));
  }

  #app.hdChrome .modeTile {
    background: linear-gradient(180deg, var(--panel-lift), var(--panel));
    border-color: var(--rail-lo);
    border-top-color: rgba(214, 203, 255, 0.26);
  }

  /* The picked difficulty wears the same borrowed hue the card's one
     real action wears, so the front end has a single accent. */
  #app.hdChrome .pickBtn.picked {
    background: linear-gradient(180deg, #2b2249, #1a1430);
    border-color: transparent;
    border-top-color: rgba(255, 255, 255, 0.5);
    border-bottom-color: rgba(0, 0, 0, 0.6);
    box-shadow:
      0 0 20px -6px var(--goal-core),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);

  }

  #app.hdChrome .modeTile .modeBlurb { color: var(--ink-dim); }
  #app.hdChrome .screenSub { color: var(--ink-dim); }
  #app.hdChrome .screenNote { color: var(--ink-dim); }

  /* Standard runs four gem colours through the title in one gradient.

</style>

<script>
"use strict";

/* ==================================================================
   PRISM PURGE
   A single file connect-and-purge puzzle game.

   Rules in short:
     - Drag across touching gems of the same colour to link them.
     - Release with 3 or more linked and they burst.
     - Cross your own path to close a loop: every gem of that colour
       on the board is wiped out.
     - 5 or 6 linked forges a Bomb. 7 or more forges a Prism. 12 or
       more forges a Chromatic, which joins any colour and lets the link
       change colour on the far side of it.
     - The Blight creeps across the board and ends the run if it
       takes fifteen cells. Linking a blighted gem cures it.
   ================================================================== */

/* ------------------------------------------------------------------
   Board constants
   ------------------------------------------------------------------ */

const COLS = 7;

/* The board is nine rows by seven columns on every screen. The whole
   difficulty curve is balanced against that number: the stone cap, the
   blight threshold, the move budget and the goal targets are all tuned
   for a board this size, so it is fixed and never guessed at from the
   screen it is being drawn on. */
const ROWS = 9;

const GEM_COLOURS = [
  { name: "red",    core: "#ff5470", rim: "#ffb3c0", glow: "#ff2f55", shape: "circle"   },
  { name: "amber",  core: "#ffab35", rim: "#ffe0a8", glow: "#ff8a00", shape: "diamond"  },
  { name: "green",  core: "#45e08a", rim: "#b6ffd6", glow: "#12c568", shape: "square"   },
  { name: "blue",   core: "#3fb0ff", rim: "#b8e4ff", glow: "#0d84e8", shape: "triangle" },
  { name: "violet", core: "#b07cff", rim: "#e2ccff", glow: "#8b4dff", shape: "hexagon"  }
];

/* The HD ramps. Five stops instead of three, because a faceted stone
   needs somewhere to travel: a deep pavilion tone to sit under it and a
   near white spark for the flat top face. The hues are the ones above,
   held at the same spacing so nothing gets harder to tell apart, with
   the cores pushed up in lightness.

   Only the gem body reads these. The path line, the burst shards, the
   toasts and the loop tint all stay on GEM_COLOURS in both modes, so
   switching appearance changes the stones and nothing else. Indexes
   match GEM_COLOURS entry for entry. */
const HD_GEM_COLOURS = [
  { deep: "#6e0a2f", glow: "#ff1f5c", core: "#ff4d7d", rim: "#ffa8c2", spark: "#fff2f6" },
  { deep: "#7d3500", glow: "#ff8f0a", core: "#ffb23d", rim: "#ffdb96", spark: "#fff8e8" },
  { deep: "#04543a", glow: "#0ce07d", core: "#3bf39c", rim: "#a8ffd4", spark: "#edfff5" },
  { deep: "#05386f", glow: "#149bff", core: "#46bcff", rim: "#a8e2ff", spark: "#eef8ff" },
  { deep: "#3f157e", glow: "#9a4dff", core: "#bd85ff", rim: "#ddc2ff", spark: "#f7f0ff" }
];

/* The two appearances the Graphics setting picks between. Standard is
   the game as it shipped: flat gradient gems and a violet interface. HD
   is the faceted cut and the chrome built around it. One setting moves
   both, because a cut stone in a flat frame looks like a mistake and a
   flat stone in a cut frame looks worse.

   HD is more to draw per gem, which is the whole reason Standard stays
   on the menu for older devices. */
const GRAPHICS_STANDARD = "standard";
const GRAPHICS_HD = "hd";

/* How many moves out the HD moves stripe starts warming. Four is where
   the number already turns red, so eight gives the player a run up to
   it rather than a slap. */
const MOVES_WARN_FROM = 8;
const LIMIT_STRIPE_CALM = "#665d85";
const LIMIT_STRIPE_ALARM = "#ff4a5f";

/* What the borrowed accent wears when the goal names no stone. A score
   goal has no piece to picture and a stone goal names one with no
   colour of its own, so both are answered with the chrome's own
   platinum rather than pretending a hue is there. */
const GOAL_ACCENT_NEUTRAL = { deep: "#2d2748", core: "#9c93bd", rim: "#d8d0f0" };

const graphics = {
  mode: GRAPHICS_HD
};

/* The HD stones move in three ways at once: a bar sweeping across each
   one, a star breathing on the highlight, and a slow hue wander in the
   dispersion. Together that is the shimmer, and on a board of sixty odd
   gems it is enough motion to give some players a headache. The setting
   stops all three.

   Switching it off pins those values where they can be pinned, so a
   still gem is the same cut stone with the movement taken out of it. The
   sweep is the exception. A bar crossing the stone has no still frame
   worth holding, so it is simply not drawn. */
const shimmer = {
  enabled: true
};

/* Where the highlight star is held while the shimmer is off. Full size,
   so a still board still reads as cut stone. */
const HD_STAR_STILL = 1;

/* The key light every HD facet is shaded against. Up and to the left,
   the direction the highlight blob already implied, so nothing in the
   scene contradicts anything else. */
const HD_LIGHT_X = -0.55;
const HD_LIGHT_Y = -0.83;

/* How much of the stone the flat top face covers. */
const HD_TABLE_SCALE = 0.44;

/* One full sweep of the travelling glint, and the slice of that cycle
   the bar is actually on screen for. Each gem carries its own phase, so
   the board twinkles unevenly instead of flashing in unison. */
const HD_GLINT_PERIOD_SECONDS = 4.2;
const HD_GLINT_VISIBLE_FRACTION = 0.2;

/* Fraction of a cell that responds to a touch. Anything below 0.707
   keeps diagonal drags from clipping their neighbours. */
const HIT_RADIUS = 0.55;

/* The link lengths the game is balanced around. Every mode names a rules
   object built from these, and a mode that lets the player change them
   names its own, so nothing at play time reads the bare constants: the
   number in play is the mode's to say. */
const MIN_LINK = 3;
const BOMB_LINK = 5;        // linking this many forges a bomb
const PRISM_LINK = 7;       // linking this many forges a prism
const CHROMATIC_LINK = 12;  // linking this many forges a chromatic

const STANDARD_LINK_RULES = {
  minLink: MIN_LINK,
  bombEnabled: true,
  bombLink: BOMB_LINK,
  prismEnabled: true,
  prismLink: PRISM_LINK,
  chromaticEnabled: true,
  chromaticLink: CHROMATIC_LINK
};

/* What a link of this length leaves standing on its last gem under the
   rules in play. Checked from the strongest tier down, so the longest
   link forges the strongest gem, and "none" when it reaches no tier. */
function forgeKindForLink(length, rules) {
  if (rules.chromaticEnabled === true && length >= rules.chromaticLink) return "chromatic";
  if (rules.prismEnabled === true && length >= rules.prismLink) return "prism";
  if (rules.bombEnabled === true && length >= rules.bombLink) return "bomb";
  return "none";
}

/* How long a gem spends bursting before it leaves the board. */
const BURST_SECONDS = 0.24;

/* A board wide clear does not go off all at once. Every cell waits
   this long per cell of distance from the middle of the loop, so the
   clear reads as a wave rolling outwards. */
const WAVE_SECONDS_PER_CELL = 0.05;

/* Shuffle empties the board and fills it back in a row at a time from
   the top, so the player sees every tile land somewhere new. The tiles
   shrink away over SHUFFLE_SHRINK_SECONDS, the board sits empty for
   SHUFFLE_BEAT_SECONDS, then each row starts SHUFFLE_ROW_STEP_SECONDS
   after the one above it. A tile takes 1 / SHUFFLE_GROW_RATE seconds
   to grow in once its turn arrives. */
const SHUFFLE_SHRINK_SECONDS = 0.12;
const SHUFFLE_BEAT_SECONDS = 0.1;
const SHUFFLE_ROW_STEP_SECONDS = 0.045;
const SHUFFLE_GROW_RATE = 5;

/* How fast a tile grows to full size when it spawns, in scale per
   second, so 4 is a quarter of a second from nothing to full. */
const SPAWN_GROW_RATE = 4;

/* A bomb clears the eight cells around it and cracks a stone once. A
   bomb caught inside a closed loop reaches three cells in every
   direction and cracks a stone three times. */
const BOMB_BLAST_RADIUS = 1;
const TRIPLE_BLAST_RADIUS = 3;
const BOMB_STONE_DAMAGE = 1;
const TRIPLE_STONE_DAMAGE = 3;
/* How much blight the board will hold. On a difficulty where blight can
   end a level this is also the number that ends it, so blight climbs to
   the ceiling and the level is over. Where it cannot, this is simply a
   ceiling and the blight sits at it. */
function blightLossThreshold() {
  return activeHazards().maxBlightOnBoard;
}

function blightIsAtCap() {
  return countBlight() >= activeHazards().maxBlightOnBoard;
}

/* A blighted gem does not sit still. Every gem counts the moves it has
   spent infected, and on the third the blight walks to a clean gem
   beside it and the cell it came from sets as stone. Leaving blight
   alone therefore costs board rather than costing nothing, and the
   stone it leaves is the softest there is: one crack and it is gone. */
const BLIGHT_MOVE_INTERVAL = 3;
const BLIGHT_STONE_HP = 1;

/* The walk is played out rather than jumped. The stone sets under the
   blight first, then the blight crawls across to the gem it picked and
   only shows up there once it has arrived. */
const BLIGHT_SET_SECONDS = 0.24;
const BLIGHT_CRAWL_SECONDS = 0.52;

/* One shared meter pays for every item. The differing costs are the
   whole decision: spend small and often, or bank for the big one.

   An item carries the thing it does. One that aims waits for a tap on
   the board and gets fireAt, one that does not gets fire. That is what
   lets a mode swap an item in without the code that fires them knowing
   any of their names. */
const CHARGE_MAX = 36;
const CLASSIC_ITEMS = [
  { id: "shuffle", cost: 8,  glyph: "↻", label: "Shuffle", aims: false, fire: fireShuffle },
  { id: "bomb",    cost: 12, glyph: "✹", label: "Bomb",    aims: true,  fireAt: firePlaceBombAt },
  { id: "moves",   cost: 20, glyph: "⇧", label: "+2 Move", aims: false, fire: fireExtraMoves },
  { id: "purge",   cost: 36, glyph: "◈", label: "Purge",   aims: true,  fireAt: firePurgeAt }
];

/* How many continues a run starts with is a difficulty setting. How
   often you earn another is the same on all three. */
const CONTINUE_EVERY_LEVELS = 10;

/* Every mode and difficulty pairing keeps its own saved run and its own
   best score. Trying Hard costs you nothing on the Normal game you were
   halfway through, and a Hard best and an Easy best are not the same
   achievement so they do not belong in one number. */
const SAVE_KEY_PREFIX = "prismPathSave:";
const BEST_KEY_PREFIX = "prismPathBest:";
const SETTINGS_KEY = "prismPathAudio";

/* The keys the game used when there was one mode and one score to keep.
   Read once by migrateLegacyStorage and removed, so a run in progress
   survives the arrival of modes. */
const LEGACY_SAVE_KEY = "prismPathSave";
const LEGACY_BEST_KEY = "prismPathBest";

/* How long the player sits still before the game offers a hint. Early
   levels are where the mechanics are still being learned, so the nudge
   comes sooner there and backs off once the player is deep enough to
   have earned some patience. Moving the slider replaces both numbers
   with whatever the player picked. */
const HINT_DELAY_EARLY_SECONDS = 8;
const HINT_DELAY_LATE_SECONDS = 15;
const HINT_LATE_FROM_LEVEL = 26;
const HINT_DELAY_MIN_SECONDS = 5;
const HINT_DELAY_MAX_SECONDS = 30;

/* Caps on the search that looks for a move. Nine is two past the seven a
   standard prism takes, and a longer trail than that is hard to follow
   anyway. A mode that sets a threshold above it simply never has that
   forge suggested. The node budget is per starting cell. */
const HINT_MAX_LINK = 9;
const HINT_NODE_BUDGET = 500;

/* How many colours are in play at each level. Fewer colours early on
   makes the opening levels forgiving. */
function coloursForLevel(level) {
  if (level <= 1) return 4;
  return 5;
}

/* ------------------------------------------------------------------
   Cell factories
   ------------------------------------------------------------------ */

function makeGem(colourIndex) {
  return {
    kind: "gem",
    colour: colourIndex,
    special: "none",     // "none" | "bomb" | "prism" | "chromatic"
    blighted: false,
    blightAge: 0,        // moves spent infected, counts up to the walk
    blightShow: 1,       // 1 visible, 0 hidden, below 0 still crawling in
    hp: 0,
    offsetY: 0,          // pixels above its resting place while falling
    fallSpeed: 0,
    scale: 0,            // grows to 1 on spawn
    spin: 0,
    /* Where this stone sits in the HD glint cycle. Random per gem so no
       two catch the light at the same moment, and it travels with the
       gem when the board falls, because the cell object moves. */
    glintPhase: Math.random() * HD_GLINT_PERIOD_SECONDS,
    doomed: false,       // marked for removal once the burst finishes
    dying: 0,            // seconds left in the burst animation
    dyingMax: BURST_SECONDS,
    dyingDelay: 0,       // seconds to wait before that burst starts
    spawnDelay: 0        // seconds to wait before it grows in, used by shuffle
  };
}

/* A hole in the board.

   It is a cell like any other so that every walk of the grid still finds
   an object carrying the fields it reads. Everything that asks for a gem
   or a stone already skips it by kind, and the two places that would
   otherwise animate or draw one skip it by name.

   Only a mode that does not refill what it clears ever puts one on the
   board. */
function makeEmpty() {
  return {
    kind: "empty",
    colour: -1,
    special: "none",
    blighted: false,
    blightAge: 0,
    blightShow: 1,
    hp: 0,
    maxHp: 0,
    offsetY: 0,
    fallSpeed: 0,
    scale: 0,
    spin: 0,
    doomed: false,
    dying: 0,
    dyingMax: BURST_SECONDS,
    dyingDelay: 0,
    spawnDelay: 0,

/* ------------------------------------------------------------------
   Sound: everything is synthesised, no audio files needed
   ------------------------------------------------------------------ */

/* Headroom trim on the whole effects bus. Every synth voice below was
   written and balanced against this figure, so the volume slider
   scales it rather than replacing it. */
const SFX_HEADROOM = 0.9;

const sound = {
  ctx: null,
  bus: null,
  enabled: true,
  volume: 1
};

function ensureAudio() {
  if (sound.ctx === null) {
    const Ctor = window.AudioContext;
    if (typeof Ctor !== "function") {
      sound.enabled = false;
      return;
    }
    sound.ctx = new Ctor();

    /* Every voice runs through one compressor. A twenty five gem break
       fires the crack, nine shards, an eight note run and a thump at
       the same moment, and straight into the destination that sums
       past full scale and clips. */
    const now = sound.ctx.currentTime;

    const limiter = sound.ctx.createDynamicsCompressor();
    limiter.threshold.setValueAtTime(-10, now);
    limiter.knee.setValueAtTime(6, now);
    limiter.ratio.setValueAtTime(12, now);
    limiter.attack.setValueAtTime(0.003, now);
    limiter.release.setValueAtTime(0.18, now);

    const master = sound.ctx.createGain();
    master.gain.setValueAtTime(SFX_HEADROOM * sound.volume, now);

    master.connect(limiter);
    limiter.connect(sound.ctx.destination);
    sound.bus = master;
  }
  if (sound.ctx.state === "suspended") {
    sound.ctx.resume();
  }
}

/* Where every voice connects. Only ever called once the context is up,
   so the bus is always there by the time anything asks for it. */
function soundBus() {
  return sound.bus;
}

/* The slider moves while gems are still ringing out. Ramping over a
   few milliseconds instead of jumping keeps the change from clicking
   through whatever is mid note. Silent until the context exists,
   because ensureAudio reads the volume when it builds the bus. */
function applySfxVolume() {
  if (sound.ctx === null) return;

  sound.bus.gain.setTargetAtTime(SFX_HEADROOM * sound.volume, sound.ctx.currentTime, 0.02);
}

function playTone(frequency, duration, type, volume) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;
  const osc = sound.ctx.createOscillator();
  const gain = sound.ctx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(frequency, now);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(volume, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

  osc.connect(gain);
  gain.connect(soundBus());
  osc.start(now);
  osc.stop(now + duration + 0.02);
}

/* Each extra gem in a link steps the note up a semitone, so a long
   chain plays as a rising run. */
function playLinkNote(step) {
  const base = 294;
  const frequency = base * Math.pow(2, step / 12);
  playTone(frequency, 0.16, "triangle", 0.16);
}

function playNoiseHit(volume) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;
  const length = Math.floor(sound.ctx.sampleRate * 0.22);
  const buffer = sound.ctx.createBuffer(1, length, sound.ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < length; i++) {
    const fade = 1 - i / length;
    data[i] = (Math.random() * 2 - 1) * fade * fade;
  }

  const source = sound.ctx.createBufferSource();
  const gain = sound.ctx.createGain();
  source.buffer = buffer;
  gain.gain.setValueAtTime(volume, now);

  source.connect(gain);
  gain.connect(soundBus());
  source.start(now);
}

    }, i * 110);
  }
