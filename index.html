  } else {
    movesStat.classList.remove("low");
  }

  /* The HD stripe down the edge of the moves box. Cold with the budget
     full, alarm with it empty, and it only starts moving once there are
     MOVES_WARN_FROM left. Standard draws no stripe and ignores this. */
  const spent = MOVES_WARN_FROM - Math.max(0, game.moves);
  const pressure = Math.max(0, Math.min(1, spent / MOVES_WARN_FROM));
  const stripe = mixRgb(hexToRgb(MOVES_STRIPE_CALM), hexToRgb(MOVES_STRIPE_ALARM), pressure);
  movesStat.style.setProperty("--moves-stripe", rgbCss(stripe));

  renderGoalLine();

  const shown = Math.min(game.goal.progress, game.goal.target);
  goalCount.textContent = shown + "/" + game.goal.target;
  goalFill.style.width = (shown / game.goal.target) * 100 + "%";

  updateItemBar();
}

/* Whether a hint on screen right now is telling the player to spend
   charge on this item. */
function hintPointsAtItem(id) {
  if (hints.showing === false) return false;
  if (hints.move === null) return false;
  if (hints.move.kind !== "item") return false;
  return hints.move.itemId === id;
}

/* The item row is built once and then only restyled, so the buttons
   keep their identity across redraws. */
function buildItemBar() {
  /* A notch on the charge bar for every item, so you can see how far
     off the next one is without doing the arithmetic. */
  for (let i = 0; i < ITEMS.length; i++) {
    const item = ITEMS[i];
    if (item.cost >= CHARGE_MAX) continue;

    const tick = document.createElement("div");
    tick.className = "chargeTick";
    tick.dataset.cost = String(item.cost);
    tick.style.left = (item.cost / CHARGE_MAX) * 100 + "%";
    chargeTicks.appendChild(tick);
  }

  for (let i = 0; i < ITEMS.length; i++) {
    const item = ITEMS[i];
    const button = document.createElement("button");
    button.className = "itemBtn";
    button.dataset.item = item.id;
    button.dataset.cost = String(item.cost);

    /* Both readings of the cost are in the markup and the appearance
       picks one. Standard reads it inside the name, "SHUFFLE 8", the way
       it always has. HD hides that copy, puts the number in the corner
       and fills the button up to it. */
    button.innerHTML =
      "<span class='fuel'></span>" +
      "<span class='cost'>" + item.cost + "</span>" +
      "<span class='glyph'>" + item.glyph + "</span>" +
      "<span class='name'>" + item.label +
        "<span class='inlineCost'> " + item.cost + "</span></span>";

    button.addEventListener("click", function () {
      ensureAudio();
      selectItem(item.id);
    });

    itemRow.appendChild(button);
  }
}

function updateItemBar() {
  chargeFill.style.width = (game.charge / CHARGE_MAX) * 100 + "%";
  chargeValue.textContent = game.charge + "/" + CHARGE_MAX;

  const ticks = chargeTicks.querySelectorAll(".chargeTick");
  for (let i = 0; i < ticks.length; i++) {
    const cost = parseInt(ticks[i].dataset.cost, 10);
    if (game.charge >= cost) {
      ticks[i].classList.add("reached");
    } else {
      ticks[i].classList.remove("reached");
    }
  }

  const buttons = itemRow.querySelectorAll(".itemBtn");
  for (let i = 0; i < buttons.length; i++) {
    const button = buttons[i];
    const id = button.dataset.item;

    button.classList.remove("ready");
    button.classList.remove("armed");
    button.classList.remove("hinted");

    if (game.aiming === id) {
      button.classList.add("armed");
    } else if (canAfford(id) === true) {
      button.classList.add("ready");
    }

    if (hintPointsAtItem(id) === true) button.classList.add("hinted");

    /* How close the meter is to paying for this one, which is what HD
       fills the button with. Standard never shows it. */
    const cost = parseInt(button.dataset.cost, 10);
    const towards = Math.min(1, game.charge / cost);
    button.style.setProperty("--fuel", Math.round(towards * 100) + "%");
  }
}

/* ------------------------------------------------------------------
   Card overlay
   ------------------------------------------------------------------ */

let cardAction = null;
let cardAltAction = null;

function showCard(title, subtitle, bodyHtml, buttonText, action, altText, altAction) {
  cardTitle.textContent = title;
  cardSub.textContent = subtitle;
  cardBody.innerHTML = bodyHtml;

  cardMenu.classList.add("hidden");
  cardBtn.classList.remove("hidden");
  cardBtn.textContent = buttonText;
  cardAction = action;

  /* A card always opens at the top of its text, however far the last
     one that used this element had been scrolled. */
  cardBody.scrollTop = 0;

  if (altText === undefined) {
    cardAltAction = null;
    cardBtnAlt.classList.add("hidden");
  } else {
    cardAltAction = altAction;
    cardBtnAlt.textContent = altText;
    cardBtnAlt.classList.remove("hidden");
  }

  overlay.classList.remove("hidden");
}

function hideCard() {
  overlay.classList.add("hidden");
  cardAction = null;
  cardAltAction = null;
  cardBtnAlt.classList.add("hidden");
  cardMenu.classList.add("hidden");
}

/* The front page needs a stack of destinations where the other cards
   need one button and sometimes a second. Entries are
   { label, action, primary }, and the primary one is the coloured
   button at the top. */
function showCardMenu(title, subtitle, bodyHtml, entries) {
  cardTitle.textContent = title;
  cardSub.textContent = subtitle;
  cardBody.innerHTML = bodyHtml;

  cardAction = null;
  cardAltAction = null;
  cardBtn.classList.add("hidden");
  cardBtnAlt.classList.add("hidden");

  cardMenu.innerHTML = "";

  for (let i = 0; i < entries.length; i++) {
    const entry = entries[i];
    const button = document.createElement("button");

    button.className = entry.primary === true ? "cardMenuItem primary" : "cardMenuItem";
    button.textContent = entry.label;

    button.addEventListener("click", function () {
      /* The same two things the single button does before it acts: the
         audio context wants a real gesture to start on, and the board
         may still be waiting for its first measurement. */
      ensureAudio();
      if (boardReady === false) {
        measureStage();
      }
      entry.action();
    });

    cardMenu.appendChild(button);
  }

  cardBody.scrollTop = 0;
  cardMenu.scrollTop = 0;

  cardMenu.classList.remove("hidden");
  overlay.classList.remove("hidden");
}

cardBtn.addEventListener("click", function () {
  ensureAudio();
  if (boardReady === false) {
    measureStage();
  }
  if (cardAction === null) return;
  const action = cardAction;
  cardAction = null;
  action();
});

cardBtnAlt.addEventListener("click", function () {
  ensureAudio();
  if (cardAltAction === null) return;
  const action = cardAltAction;
  cardAltAction = null;
  action();
});

function howToPlayHtml() {
  return "" +
  "<div class='rule'><span class='pip'>&#9679;</span><span><b>Drag</b> across touching gems of the same colour. Release with <b>3 or more</b> to burst them.</span></div>" +
  "<div class='rule'><span class='pip'>&#8634;</span><span>Cross your own trail to <b>close a loop</b> and wipe every gem of that colour off the board.</span></div>" +
  "<div class='rule'><span class='pip'>&#10039;</span><span>Link <b>5</b> to forge a <b>Bomb</b>, link <b>7</b> to forge a <b>Prism</b> that torches a whole colour.</span></div>" +
  "<div class='rule'><span class='pip'>&#9678;</span><span>Loop <b>around</b> something without linking it and it goes off far harder. A bomb blasts <b>three cells</b> in every direction, a stone takes <b>every stone</b> with it, a blight <b>cures the board</b>, and a Prism clears the <b>whole board</b>.</span></div>" +
  "<div class='rule'><span class='pip'>&#9632;</span><span><b>Stones</b> crack when a gem bursts beside them and take a full hit from any bomb blast.</span></div>" +
  "<div class='rule'><span class='pip'>&#9760;</span><span>The <b>Blight</b> creeps in from level three and follows you between levels. Link a blighted gem to cure it. " + blightLossThreshold() + " blighted cells ends the level.</span></div>" +
  "<div class='rule'><span class='pip'>&#9878;</span><span>Bursting fills your <b>charge</b>. Spend it on Shuffle, Bomb, +2 Moves or a full colour Purge.</span></div>" +
  "<div class='rule'><span class='pip'>&#10010;</span><span>You start with <b>3 continues</b> and earn one every 10 levels. A continue replays the level and rewinds the score you made on it.</span></div>";
}

/* Shown at the top of the title card when the browser will not save, so
   the player finds out before the run rather than after it. */
function storageWarningHtml() {
  if (storageWorks === true) return "";

  return "<div class='rule'><span class='pip' style='color:var(--danger)'>&#9888;</span>" +
    "<span style='color:var(--danger)'>This browser will not let the game save. Your run and your " +
    "best score are gone when you close the page. Opening the game from a web address instead of a " +
    "file on the device fixes it.</span></div>";
}

/* The rules are long, and putting them on the front page pushed the
   buttons off the bottom of a phone. They live behind their own card
   now, and the front page is just the way in. */
function showHowToPlayCard() {
  showCard("How to Play", "Prism Path", howToPlayHtml(), "Back", showTitleCard);
}

function showTitleCard() {
  cardStats.style.display = "none";

  const saved = readSave();
  const entries = [];

  if (saved === null) {
    entries.push({
      label: "Play Game",
      primary: true,
      action: function () { startRun(); hideCard(); }
    });
  } else {
    entries.push({
      label: "Continue",
      primary: true,
      action: function () { loadGame(saved); hideCard(); }
    });
    entries.push({
      label: "New Game",
      action: function () { clearSave(); startRun(); hideCard(); }
    });
  }

  entries.push({ label: "Settings", action: openSettingsFromTitle });
  entries.push({ label: "How to Play", action: showHowToPlayCard });

  if (fullscreenSupported === true) {
    entries.push({
      label: document.fullscreenElement === null ? "Fullscreen" : "Leave Fullscreen",
      action: toggleFullscreen
    });
  }

  const subtitle = saved === null
    ? "Link. Loop. Purge the blight."
    : "Saved on level " + saved.level + " with " + saved.score + " points.";

  showCardMenu("Prism Path", subtitle, storageWarningHtml(), entries);
}

/* ------------------------------------------------------------------
   Menu
   ------------------------------------------------------------------ */

function menuIsOpen() {
  return menuPanel.classList.contains("hidden") === false;
}

/* The panel is two pages in the one card. Opening it and closing it
   both land on the main page, so it never comes back halfway inside a
   submenu the player walked away from. */
function showMenuMain() {
  menuTitle.textContent = "Paused";
  settingsPage.classList.add("hidden");
  menuMain.classList.remove("hidden");
}

/* Where Back leads out of the settings page. The pause menu and the front
   page both open it, and each needs its own way out. */
let settingsReturnsTo = "menu";

function showSettingsPage(returnTo) {
  settingsReturnsTo = returnTo;
  menuTitle.textContent = "Settings";
  menuMain.classList.add("hidden");
  settingsPage.classList.remove("hidden");
  refreshSettingsPage();
}

function leaveSettingsPage() {
  if (settingsReturnsTo === "title") {
    menuPanel.classList.add("hidden");
    return;
  }
  showMenuMain();
}

/* The front page reaches the same settings panel the pause menu uses, so
   there is one set of controls wired up in one place. The panel sits on
   a layer above the card, and Back drops it again. */
function openSettingsFromTitle() {
  showSettingsPage("title");
  menuPanel.classList.remove("hidden");
}

function toggleFullscreen() {
  if (document.fullscreenElement === null) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

function settingsPageIsOpen() {
  return settingsPage.classList.contains("hidden") === false;
}

/* Pushes the current settings onto the controls. Called when the page
   opens and after anything changes them, so the toggles, the sliders
   and the numbers beside them can never end up disagreeing. */
function refreshSettingsPage() {
  const sfxPercent = Math.round(sound.volume * 100);
  const musicPercent = Math.round(music.volume * 100);

  if (graphics.mode === GRAPHICS_HD) {
    graphicsToggle.textContent = "Graphics: HD";
    graphicsNote.textContent = "Cut gems with facets, dispersion and glints.";
  } else {
    graphicsToggle.textContent = "Graphics: Standard";
    graphicsNote.textContent = "Flat gems. Lighter work for an older device.";
  }

  /* Until the player picks a number, the slider shows the one the level
     is using and says where it came from. */
  hintToggle.textContent = hints.enabled === true ? "Hints: On" : "Hints: Off";
  hintSlider.value = String(hintDelaySeconds());
  hintReadout.textContent = hintDelaySeconds() + "s" + (hints.delayChosen === true ? "" : " auto");
  setChannelMuted(hintGroup, hints.enabled === false);

  sfxToggle.textContent = sound.enabled === true ? "SFX: On" : "SFX: Off";
  sfxSlider.value = String(sfxPercent);
  sfxReadout.textContent = sfxPercent + "%";
  setChannelMuted(sfxGroup, sound.enabled === false);

  musicToggle.textContent = music.enabled === true ? "Music: On" : "Music: Off";
  musicSlider.value = String(musicPercent);
  musicReadout.textContent = musicPercent + "%";
  setChannelMuted(musicGroup, music.enabled === false);

  refreshMusicNote();
}

function setChannelMuted(group, muted) {
  if (muted === true) {
    group.classList.add("off");
  } else {
    group.classList.remove("off");
  }
}

function refreshMusicNote() {
  if (music.fileFailed === false) {
    musicNote.classList.add("hidden");
    return;
  }

  musicNote.textContent = "The music file would not load, so the game is running " +
    "without it. Opening the game from a web address instead of a file on the " +
    "device usually fixes it.";
  musicNote.classList.remove("hidden");
}

function openMenu() {
  if (game.phase === "title") return;
  if (overlay.classList.contains("hidden") === false) return;

  ensureAudio();
  showMenuMain();
  menuFull.textContent = document.fullscreenElement === null ? "Fullscreen" : "Leave Fullscreen";
  menuFull.style.display = fullscreenSupported === true ? "block" : "none";
  menuPanel.classList.remove("hidden");
}

function closeMenu() {
  menuPanel.classList.add("hidden");
  showMenuMain();
}

function toggleMenu() {
  if (menuIsOpen() === true) {
    closeMenu();
  } else {
    openMenu();
  }
}

menuBtn.addEventListener("click", toggleMenu);
menuResume.addEventListener("click", closeMenu);

/* Asking for a hint works whatever the setting says. Turning hints off
   stops the game offering them unprompted; it does not take the button
   away from a player who has just tapped it. */
hintBtn.addEventListener("click", function () {
  ensureAudio();

  /* Tapping while the trail is up puts it away and leaves the bulb on:
     the move has not gone anywhere, it is just off the board. */
  if (hints.showing === true) {
    hints.showing = false;
    hints.idleSeconds = 0;
    updateItemBar();
    return;
  }

  showHint();
});

hintToggle.addEventListener("click", function () {
  hints.enabled = hints.enabled === false;
  refreshSettingsPage();
  saveSettings();
});

/* Moving the slider at all is the player taking the delay over from the
   level, so it stays where they put it from then on. */
hintSlider.addEventListener("input", function () {
  hints.delayChosen = true;
  hints.delaySeconds = Number(hintSlider.value);
  hints.idleSeconds = 0;
  hintReadout.textContent = hints.delaySeconds + "s";
});

hintSlider.addEventListener("change", saveSettings);

menuSettings.addEventListener("click", function () { showSettingsPage("menu"); });
settingsBack.addEventListener("click", leaveSettingsPage);

/* The chrome is a class on #app, so switching appearance is one class
   and the whole stylesheet follows. The board is redrawn every frame so
   the stones and the tray change on their own; the HUD is DOM and has
   to be asked, which is what refreshHud does. It rebuilds the goal line
   from the icon cache, which is keyed by appearance, and puts the fuel
   and the stripe back where the new appearance wants them. */
function applyGraphicsMode() {
  if (graphics.mode === GRAPHICS_HD) {
    app.classList.add("hdChrome");
  } else {
    app.classList.remove("hdChrome");
  }

  /* Nothing to refresh before the board exists. Startup calls refreshHud
     itself once it does. */
  if (boardReady === true) refreshHud();
}

graphicsToggle.addEventListener("click", function () {
  if (graphics.mode === GRAPHICS_HD) {
    graphics.mode = GRAPHICS_STANDARD;
  } else {
    graphics.mode = GRAPHICS_HD;
  }

  applyGraphicsMode();
  refreshSettingsPage();
  saveSettings();
});

sfxToggle.addEventListener("click", function () {
  sound.enabled = sound.enabled === false;
  refreshSettingsPage();
  saveSettings();

  /* Switching effects back on plays one, so the player hears the level
     they are set to instead of taking the label's word for it. */
  if (sound.enabled === true) playTone(660, 0.12, "triangle", 0.14);
});

sfxSlider.addEventListener("input", function () {
  sound.volume = Number(sfxSlider.value) / 100;
  sfxReadout.textContent = sfxSlider.value + "%";
  applySfxVolume();
});

/* The sample tone and the write to storage both wait for the finger to
   come off. A drag fires input on every pixel it crosses, and neither
   a burst of beeps nor a burst of writes is wanted. */
sfxSlider.addEventListener("change", function () {
  saveSettings();
  if (sound.enabled === true) playTone(660, 0.12, "triangle", 0.14);
});

musicToggle.addEventListener("click", function () {
  music.enabled = music.enabled === false;
  refreshSettingsPage();
  saveSettings();

  /* Switching music off stops the track outright and switching it back
     on starts whatever the level asked for. With nothing wanted, which
     is the case on the title card, both do nothing. */
  syncMusic();
});

musicSlider.addEventListener("input", function () {
  music.volume = Number(musicSlider.value) / 100;
  musicReadout.textContent = musicSlider.value + "%";
  applyMusicVolume();
});

musicSlider.addEventListener("change", saveSettings);

menuFull.addEventListener("click", function () {
  toggleFullscreen();
  closeMenu();
});

menuHelp.addEventListener("click", function () {
  closeMenu();
  showCard("How to Play", "Prism Path", howToPlayHtml(), "Back", function () { hideCard(); });
});

menuSave.addEventListener("click", function () {
  saveGame();
  closeMenu();
  showToast("SAVED", "#45e08a");
});

menuSaveQuit.addEventListener("click", function () {
  saveGame();
  closeMenu();
  stopMusic();
  game.phase = "title";
  showTitleCard();
});

menuQuit.addEventListener("click", function () {
  clearSave();
  closeMenu();
  stopMusic();
  game.phase = "title";
  showTitleCard();
});

/* Escape on a keyboard, the menu button anywhere, and the Android back
   gesture all reach the same panel. Back needs a history entry of its
   own to have something to pop. */
window.addEventListener("keydown", function (event) {
  if (event.key !== "Escape") return;
  event.preventDefault();
  menuBack();
});

window.history.pushState({ prismPath: true }, "");
window.addEventListener("popstate", function () {
  window.history.pushState({ prismPath: true }, "");
  menuBack();
});

/* Escape and the back gesture both mean "up one level". Standing in the
   settings page, one level up is the main menu. */
function menuBack() {
  if (menuIsOpen() === true && settingsPageIsOpen() === true) {
    leaveSettingsPage();
    return;
  }
  toggleMenu();
}

const fullscreenSupported = typeof document.documentElement.requestFullscreen === "function";

document.addEventListener("fullscreenchange", function () {
  window.setTimeout(measureStage, 120);

  if (game.phase === "title") {
    showTitleCard();
  }
});

/* ------------------------------------------------------------------
   Boot
   ------------------------------------------------------------------ */

/* The stage can measure zero while the page is still laying out or
   while the tab is hidden, so the board is built on the first real
   measurement. */
let boardReady = false;

/* How tall the top of the screen comes out in each of its two layouts.
   Both are read once, by wearing each in turn, so that choosing between
   them later is arithmetic rather than a round of measure, swap and
   measure again. */
let tallHudHeight = 0;
let compactHudHeight = 0;

function measureHudHeights() {
  const wasCompact = app.classList.contains("compactHud");

  app.classList.remove("compactHud");
  tallHudHeight = hud.getBoundingClientRect().height;

  app.classList.add("compactHud");
  compactHudHeight = hud.getBoundingClientRect().height;

  if (wasCompact === false) app.classList.remove("compactHud");
}

/* The board is nine rows of seven, and on a tall phone it is its width
   that decides how big a cell can be: there is height left over that no
   number of rows can use. Where that is true the roomy layout is free,
   because the height it takes was never going to reach the board.

   So the question is only ever whether the board would still be as wide
   as it can be. If it would, wear the roomy one. If the extra height
   would start eating into cell size, drop to the compact one.

   The test is written against the roomy layout whichever one is being
   worn at the time, so it lands on the same answer either way and
   cannot flip back and forth between the two. */
function chooseHudSize() {
  const rect = stage.getBoundingClientRect();
  const worn = app.classList.contains("compactHud") ? compactHudHeight : tallHudHeight;
  const stageIfTall = rect.height + worn - tallHudHeight;

  const cellByWidth = Math.floor(rect.width / COLS);
  const cellByHeightIfTall = Math.floor(stageIfTall / ROWS);

  if (cellByHeightIfTall >= cellByWidth) {
    app.classList.remove("compactHud");
  } else {
    app.classList.add("compactHud");
  }
}

function measureStage() {
  const rect = stage.getBoundingClientRect();
  if (rect.width < 1 || rect.height < 1) return;

  chooseHudSize();

  if (boardReady === false) {
    resizeCanvas();
    buildBoard();
    game.goal = makeGoalForLevel(1);
    boardReady = true;
    refreshHud();
    return;
  }

  /* A resize after the run started only rescales. The board itself is
     left alone. */

  resizeCanvas();
}

const stageObserver = new ResizeObserver(measureStage);
stageObserver.observe(stage);

window.addEventListener("orientationchange", function () {
  window.setTimeout(measureStage, 200);
});

/* Blocks the pinch-zoom and double tap zoom that ruin drag controls. */
document.addEventListener("gesturestart", function (event) { event.preventDefault(); });
document.addEventListener("dblclick", function (event) { event.preventDefault(); });

game.bestScore = loadBest();
loadSettings();
applyGraphicsMode();
refreshSettingsPage();
buildItemBar();
measureHudHeights();
measureStage();
showTitleCard();
window.requestAnimationFrame(frame);

</script>
</body>
</html>
