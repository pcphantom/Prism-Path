function checkLevelState() {
  const mode = activeMode();

  const beforeGoal = mode.lossBeforeGoal();
  if (beforeGoal !== null) {
    failLevel(beforeGoal.title, beforeGoal.subtitle);
    return;
  }

  if (mode.goalIsMet() === true) {
    completeLevel();
    return;
  }

  const afterGoal = mode.lossAfterGoal();
  if (afterGoal !== null) {
    failLevel(afterGoal.title, afterGoal.subtitle);
    return;
  }

  ensureSolvableBoard();
  clearHint();
  game.phase = "idle";
  refreshHud();
}

function completeLevel() {
  const mode = activeMode();
  const bonus = mode.levelClearBonus();

  game.score += bonus.amount;
  game.phase = "levelDone";

  /* Continues bank up, so a clean run arrives at the deep levels with
     a stack of them. */
  let earned = 0;
  if (game.level % CONTINUE_EVERY_LEVELS === 0) {
    earned = 1;
    game.continues++;
  }

  game.blightCarry = countBlight();

  /* Only where a fresh board is coming and the mode says the specials
     on this one go with it. A mode that keeps its board carries
     everything anyway. */
  if (mode.rebuildsBoardEachLevel === true && mode.carriesSpecials === true) {
    game.specialCarry = countSpecials();
  }

  playFanfare();

  /* A mode that shows no card goes straight on to the next level. The
     level number in the HUD and the goal line change under the player,
     so the one toast says which level this is now, and that a continue
     came with it when one did. */
  if (mode.showsLevelClearCard === false) {
    const nextLevel = game.level + 1;
    if (earned > 0) {
      showToast("LEVEL " + nextLevel + ", CONTINUE EARNED", "#ffffff");
    } else {
      showToast("LEVEL " + nextLevel, "#ffffff");
    }
    advanceToNextLevel();
    return;
  }

  let body = "";
  if (bonus.amount > 0) {
    body += "<div class='rule'><span class='pip'>&#9733;</span><span>" + bonus.label +
      ": <b>+" + bonus.amount + "</b></span></div>";
  }
  body += "<div class='rule'><span class='pip'>&#9670;</span><span>Total score: <b>" +
    game.score + "</b></span></div>";

  if (earned > 0) {
    body += "<div class='rule'><span class='pip'>&#10010;</span><span>Continue earned. You now hold <b>" + game.continues + "</b>.</span></div>";
  }
  /* Only worth saying where a fresh board is coming and the blight is
     the part of the old one that survives it. Where the whole board
     carries on, the subtitle has already said so. */
  if (mode.rebuildsBoardEachLevel === true && game.blightCarry > 0) {
    body += "<div class='rule'><span class='pip'>&#9760;</span><span><b>" + game.blightCarry + "</b> blight follows you to the next level.</span></div>";
  }
  const carriedSpecials = game.specialCarry.bomb + game.specialCarry.prism + game.specialCarry.chromatic;
  if (carriedSpecials > 0) {
    body += "<div class='rule'><span class='pip'>&#9788;</span><span><b>" + carriedSpecials + "</b> special" + (carriedSpecials === 1 ? "" : "s") + " follow" + (carriedSpecials === 1 ? "s" : "") + " you to the next level.</span></div>";
  }
  body += "<div class='rule'><span class='pip'>&#9888;</span><span>" + mode.nextLevelWarning(game.level + 1) + "</span></div>";

  showCard(
    "Level " + game.level + " Clear",
    mode.levelClearSubtitle(),
    body,
    "Level " + (game.level + 1),
    function () {
      advanceToNextLevel();
      hideCard();
    }
  );
}

/* A failed level offers a continue while you still hold one. Taking it
   rewinds your score to what it was when the level began, so failing
   can never inflate a high score. */
function failLevel(title, subtitle) {
  game.phase = "over";
  playFailure();

  if (game.continues > 0) {
    const mode = activeMode();

    let body =
      "<div class='rule'><span class='pip'>&#10010;</span><span>Continues left: <b>" + game.continues + "</b></span></div>" +
      "<div class='rule'><span class='pip'>&#9670;</span><span>" + mode.continueDescription() + "</span></div>" +
      "<div class='rule'><span class='pip'>&#9733;</span><span>Score you keep: <b>" + game.scoreAtLevelStart + "</b></span></div>";

    showCard(
      title,
      subtitle,
      body,
      "Continue (" + game.continues + " left)",
      function () {
        game.continues--;
        mode.takeContinue();
        hideCard();
      },
      "Give Up",
      function () {
        endRun(title, subtitle);
      }
    );

    saveGame();
    return;
  }

  endRun(title, subtitle);
}

function endRun(title, subtitle) {
  game.phase = "over";
  stopMusic();

  if (game.score > game.bestScore) {
    game.bestScore = game.score;
    saveBest(game.bestScore, game.modeId, game.difficulty);
  }

  clearSaveFor(game.modeId, game.difficulty);

  finalScoreEl.textContent = String(game.score);
  bestScoreEl.textContent = String(game.bestScore);

  showCard(
    title,
    "Run over. " + subtitle,
    "<div class='rule'><span class='pip'>&#9670;</span><span>You reached <b>level " + game.level + "</b>.</span></div>" +
    "<div class='rule'><span class='pip'>&#9733;</span><span>Close a loop to wipe a whole colour when the board gets crowded.</span></div>",
    "Play Again",
    function () {
      startRun(game.modeId, game.difficulty);
      hideCard();
    },
    "Quit to Menu",
    function () {
      hideCard();
      quitToMainMenu();
    }
  );

  /* Opted into after showCard, which clears the stats row for every card
     that has not asked for it. */
  cardStats.style.display = "flex";
}

/* ------------------------------------------------------------------
   Saved games

   The save is rewritten at the start of every level, on every continue
   and when the run ends, so it always matches where the player really
   is. That keeps a reload from being a free continue.
   ------------------------------------------------------------------ */

function serialiseBoard() {
  const out = [];
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cell = cellAt(row, col);
      /* 0 gem, 1 stone, 2 a hole a draining board left behind. A save
         written before holes existed carries only 0 and 1, and reads
         back exactly as it always did. */
      let kindCode = 0;
      if (cell.kind === "stone") kindCode = 1;
      if (cell.kind === "empty") kindCode = 2;

      out.push({
        k: kindCode,
        c: cell.colour,
        s: cell.special,
        b: cell.blighted === true ? 1 : 0,
        a: cell.blightAge,
        h: cell.hp,
        m: cell.kind === "stone" ? cell.maxHp : 0
      });
    }
  }
  return out;
}

function restoreBoard(flat) {
  game.board = [];
  let index = 0;

  for (let row = 0; row < ROWS; row++) {
    const line = [];
    for (let col = 0; col < COLS; col++) {
      const saved = flat[index];
      index++;

      if (saved.k === 2) {
        line.push(makeEmpty());
        continue;
      }

      let cell;
      if (saved.k === 1) {
        cell = makeStone(saved.m);
        cell.hp = saved.h;
      } else {
        cell = makeGem(saved.c);
        cell.special = saved.s;
      }
      cell.blighted = saved.b === 1;
      cell.blightAge = saved.a;
      cell.blightShow = 1;
      cell.scale = 1;
      line.push(cell);
    }
    game.board.push(line);
  }
}

/* A browser can refuse storage outright. An iPhone opening this file
   straight off the device is the case that bit us: the page counts as
   having no origin, so localStorage, sessionStorage, IndexedDB and
   cookies are all refused. There is no other place to put a save, so
   this cannot be worked around in here. It is asked once, up front,
   and the answer is said out loud in the console and printed on the
   title card, so a run that will not be remembered says so before the
   player spends an hour on it. */
const storageWorks = (function () {
  const probeKey = "prismPathProbe";
  try {
    window.localStorage.setItem(probeKey, "1");
    window.localStorage.removeItem(probeKey);
    return true;
  } catch (refusedByBrowser) {
    console.error("PRISM PURGE cannot save: this browser refused local storage. Nothing will be remembered between sessions.", refusedByBrowser);
    return false;
  }
})();

function saveKeyFor(modeId, difficulty) {
  return SAVE_KEY_PREFIX + modeId + ":" + difficulty;
}

function bestKeyFor(modeId, difficulty) {
  return BEST_KEY_PREFIX + modeId + ":" + difficulty;
}

/* The game shipped with one save and one best score, from when there was
   one mode to play. Both are moved into Classic's slots the first time
   this build runs and the old keys are removed, so a run in progress
   survives the arrival of modes and this only ever happens once.

   A version 2 payload is what that build wrote. Anything else under
   those keys was already unreadable to the build that wrote it, so it is
   dropped the same way an old save has always been dropped, and the
   reason is said out loud rather than passed over. */
function migrateLegacyStorage() {
  if (storageWorks === false) return;

  const rawSave = window.localStorage.getItem(LEGACY_SAVE_KEY);
  if (rawSave !== null) {
    const payload = JSON.parse(rawSave);

    if (payload.version === 2) {
      payload.version = 4;
      payload.mode = "classic";
      payload.difficulty = "normal";

      /* Version 2 called it moves, because moves were the only thing a
         run could be counting down. */
      payload.budget = payload.moves;
      delete payload.moves;

      window.localStorage.setItem(saveKeyFor("classic", "normal"), JSON.stringify(payload));
    } else {
      console.error("PRISM PURGE found a saved game under the old key at version " +
        payload.version + ", which no build has ever read. It has been discarded.");
    }

    window.localStorage.removeItem(LEGACY_SAVE_KEY);
  }

  const rawBest = window.localStorage.getItem(LEGACY_BEST_KEY);
  if (rawBest !== null) {
    window.localStorage.setItem(bestKeyFor("classic", "normal"), rawBest);
    window.localStorage.removeItem(LEGACY_BEST_KEY);
  }
}

/* =====================================================================
   TEMPORARY ADAPTER: per mode saves into per mode and difficulty slots.

   DELETE THIS WHOLE BLOCK once the testers have all opened the game at
   least once on this build. To remove it: delete migratePerModeSaves,
   delete its one call in the boot sequence, and delete nothing else.
   Nothing in the game reads it or depends on it.

   What it does: saves used to be keyed by mode alone, one run per mode.
   They are now keyed by mode and difficulty together. This walks the old
   keys once at boot and moves each run into the slot for the difficulty
   it was begun on, which every save from version 4 onwards records
   inside itself. Without it a tester's run in progress would sit under a
   key nothing reads any more and look lost.
   ===================================================================== */
function migratePerModeSaves() {
  if (storageWorks === false) return;

  for (let modeIndex = 0; modeIndex < GAME_MODES.length; modeIndex++) {
    const modeId = GAME_MODES[modeIndex].id;
    const perModeKey = SAVE_KEY_PREFIX + modeId;
    const raw = window.localStorage.getItem(perModeKey);

    if (raw === null) continue;

    const payload = JSON.parse(raw);

    let difficultyIsKnown = false;
    for (let difficultyIndex = 0; difficultyIndex < DIFFICULTIES.length; difficultyIndex++) {
      if (DIFFICULTIES[difficultyIndex].id === payload.difficulty) difficultyIsKnown = true;
    }

    /* A run has to say which difficulty it was begun on or there is no
       right slot to put it in. Every save the game has ever written
       under a per mode key carries that field, so a payload without one
       came from something other than this game. It is left where it is
       and said out loud, the same way readSaveFor leaves a save it
       cannot read, because moving it somewhere arbitrary would be worse
       than leaving it alone. */
    if (difficultyIsKnown === false) {
      console.error("PRISM PURGE found a saved " + modeId + " game with no difficulty on it. " +
        "It cannot be moved into a difficulty slot and has been left alone.");
      continue;
    }

    window.localStorage.setItem(saveKeyFor(modeId, payload.difficulty), raw);
    window.localStorage.removeItem(perModeKey);
  }
}

function saveGame() {
  if (boardReady === false) return;
  if (storageWorks === false) return;

  const payload = {
    version: 6,
    randomBackgroundId: BackgroundHandler.randomId(),
    rows: ROWS,
    cols: COLS,
    mode: game.modeId,
    difficulty: game.difficulty,
    customRules: game.customRules,
    level: game.level,
    score: game.score,
    scoreAtLevelStart: game.scoreAtLevelStart,
    budget: game.budget,
    charge: game.charge,
    continues: game.continues,
    blightCarry: game.blightCarry,
    movesSinceBlight: game.movesSinceBlight,
    goal: game.goal,
    board: serialiseBoard()
  };

  window.localStorage.setItem(saveKeyFor(game.modeId, game.difficulty), JSON.stringify(payload));
}

function readSaveFor(modeId, difficulty) {
  if (storageWorks === false) return null;

  const raw = window.localStorage.getItem(saveKeyFor(modeId, difficulty));
  if (raw === null) return null;

  const payload = JSON.parse(raw);

  /* A save from a build this one does not know is treated as absent,
     the same way a save from a differently shaped board is. Said out
     loud, because a run vanishing off the mode select screen with no
     explanation is the worst way to meet it. */
  if (payload.version !== 4 && payload.version !== 5 && payload.version !== 6) {
    console.error("PRISM PURGE found a saved " + modeId + " game on " + difficulty +
      " at version " + payload.version + ", which this build cannot read. It has been " +
      "left alone and the mode will offer a new game.");
    return null;
  }

  /* A save made on a differently shaped board cannot be restored onto
     this one, so it is treated as absent. */
  if (payload.rows !== ROWS || payload.cols !== COLS) return null;

  // Version 4 predates backgrounds. Its board remains a valid saved run.
  if (payload.version === 4) {
    payload.version = 5;
    payload.randomBackgroundId = null;
  }

  /* Version 5 predates Custom, so no version 5 run can be one, and the
     rules it carries are none. */
  if (payload.version === 5) {
    payload.version = 6;
    payload.customRules = null;
  }

  /* A Custom run is nothing without the rules it was begun on. */
  if (payload.mode === "custom" && (payload.customRules === null || typeof payload.customRules !== "object")) {
    console.error("PRISM PURGE found a saved Custom game on " + difficulty +
      " with no rules on it. It has been left alone and the mode will offer a new game.");
    return null;
  }

  return payload;
}

function loadGame(payload) {
  game.modeId = payload.mode;
  game.difficulty = payload.difficulty;
  game.customRules = payload.customRules;
  if (game.modeId === "custom") {
    applyCustomRules(game.customRules, "the rules the saved Custom run was begun on");
  }
  game.specialCarry = { bomb: 0, prism: 0, chromatic: 0 };
  game.bestScore = loadBest(payload.mode, payload.difficulty);
  buildItemBar();
  game.level = payload.level;
  game.score = payload.score;
  game.scoreAtLevelStart = payload.scoreAtLevelStart;
  game.budget = payload.budget;
  game.charge = payload.charge;
  game.continues = payload.continues;
  game.blightCarry = payload.blightCarry;
  game.movesSinceBlight = payload.movesSinceBlight;
  game.goal = payload.goal;
  game.path = [];
  game.pathColour = -1;
  game.pathColours = [];
  game.loopClosed = false;
  game.aiming = "none";
  particles.length = 0;
  floaters.length = 0;
  blightCrawls.length = 0;

  restoreBoard(payload.board);
  BackgroundHandler.restoreRun(payload.randomBackgroundId);
  clearHint();

  game.phase = "idle";
  setMusicForLevel(game.level);
  refreshHud();
  // Persist a random image chosen while migrating an older saved run.
  saveGame();
}

function clearSaveFor(modeId, difficulty) {
  if (storageWorks === false) return;

  window.localStorage.removeItem(saveKeyFor(modeId, difficulty));
}

/* The mode tiles ask this once each on their way onto the screen, so it
   answers without parsing a whole board back out of storage.

   A mode can be holding a run on all three difficulties at once, and the
   tile only has room to say that a run exists, so any one of them is
   enough to answer yes. Which ones they are is the mode start screen's
   job to show, where the difficulty selector is standing right next to
   the answer. */
function hasAnySaveFor(modeId) {
  if (storageWorks === false) return false;

  for (let i = 0; i < DIFFICULTIES.length; i++) {
    const key = saveKeyFor(modeId, DIFFICULTIES[i].id);
    if (window.localStorage.getItem(key) !== null) return true;
  }
  return false;
}

function saveBest(value, modeId, difficulty) {
  if (storageWorks === false) return;

  window.localStorage.setItem(bestKeyFor(modeId, difficulty), String(value));
}

/* A mode and difficulty nobody has finished a run on has no best score,
   and zero is the honest reading of that. */
function loadBest(modeId, difficulty) {
  if (storageWorks === false) return 0;

  const raw = window.localStorage.getItem(bestKeyFor(modeId, difficulty));
  if (raw === null) return 0;

  const parsed = parseInt(raw, 10);
  if (Number.isNaN(parsed) === true) return 0;
  return parsed;
}

/* Settings are kept apart from the run on purpose. Quitting a run,
   wiping a save or losing everything on a game over must not put the
   player's volumes and hint preferences back where they started. */
function saveSettings() {
  if (storageWorks === false) return;

  const payload = {
    version: 7,
    backgrounds: BackgroundHandler.preferences(),
    customPicks: customPicks,
    sfxEnabled: sound.enabled,
    sfxVolume: sound.volume,
    musicEnabled: music.enabled,
    musicVolume: music.volume,
    hintsEnabled: hints.enabled,
    hintDelayChosen: hints.delayChosen,
    hintDelaySeconds: hints.delaySeconds,
    graphicsMode: graphics.mode,
    shimmerEnabled: shimmer.enabled,
    tourDone: tour.done
  };

  window.localStorage.setItem(SETTINGS_KEY, JSON.stringify(payload));
}

/* Reads stored audio, appearance, background and hint preferences. A
   first run has nothing stored, which is not a failure: the values
   written into those objects stand, and get saved the first time one is
   changed.

   Whether anything was ever stored is worth knowing on its own, because
   a player who has already set the game up the way they want does not
   need to be walked through it. settingsWereStored answers that.

   Version 1 is the shape that shipped before hints existed. Its audio
   fields are read in full, because a player who set their volumes
   should keep them when a new setting arrives. A version 1
   payload carries no answer about hints for the good reason that there
   was nothing to answer, so the hint helper keeps its own defaults.
   Version 2 is the same story one setting later: it knows about hints
   and knows nothing about graphics, so graphics keeps its own default,
   which is HD. Version 3 knows about graphics and nothing about the
   shimmer, so the shimmer keeps its own default, which is on.

   Version 4 knows about the shimmer and nothing about the setup tour, so
   a player arriving from it has plainly already set the game up and the
   tour counts as done.

   Version 5 predates per-mode backgrounds. Earlier supported payloads
   keep the catalog's explicit Mode Default preferences for every mode.

   Version 6 predates Custom, so its backgrounds carry no choice for it
   and there are no picks to read: the fifth mode is on its default
   background and the picks are the standard game.

   A payload under a version this build does not know is treated as
   absent, the same way an old save is. A payload under a version it
   does know is expected to hold the right shape, and is not quietly
   patched up when it does not. */
function loadSettings() {
  if (storageWorks === false) return;

  const raw = window.localStorage.getItem(SETTINGS_KEY);
  if (raw === null) return;

  const payload = JSON.parse(raw);
  if (payload.version !== 1 && payload.version !== 2 && payload.version !== 3 &&
      payload.version !== 4 && payload.version !== 5 && payload.version !== 6 &&
      payload.version !== 7) return;

  settingsWereStored = true;

  sound.enabled = storedSwitch(payload.sfxEnabled, "sfxEnabled");
  sound.volume = storedLevel(payload.sfxVolume, "sfxVolume");
  music.enabled = storedSwitch(payload.musicEnabled, "musicEnabled");
  music.volume = storedLevel(payload.musicVolume, "musicVolume");

  if (payload.version === 1) return;

  hints.enabled = storedSwitch(payload.hintsEnabled, "hintsEnabled");
  hints.delayChosen = storedSwitch(payload.hintDelayChosen, "hintDelayChosen");
  hints.delaySeconds = storedDelay(payload.hintDelaySeconds, "hintDelaySeconds");

  if (payload.version === 2) return;

  graphics.mode = storedGraphicsMode(payload.graphicsMode, "graphicsMode");

  if (payload.version === 3) return;

  shimmer.enabled = storedSwitch(payload.shimmerEnabled, "shimmerEnabled");

  if (payload.version === 4) return;

  tour.done = storedSwitch(payload.tourDone, "tourDone");
  if (payload.version === 5) return;

  if (payload.version === 6) {
    payload.backgrounds.custom = "default";
  }
  BackgroundHandler.restorePreferences(payload.backgrounds);
  if (payload.version === 6) return;

  customPicks = storedCustomPicks(payload.customPicks, "customPicks");
}

/* A stored rules object is checked the way a run's is, field by field,
   and copied so the stored object is never the one being edited. */
function storedCustomPicks(value, fieldName) {
  const isObject = value !== null && typeof value === "object";
  const hasLinks = isObject === true && value.links !== null && typeof value.links === "object";

  if (hasLinks === false) {
    throw new Error("PRISM PURGE: stored setting '" + fieldName +
      "' should be a Custom rules object and is " + JSON.stringify(value) + ".");
  }

  checkCustomRules(value, "stored setting '" + fieldName + "'");
  return cloneCustomRules(value);
}

function storedGraphicsMode(value, fieldName) {
  if (value === GRAPHICS_STANDARD) return GRAPHICS_STANDARD;
  if (value === GRAPHICS_HD) return GRAPHICS_HD;

  throw new Error("PRISM PURGE: stored setting '" + fieldName + "' should be '" +
    GRAPHICS_STANDARD + "' or '" + GRAPHICS_HD + "' and is " + JSON.stringify(value) + ".");
}

function storedDelay(value, fieldName) {
  const inRange = typeof value === "number" &&
    value >= HINT_DELAY_MIN_SECONDS &&
    value <= HINT_DELAY_MAX_SECONDS;

  if (inRange === true) return value;

  throw new Error("PRISM PURGE: stored setting '" + fieldName + "' should be a number from " +
    HINT_DELAY_MIN_SECONDS + " to " + HINT_DELAY_MAX_SECONDS + " and is " +
    JSON.stringify(value) + ".");
}

function storedSwitch(value, fieldName) {
  if (value === true) return true;
  if (value === false) return false;

  throw new Error("PRISM PURGE: stored setting '" + fieldName +
    "' should be true or false and is " + JSON.stringify(value) + ".");
}

function storedLevel(value, fieldName) {
  if (typeof value === "number" && value >= 0 && value <= 1) return value;

  throw new Error("PRISM PURGE: stored setting '" + fieldName +
    "' should be a number from 0 to 1 and is " + JSON.stringify(value) + ".");
}

/* ------------------------------------------------------------------
   Particles and floating text
   ------------------------------------------------------------------ */

function cellCentre(row, col) {
  return {
    x: layout.originX + col * layout.cell + layout.cell / 2,
    y: layout.originY + row * layout.cell + layout.cell / 2
  };
}

/* delay holds a particle still until the wave of a board wide clear
   reaches its cell. Everything else passes zero and fires at once. */
function spawnBurstParticles(row, col, cell, count, delay) {
  const centre = cellCentre(row, col);
  const colour = cell.colour >= 0 ? GEM_COLOURS[cell.colour].core : "#8b8199";

  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const speed = 60 + Math.random() * 150;
    particles.push({
      x: centre.x,
      y: centre.y + cell.offsetY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 40,
      life: 0.45 + Math.random() * 0.3,
      maxLife: 0.75,
      size: layout.cell * (0.08 + Math.random() * 0.1),
      colour: colour,
      gravity: 620,
      delay: delay
    });
  }
}

function spawnStoneDebris(row, col, delay) {
  const centre = cellCentre(row, col);
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 80 + Math.random() * 170;
    particles.push({
      x: centre.x,

function spawnFloater(row, col, text, colour) {

  });

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    if (p.delay > 0) {
      p.delay -= dt;
      continue;
    }

    p.life -= dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    p.vy += p.gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }

  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt;
    if (f.life <= 0) {
      floaters.splice(i, 1);
      continue;
    }
    f.y -= 52 * dt;
  }
}

/* ------------------------------------------------------------------
   Shockwaves and screen flash

   The loop effects hit the whole board at once, and a board wide spray
   of particles reads as mush. A ring travelling out from the middle of
   the loop is what makes the size of it legible: you can see where it
   started and watch it arrive.
   ------------------------------------------------------------------ */

const shockwaves = [];
let screenFlash = null;

function spawnShockwave(x, y, colour, maxRadius, life, width, delay) {
  shockwaves.push({
    x: x,
    y: y,
    colour: colour,
    maxRadius: maxRadius,
    life: life,
    maxLife: life,
    width: width,
    delay: delay
  });
}

function startScreenFlash(colour, seconds) {
  screenFlash = {
    colour: colour,
    life: seconds,
    maxLife: seconds
  };
}

function updateShockwaves(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const wave = shockwaves[i];

    if (wave.delay > 0) {
      wave.delay -= dt;
      continue;
    }

    wave.life -= dt;
    if (wave.life <= 0) {
      shockwaves.splice(i, 1);
    }
  }

  if (screenFlash !== null) {
    screenFlash.life -= dt;
    if (screenFlash.life <= 0) {
      screenFlash = null;
    }
  }
}

function drawShockwaves() {
  if (shockwaves.length === 0) return;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  for (let i = 0; i < shockwaves.length; i++) {
    const wave = shockwaves[i];
    if (wave.delay > 0) continue;

    /* Out fast, then easing off, which is how a real front behaves and
       also keeps the ring on screen long enough to be seen. */
    const age = 1 - wave.life / wave.maxLife;
    const eased = 1 - Math.pow(1 - age, 3);
    const radius = wave.maxRadius * eased;

    ctx.globalAlpha = (1 - age) * 0.85;
    ctx.strokeStyle = wave.colour;
    ctx.lineWidth = wave.width * (1 - age * 0.65);
    ctx.beginPath();
    ctx.arc(wave.x, wave.y, radius, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawScreenFlash() {
  if (screenFlash === null) return;

  const left = screenFlash.life / screenFlash.maxLife;

  ctx.save();
  ctx.globalAlpha = left * left * 0.9;
  ctx.fillStyle = screenFlash.colour;
  ctx.fillRect(0, 0, layout.width, layout.height);
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------------
   Toast messages
   ------------------------------------------------------------------ */

let toastTimer = 0;

/* Celebration messages that fire during a burst. A milestone word owns
   the middle of the screen while it is loud, and two messages at once
   read as neither, so these wait their turn and the word speaks for
   the break. Instructions and warnings still go through showToast
   directly, because those the player has to see. */
function showBurstToast(text, colour) {
  if (milestoneWord !== null && milestoneWord.age < WORD_HOLD_UNTIL) return;
  showToast(text, colour);
}

function showToast(text, colour) {
  toast.textContent = text;
  toast.style.color = colour;
  toastTimer = 1.1;
}

function updateToast(dt) {
  if (toastTimer <= 0) {
    toast.style.opacity = "0";
    return;
  }
  toastTimer -= dt;

  const t = Math.max(0, toastTimer / 1.1);
  const rise = (1 - t) * 26;
  toast.style.opacity = String(Math.min(1, t * 2.2));
  toast.style.transform = "translate(-50%, " + (-rise) + "px) scale(" + (0.9 + t * 0.25) + ")";
}

/* ---- MILESTONE WORDS: BEGIN ---- */

/* Bubble letters, built the way the approved mockup builds them: one
   heavy face drawn five times over, each pass a little narrower than
   the one under it.

     1. a dark copy dropped below   = shadow
     2. a fat dark stroke + fill    = the outer outline
     3. a thinner white stroke+fill = the bubble rim
     4. a gradient fill             = the body
     5. a white-to-clear fill       = the gloss

   Canvas paints a stroke over its own fill, so each pass strokes first
   and fills second. That ordering is the whole trick. */

const WORD_FONT_STACK = '"Arial Black", "Arial Bold", "Segoe UI Black", Gadget, sans-serif';
const WORD_INK = "#150e28";

/* Taken straight off the mockup, where a 112px face carried a 36px
   outline and a 17px rim. */
const WORD_OUTLINE_RATIO = 0.32;
const WORD_RIM_RATIO = 0.152;
const WORD_SHADOW_RATIO = 0.11;

/* The five milestones. widthFraction is how much of the board the word
   spans, and it climbs with the tier because size sells the escalation
   as much as colour does. It stops short of 1 because the sprite also
   has to fit its outline and its drop shadow inside the board. */
const MILESTONES = [
  {
    threshold: 5,
    text: "GOOD",
    widthFraction: 0.5,
    tilt: -2,
    body: ["#ffffff", "#a9dcff", "#2f9bef"],
    glow: "#3fb0ff",
    rayColour: "#6cc6ff",
    rays: 0,
    sparkles: 3
  },
  {
    threshold: 10,
    text: "GREAT",
    widthFraction: 0.61,
    tilt: -3,
    body: ["#f2fff2", "#6bf0a6", "#0f9d59"],
    glow: "#45e08a",
    rayColour: "#8dffc4",
    rays: 10,
    sparkles: 5
  },
  {
    threshold: 15,
    text: "AMAZING",
    widthFraction: 0.76,
    tilt: -4,
    body: ["#fffbe0", "#ffcf5c", "#f4770a"],
    glow: "#ffab35",
    rayColour: "#ffd06a",
    rays: 14,
    sparkles: 7
  },
  {
    threshold: 20,
    text: "UNBELIEVABLE",
    widthFraction: 0.88,
    tilt: -4,
    body: ["#fbf0ff", "#c79bff", "#7b2bff"],
    glow: "#b07cff",
    rayColour: "#d9b6ff",
    rays: 18,
    sparkles: 9
  },
  {
    threshold: 25,
    text: "OMG WOW!",
    widthFraction: 0.86,
    tilt: -5,
    body: ["#fff3a0", "#ffc22e", "#ff6f4d", "#ff3f9c", "#8a5bff"],
    glow: "#ff5fb0",
    rayColour: "#ffd23f",
    rays: 22,
    sparkles: 12
  }
];

/* Timings, in seconds. The whole thing is over in just over two. */
const WORD_PUNCH_IN = 0.13;
const WORD_SETTLE = 0.24;
const WORD_OVERSHOOT = 0.35;
const WORD_AT_REST = 0.46;
const WORD_GLINT_START = 0.28;
const WORD_GLINT_END = 0.66;

/* The whole thing is done inside a second. Settled at 0.46, a quarter
   second sitting still, then off in another quarter. The punch itself
   is untouched: it was only ever the tail that dragged. */
const WORD_HOLD_UNTIL = 0.72;
const WORD_GONE_AT = 1.00;

/* One live word at a time. A bigger break replaces a smaller one that
   is still on screen, because the player earned the louder message. */
let milestoneWord = null;

/* Sprites are expensive to build and cheap to blit, so each word is
   drawn once and kept until the board changes size. */
const milestoneSprites = new Map();
let milestoneSpriteWidth = 0;

function milestoneForCount(count) {
  let found = null;
  for (let i = 0; i < MILESTONES.length; i++) {
    if (count >= MILESTONES[i].threshold) {
      found = MILESTONES[i];
    }
  }
  return found;
}

/* Pick the point size that makes this word land on the target width.
   Text width is linear in point size, so one measurement is enough.
   Scaling the drawing instead would squash the outline along with the
   letters and leave the edges uneven. */
function fontSizeForWidth(measurePaint, text, targetWidth) {
  const reference = 100;

  measurePaint.font = "900 " + reference + "px " + WORD_FONT_STACK;
  const naturalWidth = measurePaint.measureText(text).width;

  return (reference * targetWidth) / naturalWidth;
}

function applyWordFont(paint, fontSize) {
  paint.font = "900 " + fontSize + "px " + WORD_FONT_STACK;
  paint.textAlign = "center";
  paint.textBaseline = "middle";
  paint.lineJoin = "round";
  paint.lineCap = "round";
}

/* Stroke then fill, so the stroke sits behind the letter and reads as
   an outline rather than a border painted on top of it. */
function strokeAndFill(paint, text, colour, lineWidth, x, y) {
  paint.strokeStyle = colour;
  paint.fillStyle = colour;
  paint.lineWidth = lineWidth;
  paint.strokeText(text, x, y);
  paint.fillText(text, x, y);
}

function buildWordSprite(milestone, boardWidth, pixelRatio) {
  const targetWidth = boardWidth * milestone.widthFraction * pixelRatio;

  const gauge = document.createElement("canvas").getContext("2d");
  const fontSize = fontSizeForWidth(gauge, milestone.text, targetWidth);

  const outlineWidth = fontSize * WORD_OUTLINE_RATIO;
  const rimWidth = fontSize * WORD_RIM_RATIO;
  const shadowDrop = fontSize * WORD_SHADOW_RATIO;

  applyWordFont(gauge, fontSize);
  const metrics = gauge.measureText(milestone.text);
  const above = metrics.actualBoundingBoxAscent;
  const below = metrics.actualBoundingBoxDescent;

  const margin = Math.ceil(outlineWidth / 2 + shadowDrop + fontSize * 0.06);
  const spriteWidth = Math.ceil(targetWidth) + margin * 2;
  const spriteHeight = Math.ceil(above + below) + margin * 2;

  const centreX = spriteWidth / 2;
  const baseline = margin + above - (above - below) / 2;

  const capTop = baseline - above;
  const capBottom = baseline + below;

  const sprite = document.createElement("canvas");
  sprite.width = spriteWidth;
  sprite.height = spriteHeight;

  const paint = sprite.getContext("2d");
  applyWordFont(paint, fontSize);

  /* 1. Shadow: the outline shape again, dropped and dimmed. */
  paint.globalAlpha = 0.45;
  strokeAndFill(paint, milestone.text, "#000000", outlineWidth, centreX, baseline + shadowDrop);
  paint.globalAlpha = 1;

  /* 2. Outline, 3. rim. */
  strokeAndFill(paint, milestone.text, WORD_INK, outlineWidth, centreX, baseline);
  strokeAndFill(paint, milestone.text, "#ffffff", rimWidth, centreX, baseline);

  /* 4. Body. */
  const bodyGradient = paint.createLinearGradient(0, capTop, 0, capBottom);
  for (let i = 0; i < milestone.body.length; i++) {
    bodyGradient.addColorStop(i / (milestone.body.length - 1), milestone.body[i]);
  }
  paint.fillStyle = bodyGradient;
  paint.fillText(milestone.text, centreX, baseline);

  /* 5. Gloss, gone by mid height. */
  const gloss = paint.createLinearGradient(0, capTop, 0, capBottom);
  gloss.addColorStop(0, "rgba(255, 255, 255, 0.66)");
  gloss.addColorStop(0.34, "rgba(255, 255, 255, 0.4)");
  gloss.addColorStop(0.55, "rgba(255, 255, 255, 0)");
  paint.fillStyle = gloss;
  paint.fillText(milestone.text, centreX, baseline);

  /* A plain white copy of the letters, used as the mask the glint
     sweeps inside so the shine never spills onto the background. */
  const mask = document.createElement("canvas");
  mask.width = spriteWidth;
  mask.height = spriteHeight;

  const cut = mask.getContext("2d");
  applyWordFont(cut, fontSize);
  cut.fillStyle = "#ffffff";
  cut.fillText(milestone.text, centreX, baseline);

  return {
    image: sprite,
    mask: mask,
    width: spriteWidth,
    height: spriteHeight
  };
}

/* Rays are drawn once into their own blurred sprite. Blurring per frame
   is far too slow on a phone, and the shape never changes: only its
   size and its opacity do. */
function buildRaySprite(milestone, spread, pixelRatio) {
  const reach = spread * 0.46;
  const inner = spread * 0.13;
  const blur = spread * 0.022;
  const halfWidth = ((Math.PI * 2) / milestone.rays) * 0.22;

  const radius = Math.ceil((reach + blur * 3) * pixelRatio);
  const size = radius * 2;

  const sprite = document.createElement("canvas");
  sprite.width = size;
  sprite.height = size;

  const paint = sprite.getContext("2d");
  paint.translate(radius, radius);
  paint.scale(pixelRatio, pixelRatio);
  paint.filter = "blur(" + (blur * pixelRatio).toFixed(1) + "px)";
  paint.fillStyle = milestone.rayColour;

  for (let i = 0; i < milestone.rays; i++) {
    const angle = (Math.PI * 2 * i) / milestone.rays;

    paint.beginPath();
    paint.moveTo(Math.cos(angle) * reach, Math.sin(angle) * reach);
    paint.lineTo(Math.cos(angle - halfWidth) * inner, Math.sin(angle - halfWidth) * inner);
    paint.lineTo(Math.cos(angle + halfWidth) * inner, Math.sin(angle + halfWidth) * inner);
    paint.closePath();
    paint.fill();
  }

  return { image: sprite, radius: radius / pixelRatio };
}

function milestoneSpriteFor(milestone, boardWidth, pixelRatio) {
  if (milestoneSpriteWidth !== boardWidth) {
    milestoneSprites.clear();
    milestoneSpriteWidth = boardWidth;
  }

  if (milestoneSprites.has(milestone.text) === false) {
    const spread = boardWidth * milestone.widthFraction;
    milestoneSprites.set(milestone.text, {
      word: buildWordSprite(milestone, boardWidth, pixelRatio),
      rays: milestone.rays === 0 ? null : buildRaySprite(milestone, spread, pixelRatio)
    });
  }

  return milestoneSprites.get(milestone.text);
}

/* Fire a word for a break of this size. Anything under the smallest
   threshold is silent, which keeps ordinary three and four gem links
   free of chatter. */
function showMilestoneWord(count) {
  const milestone = milestoneForCount(count);
  if (milestone === null) return null;

  /* A louder word always wins. A quieter one waits until the louder
     one has had its moment rather than cutting it off. */
  if (milestoneWord !== null) {
    const live = milestoneWord.milestone.threshold;
    if (live > milestone.threshold && milestoneWord.age < WORD_HOLD_UNTIL) {
      return null;
    }
  }

  const sparkles = [];
  for (let i = 0; i < milestone.sparkles; i++) {
    const angle = (Math.PI * 2 * i) / milestone.sparkles + Math.random() * 0.4;
    sparkles.push({
      angle: angle,
      distance: 0.82 + Math.random() * 0.34,
      size: 0.55 + Math.random() * 0.5,
      spin: Math.random() * Math.PI
    });
  }

  milestoneWord = { milestone: milestone, age: 0, sparkles: sparkles };
  return milestone;
}

function updateMilestoneWord(dt) {
  if (milestoneWord === null) return;

  milestoneWord.age += dt;
  if (milestoneWord.age >= WORD_GONE_AT) {
    milestoneWord = null;
  }
}

function easeOutBack(t) {
  const overshoot = 1.9;
  const shifted = t - 1;
  return 1 + (overshoot + 1) * shifted * shifted * shifted + overshoot * shifted * shifted;
}

/* Read the pop curve at a given age: how big, how tilted, how faded,
   and how far it has drifted on the way out. */
function milestonePose(age) {
  let scale = 1;
  let spin = 0;

  if (age < WORD_PUNCH_IN) {
    const t = age / WORD_PUNCH_IN;
    scale = 0.22 + (1.22 - 0.22) * easeOutBack(t);
    spin = -16 + 19 * t;
  } else if (age < WORD_SETTLE) {
    const t = (age - WORD_PUNCH_IN) / (WORD_SETTLE - WORD_PUNCH_IN);
    scale = 1.22 + (0.93 - 1.22) * t;
    spin = 3 + (-2 - 3) * t;
  } else if (age < WORD_OVERSHOOT) {
    const t = (age - WORD_SETTLE) / (WORD_OVERSHOOT - WORD_SETTLE);
    scale = 0.93 + (1.04 - 0.93) * t;
    spin = -2 + 3 * t;
  } else if (age < WORD_AT_REST) {
    const t = (age - WORD_OVERSHOOT) / (WORD_AT_REST - WORD_OVERSHOOT);
    scale = 1.04 - 0.04 * t;
    spin = 1 - t;
  }

  let fade = 1;
  let drift = 0;

  if (age > WORD_HOLD_UNTIL) {
    const t = (age - WORD_HOLD_UNTIL) / (WORD_GONE_AT - WORD_HOLD_UNTIL);
    fade = 1 - t;
    drift = -t * 54;
    scale = 1 + t * 0.14;
  }

  let appear = 1;
  if (age < 0.05) {
    appear = age / 0.05;
  }

  return { scale: scale, spin: spin, fade: fade * appear, drift: drift };
}

function drawMilestoneRays(paint, rays, age) {
  if (rays === null) return;

  let opacity = 0;
  let growth = 0.45;

  if (age < WORD_PUNCH_IN) {
    const t = age / WORD_PUNCH_IN;
    opacity = t;
    growth = 0.45 + 0.6 * t;
  } else if (age < WORD_HOLD_UNTIL) {
    const t = (age - WORD_PUNCH_IN) / (WORD_HOLD_UNTIL - WORD_PUNCH_IN);
    opacity = 1 - t * 0.5;
    growth = 1.05 + 0.4 * t;
  } else {
    const t = (age - WORD_HOLD_UNTIL) / (WORD_GONE_AT - WORD_HOLD_UNTIL);
    opacity = 0.5 * (1 - t);
    growth = 1.45 + 0.1 * t;
  }

  if (opacity <= 0) return;

  const drawnRadius = rays.radius * growth;

  paint.save();
  paint.globalAlpha = opacity * 0.85;
  paint.scale(1.75, 1);
  paint.drawImage(rays.image, -drawnRadius, -drawnRadius, drawnRadius * 2, drawnRadius * 2);
  paint.restore();
}

function traceSparkle(paint, radius) {
  const waist = radius * 0.16;

  paint.beginPath();
  paint.moveTo(0, -radius);
  paint.quadraticCurveTo(waist, -waist, radius, 0);
  paint.quadraticCurveTo(waist, waist, 0, radius);
  paint.quadraticCurveTo(-waist, waist, -radius, 0);
  paint.quadraticCurveTo(-waist, -waist, 0, -radius);
  paint.closePath();
}

function drawMilestoneSparkles(paint, word, age, spread) {
  if (age < WORD_SETTLE) return;

  let opacity = 1;
  let pop = 1;

  if (age < WORD_AT_REST) {
    const t = (age - WORD_SETTLE) / (WORD_AT_REST - WORD_SETTLE);
    pop = 1.35 - 0.35 * t;
  }
  if (age > WORD_HOLD_UNTIL) {
    const t = (age - WORD_HOLD_UNTIL) / (WORD_GONE_AT - WORD_HOLD_UNTIL);
    opacity = 1 - t;
    pop = 1 - t * 0.4;
  }

  paint.save();
  paint.globalAlpha = opacity;
  paint.fillStyle = "#ffffff";

  for (let i = 0; i < word.sparkles.length; i++) {
    const spark = word.sparkles[i];
    const x = Math.cos(spark.angle) * spread * 0.66 * spark.distance;
    const y = Math.sin(spark.angle) * spread * 0.24 * spark.distance;

    paint.save();
    paint.translate(x, y);
    paint.rotate(spark.spin);
    traceSparkle(paint, spread * 0.035 * spark.size * pop);
    paint.fill();
    paint.restore();
  }

  paint.restore();
}

/* The glint: a soft white bar sweeping across, kept inside the letters
   by painting it through the letter mask. */
function drawMilestoneGlint(paint, sprite, age) {
  if (age < WORD_GLINT_START || age > WORD_GLINT_END) return;

  const travel = (age - WORD_GLINT_START) / (WORD_GLINT_END - WORD_GLINT_START);
  const bandWidth = sprite.width * 0.2;
  const centreX = sprite.width * (-0.1 + travel * 1.2);

  const glint = document.createElement("canvas");
  glint.width = sprite.width;
  glint.height = sprite.height;

  const shine = glint.getContext("2d");
  shine.drawImage(sprite.mask, 0, 0);
  shine.globalCompositeOperation = "source-in";

  const sweep = shine.createLinearGradient(centreX - bandWidth, 0, centreX + bandWidth, 0);
  sweep.addColorStop(0, "rgba(255, 255, 255, 0)");
  sweep.addColorStop(0.5, "rgba(255, 255, 255, 0.7)");
  sweep.addColorStop(1, "rgba(255, 255, 255, 0)");

  shine.fillStyle = sweep;
  shine.fillRect(0, 0, sprite.width, sprite.height);

  paint.drawImage(glint, -sprite.width / 2, -sprite.height / 2);
}

/* Draw the live word centred on the board. */
function drawMilestoneWord(paint, boardWidth, boardHeight, pixelRatio) {
  if (milestoneWord === null) return;

  const milestone = milestoneWord.milestone;
  const cached = milestoneSpriteFor(milestone, boardWidth, pixelRatio);
  const sprite = cached.word;
  const pose = milestonePose(milestoneWord.age);
  const spread = boardWidth * milestone.widthFraction;

  paint.save();
  paint.translate(boardWidth / 2, boardHeight * 0.42 + pose.drift);
  paint.globalAlpha = pose.fade;

  drawMilestoneRays(paint, cached.rays, milestoneWord.age);

  paint.save();
  paint.rotate(((milestone.tilt + pose.spin) * Math.PI) / 180);
  paint.scale(pose.scale / pixelRatio, pose.scale / pixelRatio);

  paint.drawImage(sprite.image, -sprite.width / 2, -sprite.height / 2);
  drawMilestoneGlint(paint, sprite, milestoneWord.age);

  paint.restore();

  drawMilestoneSparkles(paint, milestoneWord, milestoneWord.age, spread);
  paint.restore();
}

/* ---- MILESTONE WORDS: END ---- */


/* ------------------------------------------------------------------
   Drawing
   ------------------------------------------------------------------ */

function resizeCanvas() {
  const rect = stage.getBoundingClientRect();
  const dpr = window.devicePixelRatio;

  const cellByWidth = Math.floor(rect.width / COLS);
  const cellByHeight = Math.floor(rect.height / ROWS);
  const cell = Math.max(24, Math.min(cellByWidth, cellByHeight));

  layout.cell = cell;
  layout.width = cell * COLS;
  layout.height = cell * ROWS;
  layout.originX = 0;
  layout.originY = 0;
  layout.pixelRatio = dpr;

  /* Word sprites are built for one board width. A resize invalidates
     every one of them. */
  milestoneSprites.clear();
  milestoneSpriteWidth = 0;

  canvas.style.width = layout.width + "px";
  canvas.style.height = layout.height + "px";
  canvas.width = Math.round(layout.width * dpr);
  canvas.height = Math.round(layout.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function tracePolygon(cx, cy, radius, sides, rotation) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const angle = rotation + (Math.PI * 2 * i) / sides;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  }
  ctx.closePath();
}

function traceGemShape(shape, cx, cy, radius, spin) {
  if (shape === "circle") {
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    return;
  }
  if (shape === "diamond") {
    tracePolygon(cx, cy, radius * 1.12, 4, spin - Math.PI / 2);
    return;
  }
  if (shape === "square") {
    tracePolygon(cx, cy, radius * 1.06, 4, spin + Math.PI / 4);
    return;
  }
  if (shape === "triangle") {
    tracePolygon(cx, cy, radius * 1.15, 3, spin - Math.PI / 2);
    return;
  }
  tracePolygon(cx, cy, radius * 1.05, 6, spin);
}

/* ------------------------------------------------------------------
   HD gem bodies

   Standard fills the silhouette with one corner to corner gradient.
   HD cuts the same silhouette into facets: a ring of flat shaded
   triangles between the girdle and a lit top face, with dispersion
   inside, a graded rim and a glint that travels across.

   The silhouette itself is shared. Both modes trace through
   traceGemShape, so a gem is the same shape and the same size whichever
   appearance is on, and nothing about hit testing or the board layout
   moves when the setting changes.
   ------------------------------------------------------------------ */

function hexToRgb(hex) {
  const red = parseInt(hex.slice(1, 3), 16);
  const green = parseInt(hex.slice(3, 5), 16);
  const blue = parseInt(hex.slice(5, 7), 16);
  return { r: red, g: green, b: blue };
}

function mixRgb(from, to, amount) {
  return {
    r: from.r + (to.r - from.r) * amount,
    g: from.g + (to.g - from.g) * amount,
    b: from.b + (to.b - from.b) * amount
  };
}

function rgbCss(rgb) {
  const red = Math.round(rgb.r);
  const green = Math.round(rgb.g);
  const blue = Math.round(rgb.b);
  return "rgb(" + red + ", " + green + ", " + blue + ")";
}

function rgbaCss(rgb, alpha) {
  const red = Math.round(rgb.r);
  const green = Math.round(rgb.g);
  const blue = Math.round(rgb.b);
  return "rgba(" + red + ", " + green + ", " + blue + ", " + alpha + ")";
}

/* A ramp is the five stops darkest first. Sampling it at nought gives
   the pavilion tone and at one the spark, which is exactly the range a
   single facet can be shaded across. */
function sampleRamp(ramp, position) {
  const clamped = Math.max(0, Math.min(1, position));
  const scaled = clamped * (ramp.length - 1);
  const lower = Math.min(ramp.length - 2, Math.floor(scaled));
  const local = scaled - lower;
  return mixRgb(ramp[lower], ramp[lower + 1], local);
}

/* Only the hue is wanted, to spin the dispersion colours off the base
   without hand picking three more hexes per gem. */
function hueOfRgb(rgb) {
  const red = rgb.r / 255;
  const green = rgb.g / 255;
  const blue = rgb.b / 255;
  const highest = Math.max(red, green, blue);
  const lowest = Math.min(red, green, blue);
  const span = highest - lowest;

  if (span === 0) return 0;

  let sector = 0;
  if (highest === red) {
    sector = ((green - blue) / span) % 6;
  } else if (highest === green) {
    sector = (blue - red) / span + 2;
  } else {
    sector = (red - green) / span + 4;
  }

  const degrees = sector * 60;
  if (degrees < 0) return degrees + 360;
  return degrees;
}

/* Worked out once at load. Parsing hex and converting to hue is
   arithmetic on constants, and doing it per gem per frame would be it
   sixty three times a frame for the same five answers. */
const HD_RAMPS = [];
const HD_FIRE_HUES = [];

for (let i = 0; i < HD_GEM_COLOURS.length; i++) {
  const palette = HD_GEM_COLOURS[i];

  HD_RAMPS.push([
    hexToRgb(palette.deep),
    hexToRgb(palette.glow),
    hexToRgb(palette.core),
    hexToRgb(palette.rim),
    hexToRgb(palette.spark)
  ]);

  HD_FIRE_HUES.push(hueOfRgb(hexToRgb(palette.core)));
}

/* The most anchors any shape needs: twelve for the circle and the
   hexagon, nine for the triangle, eight for the square and the
   diamond. */
const HD_MAX_ANCHORS = 12;

/* Facet corners are worked out fresh every time a gem is painted, so
   two scratch buffers are filled in place rather than allocating a pair
   of arrays each time. Nothing holds on to either past the gem being
   drawn, which is what lets them be shared.

   The board reaches this five times a frame now that BoardSprites holds
   the pictures, so the saving is smaller than it was. It still stands
   for the mode tiles and the settings tour, which paint live. */
const hdOuterAnchors = [];
const hdTableAnchors = [];

for (let i = 0; i < HD_MAX_ANCHORS; i++) {
  hdOuterAnchors.push({ x: 0, y: 0 });
  hdTableAnchors.push({ x: 0, y: 0 });
}

/* Points spaced along the outline of a polygon. Extra points are
   dropped along each edge so a triangle ends up with as many facets as
   a hexagon; they sit on the edge, so the silhouette is untouched. */
function fillPolygonAnchors(cx, cy, radius, sides, rotation, stepsPerEdge) {
  let written = 0;

  for (let side = 0; side < sides; side++) {
    const fromAngle = rotation + (Math.PI * 2 * side) / sides;
    const toAngle = rotation + (Math.PI * 2 * (side + 1)) / sides;

    const fromX = cx + Math.cos(fromAngle) * radius;
    const fromY = cy + Math.sin(fromAngle) * radius;
    const toX = cx + Math.cos(toAngle) * radius;
    const toY = cy + Math.sin(toAngle) * radius;

    for (let step = 0; step < stepsPerEdge; step++) {
      const along = step / stepsPerEdge;
      hdOuterAnchors[written].x = fromX + (toX - fromX) * along;
      hdOuterAnchors[written].y = fromY + (toY - fromY) * along;
      written = written + 1;
    }
  }

  return written;
}

function fillCircleAnchors(cx, cy, radius, rotation, wanted) {
  for (let i = 0; i < wanted; i++) {
    const angle = rotation + (Math.PI * 2 * i) / wanted;
    hdOuterAnchors[i].x = cx + Math.cos(angle) * radius;
    hdOuterAnchors[i].y = cy + Math.sin(angle) * radius;
  }
  return wanted;
}

/* Fills both buffers and hands back how many anchors are live. The
   radii here match traceGemShape exactly, so the facets land on the
   silhouette rather than near it. */
function fillGemAnchors(shape, cx, cy, radius, spin) {
  let count = 0;

  if (shape === "circle") {
    count = fillCircleAnchors(cx, cy, radius, spin - Math.PI / 2, 12);
  } else if (shape === "diamond") {
    count = fillPolygonAnchors(cx, cy, radius * 1.12, 4, spin - Math.PI / 2, 2);
  } else if (shape === "square") {
    count = fillPolygonAnchors(cx, cy, radius * 1.06, 4, spin + Math.PI / 4, 2);
  } else if (shape === "triangle") {
    count = fillPolygonAnchors(cx, cy, radius * 1.15, 3, spin - Math.PI / 2, 3);
  } else {
    count = fillPolygonAnchors(cx, cy, radius * 1.05, 6, spin, 2);
  }

  for (let i = 0; i < count; i++) {
    hdTableAnchors[i].x = cx + (hdOuterAnchors[i].x - cx) * HD_TABLE_SCALE;
    hdTableAnchors[i].y = cy + (hdOuterAnchors[i].y - cy) * HD_TABLE_SCALE;
  }

  return count;
}

/* A soft coloured halo under the stone, so gems light the board they
   sit on. Painted before the body, and the only part of the gem that
   reaches outside its own silhouette. */
function drawHdBloom(glowColour, cx, cy, radius) {
  const reach = radius * 1.85;
  const glow = hexToRgb(glowColour);

  const halo = ctx.createRadialGradient(cx, cy, radius * 0.5, cx, cy, reach);
  halo.addColorStop(0, rgbaCss(glow, 0.34));
  halo.addColorStop(0.45, rgbaCss(glow, 0.13));
  halo.addColorStop(1, rgbaCss(glow, 0));

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.beginPath();
  ctx.arc(cx, cy, reach, 0, Math.PI * 2);
  ctx.fillStyle = halo;
  ctx.fill();
  ctx.restore();
}

/* One flat facet. Its shade comes from where it faces relative to the
   key light, so the whole stone stays lit from one direction however
   many sides the shape has. */
function fillFacet(ramp, cx, cy, corners, cornerCount, shadeOffset) {
  let centroidX = 0;
  let centroidY = 0;

  for (let i = 0; i < cornerCount; i++) {
    centroidX = centroidX + corners[i].x;
    centroidY = centroidY + corners[i].y;
  }

  centroidX = centroidX / cornerCount;
  centroidY = centroidY / cornerCount;

  const awayX = centroidX - cx;
  const awayY = centroidY - cy;
  const distance = Math.sqrt(awayX * awayX + awayY * awayY);
  const facingX = awayX / distance;
  const facingY = awayY / distance;

  /* Lambert against the key light. The dot product runs minus one to
     one, so it is remapped into a nought to one shade before the curve
     and the offset go on.

     The range stops well short of the spark on purpose. A facet that
     reaches the top of the ramp goes white, and a white gem is one the
     player cannot name at a glance. The brightest facet lands on the
     rim tone and the shine is left to the table and the highlights. */
  const towardsLight = facingX * HD_LIGHT_X + facingY * HD_LIGHT_Y;
  const lambert = (towardsLight + 1) / 2;
  const shade = 0.12 + Math.pow(lambert, 1.5) * 0.62 + shadeOffset;

  ctx.beginPath();
  ctx.moveTo(corners[0].x, corners[0].y);
  for (let i = 1; i < cornerCount; i++) {
    ctx.lineTo(corners[i].x, corners[i].y);
  }
  ctx.closePath();
  ctx.fillStyle = rgbCss(sampleRamp(ramp, shade));
  ctx.fill();
}

/* The crown: two facets per anchor, one reaching the girdle and one
   leaning in toward the table. They are given opposite shade nudges, so
   neighbours sit a step apart and the cut reads even on a still frame. */
const hdFacetCorners = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];

function drawHdCrown(ramp, cx, cy, anchorCount) {
  for (let i = 0; i < anchorCount; i++) {
    const next = (i + 1) % anchorCount;

    hdFacetCorners[0].x = hdOuterAnchors[i].x;
    hdFacetCorners[0].y = hdOuterAnchors[i].y;
    hdFacetCorners[1].x = hdOuterAnchors[next].x;
    hdFacetCorners[1].y = hdOuterAnchors[next].y;
    hdFacetCorners[2].x = hdTableAnchors[next].x;
    hdFacetCorners[2].y = hdTableAnchors[next].y;
    fillFacet(ramp, cx, cy, hdFacetCorners, 3, 0.1);

    hdFacetCorners[0].x = hdOuterAnchors[i].x;
    hdFacetCorners[0].y = hdOuterAnchors[i].y;
    hdFacetCorners[1].x = hdTableAnchors[next].x;
    hdFacetCorners[1].y = hdTableAnchors[next].y;
    hdFacetCorners[2].x = hdTableAnchors[i].x;
    hdFacetCorners[2].y = hdTableAnchors[i].y;
    fillFacet(ramp, cx, cy, hdFacetCorners, 3, -0.09);
  }
}

/* The flat top face, brightest off centre toward the light. Most of the
   brightness the player actually perceives comes from here. */
function drawHdTable(ramp, cx, cy, radius, anchorCount) {
  const hotX = cx - radius * 0.16;
  const hotY = cy - radius * 0.19;

  /* Stops short of the spark for the same reason the facets do. The
     table is the brightest thing on the stone and it still has to be
     recognisably red or green while it is doing it. */
  const face = ctx.createRadialGradient(hotX, hotY, 0, cx, cy, radius * HD_TABLE_SCALE * 1.5);
  face.addColorStop(0, rgbCss(sampleRamp(ramp, 0.9)));
  face.addColorStop(0.42, rgbCss(sampleRamp(ramp, 0.66)));
  face.addColorStop(1, rgbCss(sampleRamp(ramp, 0.44)));

  ctx.beginPath();
  ctx.moveTo(hdTableAnchors[0].x, hdTableAnchors[0].y);
  for (let i = 1; i < anchorCount; i++) {
    ctx.lineTo(hdTableAnchors[i].x, hdTableAnchors[i].y);
  }
  ctx.closePath();
  ctx.fillStyle = face;
  ctx.fill();
}

/* The hairlines where facets meet. Cheap, and at board size they do
   most of the work of saying this is cut glass. */
function drawHdFacetEdges(radius, anchorCount) {
  ctx.lineWidth = Math.max(0.6, radius * 0.02);
  ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";

  ctx.beginPath();
  for (let i = 0; i < anchorCount; i++) {
    ctx.moveTo(hdOuterAnchors[i].x, hdOuterAnchors[i].y);
    ctx.lineTo(hdTableAnchors[i].x, hdTableAnchors[i].y);
  }
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(hdTableAnchors[0].x, hdTableAnchors[0].y);
  for (let i = 1; i < anchorCount; i++) {
    ctx.lineTo(hdTableAnchors[i].x, hdTableAnchors[i].y);
  }
  ctx.closePath();
  ctx.strokeStyle = "rgba(255, 255, 255, 0.26)";
  ctx.stroke();
}

/* Depth on the shadow side, so the stone reads as a solid with a bottom
   to it rather than a lit disc. */
function drawHdPavilionShadow(deepColour, cx, cy, radius) {
  const deep = hexToRgb(deepColour);
  const shadowX = cx + radius * 0.42;
  const shadowY = cy + radius * 0.48;

  const shade = ctx.createRadialGradient(shadowX, shadowY, radius * 0.1, shadowX, shadowY, radius * 1.25);
  shade.addColorStop(0, rgbaCss(deep, 0.5));
  shade.addColorStop(1, rgbaCss(deep, 0));

  ctx.fillStyle = shade;
  ctx.fillRect(cx - radius * 1.3, cy - radius * 1.3, radius * 2.6, radius * 2.6);
}

/* Dispersion. Three blobs in hues spun off the base colour, added in
   lighter mode so they brighten rather than tint. Held at low alpha on
   purpose: the player has to be able to name the colour at a glance,
   and a gem that has gone rainbow is a gem they cannot match. */
function drawHdFire(colourIndex, cx, cy, radius) {
  const baseHue = HD_FIRE_HUES[colourIndex];
  const reach = radius * 0.62;

  let drift = 0;
  if (shimmer.enabled === true) {
    drift = Math.sin(game.time * 0.6) * 8;
  }

  const hues = [baseHue - 46 + drift, baseHue + 46 - drift, baseHue + 128];
  const angles = [2.5, 0.75, 4.4];
  const alphas = [0.3, 0.27, 0.2];

  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  for (let i = 0; i < hues.length; i++) {
    const blobX = cx + Math.cos(angles[i]) * radius * 0.66;
    const blobY = cy + Math.sin(angles[i]) * radius * 0.66;

    const wash = ctx.createRadialGradient(blobX, blobY, 0, blobX, blobY, reach);
    wash.addColorStop(0, "hsl(" + hues[i] + ", 100%, 62%)");
    wash.addColorStop(1, "hsla(" + hues[i] + ", 100%, 62%, 0)");

    ctx.globalAlpha = alphas[i];
    ctx.beginPath();
    ctx.arc(blobX, blobY, reach, 0, Math.PI * 2);
    ctx.fillStyle = wash;
    ctx.fill();
  }

  ctx.restore();
}

/* A bright bar crossing the stone once per cycle, clipped to the shape
   so it never bleeds onto the board. */
function drawHdGlint(cx, cy, radius, phase) {
  const cyclePosition = ((game.time + phase) % HD_GLINT_PERIOD_SECONDS) / HD_GLINT_PERIOD_SECONDS;
  if (cyclePosition > HD_GLINT_VISIBLE_FRACTION) return;

  const sweep = cyclePosition / HD_GLINT_VISIBLE_FRACTION;
  const travel = -radius * 1.5 + sweep * radius * 3;
  const barWidth = radius * 0.55;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.translate(cx, cy);
  ctx.rotate(-0.62);

  const bar = ctx.createLinearGradient(travel - barWidth, 0, travel + barWidth, 0);
  bar.addColorStop(0, "rgba(255, 255, 255, 0)");
  bar.addColorStop(0.5, "rgba(255, 255, 255, 0.55)");
  bar.addColorStop(1, "rgba(255, 255, 255, 0)");

  ctx.fillStyle = bar;
  ctx.fillRect(travel - barWidth, -radius * 1.6, barWidth * 2, radius * 3.2);
  ctx.restore();
}

/* The girdle. Near white where the light lands at the top left, fading
   out through the middle, picking the rim tone back up on the far side,
   in place of Standard's flat white stroke. */
function drawHdGirdle(rimColour, shape, cx, cy, radius, spin) {
  const rim = ctx.createLinearGradient(cx - radius, cy - radius, cx + radius, cy + radius);
  rim.addColorStop(0, "rgba(255, 255, 255, 0.92)");
  rim.addColorStop(0.34, "rgba(255, 255, 255, 0.3)");
  rim.addColorStop(0.62, "rgba(255, 255, 255, 0.1)");
  rim.addColorStop(1, rgbaCss(hexToRgb(rimColour), 0.62));

  ctx.strokeStyle = rim;
  ctx.lineWidth = Math.max(1.4, radius * 0.075);
  traceGemShape(shape, cx, cy, radius * 0.96, spin);
  ctx.stroke();
}

/* The two highlights, plus a four point star sitting on the main one.
   The star is what reads as shiny while the board is standing still,
   between glints. */
function drawHdSpecular(cx, cy, radius) {
  ctx.beginPath();
  ctx.ellipse(cx - radius * 0.3, cy - radius * 0.36, radius * 0.27, radius * 0.15, -0.7, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255, 255, 255, 0.62)";
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(cx + radius * 0.28, cy + radius * 0.34, radius * 0.15, radius * 0.085, -0.7, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255, 255, 255, 0.24)";
  ctx.fill();

  let breath = HD_STAR_STILL;
  if (shimmer.enabled === true) {
    breath = 0.75 + Math.sin(game.time * 2.1) * 0.25;
  }

  const starX = cx - radius * 0.3;
  const starY = cy - radius * 0.36;
  const armLong = radius * 0.46 * breath;
  const armShort = radius * 0.09 * breath;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
  ctx.beginPath();
  ctx.moveTo(starX, starY - armLong);
  ctx.quadraticCurveTo(starX + armShort, starY - armShort, starX + armLong, starY);
  ctx.quadraticCurveTo(starX + armShort, starY + armShort, starX, starY + armLong);
  ctx.quadraticCurveTo(starX - armShort, starY + armShort, starX - armLong, starY);
  ctx.quadraticCurveTo(starX - armShort, starY - armShort, starX, starY - armLong);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* The flat gradient body the game shipped with, kept exactly as it
   was. */
function drawGemBodyStandard(cell, cx, cy, radius) {
  const palette = GEM_COLOURS[cell.colour];

  ctx.shadowColor = palette.glow;
  ctx.shadowBlur = radius * 0.7;
  traceGemShape(palette.shape, cx, cy, radius, cell.spin);

  const body = ctx.createLinearGradient(cx - radius, cy - radius, cx + radius, cy + radius);
  body.addColorStop(0, palette.rim);
  body.addColorStop(0.45, palette.core);
  body.addColorStop(1, palette.glow);
  ctx.fillStyle = body;
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
  ctx.lineWidth = Math.max(1.5, radius * 0.09);
  traceGemShape(palette.shape, cx, cy, radius * 0.97, cell.spin);
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(cx - radius * 0.3, cy - radius * 0.36, radius * 0.26, radius * 0.16, -0.7, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
  ctx.fill();
}

/* The stone itself: the shadowed base, then everything cut into it,
   clipped to the silhouette. This is the half of the gem that sits
   under the travelling glint. */
function drawHdCut(cell, cx, cy, radius) {
  const shape = GEM_COLOURS[cell.colour].shape;
  const palette = HD_GEM_COLOURS[cell.colour];
  const ramp = HD_RAMPS[cell.colour];

  ctx.save();
  ctx.shadowColor = palette.glow;
  ctx.shadowBlur = radius * 0.85;
  traceGemShape(shape, cx, cy, radius, cell.spin);
  ctx.fillStyle = rgbCss(sampleRamp(ramp, 0.35));
  ctx.fill();
  ctx.restore();

  const anchorCount = fillGemAnchors(shape, cx, cy, radius, cell.spin);

  ctx.save();
  traceGemShape(shape, cx, cy, radius, cell.spin);
  ctx.clip();

  drawHdCrown(ramp, cx, cy, anchorCount);
  drawHdTable(ramp, cx, cy, radius, anchorCount);
  drawHdFacetEdges(radius, anchorCount);
  drawHdPavilionShadow(palette.deep, cx, cy, radius);
  drawHdFire(cell.colour, cx, cy, radius);

  ctx.restore();
}

/* The glint, clipped so the bar never bleeds onto the board. Its own
   call because its phase is the one thing about a gem's appearance that
   is per gem rather than per colour, which is what keeps it out of the
   pictures BoardSprites paints and puts it last in the order.

   It used to sweep under the girdle and the highlights. Painting it
   over them instead was measured against the old order across a full
   board: mean error 2.35 of 255 with the glint on top, against 2.36 for
   the resampling the blit costs anyway. The rim and the highlights are
   near white where the bar is bright, so adding to them lands in the
   same place as covering them. */
function drawHdGlintClipped(cell, cx, cy, radius) {
  const shape = GEM_COLOURS[cell.colour].shape;

  ctx.save();
  traceGemShape(shape, cx, cy, radius, cell.spin);
  ctx.clip();
  drawHdGlint(cx, cy, radius, cell.glintPhase);
  ctx.restore();
}

/* The girdle and the two highlights: the finish on a cut stone. */
function drawHdPolish(cell, cx, cy, radius) {
  const shape = GEM_COLOURS[cell.colour].shape;
  const palette = HD_GEM_COLOURS[cell.colour];

  drawHdGirdle(palette.rim, shape, cx, cy, radius, cell.spin);
  drawHdSpecular(cx, cy, radius);
}

/* The faceted body, painted bottom up: bloom, cut, polish, glint. Only
   the bloom reaches outside the silhouette.

   The glint goes last so that everything under it is the same picture
   for every gem wearing a colour, which is what lets BoardSprites hold
   one of them instead of building sixty three a frame. Every painter of
   a gem uses this order, so the board and the settings tour cannot
   drift apart.

   showGlint is passed rather than assumed because the goal line icons
   are painted once and cached. A sweeping bar baked into a still would
   sit frozen halfway across the icon forever. */
function drawGemBodyHD(cell, cx, cy, radius, showGlint) {
  const palette = HD_GEM_COLOURS[cell.colour];

  drawHdBloom(palette.glow, cx, cy, radius);
  drawHdCut(cell, cx, cy, radius);
  drawHdPolish(cell, cx, cy, radius);

  if (showGlint === true && shimmer.enabled === true) {
    drawHdGlintClipped(cell, cx, cy, radius);
  }
}

/* The tray the live board sits in. A mode tile builds one of these at
   its own size and level, which is what lets a tile show the real tray
   instead of a hand copy of it that drifts away over time. */
function boardTray() {
  return {
    originX: layout.originX,
    originY: layout.originY,
    cell: layout.cell,
    rows: ROWS,
    cols: COLS,
    width: layout.width,
    height: layout.height,
    level: game.level
  };
}

function drawBackdrop(tray, showImage = false) {
  if (graphics.mode === GRAPHICS_HD) {
    drawBackdropHD(tray, showImage);
    return;
  }
  drawBackdropStandard(tray, showImage);
}

function drawBackdropStandard(tray, showImage) {
  if (showImage === false) {
    const hueShift = (tray.level - 1) * 26;
    const gradient = ctx.createLinearGradient(0, 0, 0, tray.height);
    gradient.addColorStop(0, "hsl(" + ((262 + hueShift) % 360) + ", 44%, 12%)");
    gradient.addColorStop(1, "hsl(" + ((228 + hueShift) % 360) + ", 50%, 7%)");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, tray.width, tray.height);
  }

  ctx.strokeStyle = "rgba(255, 255, 255, 0.045)";
  ctx.lineWidth = 1;
  for (let row = 0; row < tray.rows; row++) {
    for (let col = 0; col < tray.cols; col++) {
      const x = tray.originX + col * tray.cell;
      const y = tray.originY + row * tray.cell;
      roundedRect(x + 2, y + 2, tray.cell - 4, tray.cell - 4, tray.cell * 0.18);
      ctx.stroke();
    }
  }
}

/* The tray. Darker and a good deal less saturated than Standard, which
   is what gives the HD bloom somewhere to land, and each cell cut as a
   recess rather than outlined: dark along the top edge fading to a lit
   lip along the bottom, which is what a hole in a surface looks like
   under a key light coming from above. The same light the stones are
   cut for.

   With No Background, the level tints the base at a third of Standard's
   saturation. With artwork, only the recessed cells cover the image.

   One gradient per row rather than one per cell. The lip is vertical
   and every cell in a row shares a y, so seven cells share an object
   and the frame builds nine of them instead of sixty three. */
function drawBackdropHD(tray, showImage) {
  if (showImage === false) {
    const hueShift = (tray.level - 1) * 26;
    const gradient = ctx.createLinearGradient(0, 0, 0, tray.height);
    gradient.addColorStop(0, "hsl(" + ((262 + hueShift) % 360) + ", 30%, 7%)");
    gradient.addColorStop(1, "hsl(" + ((228 + hueShift) % 360) + ", 34%, 4%)");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, tray.width, tray.height);
  }

  const inset = 2;
  const size = tray.cell - inset * 2;
  const corner = tray.cell * 0.2;

  ctx.lineWidth = 1;

  for (let row = 0; row < tray.rows; row++) {
    const y = tray.originY + row * tray.cell + inset;

    const lip = ctx.createLinearGradient(0, y, 0, y + size);
    lip.addColorStop(0, "rgba(0, 0, 0, 0.55)");
    lip.addColorStop(0.55, "rgba(0, 0, 0, 0.18)");
    lip.addColorStop(1, "rgba(190, 174, 244, 0.17)");

    for (let col = 0; col < tray.cols; col++) {
      const x = tray.originX + col * tray.cell + inset;

      roundedRect(x, y, size, size, corner);
      ctx.fillStyle = "rgba(0, 0, 0, 0.34)";
      ctx.fill();

      roundedRect(x + 0.5, y + 0.5, size - 1, size - 1, corner);
      ctx.strokeStyle = lip;
      ctx.stroke();
    }
  }
}

function drawStone(cell, cx, cy, radius) {
  const size = radius * 1.7;
  ctx.save();
  ctx.translate(cx, cy);

  const gradient = ctx.createLinearGradient(-size / 2, -size / 2, size / 2, size / 2);
  gradient.addColorStop(0, "#7d7597");
  gradient.addColorStop(1, "#433d5c");

  roundedRect(-size / 2, -size / 2, size, size, size * 0.22);
  ctx.fillStyle = gradient;
  ctx.fill();
  ctx.strokeStyle = "rgba(255, 255, 255, 0.18)";
  ctx.lineWidth = 2;
  ctx.stroke();

  /* Two or more hits left is written on the stone as a number. Counting
     crack marks is guesswork, and a number cannot be misread. The last
     hit is the exception: it shows the damage instead, so a stone about
     to go looks like one. */
  const showsCount = cell.hp >= 2;

  if (showsCount === false) {
    ctx.strokeStyle = "rgba(0, 0, 0, 0.55)";
    ctx.lineWidth = Math.max(1.6, radius * 0.1);

    const crackPaths = [
      [[-0.30, -0.26], [-0.05,  0.00], [-0.18,  0.30]],
      [[ 0.32, -0.30], [ 0.08,  0.05], [ 0.30,  0.32]],
      [[-0.30,  0.32], [-0.02,  0.18], [ 0.22,  0.34]],
      [[-0.32, -0.06], [ 0.00, -0.20], [ 0.30, -0.10]],
      [[-0.10, -0.34], [ 0.04, -0.06], [-0.06,  0.30]]
    ];

    const cracks = Math.min(crackPaths.length, cell.maxHp - cell.hp);
    for (let i = 0; i < cracks; i++) {
      const points = crackPaths[i];
      ctx.beginPath();
      ctx.moveTo(points[0][0] * size, points[0][1] * size);
      ctx.lineTo(points[1][0] * size, points[1][1] * size);
      ctx.lineTo(points[2][0] * size, points[2][1] * size);
      ctx.stroke();
    }
  }

  /* Tough stones get a brighter rim so you can tell at a glance that
     they will take more than the usual two hits. */
  if (cell.maxHp > 2) {
    ctx.strokeStyle = "rgba(255, 214, 120, " + Math.min(0.85, 0.25 + cell.maxHp * 0.1) + ")";
    ctx.lineWidth = Math.max(1.5, radius * 0.08);
    roundedRect(-size / 2 + 3, -size / 2 + 3, size - 6, size - 6, size * 0.18);
    ctx.stroke();
  }

  if (showsCount === true) {
    ctx.font = "bold " + Math.round(radius * 0.85) + "px Trebuchet MS, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineWidth = Math.max(2, radius * 0.14);
    ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
    ctx.strokeText(String(cell.hp), 0, 0);
    ctx.fillStyle = "#ffe0a8";
    ctx.fillText(String(cell.hp), 0, 0);
  }

  ctx.restore();
}

/* The body is whichever appearance the Graphics setting is on, and the
   marks that go over it are the same either way: a bomb reads as a bomb
   and blight reads as blight whether the stone under it is flat or cut.

   showGlint is false for the goal line icons, which are painted once
   and kept. Everything else on the board passes true. */
/* What a cell carries on top of its body. These vary cell by cell, so
   no shared picture can hold them and they are always painted live.
   Their own call because the board blits its bodies from BoardSprites
   and still has to put the same marks on the same way. */
function drawGemMarks(cell, cx, cy, radius) {
  if (cell.special === "bomb") {
    drawBombMarks(cx, cy, radius);
  }
  if (cell.special === "prism") {
    drawPrismMarks(cx, cy, radius);
  }
  if (cell.special === "chromatic") {
    drawChromaticMarks(cx, cy, radius, game.time * CHROMATIC_SPIN_RATE);
  }
  if (cell.blighted === true && cell.blightShow > 0) {
    drawBlight(cx, cy, radius, cell.blightShow);
  }
}

function drawGem(cell, cx, cy, radius, showGlint) {
  ctx.save();

  if (graphics.mode === GRAPHICS_HD) {
    drawGemBodyHD(cell, cx, cy, radius, showGlint);
  } else {
    drawGemBodyStandard(cell, cx, cy, radius);
  }

  drawGemMarks(cell, cx, cy, radius);

  ctx.restore();
}

/* ------------------------------------------------------------------
   Goal line icons

   The goal used to name its target in words: "Burst 15 amber gems".
   That asks the player to agree with us about what amber is, and to be
   able to tell it from red in the first place. The gem itself is drawn
   into the line instead, so the shape and the colour both say which
   piece to go for and neither has to be read.

   These are the board's own routines painting into a small canvas, so
   an icon is the same picture as the thing sitting on the board. Those
   routines paint through the module level ctx, so it is pointed at the
   icon canvas for one synchronous call and put straight back. Nothing
   else runs in between.
   ------------------------------------------------------------------ */

const GOAL_ICON_PIXELS = 22;

/* Built once each and kept. The key carries the pixel ratio so moving
   the window to a different screen redraws them sharp. */
const goalIcons = new Map();

function buildGoalIcon(paint) {
  const dpr = window.devicePixelRatio;
  const iconCanvas = document.createElement("canvas");

  iconCanvas.className = "goalIcon";
  iconCanvas.width = Math.round(GOAL_ICON_PIXELS * dpr);
  iconCanvas.height = Math.round(GOAL_ICON_PIXELS * dpr);
  iconCanvas.style.width = GOAL_ICON_PIXELS + "px";
  iconCanvas.style.height = GOAL_ICON_PIXELS + "px";

  const boardCtx = ctx;
  ctx = iconCanvas.getContext("2d");
  ctx.scale(dpr, dpr);

  /* The board draws a gem at 0.38 of a cell across. The icon holds the
     same proportion against its own box, with the remainder left for
     the glow and for the shapes that reach past their radius. */
  const centre = GOAL_ICON_PIXELS / 2;
  paint(centre, centre, GOAL_ICON_PIXELS * 0.33);

  ctx = boardCtx;
  return iconCanvas;
}

function goalGemIcon(colour) {
  /* The appearance is part of the key, so switching between Standard
     and HD gets a fresh picture rather than the one already cached, and
     switching back reuses what was built the first time. The shimmer
     setting is in there for the same reason: the still bakes in whatever
     size the star and whatever hue the dispersion held when it was
     drawn. */
  const key = "gem:" + colour + ":" + graphics.mode + ":" + shimmer.enabled +
    ":" + window.devicePixelRatio;
  const cached = goalIcons.get(key);
  if (cached !== undefined) return cached;

  /* A gem at rest: no spin, no bomb or prism marks, no blight, and no
     glint, because a still cannot carry a sweep. */
  const sample = { colour: colour, spin: 0, special: "none", blighted: false, glintPhase: 0 };
  const icon = buildGoalIcon(function (x, y, radius) { drawGem(sample, x, y, radius, false); });

  goalIcons.set(key, icon);
  return icon;
}

function goalStoneIcon() {
  const key = "stone:" + window.devicePixelRatio;
  const cached = goalIcons.get(key);
  if (cached !== undefined) return cached;

  /* A whole stone. One hit point leaves it with no cracks and no number
     written on it, which is what a plain symbol wants. */
  const sample = { hp: 1, maxHp: 1 };
  const icon = buildGoalIcon(function (x, y, radius) { drawStone(sample, x, y, radius); });

  goalIcons.set(key, icon);
  return icon;
}

/* =====================================================================
   ModeTiles
   Owns: painting and keeping the pictures on the mode select screen.
   Stays out of: what each picture shows, which is the mode's own to say.

   A tile is the game drawing itself. The tray, the gems and the stones
   are the board's own routines at a smaller cell size, so a tile is
   right in Standard and right in HD without either being drawn twice.

   Every tile is a still. The gems hold no spin and no glint, the tray is
   pinned to one level so its hue never wanders, and the picture itself
   is written out by hand in the mode. Rebuilding a tile therefore
   produces the same image it produced last time, whether the rebuild
   came from switching appearance or from moving the window to a screen
   of a different sharpness.
   ===================================================================== */

/* The level the tray borrows its hue from. Fixed, because a tray tinted
   by the level in play would make the tile change as you climbed. */
const TILE_LEVEL = 1;

/* Canvas cannot read a CSS font stack, so the one the interface uses has
   to be said again here. It matches the family on html, body. */
const TILE_FONT_STACK = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';

/* Built once each and kept. The key carries everything that changes the
   picture, so switching appearance gets a fresh one and switching back
   reuses what was built the first time. */
const modeTiles = new Map();

/* A plate with a number on it, in the style of the stat boxes at the top
   of the screen. The colours are borrowed off the stylesheet rather than
   written out a second time here, which is also what makes the plate
   follow Standard and HD without being told which one is on. */
function drawTileChip(tray, text) {
  const chrome = window.getComputedStyle(app);
  const fontSize = Math.round(tray.cell * 0.42);
  const paddingX = tray.cell * 0.26;
  const height = tray.cell * 0.72;
  const corner = tray.cell * 0.18;
  const margin = tray.cell * 0.22;

  ctx.font = "bold " + fontSize + "px " + TILE_FONT_STACK;
  const width = ctx.measureText(text).width + paddingX * 2;

  const left = tray.originX + tray.width - width - margin;
  const top = tray.originY + margin;

  roundedRect(left, top, width, height, corner);

  /* HD's surfaces are metal, which is a gradient and never a flat line.
