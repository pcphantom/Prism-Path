     Standard's are flat. --panel-lift is HD's own token and is only read
     on the branch that HD takes. */
  if (graphics.mode === GRAPHICS_HD) {
    const face = ctx.createLinearGradient(0, top, 0, top + height);
    face.addColorStop(0, chrome.getPropertyValue("--panel-lift").trim());
    face.addColorStop(1, chrome.getPropertyValue("--panel").trim());
    ctx.fillStyle = face;
  } else {
    ctx.fillStyle = chrome.getPropertyValue("--panel").trim();
  }

  ctx.fill();
  ctx.strokeStyle = chrome.getPropertyValue("--panel-edge").trim();
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = chrome.getPropertyValue("--ink").trim();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, left + width / 2, top + height / 2);
}

/* A ring with four arms outside it, sitting over one cell. The same
   marker the aim hint puts on the board, held still. */
function drawTileCrosshair(tray, row, col) {
  const centreX = tray.originX + col * tray.cell + tray.cell / 2;
  const centreY = tray.originY + row * tray.cell + tray.cell / 2;
  const radius = tray.cell * 0.46;
  const armInner = radius * 1.16;
  const armOuter = radius * 1.62;

  ctx.strokeStyle = "#4fd6ff";
  ctx.lineWidth = Math.max(1.5, tray.cell * 0.06);

  ctx.beginPath();
  ctx.arc(centreX, centreY, radius, 0, Math.PI * 2);
  ctx.stroke();

  const arms = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  for (let i = 0; i < arms.length; i++) {
    ctx.beginPath();
    ctx.moveTo(centreX + arms[i][0] * armInner, centreY + arms[i][1] * armInner);
    ctx.lineTo(centreX + arms[i][0] * armOuter, centreY + arms[i][1] * armOuter);
    ctx.stroke();
  }
}

/* The gems the mode laid out, at the same proportion of a cell the board
   gives them. A cell the mode left empty shows the bare tray, which is
   how a draining board reads at a glance. */
function drawTileGems(mode, tray) {
  const radius = tray.cell * 0.38;

  for (let row = 0; row < tray.rows; row++) {
    for (let col = 0; col < tray.cols; col++) {
      const colour = mode.tileGems[row][col];
      if (colour === TILE_EMPTY) continue;

      const centreX = tray.originX + col * tray.cell + tray.cell / 2;
      const centreY = tray.originY + row * tray.cell + tray.cell / 2;

      /* A gem at rest: no spin, no bomb or prism marks, no blight, and
         no glint, because a still cannot carry a sweep. */
      const sample = { colour: colour, spin: 0, special: "none", blighted: false, glintPhase: 0 };
      drawGem(sample, centreX, centreY, radius, false);
    }
  }
}

/* The board's routines paint through the module level ctx, so it is
   pointed at the tile canvas for one synchronous run and put straight
   back. Nothing else runs in between. */
function buildModeTile(mode, cssWidth) {
  const dpr = window.devicePixelRatio;
  const rows = mode.tileGems.length;
  const cols = mode.tileGems[0].length;
  const cell = cssWidth / cols;
  const cssHeight = cell * rows;

  const tileCanvas = document.createElement("canvas");
  tileCanvas.className = "modeTileArt";
  tileCanvas.width = Math.round(cssWidth * dpr);
  tileCanvas.height = Math.round(cssHeight * dpr);
  tileCanvas.style.width = cssWidth + "px";
  tileCanvas.style.height = cssHeight + "px";

  const boardCtx = ctx;
  ctx = tileCanvas.getContext("2d");
  ctx.scale(dpr, dpr);

  const tray = {
    originX: 0,
    originY: 0,
    cell: cell,
    rows: rows,
    cols: cols,
    width: cssWidth,
    height: cssHeight,
    level: TILE_LEVEL
  };

  drawBackdrop(tray);
  drawTileGems(mode, tray);
  mode.drawTileMark(tray);

  ctx = boardCtx;
  return tileCanvas;
}

/* The element itself, kept and handed back. Each mode and width pairing
   is shown in exactly one place, so the one element can live wherever
   the screen that asked for it puts it. Two screens wanting the same
   picture at the same width at the same moment would need a copy, and
   nothing does that. */
function modeTileFor(modeId, cssWidth) {
  /* Rounded, because a browser can report the same ratio as 2 on one
     read and 2.0000000596046448 on the next. Left raw, those two build
     the identical picture twice and keep both. */
  const sharpness = Math.round(window.devicePixelRatio * 100) / 100;
  const key = modeId + ":" + cssWidth + ":" + graphics.mode + ":" + shimmer.enabled +
    ":" + sharpness;

  const cached = modeTiles.get(key);
  if (cached !== undefined) return cached;

  const tile = buildModeTile(modeById(modeId), cssWidth);
  modeTiles.set(key, tile);
  return tile;
}

function drawBombMarks(cx, cy, radius) {
  const pulse = 0.7 + Math.sin(game.time * 7) * 0.3;

  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.44, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(20, 12, 28, 0.85)";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.2 * pulse, 0, Math.PI * 2);
  ctx.fillStyle = "#ffd47a";
  ctx.fill();

  ctx.strokeStyle = "rgba(255, 212, 122, " + pulse + ")";
  ctx.lineWidth = Math.max(1.5, radius * 0.08);
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.62, 0, Math.PI * 2);
  ctx.stroke();
}

function drawPrismMarks(cx, cy, radius) {
  const spin = game.time * 1.6;

  for (let i = 0; i < GEM_COLOURS.length; i++) {
    const angle = spin + (Math.PI * 2 * i) / GEM_COLOURS.length;
    ctx.beginPath();
    ctx.arc(
      cx + Math.cos(angle) * radius * 0.5,
      cy + Math.sin(angle) * radius * 0.5,
      radius * 0.17,
      0,
      Math.PI * 2
    );
    ctx.fillStyle = GEM_COLOURS[i].core;
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
}

/* A colour wheel: twelve wedges round the hue circle, a lighter ring of
   the same twelve inside them, and a white core. It turns more slowly
   than the prism's dots. The angle is an argument so a still picture of
   one can be drawn at a fixed turn. */
const CHROMATIC_SPIN_RATE = 0.9;
const CHROMATIC_WEDGES = 12;

function drawChromaticMarks(cx, cy, radius, spin) {
  const wedgeAngle = (Math.PI * 2) / CHROMATIC_WEDGES;

  for (let i = 0; i < CHROMATIC_WEDGES; i++) {
    const hue = i * (360 / CHROMATIC_WEDGES);
    const from = spin + i * wedgeAngle;
    const to = from + wedgeAngle;

    drawWheelWedge(cx, cy, radius * 0.30, radius * 0.64, from, to, "hsl(" + hue + ", 90%, 55%)");
    drawWheelWedge(cx, cy, radius * 0.16, radius * 0.30, from, to, "hsl(" + hue + ", 90%, 78%)");
  }

  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.16, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
}

function drawWheelWedge(cx, cy, innerRadius, outerRadius, from, to, colour) {
  ctx.beginPath();
  ctx.arc(cx, cy, outerRadius, from, to);
  ctx.arc(cx, cy, innerRadius, to, from, true);
  ctx.closePath();
  ctx.fillStyle = colour;
  ctx.fill();
}

function drawBlight(cx, cy, radius, alpha) {
  const wobble = Math.sin(game.time * 3) * radius * 0.05;

  ctx.save();
  ctx.globalAlpha = ctx.globalAlpha * alpha;

  ctx.beginPath();
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12;
    const jag = radius * (0.86 + (i % 2 === 0 ? 0.14 : -0.1)) + wobble;
    const x = cx + Math.cos(angle) * jag;
    const y = cy + Math.sin(angle) * jag;
    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  }
  ctx.closePath();
  /* Kept translucent so the gem colour underneath still reads. You
     have to be able to see what you are matching to cure it. */
  ctx.fillStyle = "rgba(18, 4, 30, 0.58)";
  ctx.fill();
  ctx.strokeStyle = "rgba(190, 90, 255, 0.75)";
  ctx.lineWidth = Math.max(1.5, radius * 0.09);
  ctx.stroke();

  /* Two small eyes give the blight a face. */
  const eyeGlow = 0.55 + Math.sin(game.time * 5) * 0.35;
  ctx.fillStyle = "rgba(255, 120, 220, " + eyeGlow + ")";
  ctx.beginPath();
  ctx.arc(cx - radius * 0.24, cy - radius * 0.05, radius * 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + radius * 0.24, cy - radius * 0.05, radius * 0.1, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/* =====================================================================
   BoardSprites
   Owns: the pre-painted gem bodies and tray the live board is blitted
   from, and knowing when they have gone stale.
   Stays out of: what a gem or a tray looks like, which stays with the
   drawing routines above.

   Why it exists: the board repaints sixty three gems every frame, and
   every one of them used to rebuild the same shadows, gradients and
   facets from scratch. Measured on the desktop preview that was 12.6ms
   of a 26.3ms frame. Painting each colour once and blitting the result
   takes the board's share of the frame down to nothing measurable.

   Only the live board draws from here. The goal icons, the mode tiles
   and the settings tour all keep calling drawGem and drawBackdrop
   directly. Each of those paints once, at its own size, on a screen
   where the board is not drawing at all, so routing them through here
   would buy nothing and would push the board's own pictures out.

   Two pictures per colour. The bloom is one because it is added to the
   board underneath the gem rather than drawn over it, so it cannot
   share a blit with anything. Everything else the gem is made of goes
   in the second, and the glint is painted live on top, since its phase
   is the one part of a gem that is per gem rather than per colour.

   Two and no more, on purpose. Every layer is resampled as it lands, so
   the errors compound: a four layer version that kept each blend mode
   perfectly separate measured worse than this one against the live
   painter, mean 3.01 of 255 against 2.35.

   Standard has no bloom and no glint. Its whole body is the one
   picture.

   The shimmer is the one part of a colour that genuinely moves. The
   dispersion hue drifts and the highlight star breathes, both on the
   clock and both identical across every gem of a colour. So with the
   shimmer on the pictures are repainted once a frame, which is five
   gems' work in place of sixty three. With it off they are painted once
   and held until something in the key changes.
   ===================================================================== */

/* Sprites are painted at the largest a gem is ever drawn, so a gem part
   way through a spawn or a death pop is only ever scaled down. A death
   pop reaches 1.35 and a landing bounce reaches 1.16. */
const SPRITE_HEADROOM = 1.35;

/* How far past the gem radius each picture has to reach. The widest
   silhouette is the triangle at 1.15, and the body casts a drop shadow
   that blurs well past that, so it is given the room to finish. The
   bloom is a disc of 1.85 and casts nothing. */
const BODY_SPRITE_REACH = 2.4;
const BLOOM_SPRITE_REACH = 1.95;

const boardSprites = {
  /* What the held pictures were painted for. Any change to this and
     every one of them is wrong. */
  key: "",

  /* The clock the moving parts were painted at, so a shimmering board
     repaints once a frame and no more. */
  paintedAtTime: -1,

  /* One entry per gem colour, each holding the canvases described in
     the banner. Standard leaves bloom null. */
  gems: [],

  /* The tray, which moves only when the level, the size or the
     appearance does. */
  tray: null,
  trayKey: ""
};

/* The gem routines paint through the module level ctx, so it is pointed
   at the sprite for one synchronous call and put straight back. The
   same trick the goal icons and the tour panels use. */
function paintIntoSprite(sprite, reach, paint) {
  const boardCtx = ctx;

  ctx = sprite.getContext("2d");

  /* Cleared in device pixels against the canvas's own size. Rounding up
     to a whole pixel leaves the canvas a shade bigger than the reach,
     and clearing by the reach would leave that edge holding the last
     repaint. */
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, sprite.width, sprite.height);

  ctx.setTransform(layout.pixelRatio, 0, 0, layout.pixelRatio, 0, 0);
  paint(reach, reach);

  ctx = boardCtx;
}

function makeSpriteCanvas(reach) {
  const sprite = document.createElement("canvas");
  const side = Math.ceil(reach * 2 * layout.pixelRatio);

  sprite.width = side;
  sprite.height = side;
  return sprite;
}

/* A gem at rest wearing one colour. Spin is nought on every cell the
   game makes, which is what lets a colour share one picture. The glint
   phase is unused here because no picture carries a glint. */
function spriteSampleGem(colour) {
  return { colour: colour, spin: 0, special: "none", blighted: false, glintPhase: 0 };
}

function repaintGemSprites(spriteRadius) {
  const isHd = graphics.mode === GRAPHICS_HD;

  const bloomReach = spriteRadius * BLOOM_SPRITE_REACH;
  const bodyReach = spriteRadius * BODY_SPRITE_REACH;

  for (let colour = 0; colour < GEM_COLOURS.length; colour++) {
    const held = boardSprites.gems[colour];
    const sample = spriteSampleGem(colour);

    if (isHd === true) {
      paintIntoSprite(held.bloom, bloomReach, function (x, y) {
        drawHdBloom(HD_GEM_COLOURS[colour].glow, x, y, spriteRadius);
      });
      paintIntoSprite(held.body, bodyReach, function (x, y) {
        drawHdCut(sample, x, y, spriteRadius);
        drawHdPolish(sample, x, y, spriteRadius);
      });
    } else {
      paintIntoSprite(held.body, bodyReach, function (x, y) {
        drawGemBodyStandard(sample, x, y, spriteRadius);
      });
    }
  }
}

/* Builds the canvases the pictures are painted into. Called only when
   the key changes, since that is the only time their size can move. */
function rebuildGemSpriteCanvases(spriteRadius) {
  const isHd = graphics.mode === GRAPHICS_HD;

  boardSprites.gems.length = 0;

  for (let colour = 0; colour < GEM_COLOURS.length; colour++) {
    boardSprites.gems.push({
      bloom: isHd === true ? makeSpriteCanvas(spriteRadius * BLOOM_SPRITE_REACH) : null,
      body: makeSpriteCanvas(spriteRadius * BODY_SPRITE_REACH)
    });
  }
}

/* Hands back the pictures for the appearance and size now in force,
   repainting them first if anything they were painted for has moved. */
function currentGemSprites(restingRadius) {
  const spriteRadius = restingRadius * SPRITE_HEADROOM;
  const key = graphics.mode + ":" + shimmer.enabled + ":" +
    layout.pixelRatio + ":" + spriteRadius;

  if (boardSprites.key !== key) {
    rebuildGemSpriteCanvases(spriteRadius);
    repaintGemSprites(spriteRadius);
    boardSprites.key = key;
    boardSprites.paintedAtTime = game.time;
    return boardSprites.gems;
  }

  /* Only HD has anything that moves with the clock, and only while the
     shimmer is on. Everything else holds still and is left alone. */
  const shimmering = graphics.mode === GRAPHICS_HD && shimmer.enabled === true;

  if (shimmering === true && boardSprites.paintedAtTime !== game.time) {
    repaintGemSprites(spriteRadius);
    boardSprites.paintedAtTime = game.time;
  }

  return boardSprites.gems;
}

/* One picture onto the board, centred on the gem and covering the reach
   it was painted to hold. The size the sprite was baked at never enters
   into it: the picture is the same either way and only has to land at
   the size this gem is drawing. */
function blitSpriteLayer(sprite, half, cx, cy) {
  ctx.drawImage(sprite, cx - half, cy - half, half * 2, half * 2);
}

/* A board gem: its body from the held pictures, then the glint, then
   whatever the cell is carrying. The same order drawGemBodyHD paints
   in, with the first two steps arriving as pictures.

   The set is passed in rather than asked for here, because the answer
   is the same for all sixty three gems and working it out means
   building a key string. Once a frame, not once a gem. */
function drawBoardGem(sprites, cell, cx, cy, restingRadius, drawnScale) {
  const held = sprites[cell.colour];
  const radius = restingRadius * drawnScale;

  ctx.save();

  if (held.bloom !== null) {
    /* The bloom is added to the board underneath rather than drawn over
       it, exactly as drawHdBloom does when it paints live. */
    ctx.globalCompositeOperation = "lighter";
    blitSpriteLayer(held.bloom, radius * BLOOM_SPRITE_REACH, cx, cy);
    ctx.globalCompositeOperation = "source-over";
  }

  blitSpriteLayer(held.body, radius * BODY_SPRITE_REACH, cx, cy);

  if (graphics.mode === GRAPHICS_HD && shimmer.enabled === true) {
    drawHdGlintClipped(cell, cx, cy, radius);
  }

  drawGemMarks(cell, cx, cy, radius);

  ctx.restore();
}

/* The tray under the board. It is the same picture every frame until
   the level, the size or the appearance moves, so it is painted once
   and blitted after that. */
function drawBoardBackdrop(tray, showImage) {
  const key = graphics.mode + ":" + showImage + ":" + tray.level + ":" +
    tray.width + ":" + tray.height + ":" + tray.cell + ":" + layout.pixelRatio;

  if (boardSprites.trayKey !== key) {
    if (boardSprites.tray === null) {
      boardSprites.tray = document.createElement("canvas");
    }
    /* Setting the size empties the canvas, so a repaint never carries
       anything over from the tray it replaces. */
    boardSprites.tray.width = Math.round(tray.width * layout.pixelRatio);
    boardSprites.tray.height = Math.round(tray.height * layout.pixelRatio);

    const boardCtx = ctx;
    ctx = boardSprites.tray.getContext("2d");
    ctx.setTransform(layout.pixelRatio, 0, 0, layout.pixelRatio, 0, 0);
    drawBackdrop(tray, showImage);
    ctx = boardCtx;

    boardSprites.trayKey = key;
  }

  ctx.drawImage(boardSprites.tray, 0, 0, tray.width, tray.height);
}

function drawCells() {
  const restingRadius = layout.cell * 0.38;
  const sprites = currentGemSprites(restingRadius);

  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cell = cellAt(row, col);
      if (cell.kind === "empty") continue;

      const centre = cellCentre(row, col);
      const y = centre.y + cell.offsetY;

      let scale = cell.scale;
      /* A doomed cell waiting for the wave to reach it is still drawn
         as a live gem. It only pops once its delay has run out. */
      if (cell.doomed === true && cell.dyingDelay <= 0) {
        const t = Math.max(0, cell.dying / cell.dyingMax);
        scale = t * 1.35;
      }
      if (scale <= 0.01) continue;

      if (cell.kind === "stone") {
        drawStone(cell, centre.x, y, restingRadius * scale);
      } else {
        drawBoardGem(sprites, cell, centre.x, y, restingRadius, scale);
      }
    }
  }
}

/* ------------------------------------------------------------------
   The inside of a closed loop

   Drawn in two halves. The tint goes under the gems so it reads as the
   ground the ring has claimed, and the marks go over them so whatever
   was caught is never hidden by its own highlight.
   ------------------------------------------------------------------ */

function drawLoopInteriorGlow() {
  if (game.loopClosed === false) return;
  if (pathHasAColour() === false) return;

  const summary = loopInteriorSummary(game.path);
  const palette = GEM_COLOURS[pathPaintColour()];
  const pulse = 0.5 + Math.sin(game.time * 9) * 0.5;

  let alpha = 0.14 + pulse * 0.12;
  if (loopCaughtSomething(summary) === true) {
    alpha = 0.24 + pulse * 0.22;
  }

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = palette.core;

  for (let i = 0; i < summary.cells.length; i++) {
    const spot = summary.cells[i];
    const x = layout.originX + spot.col * layout.cell;
    const y = layout.originY + spot.row * layout.cell;
    roundedRect(x + 2, y + 2, layout.cell - 4, layout.cell - 4, layout.cell * 0.18);
    ctx.fill();
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

/* Every special caught in the middle gets a halo, and the effects are
   listed once above the ring. Labelling every cell put two words on
   top of each other the moment two specials sat side by side, which is
   exactly the case worth showing off. */
function drawLoopCatchMarks() {
  if (game.loopClosed === false) return;
  if (pathHasAColour() === false) return;

  const summary = loopInteriorSummary(game.path);
  if (loopCaughtSomething(summary) === false) return;

  /* Radius per kind, so a gem that is both blighted and a bomb draws
     two rings nested, one inside the other. */
  const haloed = [];
  const lines = [];

  for (let i = 0; i < summary.bombs.length; i++) {
    haloed.push({ spot: summary.bombs[i], colour: "#ffd47a", radius: 0.5 });
  }
  if (summary.bombs.length > 0) lines.push({ text: "x3 BLAST", colour: "#ffd47a" });

  for (let i = 0; i < summary.stones.length; i++) {
    haloed.push({ spot: summary.stones[i], colour: "#cfc7e6", radius: 0.5 });
  }
  if (summary.stones.length > 0) lines.push({ text: "ALL STONES", colour: "#cfc7e6" });

  for (let i = 0; i < summary.blighted.length; i++) {
    haloed.push({ spot: summary.blighted[i], colour: "#45e08a", radius: 0.58 });
  }
  if (summary.blighted.length > 0) lines.push({ text: "ALL BLIGHT", colour: "#45e08a" });

  for (let i = 0; i < summary.prisms.length; i++) {
    haloed.push({ spot: summary.prisms[i], colour: "#ffffff", radius: 0.44 });
  }
  if (summary.prisms.length > 0) lines.push({ text: "WHOLE BOARD", colour: "#ffffff" });

  for (let i = 0; i < summary.chromatics.length; i++) {
    haloed.push({ spot: summary.chromatics[i], colour: "#ffffff", radius: 0.44 });
  }
  if (summary.chromatics.length > 0) lines.push({ text: "LEVEL CLEAR", colour: "#ffffff" });

  const spin = game.time * 3;
  const pulse = 1 + Math.sin(game.time * 11) * 0.08;

  ctx.save();

  for (let i = 0; i < haloed.length; i++) {
    const mark = haloed[i];
    const centre = cellCentre(mark.spot.row, mark.spot.col);

    /* A dashed ring, turning, so the halo cannot be mistaken for the
       plain white ring the linked gems already wear. */
    ctx.setLineDash([layout.cell * 0.14, layout.cell * 0.1]);
    ctx.lineDashOffset = -spin * layout.cell * 0.3;
    ctx.strokeStyle = mark.colour;
    ctx.lineWidth = Math.max(2, layout.cell * 0.07);
    ctx.shadowColor = mark.colour;
    ctx.shadowBlur = layout.cell * 0.35;
    ctx.beginPath();
    ctx.arc(centre.x, centre.y, layout.cell * mark.radius * pulse, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.setLineDash([]);
  ctx.shadowBlur = 0;
  drawLoopCatchLegend(summary, lines);
  ctx.restore();
}

/* The list of what is about to happen, stacked over the ring. It sits
   above the trapped cells, and drops below them when the ring is close
   enough to the top of the board that there is no room up there. */
function drawLoopCatchLegend(summary, lines) {
  let leftCol = COLS;
  let rightCol = 0;
  let topRow = ROWS;
  let bottomRow = 0;

  for (let i = 0; i < summary.cells.length; i++) {
    const spot = summary.cells[i];
    if (spot.col < leftCol) leftCol = spot.col;
    if (spot.col > rightCol) rightCol = spot.col;
    if (spot.row < topRow) topRow = spot.row;
    if (spot.row > bottomRow) bottomRow = spot.row;
  }

  const middleX = layout.originX + ((leftCol + rightCol) / 2 + 0.5) * layout.cell;
  const lineHeight = layout.cell * 0.3;
  const aboveRing = layout.originY + topRow * layout.cell - layout.cell * 0.3;
  const belowRing = layout.originY + (bottomRow + 1) * layout.cell + layout.cell * 0.3;

  /* Where the top line goes. Stacked upward from the ring by default. */
  let firstLineY = aboveRing - (lines.length - 1) * lineHeight;
  if (firstLineY < lineHeight) {
    firstLineY = belowRing;
  }

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold " + Math.round(layout.cell * 0.24) + "px Trebuchet MS, sans-serif";
  ctx.lineWidth = 3.5;

  for (let i = 0; i < lines.length; i++) {
    const y = firstLineY + i * lineHeight;
    ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
    ctx.strokeText(lines[i].text, middleX, y);
    ctx.fillStyle = lines[i].colour;
    ctx.fillText(lines[i].text, middleX, y);
  }
}

/* The line is drawn one segment at a time, each in its own colour, so a
   link that changed colour at a chromatic visibly does. A chromatic
   belongs to the segment before it and the one after, which is what
   keeps the line continuous through it. A closed ring is white all the
   way round, as it always was. */
function drawPath() {
  if (game.path.length === 0) return;

  ctx.save();
  ctx.lineWidth = layout.cell * 0.16;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.shadowBlur = layout.cell * 0.4;
  ctx.globalAlpha = 0.9;

  let segmentStart = 0;
  let segmentColour = -1;

  for (let i = 0; i < game.path.length; i++) {
    const cell = cellAt(game.path[i].row, game.path[i].col);

    if (segmentColour === -1 && cell.special === "none") {
      segmentColour = cell.colour;
    }

    const closesSegment = cell.special === "chromatic" && i > segmentStart;
    const isLast = i === game.path.length - 1;

    if (closesSegment === true || isLast === true) {
      drawPathSegment(segmentStart, i, segmentColour);
      segmentStart = i;
      segmentColour = -1;
    }
  }

  if (game.loopClosed === true) {
    const head = game.path[game.path.length - 1];
    const first = game.path[0];
    const headCentre = cellCentre(head.row, head.col);
    const firstCentre = cellCentre(first.row, first.col);
    ctx.strokeStyle = "#ffffff";
    ctx.shadowColor = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(headCentre.x, headCentre.y + cellAt(head.row, head.col).offsetY);
    ctx.lineTo(firstCentre.x, firstCentre.y);
    ctx.stroke();
  }
  ctx.restore();

  drawPathRings();
  drawPathCounter();
  drawLoopCatchMarks();
}

/* One stretch of the line, from one path index to another, in one
   colour. A segment with no colour fixed yet is painted violet, which is
   what a link made only of specials has always been painted. */
function drawPathSegment(fromIndex, toIndex, segmentColour) {
  const palette = GEM_COLOURS[segmentColour === -1 ? 4 : segmentColour];

  ctx.shadowColor = palette.glow;
  ctx.strokeStyle = game.loopClosed === true ? "#ffffff" : palette.rim;

  ctx.beginPath();
  for (let i = fromIndex; i <= toIndex; i++) {
    const spot = game.path[i];
    const centre = cellCentre(spot.row, spot.col);
    const cell = cellAt(spot.row, spot.col);
    const y = centre.y + cell.offsetY;
    if (i === fromIndex) {
      ctx.moveTo(centre.x, y);
    } else {
      ctx.lineTo(centre.x, y);
    }
  }
  ctx.stroke();
}

function drawPathRings() {
  /* Rings around every linked gem. */
  ctx.save();
  ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
  ctx.lineWidth = Math.max(2, layout.cell * 0.05);
  const pulse = 1 + Math.sin(game.time * 12) * 0.06;

  for (let i = 0; i < game.path.length; i++) {
    const spot = game.path[i];
    const centre = cellCentre(spot.row, spot.col);
    const cell = cellAt(spot.row, spot.col);
    ctx.beginPath();
    ctx.arc(centre.x, centre.y + cell.offsetY, layout.cell * 0.46 * pulse, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPathCounter() {
  /* Link counter floating by the head of the path. */
  if (game.path.length >= 2) {
    const head = game.path[game.path.length - 1];
    const centre = cellCentre(head.row, head.col);
    ctx.save();
    ctx.font = "bold " + Math.round(layout.cell * 0.34) + "px Trebuchet MS, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = game.path.length >= activeLinkRules().minLink ? "#ffffff" : "rgba(255,255,255,0.5)";
    ctx.strokeStyle = "rgba(0,0,0,0.7)";
    ctx.lineWidth = 3;
    const label = String(game.path.length);
    const ty = centre.y - layout.cell * 0.52;
    ctx.strokeText(label, centre.x, ty);
    ctx.fillText(label, centre.x, ty);
    ctx.restore();
  }
}

/* ------------------------------------------------------------------
   Drawing a hint

   Deliberately unlike drawPath. A hint is a suggestion sitting under
   the board, so it is dashed, dimmer and pulsing slowly, and a real
   drag paints straight over the top of it.
   ------------------------------------------------------------------ */

function drawHint() {
  if (hints.showing === false) return;
  if (hints.move === null) return;

  if (hints.move.kind === "link") {
    drawLinkHint(hints.move);
    return;
  }
  if (hints.move.kind === "item") {
    drawItemHint(hints.move);
    return;
  }

  throw new Error("PRISM PURGE: cannot draw a hint of kind " + hints.move.kind + ".");
}

function drawLinkHint(move) {
  const palette = GEM_COLOURS[move.colour];
  const pulse = 0.55 + Math.sin(game.time * 3.4) * 0.2;

  /* The trail, crawling forwards so the direction to drag is obvious. */
  ctx.save();
  ctx.setLineDash([layout.cell * 0.2, layout.cell * 0.16]);
  ctx.lineDashOffset = -game.time * layout.cell * 0.6;
  ctx.lineWidth = layout.cell * 0.13;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.strokeStyle = palette.rim;
  ctx.shadowColor = palette.glow;
  ctx.shadowBlur = layout.cell * 0.35;
  ctx.globalAlpha = pulse;

  ctx.beginPath();
  for (let i = 0; i < move.path.length; i++) {
    const centre = cellCentre(move.path[i].row, move.path[i].col);
    if (i === 0) {
      ctx.moveTo(centre.x, centre.y);
    } else {
      ctx.lineTo(centre.x, centre.y);
    }
  }
  if (move.closesLoop === true) {
    const first = cellCentre(move.path[0].row, move.path[0].col);
    ctx.lineTo(first.x, first.y);
  }
  ctx.stroke();
  ctx.restore();

  /* A ring on every gem in the link. */
  ctx.save();
  ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
  ctx.lineWidth = Math.max(2, layout.cell * 0.045);
  ctx.globalAlpha = pulse;

  for (let i = 0; i < move.path.length; i++) {
    const centre = cellCentre(move.path[i].row, move.path[i].col);
    ctx.beginPath();
    ctx.arc(centre.x, centre.y, layout.cell * 0.43, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  /* A heavier ring on the gem to start the drag from. */
  const start = cellCentre(move.path[0].row, move.path[0].col);
  ctx.save();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = Math.max(3, layout.cell * 0.08);
  ctx.shadowColor = palette.glow;
  ctx.shadowBlur = layout.cell * 0.5;
  ctx.globalAlpha = pulse;
  ctx.beginPath();
  ctx.arc(start.x, start.y, layout.cell * 0.46, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  drawHintCaption(move.caption, move.path);
}

function drawItemHint(move) {
  if (move.target === null) {
    drawHintCaption(move.caption, []);
    return;
  }

  const centre = cellCentre(move.target.row, move.target.col);
  const pulse = 0.5 + Math.sin(game.time * 3.4) * 0.25;
  const radius = layout.cell * (0.42 + Math.sin(game.time * 3.4) * 0.06);

  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = Math.max(3, layout.cell * 0.07);
  ctx.shadowColor = "#b07cff";
  ctx.shadowBlur = layout.cell * 0.5;

  ctx.beginPath();
  ctx.arc(centre.x, centre.y, radius, 0, Math.PI * 2);
  ctx.stroke();

  /* Crosshair arms, so the ring reads as a marker put down on the
     board and never as another gem sitting on it. */
  const inner = radius * 1.15;
  const outer = radius * 1.55;
  const arms = [[0, -1], [0, 1], [-1, 0], [1, 0]];

  ctx.beginPath();
  for (let i = 0; i < arms.length; i++) {
    ctx.moveTo(centre.x + arms[i][0] * inner, centre.y + arms[i][1] * inner);
    ctx.lineTo(centre.x + arms[i][0] * outer, centre.y + arms[i][1] * outer);
  }
  ctx.stroke();
  ctx.restore();

  drawHintCaption(move.caption, [move.target]);
}

/* The caption sits above whatever the hint is pointing at, and drops
   below it when the hint is near the top of the board. With nothing to
   point at it goes in the middle. */
function drawHintCaption(text, cells) {
  if (text === "") return;

  let x = layout.width / 2;
  let y = layout.height / 2;

  if (cells.length > 0) {
    let minRow = ROWS;
    let maxRow = -1;
    let totalCol = 0;

    for (let i = 0; i < cells.length; i++) {
      if (cells[i].row < minRow) minRow = cells[i].row;
      if (cells[i].row > maxRow) maxRow = cells[i].row;
      totalCol += cells[i].col;
    }

    const middleCol = totalCol / cells.length;
    x = layout.originX + middleCol * layout.cell + layout.cell / 2;

    const above = layout.originY + minRow * layout.cell - layout.cell * 0.3;
    const below = layout.originY + (maxRow + 1) * layout.cell + layout.cell * 0.5;
    y = minRow === 0 ? below : above;
  }

  ctx.save();
  ctx.font = "bold " + Math.round(layout.cell * 0.26) + "px Trebuchet MS, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  /* Kept fully inside the board, so a caption on a link out at the edge
     never runs off the side of the canvas. */
  const halfWidth = ctx.measureText(text).width / 2;
  const margin = layout.cell * 0.15;
  if (x - halfWidth < margin) x = margin + halfWidth;
  if (x + halfWidth > layout.width - margin) x = layout.width - margin - halfWidth;

  ctx.globalAlpha = 0.75 + Math.sin(game.time * 3.4) * 0.15;

  /* A plate under the words. Gems are bright and the caption lands on
     top of them, so an outline on its own is not enough to read. */
  const plateHeight = layout.cell * 0.42;
  const platePadding = layout.cell * 0.22;
  ctx.fillStyle = "rgba(8, 5, 18, 0.88)";
  ctx.strokeStyle = "rgba(176, 124, 255, 0.5)";
  ctx.lineWidth = 1.5;
  roundedRect(
    x - halfWidth - platePadding,
    y - plateHeight / 2,
    halfWidth * 2 + platePadding * 2,
    plateHeight,
    plateHeight / 2
  );
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#ffffff";
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawAimHint() {
  if (game.aiming === "none") return;

  const alpha = 0.15 + Math.sin(game.time * 6) * 0.08;
  ctx.fillStyle = "rgba(69, 224, 138, " + alpha + ")";
  ctx.fillRect(0, 0, layout.width, layout.height);

  const text = game.aiming === "bomb" ? "TAP A GEM TO PLANT" : "TAP A COLOUR TO PURGE";

  ctx.save();
  ctx.font = "bold " + Math.round(layout.cell * 0.32) + "px Trebuchet MS, sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff";
  ctx.strokeStyle = "rgba(0,0,0,0.75)";
  ctx.lineWidth = 4;
  ctx.strokeText(text, layout.width / 2, layout.height / 2);
  ctx.fillText(text, layout.width / 2, layout.height / 2);
  ctx.restore();
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (p.delay > 0) continue;
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.colour;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloaters() {
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for (let i = 0; i < floaters.length; i++) {
    const f = floaters[i];
    const t = f.life / f.maxLife;
    ctx.globalAlpha = Math.min(1, t * 1.6);
    ctx.font = "bold " + Math.round(layout.cell * 0.42) + "px Trebuchet MS, sans-serif";
    ctx.strokeStyle = "rgba(0, 0, 0, 0.75)";
    ctx.lineWidth = 4;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.colour;
    ctx.fillText(f.text, f.x, f.y);
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

/* A danger reading, so it is only drawn where there is a danger. On a
   difficulty blight cannot end, the blight on the gems is the whole of
   what there is to know about it. */
function drawBlightMeter() {
  if (activeHazards().blightEndsLevel === false) return;

  const blight = countBlight();
  if (blight === 0) return;

  const barHeight = 5;
  const fraction = Math.min(1, blight / blightLossThreshold());

  ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
  ctx.fillRect(0, layout.height - barHeight, layout.width, barHeight);

  const danger = fraction > 0.7;
  ctx.fillStyle = danger === true ? "#ff5470" : "#a24dff";
  ctx.fillRect(0, layout.height - barHeight, layout.width * fraction, barHeight);
}

function render() {
  // Clear before shaking so transparent artwork cannot leave gem trails.
  ctx.clearRect(0, 0, layout.width, layout.height);
  ctx.save();

  if (game.shake > 0.2) {
    const dx = (Math.random() * 2 - 1) * game.shake;
    const dy = (Math.random() * 2 - 1) * game.shake;
    ctx.translate(dx, dy);
  }

  drawBoardBackdrop(boardTray(), BackgroundHandler.isVisible());
  drawLoopInteriorGlow();
  drawCells();
  drawShockwaves();
  drawBlightCrawls();
  drawHint();
  drawPath();
  drawParticles();
  drawFloaters();
  drawAimHint();
  drawBlightMeter();
  drawMilestoneWord(ctx, layout.width, layout.height, layout.pixelRatio);
  drawScreenFlash();

  ctx.restore();
}

/* ------------------------------------------------------------------
   Main loop
   ------------------------------------------------------------------ */

let lastFrame = 0;

function frame(now) {
  if (lastFrame === 0) lastFrame = now;

  /* Clamp dt so a backgrounded tab does not teleport the animation. */
  let dt = (now - lastFrame) / 1000;
  if (dt > 0.05) dt = 0.05;
  lastFrame = now;

  window.requestAnimationFrame(frame);

  /* Nothing to draw until the stage has a measured size. */
  if (boardReady === false) return;

  game.time += dt;
  update(dt);

  /* Every screen covers the whole app with an opaque sheet, so a board
     painted under one is a board nobody can see. The board keeps being
     simulated either way: a run paused behind the rules screen has to
     come back exactly as it was left, and update is three microseconds
     against render's twelve milliseconds.

     The card overlay and the pause menu are not screens. Both belong to
     a run in progress and both leave the board showing, so both keep
     drawing it. */
  if (screens.current === "playing") {
    render();
  }

  /* The tour's panels are the game drawing itself, live, which is the
     only way to show a shimmer to somebody deciding whether to keep it.
     They are their own canvases, so they carry on while the board above
     stays dark. */
  if (screens.current === "settingsTour") {
    drawTourPanels();
  }
}

function update(dt) {
  if (game.shake > 0) {
    game.shake -= dt * 34;
    if (game.shake < 0) game.shake = 0;
  }

  updateParticles(dt);
  updateShockwaves(dt);
  updateBlightCrawls(dt);
  updateToast(dt);
  updateMilestoneWord(dt);
  updateCellAnimations(dt);
  updateHint(dt);

  if (runIsLive() === true) {
    activeMode().advanceTime(dt);
  }

  if (game.phase === "bursting") {
    game.burstTimer -= dt;
    if (game.burstTimer <= 0) {
      removeDeadCells();
      applyGravity();
      game.phase = "falling";
    }
  } else if (game.phase === "falling") {
    if (boardIsSettled() === true) {
      checkLevelState();
    }
  } else if (game.phase === "shuffling") {
    updateShuffleFill(dt);
  }
}

/* Drives the empty and the refill. The shrink is done on one clock here
   because every tile leaves together. Once the last row has finished
   growing the board goes back to the player. */
function updateShuffleFill(dt) {
  game.shuffleTime += dt;

  const fillStart = SHUFFLE_SHRINK_SECONDS + SHUFFLE_BEAT_SECONDS;

  /* Everything shrinks away together, then the board sits empty for a
     beat so the clear registers before the fill starts. */
  if (game.shuffleTime < fillStart) {
    let remaining = 1 - game.shuffleTime / SHUFFLE_SHRINK_SECONDS;
    if (remaining < 0) remaining = 0;

    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        cellAt(row, col).scale = remaining;
      }
    }
    return;
  }

  /* One note per row as it arrives, stepping up a semitone each time,
     so the fill sounds like it is being dealt out. */
  const secondsFilling = game.shuffleTime - fillStart;
  const rowsDue = Math.floor(secondsFilling / SHUFFLE_ROW_STEP_SECONDS) + 1;

  while (game.shuffleRowsTicked < rowsDue && game.shuffleRowsTicked < ROWS) {
    const semitone = game.shuffleRowsTicked;
    playTone(420 * Math.pow(2, semitone / 12), 0.09, "triangle", 0.11);
    game.shuffleRowsTicked++;
  }

  if (shuffleFillIsDone() === true) {
    game.phase = "idle";
    resetHintTimer();

    /* A shuffle changes which links exist, and in a mode that ends its
       level when none do, that is enough to end one. Every other mode
       finds nothing here: the goal has not moved and neither has the
       budget. */
    checkLevelState();
  }
}

function shuffleFillIsDone() {
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cell = cellAt(row, col);
      if (cell.kind === "empty") continue;
      if (cell.spawnDelay > 0) return false;
      if (cell.scale < 1) return false;
    }
  }
  return true;
}

function updateCellAnimations(dt) {
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cell = cellAt(row, col);
      if (cell === null) continue;
      if (cell.kind === "empty") continue;

      if (cell.dyingDelay > 0) {
        cell.dyingDelay -= dt;
        if (cell.dyingDelay < 0) cell.dyingDelay = 0;
      } else if (cell.dying > 0) {
        cell.dying -= dt;
        if (cell.dying < 0) cell.dying = 0;
      }

      if (cell.offsetY < 0) {
        cell.fallSpeed += 3600 * dt;
        cell.offsetY += cell.fallSpeed * dt;
        if (cell.offsetY >= 0) {
          cell.offsetY = 0;
          cell.fallSpeed = 0;
          cell.scale = 1.16;
        }
      }

      /* A blight that is still crawling over counts its arrival down
         below zero, then fades in once the blob lands on it. */
      if (cell.blightShow < 0) {
        cell.blightShow += dt;
        if (cell.blightShow > 0) cell.blightShow = 0;
      } else if (cell.blightShow < 1) {
        cell.blightShow += dt * 7;
        if (cell.blightShow > 1) cell.blightShow = 1;
      }

      /* A tile waiting its turn in a shuffle refill holds at nothing
         until its row comes up. Once it does, it grows in a little
         faster than a normal spawn, which keeps the fill crisp. The
         whole board is in the shuffle together, so nothing else is
         growing while that phase runs. */
      if (cell.spawnDelay > 0) {
        cell.spawnDelay -= dt;
        if (cell.spawnDelay < 0) cell.spawnDelay = 0;
      } else {
        let growRate = SPAWN_GROW_RATE;
        if (game.phase === "shuffling") growRate = SHUFFLE_GROW_RATE;

        if (cell.scale > 1) {
          cell.scale -= dt * 2.4;
          if (cell.scale < 1) cell.scale = 1;
        }
        if (cell.scale < 1) {
          cell.scale += dt * growRate;
          if (cell.scale > 1) cell.scale = 1;
        }
      }
    }
  }
}

/* ------------------------------------------------------------------
   Input
   ------------------------------------------------------------------ */

function pointToCell(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;

  const col = Math.floor(x / layout.cell);
  const row = Math.floor(y / layout.cell);

  if (insideBoard(row, col) === false) return null;

  /* The live part of a cell is a disc around its middle. Corners stay
     dead so a diagonal drag cannot clip the two cells either side of
     the corner it passes through: those centres sit 0.707 of a cell
     away from the diagonal, comfortably outside this radius. */
  const centre = cellCentre(row, col);
  const dx = x - centre.x;
  const dy = y - centre.y;
  const distance = Math.sqrt(dx * dx + dy * dy);

  if (distance > layout.cell * HIT_RADIUS) return null;

  return { row: row, col: col };
}

let pointerDown = false;
let lastPointerX = 0;
let lastPointerY = 0;

function onPointerDown(event) {
  ensureAudio();

  if (boardAcceptsInput() === false) return;
  event.preventDefault();

  const spot = pointToCell(event.clientX, event.clientY);
  if (spot === null) return;

  if (game.aiming !== "none") {
    fireArmedItemAt(spot.row, spot.col);
    return;
  }

  pointerDown = true;
  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
  resetHintTimer();
  beginPath(spot.row, spot.col);
}

function onPointerMove(event) {
  if (pointerDown === false) return;
  if (boardAcceptsInput() === false) return;
  event.preventDefault();

  /* A moving finger reports positions that can be more than a cell
     apart, and a link only extends to a neighbour of its head. Walking
     the route between two samples in small steps visits every cell
     along the way, so a fast drag registers the same chain a slow one
     does. */
  const dx = event.clientX - lastPointerX;
  const dy = event.clientY - lastPointerY;
  const distance = Math.sqrt(dx * dx + dy * dy);
  const steps = Math.max(1, Math.ceil(distance / (layout.cell * 0.25)));

  for (let i = 1; i <= steps; i++) {
    const x = lastPointerX + (dx * i) / steps;
    const y = lastPointerY + (dy * i) / steps;
    const spot = pointToCell(x, y);
    if (spot !== null) {
      extendPath(spot.row, spot.col);
    }
  }

  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
}

function onPointerUp(event) {
  if (pointerDown === false) return;
  pointerDown = false;
  event.preventDefault();

  if (boardAcceptsInput() === false) {
    game.path = [];
    return;
  }

  resolvePath();
}

/* Move and release are watched on the window so a drag that wanders
   off the edge of the board still tracks and still resolves. */
canvas.addEventListener("pointerdown", onPointerDown);
window.addEventListener("pointermove", onPointerMove, { passive: false });
window.addEventListener("pointerup", onPointerUp);
window.addEventListener("pointercancel", onPointerUp);
canvas.addEventListener("contextmenu", function (event) { event.preventDefault(); });

/* ------------------------------------------------------------------
   HUD updates
   ------------------------------------------------------------------ */

/* The goal line is built as nodes rather than a string, because the
   piece it names is a picture. A score goal has nothing to picture, so
   it stays as words. */
function renderGoalLine() {
  goalText.textContent = game.goal.label;

  if (game.goal.kind === "colour") {
    applyGoalAccent(HD_GEM_COLOURS[game.goal.colour]);
    goalText.appendChild(socketed(goalGemIcon(game.goal.colour)));
    return;
  }

  applyGoalAccent(GOAL_ACCENT_NEUTRAL);

  if (game.goal.kind === "stone") {
    goalText.appendChild(socketed(goalStoneIcon()));
  }
}

/* The HD chrome carries exactly one saturated colour and it is borrowed
   from the stone the level is asking for, so the only thing on screen
   with real colour in it is always pointing at the target. Standard
   declares none of these variables and is unaffected by them. */
function applyGoalAccent(palette) {
  app.style.setProperty("--goal-deep", palette.deep);
  app.style.setProperty("--goal-core", palette.core);
  app.style.setProperty("--goal-rim", palette.rim);
}

/* HD sets the icon into a recess, the way a stone sits in a ring. The
   wrapper goes in on both appearances so the goal line is built the
   same way either way; on Standard it carries no styling and simply
   holds the icon where the icon already was. */
function socketed(icon) {
  const socket = document.createElement("span");
  socket.className = "goalSocket";
  socket.appendChild(icon);
  return socket;
}

/* Steps a number's font down until it fits the width its box gives it.
   Four digit levels and seven figure scores are the cases that need it:
   the number stays whole and readable instead of being cut off. */
function fitValueText(element) {
  element.style.fontSize = "";

  let size = parseFloat(window.getComputedStyle(element).fontSize);
  while (size > 9 && element.scrollWidth > element.clientWidth) {
    size--;
    element.style.fontSize = size + "px";
  }
}



function refreshHud() {
  const mode = activeMode();

  scoreValue.textContent = String(game.score);
  limitLabelEl.textContent = mode.limitLabel;
  limitValue.textContent = mode.limitText();
  levelValue.textContent = String(game.level);

  fitValueText(scoreValue);
  fitValueText(limitValue);
  fitValueText(levelValue);

  if (mode.limitIsCritical() === true) {
    limitStat.classList.add("alarm");
  } else {
    limitStat.classList.remove("alarm");
  }

  /* The HD stripe down the edge of the limit box. Cold with the limit
     full, alarm with it spent. What "spent" means is the mode's to say.
     Standard draws no stripe and ignores this. */
  const stripe = mixRgb(hexToRgb(LIMIT_STRIPE_CALM), hexToRgb(LIMIT_STRIPE_ALARM), mode.limitPressure());
  limitStat.style.setProperty("--limit-stripe", rgbCss(stripe));

  renderGoalLine();

  const shown = Math.min(game.goal.progress, game.goal.target);
  goalCount.textContent = shown + "/" + game.goal.target;
  goalFill.style.width = (shown / game.goal.target) * 100 + "%";

  updateItemBar();
}

/* Whether a hint on screen right now is telling the player to spend
   charge on this item. */
function hintPointsAtItem(id) {
  if (hints.showing === false) return false;
  if (hints.move === null) return false;
  if (hints.move.kind !== "item") return false;
  return hints.move.itemId === id;
}

/* Built once per run, when the mode is known, and then only restyled, so
   the buttons keep their identity across redraws. Two modes with
   different items means the row is rebuilt on the way into a run rather
   than once at boot. */
function buildItemBar() {
  const items = activeMode().items;

  chargeTicks.innerHTML = "";
  itemRow.innerHTML = "";

  /* A notch on the charge bar for every item, so you can see how far
     off the next one is without doing the arithmetic. */
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    if (item.cost >= CHARGE_MAX) continue;

    const tick = document.createElement("div");
    tick.className = "chargeTick";
    tick.dataset.cost = String(item.cost);
    tick.style.left = (item.cost / CHARGE_MAX) * 100 + "%";
    chargeTicks.appendChild(tick);
  }

  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const button = document.createElement("button");
    button.className = "itemBtn";
    button.dataset.item = item.id;
    button.dataset.cost = String(item.cost);

    /* Both readings of the cost are in the markup and the appearance
       picks one. Standard reads it inside the name, "SHUFFLE 8", the way
       it always has. HD hides that copy, puts the number in the corner
       and fills the button up to it. */
    button.innerHTML =
      "<span class='fuel'></span>" +
      "<span class='cost'>" + item.cost + "</span>" +
      "<span class='glyph'>" + item.glyph + "</span>" +
      "<span class='name'>" + item.label +
        "<span class='inlineCost'> " + item.cost + "</span></span>";

    button.addEventListener("click", function () {
      ensureAudio();
      selectItem(item.id);
    });

    itemRow.appendChild(button);
  }
}

function updateItemBar() {
  chargeFill.style.width = (game.charge / CHARGE_MAX) * 100 + "%";
  chargeValue.textContent = game.charge + "/" + CHARGE_MAX;

  const ticks = chargeTicks.querySelectorAll(".chargeTick");
  for (let i = 0; i < ticks.length; i++) {
    const cost = parseInt(ticks[i].dataset.cost, 10);
    if (game.charge >= cost) {
      ticks[i].classList.add("reached");
    } else {
      ticks[i].classList.remove("reached");
    }
  }

  const buttons = itemRow.querySelectorAll(".itemBtn");
  for (let i = 0; i < buttons.length; i++) {
    const button = buttons[i];
    const id = button.dataset.item;

    button.classList.remove("ready");
    button.classList.remove("armed");
    button.classList.remove("hinted");

    if (game.aiming === id) {
      button.classList.add("armed");
    } else if (canAfford(id) === true) {
      button.classList.add("ready");
    }

    if (hintPointsAtItem(id) === true) button.classList.add("hinted");

    /* How close the meter is to paying for this one, which is what HD
       fills the button with. Standard never shows it. */
    const cost = parseInt(button.dataset.cost, 10);
    const towards = Math.min(1, game.charge / cost);
    button.style.setProperty("--fuel", Math.round(towards * 100) + "%");
  }
}

/* ------------------------------------------------------------------
   Card overlay
   ------------------------------------------------------------------ */

let cardAction = null;
let cardAltAction = null;

function showCard(title, subtitle, bodyHtml, buttonText, action, altText, altAction) {
  cardTitle.textContent = title;
  cardSub.textContent = subtitle;
  cardBody.innerHTML = bodyHtml;

  /* The score and best pair belongs to the end of a run and nothing
     else, so every card starts without it and the one card that wants
     it turns it back on. */
  cardStats.style.display = "none";

  cardBtn.textContent = buttonText;
  cardAction = action;

  /* A card always opens at the top of its text, however far the last
     one that used this element had been scrolled. */
  cardBody.scrollTop = 0;

  if (altText === undefined) {
    cardAltAction = null;
    cardBtnAlt.classList.add("hidden");
  } else {
    cardAltAction = altAction;
    cardBtnAlt.textContent = altText;
    cardBtnAlt.classList.remove("hidden");
  }

  overlay.classList.remove("hidden");
}

function hideCard() {
  overlay.classList.add("hidden");
  cardAction = null;
  cardAltAction = null;
  cardBtnAlt.classList.add("hidden");
}

cardBtn.addEventListener("click", function () {
  ensureAudio();
  if (boardReady === false) {
    measureStage();
  }
  if (cardAction === null) return;
  const action = cardAction;
  cardAction = null;
  action();
});

cardBtnAlt.addEventListener("click", function () {
  ensureAudio();
  if (cardAltAction === null) return;
  const action = cardAltAction;
  cardAltAction = null;
  action();
});

/* What is true in every mode. A mode adds the rules that are its own on
   top of this, and nothing here may describe a piece that some mode does
   not have. Stones, blight and the third charge item all failed that
   test and moved out. */
/* The rules every mode shares, printed from the link rules handed in so
   the numbers are the ones in play. The two loop lines are printed only
   where loops are on, which for every fixed mode is always. */
function howToPlayHtml(linkRules, loopsEnabled) {
  let text = "";
  text += "<div class='rule'><span class='pip'>&#9679;</span><span><b>Drag</b> across touching gems of the same colour. Release with <b>" + linkRules.minLink + " or more</b> to burst them.</span></div>";
  if (loopsEnabled === true) {
    text += "<div class='rule'><span class='pip'>&#8634;</span><span>Cross your own trail to <b>close a loop</b> and wipe every gem of that colour off the board.</span></div>";
  }
  text += forgeRulesHtml(linkRules, loopsEnabled);
  if (loopsEnabled === true) {
    text += loopAroundRuleHtml(linkRules);
  }
  return text +
  "<div class='rule'><span class='pip'>&#9878;</span><span>Bursting fills your <b>charge</b>. The row along the bottom of the screen is what it buys.</span></div>";
}

/* What a link forges, naming only the specials the rules have on, and
   what a loop does with a chromatic only where loops are on. */
function forgeRulesHtml(linkRules, loopsEnabled) {
  let text = "";

  if (linkRules.bombEnabled === true && linkRules.prismEnabled === true) {
    text += "<div class='rule'><span class='pip'>&#10039;</span><span>Link <b>" + linkRules.bombLink + "</b> to forge a <b>Bomb</b>, link <b>" + linkRules.prismLink + "</b> to forge a <b>Prism</b> that torches a whole colour.</span></div>";
  } else if (linkRules.bombEnabled === true) {
    text += "<div class='rule'><span class='pip'>&#10039;</span><span>Link <b>" + linkRules.bombLink + "</b> to forge a <b>Bomb</b>.</span></div>";
  } else if (linkRules.prismEnabled === true) {
    text += "<div class='rule'><span class='pip'>&#10039;</span><span>Link <b>" + linkRules.prismLink + "</b> to forge a <b>Prism</b> that torches a whole colour.</span></div>";
  }

  if (linkRules.chromaticEnabled === true) {
    let chromaticLine = "Link <b>" + linkRules.chromaticLink + "</b> to forge a <b>Chromatic</b>. It joins any colour, and the link can change colour on the far side of it.";
    if (loopsEnabled === true) {
      chromaticLine += " Close a loop through one and every colour you linked is purged.";
    }
    text += "<div class='rule'><span class='pip'>&#9788;</span><span>" + chromaticLine + "</span></div>";
  }

  return text;
}

/* What looping around a special does, naming the chromatic only where
   the rules can produce one. */
function loopAroundRuleHtml(linkRules) {
  let ending = "and a Prism clears the <b>whole board</b>.";
  if (linkRules.chromaticEnabled === true) {
    ending = "a Prism clears the <b>whole board</b>, and a Chromatic clears the <b>level</b>.";
  }
  return "<div class='rule'><span class='pip'>&#9678;</span><span>Loop <b>around</b> something without linking it and it goes off far harder. A bomb blasts <b>three cells</b> in every direction, " + ending + "</span></div>";
}

/* Stones and blight, for the modes that have them. Custom prints each
   on its own, only where it is on, and leaves out what a loop does to
   them where loops are off. */
function hazardRulesHtml() {
  return stoneRuleHtml(true) + blightRuleHtml(true);
}

function stoneRuleHtml(loopsEnabled) {
  let line = "<b>Stones</b> crack when a gem bursts beside them and take a full hit from any bomb blast.";
  if (loopsEnabled === true) {
    line += " Loop around one and every stone on the board goes with it.";
  }
  return "<div class='rule'><span class='pip'>&#9632;</span><span>" + line + "</span></div>";
}

function blightRuleHtml(loopsEnabled) {
  let cure = "Link a blighted gem to <b>cure</b> it.";
  if (loopsEnabled === true) {
    cure = "Link a blighted gem to <b>cure</b> it, or loop around one to cure the whole board.";
  }
  return "<div class='rule'><span class='pip'>&#9760;</span><span>The <b>Blight</b> creeps in from the early levels and follows you between them. " + cure + " Let it take the board and the level is over.</span></div>";
}

/* The continue every mode has except the one where replaying a level
   would mean nothing. */
function retryContinueRuleHtml() {
  return "<div class='rule'><span class='pip'>&#10010;</span><span>You start with a stock of <b>continues</b> and earn one every " + CONTINUE_EVERY_LEVELS + " levels. A continue replays the level and rewinds the score you made on it. How many you begin with is up to the difficulty.</span></div>";
}

function classicRulesHtml() {
  return howToPlayHtml(STANDARD_LINK_RULES, true) + hazardRulesHtml() +
    classicOwnRulesHtml(CLASSIC_HAZARDS.normal, STANDARD_LINK_RULES);
}

/* The lines that are Classic's alone, which Custom prints under the
   shared rules when it plays on the Classic base. Every mode's own lines
   take the hazards and link rules in play, because a line that names a
   hazard or a link length has to be true under Custom too. */
function classicOwnRulesHtml(hazards, linkRules) {
  return "" +
    "<div class='rule'><span class='pip'>&#8679;</span><span><b>+2 Moves</b> is the third thing charge buys, and the one the other modes swap out.</span></div>" +
    retryContinueRuleHtml();
}

/* Shown at the top of the title card when the browser will not save, so
   the player finds out before the run rather than after it. */
function storageWarningHtml() {
  if (storageWorks === true) return "";

  return "<div class='rule'><span class='pip' style='color:var(--danger)'>&#9888;</span>" +
    "<span style='color:var(--danger)'>This browser will not let the game save. Your run and your " +
    "best score are gone when you close the page. Opening the game from a web address instead of a " +
    "file on the device fixes it.</span></div>";
}

/* =====================================================================
   Screens
   Owns: which front end screen is showing and what is printed on it.
   Stays out of: game rules, the board, and the pause menu's own pages.

   A screen covers the whole app and replaces the game. The card overlay
   and the pause menu are the other two layers and both belong to a game
   in progress, which is why neither is a screen.

   screens.current is the authority on whether the player is playing.
   game.phase only says what the board is doing.
   ===================================================================== */

const screens = {
  current: "mainMenu"    // "mainMenu" | "settingsTour" | "modeSelect" | "modeStart" | "help" | "playing"
};

const SCREEN_ELEMENTS = {
  mainMenu: mainMenuScreen,
  settingsTour: tourScreen,
  modeSelect: modeSelectScreen,
  modeStart: modeStartScreen,
  help: helpScreen
};

/* Playing is the absence of a screen, so it has no element of its own
   and simply leaves every one of them hidden. */
function showScreen(name) {
  screens.current = name;
  setMusicForScreen(name);
  BackgroundHandler.setVisible(name === "playing");

  const names = Object.keys(SCREEN_ELEMENTS);
  for (let i = 0; i < names.length; i++) {
    const element = SCREEN_ELEMENTS[names[i]];
    if (names[i] === name) {
      element.classList.remove("hidden");
    } else {
      element.classList.add("hidden");
    }
  }
}

/* The board only takes a drag while the player is actually on it. The
   screen answers whether they are, and the phase answers whether the
   board is ready for another move. Both have to be true. */
function boardAcceptsInput() {
  if (screens.current !== "playing") return false;
  return game.phase === "idle";
}

/* Whether the run is actually running. A mode with a clock is charging
   the player for this moment, so a pause menu, a card, or a board still
   bursting all have to stop counting. */
function runIsLive() {
  if (boardAcceptsInput() === false) return false;
  if (menuIsOpen() === true) return false;
  return overlay.classList.contains("hidden");
}

function showMainMenu() {
  mainMenuWarning.innerHTML = storageWarningHtml();
  refreshFullscreenLabels();
  showScreen("mainMenu");
}

/* How wide a mode's picture is drawn in each of the two places it
   appears. Small enough beside its own text to leave the blurb room, and
   large enough on the mode's own screen to be looked at. */
const MODE_TILE_LIST_WIDTH = 104;
const MODE_TILE_START_WIDTH = 240;

function showModeSelect() {
  modeList.innerHTML = "";

  for (let i = 0; i < GAME_MODES.length; i++) {
    const mode = GAME_MODES[i];
    const tile = document.createElement("button");

    tile.className = "modeTile";
    tile.appendChild(modeTileFor(mode.id, MODE_TILE_LIST_WIDTH));

    const words = document.createElement("div");
    words.className = "modeWords";

    const name = document.createElement("div");
    name.className = "modeName";
    name.textContent = mode.name;
    words.appendChild(name);

    const blurb = document.createElement("div");
    blurb.className = "modeBlurb";
    blurb.textContent = mode.blurb;
    words.appendChild(blurb);

    if (hasAnySaveFor(mode.id) === true) {
      const saved = document.createElement("div");
      saved.className = "modeSaved";
      saved.textContent = "Game in progress";
      words.appendChild(saved);
    }

    tile.appendChild(words);

    tile.addEventListener("click", function () {
      ensureAudio();
      showModeStart(mode.id);
    });

    modeList.appendChild(tile);
  }

  modeList.scrollTop = 0;
  showScreen("modeSelect");
}

/* Which mode the start screen is currently showing, and the saved run on
   the difficulty currently picked, if there is one. The mode is set by
   showModeStart and the run by refreshDifficultyRow, since a mode holds
   a separate run on each difficulty and the selector decides which one
   this screen is talking about. Both are read by the two buttons, so
   neither has to go back to storage to find out what it is acting on. */
let modeStartMode = "classic";
let modeStartSave = null;

/* Whether New Game is waiting to be asked twice. It only ever is when
   the mode is holding a run, because that is the only time the button
   destroys anything. */
let modeStartConfirming = false;

/* The difficulty the start screen is looking at. It decides which run
   Continue offers and which one New Game starts, and it follows the
   player from one mode's screen to the next for as long as the page is
   open, so somebody who plays Hard is not put back to Normal every
   time. */
let pickedDifficulty = DEFAULT_DIFFICULTY;

/* Built once. The three buttons never change, only which one is worn. */
function buildDifficultyRow() {
  for (let i = 0; i < DIFFICULTIES.length; i++) {
    const difficulty = DIFFICULTIES[i];
    const button = document.createElement("button");

    button.className = "pickBtn";
    button.dataset.difficulty = difficulty.id;
    button.textContent = difficulty.name;

    button.addEventListener("click", function () {
      ensureAudio();
      pickedDifficulty = difficulty.id;
      refreshDifficultyRow();
    });

    difficultyRow.appendChild(button);
  }
}

/* Everything on this screen that changes with the difficulty: the worn
   button, the line explaining what the pick means, the saved run being
   offered, and the best score. All four belong to a mode and a
   difficulty together, so all four are answered here and the selector
   is the only thing that has to be told a difficulty changed. */
function refreshDifficultyRow() {
  const mode = modeById(modeStartMode);
  const buttons = difficultyRow.querySelectorAll(".pickBtn");

  for (let i = 0; i < buttons.length; i++) {
    if (buttons[i].dataset.difficulty === pickedDifficulty) {
      buttons[i].classList.add("picked");
    } else {
      buttons[i].classList.remove("picked");
    }
  }

  difficultyNote.textContent = mode.difficultySummary(pickedDifficulty);
  modeStartSave = readSaveFor(modeStartMode, pickedDifficulty);
  refreshModeStartButtons();
  refreshModeStartBest();
}

function refreshModeStartBest() {
  const best = loadBest(modeStartMode, pickedDifficulty);

  if (best === 0) {
    modeStartBest.textContent = "No finished run on " + difficultyName(pickedDifficulty) + " yet.";
    return;
  }
  modeStartBest.textContent = "Best on " + difficultyName(pickedDifficulty) + ": " + best;
}

/* Where a mode's saved games live, which is the whole reason Continue
   and New Game moved off the front page and onto here. The mode is set
   first because refreshDifficultyRow reads it to find the saved run and
   the best score, and it is the only thing here that fills in the foot
   of the screen. */
function showModeStart(modeId) {
  const mode = modeById(modeId);

  modeStartMode = modeId;

  modeStartTitle.textContent = mode.name;
  modeStartSub.textContent = mode.blurb;

  /* Custom's body is the rules editor. Every other mode prints its
     rules. The foot below is the same for all five. */
  if (modeId === "custom") {
    modeStartRules.innerHTML = "";
    modeStartRules.appendChild(customEditor);
    applyCustomRules(customPicks, "the Custom picks");
    refreshCustomEditor();
  } else {
    modeStartRules.innerHTML = mode.rulesHtml();
  }

  const art = modeTileFor(modeId, MODE_TILE_START_WIDTH);
  art.classList.add("modeStartArt");
  modeStartRules.insertBefore(art, modeStartRules.firstChild);

  modeStartRules.scrollTop = 0;

  modeStartConfirming = false;
  refreshDifficultyRow();
  showScreen("modeStart");
}

/* Two shapes for the foot of this screen. Ordinarily it offers the run
   you have on the picked difficulty and a new one. Once New Game has
   been pressed on a difficulty that is holding a run, it offers nothing
   but the decision, so the button that discards a level thirty game
   cannot be reached by a thumb aiming at something else. The difficulty
   row goes with it, which is what stops the pick moving underneath a
   warning already naming the run it is about to destroy. */
function refreshModeStartButtons() {
  const saved = modeStartSave;

  if (modeStartConfirming === true) {
    modeStartWarning.textContent = "Starting a new game will discard your saved " +
      modeById(modeStartMode).name + " run on " + difficultyName(saved.difficulty) +
      ", level " + saved.level + ", worth " + saved.score + " points. Your runs on the " +
      "other difficulties are not touched. This cannot be undone.";
    modeStartWarning.classList.remove("hidden");

    modeContinue.classList.add("hidden");
    difficultyRow.classList.add("hidden");
    difficultyNote.classList.add("hidden");
    modeStartBest.classList.add("hidden");

    modeNewGame.textContent = "Discard It and Start Over";
    modeNewGame.className = "screenBtn danger";
    modeNewGameCancel.classList.remove("hidden");
    return;
  }

  modeStartWarning.classList.add("hidden");
  difficultyRow.classList.remove("hidden");
  difficultyNote.classList.remove("hidden");
  modeStartBest.classList.remove("hidden");
  modeNewGameCancel.classList.add("hidden");
  modeNewGame.textContent = "New Game";

  /* A difficulty with nothing saved leads with New Game, because it is
     the only thing on offer. */
  if (saved === null) {
    modeContinue.classList.add("hidden");
    modeNewGame.className = "screenBtn primary";
    return;
  }

  modeContinue.textContent = "Continue " + difficultyName(saved.difficulty) +
    ", level " + saved.level;
  modeContinue.classList.remove("hidden");
  modeNewGame.className = "screenBtn";
}

/* =====================================================================
   CustomSetup
   Owns: the rules editor on Custom's start screen, and keeping
   customPicks, the Custom entry and the summary line in step with it.
   Stays out of: what the rules mean in play, which GameModes owns, and
   the rest of the start screen, which Screens owns.

   One row per rule. A change writes the pick, re-applies the picks to the
   Custom entry so the summary and rules text read them, refreshes every
   control (a pick can change what another is allowed), and saves settings
   so the picks are there next session.
   ===================================================================== */

/* The editor is built once and moved into the start screen's body when
   Custom is shown. A handle per control, so refreshing reads as a list of
   what changes rather than a walk of the DOM. */
const customEditor = document.createElement("div");
customEditor.className = "ruleRows";
customEditor.id = "customEditor";

const customControls = {
  baseButtons: [],
  baseNote: null,
  blightToggle: null,
  blightNote: null,
  stonesToggle: null,
  stonesNote: null,
  loopsToggle: null,
  loopsNote: null,
  carryToggle: null,
  carryNote: null,
  minLinkStepper: null,
  bombToggle: null,
  bombStepper: null,
  bombNote: null,
  prismToggle: null,
  prismStepper: null,
  prismNote: null,
  chromaticToggle: null,
  chromaticStepper: null,
  chromaticNote: null
};

/* Called after every change. The picks are the truth; everything on the
   screen is read back from them. */
function customPickChanged() {
  applyCustomRules(customPicks, "the Custom picks");
  refreshCustomEditor();
  refreshDifficultyRow();
  saveSettings();
}

function makeRuleRow(labelText, stacked) {
  const row = document.createElement("div");
  row.className = stacked === true ? "ruleRow stacked" : "ruleRow";

  const label = document.createElement("div");
  label.className = "ruleLabel";
  label.textContent = labelText;
  row.appendChild(label);

  const controls = document.createElement("div");
  controls.className = stacked === true ? "pickRow" : "ruleControls";
  row.appendChild(controls);

  customEditor.appendChild(row);
  return controls;
}

function makeRuleNote() {
  const note = document.createElement("p");
  note.className = "ruleNote";
  customEditor.appendChild(note);
  return note;
}

/* A pick button reading On or Off. */
function makeToggle(parent, onPress) {
  const button = document.createElement("button");
  button.className = "pickBtn";
  button.addEventListener("click", function () {
    ensureAudio();
    onPress();
  });
  parent.appendChild(button);
  return button;
}

function refreshToggle(button, isOn, isDisabled) {
  button.textContent = isOn === true ? "On" : "Off";
  button.disabled = isDisabled === true;
  if (isOn === true) {
    button.classList.add("picked");
  } else {
    button.classList.remove("picked");
  }
}

/* A minus, the number and a plus. The window it may move in is worked
   out on every refresh, because the tiers either side of it can move. */
function makeStepper(parent, onChange) {
  const stepper = document.createElement("div");
  stepper.className = "stepper";

  const minus = document.createElement("button");
  minus.className = "pickBtn";
  minus.textContent = "\u2212";
  minus.addEventListener("click", function () {
    ensureAudio();
    onChange(-1);
  });
  stepper.appendChild(minus);

  const value = document.createElement("span");
  value.className = "stepperValue";
  stepper.appendChild(value);

  const plus = document.createElement("button");
  plus.className = "pickBtn";
  plus.textContent = "+";
  plus.addEventListener("click", function () {
    ensureAudio();
    onChange(1);
  });
  stepper.appendChild(plus);

  parent.appendChild(stepper);
  return { minus: minus, value: value, plus: plus };
}

function refreshStepper(stepper, current, lowest, highest, isDisabled) {
  stepper.value.textContent = String(current);
  stepper.minus.disabled = isDisabled === true || current <= lowest;
  stepper.plus.disabled = isDisabled === true || current >= highest;
}

/* The lengths a tier may sit at without breaking the order: above the
   enabled tier before it (or the minimum link), and below the enabled
   tier after it (or the ceiling). Empty when there is no room, which
   the toggle refuses and the note explains. */
function tierWindow(tierName) {
  const links = customPicks.links;
  const order = ["bombLink", "prismLink", "chromaticLink"];
  const enabledFlag = { bombLink: "bombEnabled", prismLink: "prismEnabled", chromaticLink: "chromaticEnabled" };
  const index = order.indexOf(tierName);

  let lowest = links.minLink + 1;
  for (let i = index - 1; i >= 0; i--) {
    if (links[enabledFlag[order[i]]] === true) {
      lowest = links[order[i]] + 1;
      break;
    }
  }

  let highest = CUSTOM_THRESHOLD_HIGHEST;
  for (let i = index + 1; i < order.length; i++) {
    if (links[enabledFlag[order[i]]] === true) {
      highest = links[order[i]] - 1;
      break;
    }
  }

  return { lowest: Math.max(lowest, CUSTOM_THRESHOLD_LOWEST), highest: highest };
}

/* The minimum link may rise as far as one below the first enabled tier. */
function minLinkWindow() {
  const links = customPicks.links;
  let highest = CUSTOM_MIN_LINK_HIGHEST;
  const tiers = enabledLinkTiers(links);
  if (tiers.length > 0) {
    highest = Math.min(highest, tiers[0].length - 1);
  }
  return { lowest: CUSTOM_MIN_LINK_LOWEST, highest: highest };
}

/* Switching a tier on puts it at the nearest length its window allows.
   With no room at all the switch is refused and the note says why. */
function toggleTier(enabledField, lengthField) {
  const links = customPicks.links;

  if (links[enabledField] === true) {
    links[enabledField] = false;
    customPickChanged();
    return;
  }

  const window = tierWindow(lengthField);
  if (window.lowest > window.highest) {
    refreshCustomEditor();
    return;
  }

  links[enabledField] = true;
  links[lengthField] = Math.max(window.lowest, Math.min(links[lengthField], window.highest));
  customPickChanged();
}

function stepTier(lengthField, direction) {
  const links = customPicks.links;
  const window = tierWindow(lengthField);
  const next = links[lengthField] + direction;
  if (next < window.lowest || next > window.highest) return;
  links[lengthField] = next;
  customPickChanged();
}

function stepMinLink(direction) {
  const window = minLinkWindow();
  const next = customPicks.links.minLink + direction;
  if (next < window.lowest || next > window.highest) return;
  customPicks.links.minLink = next;
  customPickChanged();
}

/* Moving onto the Elimination base switches both hazards off, because it
   cannot play with either. Nothing is switched back on when moving away,
   so a player who turned blight off keeps it off. */
function pickBaseMode(baseModeId) {
  customPicks.baseModeId = baseModeId;
  if (baseModeId === "elimination") {
    customPicks.blightEnabled = false;
    customPicks.stonesEnabled = false;
  }
  customPickChanged();
}

function buildCustomEditor() {
  const baseRow = makeRuleRow("Game type", true);
  for (let i = 0; i < CUSTOM_BASE_MODE_IDS.length; i++) {
    const baseModeId = CUSTOM_BASE_MODE_IDS[i];
    const button = document.createElement("button");
    button.className = "pickBtn";
    button.textContent = modeById(baseModeId).name;
    button.addEventListener("click", function () {
      ensureAudio();
      pickBaseMode(baseModeId);
    });
    baseRow.appendChild(button);
    customControls.baseButtons.push({ id: baseModeId, button: button });
  }
  customControls.baseNote = makeRuleNote();

  customControls.blightToggle = makeToggle(makeRuleRow("Blight", false), function () {
    customPicks.blightEnabled = customPicks.blightEnabled === false;
    customPickChanged();
  });
  customControls.blightNote = makeRuleNote();

  customControls.stonesToggle = makeToggle(makeRuleRow("Stones", false), function () {
    customPicks.stonesEnabled = customPicks.stonesEnabled === false;
    customPickChanged();
  });
  customControls.stonesNote = makeRuleNote();

  customControls.loopsToggle = makeToggle(makeRuleRow("Loops", false), function () {
    customPicks.loopsEnabled = customPicks.loopsEnabled === false;
    customPickChanged();
  });
  customControls.loopsNote = makeRuleNote();

  customControls.carryToggle = makeToggle(makeRuleRow("Specials carry over", false), function () {
    customPicks.specialsCarryOver = customPicks.specialsCarryOver === false;
    customPickChanged();
  });
  customControls.carryNote = makeRuleNote();

  customControls.minLinkStepper = makeStepper(makeRuleRow("Minimum link", false), stepMinLink);

  const bombRow = makeRuleRow("Bomb", false);
  customControls.bombToggle = makeToggle(bombRow, function () { toggleTier("bombEnabled", "bombLink"); });
  customControls.bombStepper = makeStepper(bombRow, function (direction) { stepTier("bombLink", direction); });
  customControls.bombNote = makeRuleNote();

  const prismRow = makeRuleRow("Prism", false);
  customControls.prismToggle = makeToggle(prismRow, function () { toggleTier("prismEnabled", "prismLink"); });
  customControls.prismStepper = makeStepper(prismRow, function (direction) { stepTier("prismLink", direction); });
  customControls.prismNote = makeRuleNote();

  const chromaticRow = makeRuleRow("Chromatic", false);
  customControls.chromaticToggle = makeToggle(chromaticRow, function () { toggleTier("chromaticEnabled", "chromaticLink"); });
  customControls.chromaticStepper = makeStepper(chromaticRow, function (direction) { stepTier("chromaticLink", direction); });
  customControls.chromaticNote = makeRuleNote();
}

/* Every control, read back from the picks. */
function refreshCustomEditor() {
  const picks = customPicks;
  const links = picks.links;
  const onElimination = picks.baseModeId === "elimination";

  for (let i = 0; i < customControls.baseButtons.length; i++) {
    const entry = customControls.baseButtons[i];
    if (entry.id === picks.baseModeId) {
      entry.button.classList.add("picked");
    } else {
      entry.button.classList.remove("picked");
    }
  }
  customControls.baseNote.textContent = modeById(picks.baseModeId).blurb;

  refreshToggle(customControls.blightToggle, picks.blightEnabled, onElimination);
  if (onElimination === true) {
    customControls.blightNote.textContent = "Elimination plays without blight.";
  } else {
    customControls.blightNote.textContent = "";
  }

  refreshToggle(customControls.stonesToggle, picks.stonesEnabled, onElimination);
  if (onElimination === true) {
    customControls.stonesNote.textContent = "Elimination plays without stones.";
  } else if (picks.stonesEnabled === false) {
