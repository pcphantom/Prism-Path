<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0714">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Prism Path</title>
<style>
  :root {
    --bg-deep: #08061199;
    --panel: rgba(24, 18, 44, 0.82);
    --panel-edge: rgba(150, 120, 255, 0.28);
    --ink: #efe9ff;
    --ink-dim: #a99fc9;
    --accent: #b07cff;
    --danger: #ff5470;
    --good: #45e08a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);

    /* The label sits beside the number rather than above it, so a stat
       box only has to be tall enough for one line of text. The goal bar
       carries a 22px icon, so it gets a couple of pixels more. Both are
       kept as small as their contents allow, because every pixel saved
       here is a pixel the nine row board gets to use. */
    /* The roomy layout, with the label sitting above the number. This is
       what the top of the screen wants to be, and on most phones there
       is height going spare to pay for it. chooseHudSize drops to the
       compact set below only when keeping this one would cost the board
       a row's worth of cell size. */
    --hud-box-height: 46px;
    --goal-box-height: 46px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #06040d;
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: calc(6px + var(--safe-top)) 8px calc(6px + var(--safe-bottom)) 8px;
    gap: 6px;
  }

  /* ---------------------------------------------------------------- HUD */

  #hud {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  #topRow {
    display: flex;
    align-items: stretch;
    gap: 6px;
  }

  /* Roomy layout: the three boxes split the row evenly and each stacks
     its label above its number. */
  .stat {
    flex: 1 1 0;
    min-height: var(--hud-box-height);
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 5px 8px;
    min-width: 0;
    display: flex;
    align-items: stretch;
  }

  .statBody {
    flex: 1 1 auto;
    min-width: 0;
  }

  .stat .label {
    display: block;
    font-size: 10px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .stat .value {
    display: block;
    min-width: 0;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }

  #movesStat.low .value { color: var(--danger); }

  /* ------------------------------------------------- compact HUD */

  /* Worn only when the roomy layout would squeeze the board. Label and
     number go on one line, which takes 30px off the height of the top of
     the screen and hands it to the nine rows. Moves never needs room for
     more than two digits and level rarely more than three, so those two
     shrink to their contents and the score box takes what is left. */
  #app.compactHud {
    --hud-box-height: 30px;
    --goal-box-height: 32px;
  }

  #app.compactHud .stat {
    padding: 4px 7px;
    align-items: center;
    gap: 4px;
  }

  #app.compactHud .statBody {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  #app.compactHud #scoreStat { flex: 1 1 0; }
  #app.compactHud #movesStat { flex: 0 0 auto; }
  #app.compactHud #levelStat { flex: 0 0 auto; }

  /* The colon only belongs to the one line reading, so the markup does
     not carry it. */
  #app.compactHud .stat .label {
    display: inline;
    font-size: 9px;
    letter-spacing: 0.4px;
  }

  #app.compactHud .stat .label::after { content: ":"; }

  #app.compactHud .stat .value {
    display: inline-block;
    font-size: 18px;
    line-height: 1.15;
    text-overflow: clip;
  }

  /* Fixed pixels rather than ch units, because a ch shrinks along with
     the font and the box would run away from the text it is trying to
     hold. Anything longer has its text stepped down by fitValueText. */
  #app.compactHud #scoreValue { flex: 1 1 auto; }
  #app.compactHud #movesValue { flex: 0 0 auto; min-width: 22px; max-width: 26px; }
  #app.compactHud #levelValue { flex: 0 0 auto; min-width: 22px; max-width: 34px; }

  /* The level box carries the hint button on its right edge, the way
     the goal bar carries the menu button. The padding moves off the box
     and onto the text beside it, so the button can reach the edges. */
  /* The button reaches the edges of the level box with a negative
     margin, so the box keeps the padding every stat box has and the row
     is laid out exactly as it would be without a button in it. */
  #hintBtn {
    flex: 0 0 auto;
    align-self: stretch;
    width: 40px;
    margin: -5px -8px -5px 0;
    padding: 0;
    font-size: 20px;
    font-weight: bold;
    line-height: 1;
    border-radius: 0 11px 11px 0;
    border: 0;
    border-left: 1px solid var(--panel-edge);
    background: rgba(255, 255, 255, 0.07);
  }

  /* The margin has to follow the padding the compact boxes use, or the
     button stops reaching their edges. */
  #app.compactHud #hintBtn {
    width: 32px;
    margin: -4px -7px -4px 0;
    font-size: 17px;
  }

  #hintBtn:active { background: rgba(255, 255, 255, 0.16); }

  /* Lit while a hint is pointing at it. */
  /* The bulb is drawn rather than typed, because a light that has to
     come on in yellow needs a colour something else can set. The glass
     and the two lines of the base take their colour from the button, so
     lighting it is a single property. */
  #hintBtn svg {
    display: block;
    width: 21px;
    height: 21px;
    margin: 0 auto;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #app.compactHud #hintBtn svg { width: 18px; height: 18px; }

  /* Dark and dormant while there is nothing to say. The rays stay drawn
     so the shape still reads as a light bulb, but they sit well back
     until there is something to light them up for. */
  #hintBtn { color: var(--ink-dim); }

  /* Dimmed with a colour rather than with opacity. Anything below full
     opacity puts the element on its own composited layer, and inside a
     fixed position app that leaves a seam down the edge of the screen
     where the browser fails to repaint. */
  #hintBtn .bulbRays { stroke: #3f3a52; }
  #hintBtn.lit .bulbRays { stroke: currentColor; }

  /* Lit the moment a hint is ready, which is not the same as the hint
     being drawn on the board. The player can put the trail away and the
     bulb stays on, because the suggestion is still there to ask for. */
  #hintBtn.lit { color: #ffd23f; }

  /* A solid colour, not a translucent one. Nothing in this button is
     allowed to need a layer of its own. */
  #hintBtn.lit .bulbGlass { fill: #5c4d1e; }

  /* Same height as the stat boxes above, so the top of the screen
     reads as one block. */
  #goalBar {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 0 0 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: var(--goal-box-height);
  }

  #goalText {
    font-size: 15px;
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    /* The icon sits on the text baseline row, so the line has to be
       tall enough to hold it without the bar growing. */
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* The gem or stone the goal is asking for, drawn by the board's own
     code. Never squashed by the flex row it sits in. */
  .goalIcon {
    flex: 0 0 auto;
    display: block;
  }

  /* Holds the icon. On Standard it is a box that fits its contents and
     changes nothing; HD turns it into a recessed socket. */
  .goalSocket {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #goalCount {
    font-size: 15px;
    font-weight: bold;
    color: var(--accent);
    flex: 0 0 auto;
  }

  #goalTrack {
    flex: 0 0 90px;
    height: 8px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }

  #goalFill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #7c5cff, #45e08a);
    transition: width 0.25s ease-out;
  }

  /* -------------------------------------------------------------- stage */

  #stage {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #board {
    display: block;
    touch-action: none;
  }

  /* ----------------------------------------------------------- controls */

  #controls {
    flex: 0 0 auto;
    display: flex;
    gap: 6px;
    align-items: stretch;
  }

  button {
    font-family: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 9px 6px;
    font-size: 12px;
    letter-spacing: 0.6px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
  }

  button:active { transform: scale(0.94); }

  .iconBtn {
    flex: 0 0 52px;
    font-size: 18px;
    padding: 8px 0;
  }

  /* Full height of the goal bar, and wide enough to hit with a
     thumb without looking. */
  #menuBtn {
    flex: 0 0 auto;
    align-self: stretch;
    width: 52px;
    padding: 0;
    font-size: 21px;
    line-height: 1;
    border-radius: 0 11px 11px 0;
    border: 0;
    border-left: 1px solid var(--panel-edge);
    background: rgba(255, 255, 255, 0.07);
  }

  #menuBtn:active { background: rgba(255, 255, 255, 0.16); }

  #controls {
    flex-direction: column;
    gap: 4px;
  }

  #chargeRow {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 2px;
  }

  #chargeLabel,
  #chargeValue {
    flex: 0 0 auto;
    font-size: 10px;
    letter-spacing: 1.2px;
    color: var(--ink-dim);
  }

  #chargeValue {
    font-weight: bold;
    color: var(--ink);
    min-width: 44px;
    text-align: right;
  }

  #chargeTrack {
    position: relative;
    flex: 1 1 auto;
    height: 14px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  #chargeFill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #7c5cff, #4fd6ff, #45e08a);
    transition: width 0.25s ease-out;
  }

  /* One notch per item, so the bar shows how close the next one is. */
  #chargeTicks {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .chargeTick {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    margin-left: -1px;
    background: rgba(10, 6, 20, 0.75);
  }

  .chargeTick.reached { background: rgba(255, 255, 255, 0.85); }

  #itemRow {
    display: flex;
    gap: 5px;
  }

  .itemBtn {
    flex: 1 1 0;
    min-width: 0;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 2px;
    opacity: 0.4;
  }

  .itemBtn .glyph { font-size: 22px; line-height: 1; }

  .itemBtn .name {
    font-size: 10px;
    line-height: 1;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* Both of these are in the markup for HD's benefit and are nothing to
     Standard. display:none rather than left alone, because .itemBtn is
     a flex column with a gap and an empty span would still buy a gap. */
  .itemBtn .cost { display: none; }
  .itemBtn .fuel { display: none; }

  .itemBtn.ready {
    opacity: 1;
    border-color: rgba(176, 124, 255, 0.6);
    background: rgba(124, 92, 255, 0.16);
  }

  .itemBtn.armed {
    opacity: 1;
    color: #fff;
    border-color: var(--good);
    background: rgba(69, 224, 138, 0.22);
    animation: pulse 1.1s ease-in-out infinite;
  }

  /* A hint pointing at an item. Cyan, because the ready state is
     already violet and the armed state is already green: with the
     charge bar full every button is lit, and the one being suggested
     has to be the one that stands out. */
  .itemBtn.hinted {
    opacity: 1;
    color: #fff;
    border-color: #4fd6ff;
    background: rgba(79, 214, 255, 0.22);
    animation: hintPulse 1.4s ease-in-out infinite;
  }

  @keyframes hintPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(79, 214, 255, 0.55); }
    50%      { box-shadow: 0 0 18px 4px rgba(79, 214, 255, 0.55); }
  }

  /* ------------------------------------------------------------ menu */

  #menuPanel {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(6, 4, 13, 0.9);
    backdrop-filter: blur(3px);
    z-index: 20;
  }

  #menuPanel.hidden { display: none; }

  /* Same rule as the card: never taller than the space it is in, and
     scrolls when the list does not fit. Seven items on a short phone
     would otherwise run off the bottom. */
  #menuCard {
    width: 100%;
    max-width: 300px;
    max-height: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
    background: linear-gradient(160deg, rgba(40, 28, 74, 0.96), rgba(18, 12, 34, 0.96));
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
  }

  #menuCard h2 {
    margin: 0 0 12px 0;
    font-size: 19px;
    text-align: center;
    letter-spacing: 1px;
    color: var(--ink);
  }

  .menuItem {
    display: block;
    width: 100%;
    margin-bottom: 7px;
    padding: 11px;
    font-size: 14px;
    text-align: center;
  }

  .menuItem.danger { color: var(--danger); border-color: rgba(255, 84, 112, 0.4); }

  /* ----------------------------------------------- settings submenu */

  #menuMain.hidden, #settingsPage.hidden { display: none; }

  /* One channel per box, so the toggle and the slider that belong
     together read as a pair. */
  .settingGroup {
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    padding: 10px;
    margin-bottom: 9px;
  }

  .settingGroup .menuItem { margin-bottom: 0; }

  .sliderRow {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 10px;
  }

  .sliderLabel {
    flex: 0 0 auto;
    font-size: 10px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .sliderRow output {
    flex: 0 0 36px;
    text-align: right;
    font-size: 12px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  /* Wider than the volume readouts, because it has to say whether the
     delay is the one the player picked or the one the level chose. */
  #hintReadout { flex: 0 0 62px; }

  /* Graphics is the one setting whose name does not explain itself, so
     it gets a line under the button saying what the choice costs. */
  .settingNote {
    margin: 9px 2px 1px;
    font-size: 11px;
    line-height: 1.45;
    color: var(--ink-dim);
    text-align: center;
  }

  /* A muted channel keeps its slider on screen so the level stays
     readable, and dims it to say it is doing nothing right now. */
  .settingGroup.off .sliderRow { opacity: 0.38; }

  input[type="range"] {
    flex: 1 1 auto;
    min-width: 0;
    height: 22px;
    margin: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid var(--panel-edge);
  }

  input[type="range"]::-webkit-slider-thumb {
    width: 18px;
    height: 18px;
    margin-top: -7px;
    border-radius: 50%;
    background: var(--accent);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 8px rgba(176, 124, 255, 0.55);
    -webkit-appearance: none;
    appearance: none;
  }

  input[type="range"]::-moz-range-track {
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid var(--panel-edge);
  }

  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 8px rgba(176, 124, 255, 0.55);
  }

  /* Printed in the settings panel when the music file will not load, so
     the player learns why it is silent instead of guessing. */
  #musicNote {
    margin: 0 0 10px 0;
    font-size: 11px;
    line-height: 1.4;
    text-align: center;
    color: var(--danger);
  }

  #musicNote.hidden { display: none; }

  #cardBtnAlt {
    width: 100%;
    margin-top: 8px;
    padding: 11px;
    font-size: 14px;
  }

  #cardBtnAlt.hidden { display: none; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(176, 124, 255, 0.5); }
    50%      { box-shadow: 0 0 16px 3px rgba(176, 124, 255, 0.5); }
  }

  /* ---------------------------------------------------------- overlays */

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(6, 4, 13, 0.86);
    backdrop-filter: blur(3px);
    z-index: 10;
  }

  #overlay.hidden { display: none; }

  /* The card is never taller than the space it sits in. Anything that
     does not fit scrolls inside it, so a long rules list can never push
     the buttons off the bottom of a phone screen. */
  #card {
    width: 100%;
    max-width: 340px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    background: linear-gradient(160deg, rgba(40, 28, 74, 0.96), rgba(18, 12, 34, 0.96));
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 20px 18px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);

    /* On a screen too short even for the shrunk down regions inside,
       the whole card scrolls. A landscape phone leaves the stage about
       180px tall, which is the case that needs this. */
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }

  /* Everything except the scrolling middle keeps its natural height. */
  #cardTitle, #cardSub, #cardStats, #cardBtn, #cardBtnAlt {
    flex: 0 0 auto;
  }

  #cardTitle {
    font-size: 27px;
    margin: 0 0 4px 0;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff6ea9, #b07cff, #4fd6ff, #45e08a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  #cardSub {
    font-size: 13px;
    color: var(--ink-dim);
    margin: 0 0 14px 0;
  }

  #cardBody {
    font-size: 13px;
    line-height: 1.55;
    text-align: left;
    color: #d9d2f2;
    margin-bottom: 16px;

    /* The scrolling middle. min-height lets it shrink below its content
       so overflow-y actually has something to do. */
    flex: 1 1 auto;
    min-height: 90px;
    overflow-y: auto;
    overscroll-behavior: contain;

    /* The page switches touch gestures off so drags on the board read
       cleanly. Vertical dragging has to be handed back here, or the
       rules cannot be scrolled with a finger. */
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }

  /* The title card carries no body text, so it pays for neither the gap
     under one nor the floor that keeps one readable. */
  #cardBody:empty {
    min-height: 0;
    margin-bottom: 0;
  }

  #cardBody b { color: #fff; }

  #cardBody .rule {
    display: flex;
    gap: 8px;
    margin-bottom: 7px;
    align-items: baseline;
  }

  #cardBody .rule .pip {
    flex: 0 0 auto;
    font-size: 14px;
  }

  #cardBtn {
    width: 100%;
    padding: 13px;
    font-size: 16px;
    font-weight: bold;
    background: linear-gradient(90deg, #7c5cff, #b07cff);
    border-color: transparent;
  }

  #cardBtn.hidden { display: none; }

  /* The front page is a list of destinations, so it gets its own stack
     of buttons in place of the one or two the other cards need. Tall
     targets with a real gap between them, so a thumb cannot start a new
     run while reaching for the rules. */
  #cardMenu {
    display: flex;
    flex-direction: column;
    gap: 10px;

    /* Shrinks and scrolls only when the screen is too short to hold the
       whole list, and never below about three buttons. */
    flex: 0 1 auto;
    min-height: 160px;
    overflow-y: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }

  #cardMenu.hidden { display: none; }

  .cardMenuItem {
    width: 100%;
    padding: 15px 10px;
    font-size: 16px;
    letter-spacing: 0.8px;
  }

  .cardMenuItem.primary {
    font-weight: bold;
    background: linear-gradient(90deg, #7c5cff, #b07cff);
    border-color: transparent;
  }

  #cardStats {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-bottom: 15px;
  }

  #cardStats div { text-align: center; }
  #cardStats .n { font-size: 23px; font-weight: bold; }
  #cardStats .k {
    font-size: 10px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }

  #toast {
    position: absolute;
    left: 50%;
    top: 14%;
    transform: translate(-50%, 0);
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;
    pointer-events: none;
    opacity: 0;
    z-index: 5;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    white-space: nowrap;
  }

  @media (min-width: 620px) {
    #app { max-width: 520px; margin: 0 auto; }
  }

  /* ================================================================
     HD CHROME

     Worn as a class on #app when Graphics is set to HD. Standard is the
     absence of it, so every rule above is left exactly as it was and
     nothing here can change how the game looks on Standard.

     The idea in one line: the interface is the setting and the gems are
     the stones, so the chrome gives up its hue. Every surface, rail and
     label here sits under 25 percent chroma. The only saturated colour
     in the whole frame is borrowed from the stone the level is asking
     for, which means the one coloured thing on screen is always
     pointing at the thing being hunted.

     That matters more than taste. Measured against the five gem hues,
     the Standard tokens land: --accent on the violet gem's exact hex,
     --good on the green gem's, --danger on the red gem's, the charge
     bar 12 degrees off violet and the hint cyan 11 degrees off blue.
     In a game where colour is the mechanic, the chrome was competing
     with the board for the same channel.

     Two house rules are kept throughout. Nothing here changes the
     height of anything, because every pixel at the top of the screen is
     a pixel the nine rows do not get. And nothing animates opacity or
     sits below full opacity, because that puts the element on its own
     composited layer and leaves a repaint seam down the edge of the
     fixed shell. The item row actually drops four such layers.
     ================================================================ */

  #app.hdChrome {
    --void:       #05040b;
    --velvet:     #0d0a18;
    --panel:      #17122b;
    --panel-lift: #201936;
    --panel-edge: rgba(214, 203, 255, 0.46);
    --rail-lo:    rgba(122, 106, 174, 0.22);
    --ink:        #f1edff;
    --ink-dim:    #9c93bd;
    --ink-faint:  #665d85;
    --fuel-off:   #2a2145;
    --fuel-on:    #cbbcf5;
    --fuel-hot:   #f5f0ff;
    --danger:     #ff4a5f;

    /* Overwritten by renderGoalLine every time the goal changes. The
       values here are the neutral the chrome wears when the goal names
       no stone, which is what a score goal does. */
    --goal-deep: #2d2748;
    --goal-core: #9c93bd;
    --goal-rim:  #d8d0f0;

    /* Everything that used to be violet now borrows. */
    --accent: var(--goal-rim);

    background: var(--void);
  }

  /* ---- surfaces: metal, which is a gradient and never a flat line ---- */

  #app.hdChrome .stat,
  #app.hdChrome #goalBar {
    background: linear-gradient(180deg, var(--panel-lift), var(--panel));
    border-top-color: var(--panel-edge);
    border-left-color: var(--rail-lo);
    border-right-color: var(--rail-lo);
    border-bottom-color: rgba(0, 0, 0, 0.5);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  /* ---- moves: warns before it shouts ----

     The number still turns red at four. The stripe starts warming at
     eight, which is far enough out to still be able to do something
     about it, and it arrives in peripheral vision rather than asking to
     be read. refreshHud sets the colour. */

  #app.hdChrome #movesStat {
    position: relative;
    padding-left: 13px;
  }

  #app.hdChrome #movesStat::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 99px;
    background: var(--moves-stripe);
    transition: background 0.3s ease;
  }

  /* ---- the goal line ---- */

  /* The stone sits in a recess, the way a stone sits in a ring. The
     socket is in the markup on Standard too, where it carries no styling
     at all and simply holds the icon where the icon already was. */
  #app.hdChrome .goalSocket {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: var(--velvet);
    box-shadow:
      inset 0 1px 3px rgba(0, 0, 0, 0.7),
      inset 0 -1px 0 rgba(255, 255, 255, 0.04);
  }

  #app.hdChrome.compactHud .goalSocket { width: 24px; height: 24px; }

  #app.hdChrome #goalTrack {
    background: var(--velvet);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
  }

  #app.hdChrome #goalFill {
    background: linear-gradient(90deg, var(--goal-deep), var(--goal-core));
    box-shadow: 0 0 8px -1px var(--goal-core);
  }

  /* ---- the two edge buttons ---- */

  #app.hdChrome #menuBtn,
  #app.hdChrome #hintBtn {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
    border-left-color: var(--rail-lo);
  }

  #app.hdChrome #menuBtn:active,
  #app.hdChrome #hintBtn:active {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
  }

  /* ---- charge: a filament, not a rainbow ----

     Standard paints charge violet to cyan to green and goal progress
     violet to green, so two bars measuring completely different things
     look nearly the same. Charge becomes one hue read as lightness,
     which leaves colour to mean progress and nothing else. */

  #app.hdChrome #chargeTrack {
    background: var(--velvet);
    border-color: rgba(0, 0, 0, 0.5);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7);
  }

  #app.hdChrome #chargeFill {
    background: linear-gradient(90deg, var(--fuel-off) 0%, var(--fuel-on) 78%, var(--fuel-hot) 100%);
    box-shadow: 0 0 10px -2px var(--fuel-on);
  }

  /* A gate per item cost. Passing one lights it, so a glance at the bar
     says what the next spend buys. */
  #app.hdChrome .chargeTick {
    top: 2px;
    bottom: 2px;
    width: 1px;
    margin-left: -0.5px;
    background: rgba(5, 4, 11, 0.9);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }

  #app.hdChrome .chargeTick.reached {
    background: var(--fuel-hot);
    box-shadow: 0 0 6px 0 var(--fuel-on);
  }

  /* ---- items: fill, never dim ----

     Standard drops an unaffordable item to 0.4 opacity, which reads as
     broken rather than as not yet, and costs a composited layer each.
     Full contrast is kept and fuel rises toward the cost instead. */

  #app.hdChrome .itemBtn {
    --fuel: 0%;
    opacity: 1;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, var(--panel-lift), var(--panel));
    border-top-color: var(--rail-lo);
    border-left-color: var(--rail-lo);
    border-right-color: var(--rail-lo);
    border-bottom-color: rgba(0, 0, 0, 0.5);
    color: var(--ink-faint);
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  #app.hdChrome .itemBtn .fuel {
    display: block;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--fuel);
    background: linear-gradient(180deg, rgba(203, 188, 245, 0.13), rgba(203, 188, 245, 0.04));
    border-top: 1px solid rgba(203, 188, 245, 0.28);
    transition: height 0.25s ease-out;
    pointer-events: none;
  }

  /* The fuel is positioned, so it would paint over static content
     whatever the markup order. The label is lifted above it. */
  #app.hdChrome .itemBtn .glyph,
  #app.hdChrome .itemBtn .name,
  #app.hdChrome .itemBtn .cost {
    position: relative;
    z-index: 1;
  }

  /* The cost moves out of the name and into the corner. */
  #app.hdChrome .itemBtn .inlineCost { display: none; }

  #app.hdChrome .itemBtn .cost {
    display: block;
    position: absolute;
    top: 3px;
    right: 6px;
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 0.4px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    transition: color 0.2s ease;
  }

  #app.hdChrome .itemBtn.ready {
    opacity: 1;
    background: linear-gradient(180deg, var(--panel-lift), var(--panel));
    border-top-color: var(--panel-edge);
    color: var(--ink);
  }

  #app.hdChrome .itemBtn.ready .cost { color: var(--fuel-on); }

  /* Armed is white and moving. Standard uses the green gem's exact hex.
     Nothing on the board is ever ringed in white, so this cannot be
     misread as a stone. */
  #app.hdChrome .itemBtn.armed {
    opacity: 1;
    color: #fff;
    background: linear-gradient(180deg, var(--panel-lift), var(--panel));
    border-color: rgba(255, 255, 255, 0.85);
    animation: hdArmed 1.2s ease-in-out infinite;
  }

  @keyframes hdArmed {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4), inset 0 0 12px -4px rgba(255, 255, 255, 0.5); }
    50%      { box-shadow: 0 0 14px 2px rgba(255, 255, 255, 0.4), inset 0 0 18px -2px rgba(255, 255, 255, 0.6); }
  }

  /* A hint is dashed and slowly pulsing on the board. It is dashed and
     slowly pulsing here too, so a hint looks like a hint wherever it
     turns up. The pulse runs on border-color rather than opacity, which
     repaints without asking for a layer. */
  #app.hdChrome .itemBtn.hinted {
    opacity: 1;
    color: var(--ink);
    background: linear-gradient(180deg, var(--panel-lift), var(--panel));
    border-color: var(--rail-lo);
    animation: none;
  }

  #app.hdChrome .itemBtn.hinted::after {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: 10px;
    border: 1px dashed rgba(255, 255, 255, 0.9);
    animation: hdHint 1.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 2;
  }

  @keyframes hdHint {
    0%, 100% { border-color: rgba(255, 255, 255, 0.32); }
    50%      { border-color: rgba(255, 255, 255, 0.95); }
  }

  /* ---- cards and menus ---- */

  #app.hdChrome #card,
  #app.hdChrome #menuCard {
    background: linear-gradient(160deg, var(--panel-lift), var(--velvet));
    border-color: var(--rail-lo);
    border-top-color: var(--panel-edge);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.7);
  }

  #app.hdChrome #menuPanel,
  #app.hdChrome #overlay {
    background: rgba(5, 4, 11, 0.9);
  }

  /* Standard runs four gem colours through the title in one gradient.
     One warm metal sweep instead, with the borrowed hue in the middle
     of it so the card still knows what level it belongs to.

     background-image, not the background shorthand. The shorthand
     resets background-clip to border-box, and the title is painted by
     clipping this gradient to the glyphs. */
  #app.hdChrome #cardTitle {
    background-image: linear-gradient(90deg, #ffffff, var(--goal-rim), var(--fuel-on));
  }

  #app.hdChrome #cardBody { color: #ded7f5; }

  #app.hdChrome .menuItem,
  #app.hdChrome button {
    background: linear-gradient(180deg, var(--panel-lift), var(--panel));
    border-color: var(--rail-lo);
    border-top-color: rgba(214, 203, 255, 0.26);
    color: var(--ink);
  }

  /* The one action the card is really offering. A brighter face and a
     glow underneath in the level's own hue, in place of the slab of
     violet Standard paints. */
  #app.hdChrome #cardBtn,
  #app.hdChrome .cardMenuItem.primary {
    background: linear-gradient(180deg, #2b2249, #1a1430);
    border-color: transparent;
    border-top-color: rgba(255, 255, 255, 0.5);
    border-bottom-color: rgba(0, 0, 0, 0.6);
    box-shadow:
      0 0 20px -6px var(--goal-core),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    color: #ffffff;
  }

  #app.hdChrome .menuItem.danger {
    color: var(--danger);
    border-color: rgba(255, 74, 95, 0.42);
  }

  #app.hdChrome .settingGroup {
    border-color: var(--rail-lo);
    background: rgba(255, 255, 255, 0.02);
  }

  @media (prefers-reduced-motion: reduce) {
    #app.hdChrome .itemBtn.armed,
    #app.hdChrome .itemBtn.hinted::after { animation: none; }
  }
</style>
</head>
<body>

<div id="app">

  <div id="hud">
    <div id="topRow">
      <div class="stat" id="scoreStat">
        <div class="statBody">
          <span class="label">Score</span>
          <span class="value" id="scoreValue">0</span>
        </div>
      </div>
      <div class="stat" id="movesStat">
        <div class="statBody">
          <span class="label">Moves</span>
          <span class="value" id="movesValue">20</span>
        </div>
      </div>
      <div class="stat" id="levelStat">
        <div class="statBody">
          <span class="label">Level</span>
          <span class="value" id="levelValue">1</span>
        </div>
        <button id="hintBtn" title="Hint" aria-label="Show a hint"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="bulbRays"><path d="M7.33 4.33 5.35 2.35"/><path d="M5.4 9H2.6"/><path d="M7.33 13.67 5.35 15.65"/><path d="M16.67 4.33 18.65 2.35"/><path d="M18.6 9h2.8"/><path d="M16.67 13.67 18.65 15.65"/></g><circle class="bulbGlass" cx="12" cy="9" r="4.7"/><path d="M9.6 15.4h4.8"/><path d="M10.5 17.9h3"/></svg></button>
      </div>
    </div>
    <div id="goalBar">
      <div id="goalText">Link 20 red gems</div>
      <div id="goalTrack"><div id="goalFill"></div></div>
      <div id="goalCount">0/20</div>
      <button id="menuBtn" title="Menu" aria-label="Menu">&#9776;</button>
    </div>
  </div>

  <div id="stage">
    <canvas id="board"></canvas>
    <div id="toast"></div>
    <div id="menuPanel" class="hidden">
      <div id="menuCard">
        <h2 id="menuTitle">Paused</h2>

        <div id="menuMain">
          <button class="menuItem" id="menuResume">Resume</button>
          <button class="menuItem" id="menuSettings">Settings</button>
          <button class="menuItem" id="menuFull">Fullscreen</button>
          <button class="menuItem" id="menuHelp">How to Play</button>
          <button class="menuItem" id="menuSave">Save</button>
          <button class="menuItem" id="menuSaveQuit">Save and Quit</button>
          <button class="menuItem danger" id="menuQuit">Quit without Saving</button>
        </div>

        <div id="settingsPage" class="hidden">
          <p id="musicNote" class="hidden"></p>

          <div class="settingGroup" id="graphicsGroup">
            <button class="menuItem" id="graphicsToggle">Graphics: HD</button>
            <p class="settingNote" id="graphicsNote"></p>
          </div>

          <div class="settingGroup" id="hintGroup">
            <button class="menuItem" id="hintToggle">Hints: On</button>
            <div class="sliderRow">
              <span class="sliderLabel">Delay</span>
              <input type="range" id="hintSlider" min="5" max="30" step="1" value="8" aria-label="Hint delay in seconds">
              <output id="hintReadout">8s</output>

          <div class="settingGroup" id="sfxGroup">

              <span class="sliderLabel">Vol</span>
              <input type="range" id="sfxSlider" min="0" max="100" step="1" value="100" aria-label="SFX volume">
              <output id="sfxReadout">100%</output>

          <div class="settingGroup" id="musicGroup">
            <button class="menuItem" id="musicToggle">Music: On</button>
            <div class="sliderRow">
              <span class="sliderLabel">Vol</span>
              <input type="range" id="musicSlider" min="0" max="100" step="1" value="60" aria-label="Music volume">
              <output id="musicReadout">60%</output>

    <div id="overlay" class="hidden">
      <div id="card">
        <h1 id="cardTitle"></h1>
        <p id="cardSub"></p>
        <div id="cardStats" style="display:none">
          <div><div class="n" id="finalScore">0</div><div class="k">Score</div></div>
          <div><div class="n" id="bestScore">0</div><div class="k">Best</div></div>
        </div>
        <div id="cardBody"></div>
        <div id="cardMenu" class="hidden"></div>

  <div id="controls">
    <div id="chargeRow">
      <span id="chargeLabel">CHARGE</span>

        <div id="chargeFill"></div>
        <div id="chargeTicks"></div>
      </div>
      <span id="chargeValue">0/36</span>
    </div>
    <div id="itemRow"></div>
  </div>

</div>

<script>
"use strict";

/* ==================================================================
   Prism Path
   A single file connect-and-purge puzzle game.

   Rules in short:
     - Drag across touching gems of the same colour to link them.
     - Release with 3 or more linked and they burst.
     - Cross your own path to close a loop: every gem of that colour
       on the board is wiped out.
     - 5 or 6 linked forges a Bomb. 7 or more forges a Prism.
     - The Blight creeps across the board and ends the run if it
       takes fifteen cells. Linking a blighted gem cures it.
   ================================================================== */

/* ------------------------------------------------------------------
   Board constants
   ------------------------------------------------------------------ */

const COLS = 7;

/* The board is nine rows by seven columns on every screen. The whole
   difficulty curve is balanced against that number: the stone cap, the
   blight threshold, the move budget and the goal targets are all tuned
   for a board this size, so it is fixed and never guessed at from the
   screen it is being drawn on. */
const ROWS = 9;

const GEM_COLOURS = [
  { name: "red",    core: "#ff5470", rim: "#ffb3c0", glow: "#ff2f55", shape: "circle"   },
  { name: "amber",  core: "#ffab35", rim: "#ffe0a8", glow: "#ff8a00", shape: "diamond"  },
  { name: "green",  core: "#45e08a", rim: "#b6ffd6", glow: "#12c568", shape: "square"   },
  { name: "blue",   core: "#3fb0ff", rim: "#b8e4ff", glow: "#0d84e8", shape: "triangle" },
  { name: "violet", core: "#b07cff", rim: "#e2ccff", glow: "#8b4dff", shape: "hexagon"  }
];

/* The HD ramps. Five stops instead of three, because a faceted stone
   needs somewhere to travel: a deep pavilion tone to sit under it and a
   near white spark for the flat top face. The hues are the ones above,
   held at the same spacing so nothing gets harder to tell apart, with
   the cores pushed up in lightness.

   Only the gem body reads these. The path line, the burst shards, the
   toasts and the loop tint all stay on GEM_COLOURS in both modes, so
   switching appearance changes the stones and nothing else. Indexes
   match GEM_COLOURS entry for entry. */
const HD_GEM_COLOURS = [
  { deep: "#6e0a2f", glow: "#ff1f5c", core: "#ff4d7d", rim: "#ffa8c2", spark: "#fff2f6" },
  { deep: "#7d3500", glow: "#ff8f0a", core: "#ffb23d", rim: "#ffdb96", spark: "#fff8e8" },
  { deep: "#04543a", glow: "#0ce07d", core: "#3bf39c", rim: "#a8ffd4", spark: "#edfff5" },
  { deep: "#05386f", glow: "#149bff", core: "#46bcff", rim: "#a8e2ff", spark: "#eef8ff" },
  { deep: "#3f157e", glow: "#9a4dff", core: "#bd85ff", rim: "#ddc2ff", spark: "#f7f0ff" }
];

/* The two appearances the Graphics setting picks between. Standard is
   the game as it shipped: flat gradient gems and a violet interface. HD
   is the faceted cut and the chrome built around it. One setting moves
   both, because a cut stone in a flat frame looks like a mistake and a
   flat stone in a cut frame looks worse.

   HD is more to draw per gem, which is the whole reason Standard stays
   on the menu for older devices. */
const GRAPHICS_STANDARD = "standard";
const GRAPHICS_HD = "hd";

/* How many moves out the HD moves stripe starts warming. Four is where
   the number already turns red, so eight gives the player a run up to
   it rather than a slap. */
const MOVES_WARN_FROM = 8;
const MOVES_STRIPE_CALM = "#665d85";
const MOVES_STRIPE_ALARM = "#ff4a5f";

/* What the borrowed accent wears when the goal names no stone. A score
   goal has no piece to picture and a stone goal names one with no
   colour of its own, so both are answered with the chrome's own
   platinum rather than pretending a hue is there. */
const GOAL_ACCENT_NEUTRAL = { deep: "#2d2748", core: "#9c93bd", rim: "#d8d0f0" };

const graphics = {
  mode: GRAPHICS_HD
};

/* The key light every HD facet is shaded against. Up and to the left,
   the direction the highlight blob already implied, so nothing in the
   scene contradicts anything else. */
const HD_LIGHT_X = -0.55;
const HD_LIGHT_Y = -0.83;

/* How much of the stone the flat top face covers. */
const HD_TABLE_SCALE = 0.44;

/* One full sweep of the travelling glint, and the slice of that cycle
   the bar is actually on screen for. Each gem carries its own phase, so
   the board twinkles unevenly instead of flashing in unison. */
const HD_GLINT_PERIOD_SECONDS = 4.2;
const HD_GLINT_VISIBLE_FRACTION = 0.2;

/* Fraction of a cell that responds to a touch. Anything below 0.707
   keeps diagonal drags from clipping their neighbours. */
const HIT_RADIUS = 0.55;

const MIN_LINK = 3;
const BOMB_LINK = 5;      // linking this many forges a bomb
const PRISM_LINK = 7;     // linking this many forges a prism

/* How long a gem spends bursting before it leaves the board. */
const BURST_SECONDS = 0.24;

/* A board wide clear does not go off all at once. Every cell waits
   this long per cell of distance from the middle of the loop, so the
   clear reads as a wave rolling outwards. */
const WAVE_SECONDS_PER_CELL = 0.05;

/* Shuffle empties the board and fills it back in a row at a time from
   the top, so the player sees every tile land somewhere new. The tiles
   shrink away over SHUFFLE_SHRINK_SECONDS, the board sits empty for
   SHUFFLE_BEAT_SECONDS, then each row starts SHUFFLE_ROW_STEP_SECONDS
   after the one above it. A tile takes 1 / SHUFFLE_GROW_RATE seconds
   to grow in once its turn arrives. */
const SHUFFLE_SHRINK_SECONDS = 0.12;
const SHUFFLE_BEAT_SECONDS = 0.1;
const SHUFFLE_ROW_STEP_SECONDS = 0.045;
const SHUFFLE_GROW_RATE = 5;

/* How fast a tile grows to full size when it spawns, in scale per
   second, so 4 is a quarter of a second from nothing to full. */
const SPAWN_GROW_RATE = 4;

/* A bomb clears the eight cells around it and cracks a stone once. A
   bomb caught inside a closed loop reaches three cells in every
   direction and cracks a stone three times. */
const BOMB_BLAST_RADIUS = 1;
const TRIPLE_BLAST_RADIUS = 3;
const BOMB_STONE_DAMAGE = 1;
const TRIPLE_STONE_DAMAGE = 3;
/* The board is between 8 and 12 rows depending on the screen, so a
   flat blight threshold would make small phones harder than large
   ones. Scaling it keeps the pressure the same everywhere. */
function blightLossThreshold() {
  return Math.max(8, Math.round(ROWS * COLS * 0.14));
}

/* Blight carried between levels always leaves headroom, so a new level
   can never open already lost. */
function blightCarryCap() {
  return blightLossThreshold() - 3;
}

/* A blighted gem does not sit still. Every gem counts the moves it has
   spent infected, and on the third the blight walks to a clean gem
   beside it and the cell it came from sets as stone. Leaving blight
   alone therefore costs board rather than costing nothing, and the
   stone it leaves is the softest there is: one crack and it is gone. */
const BLIGHT_MOVE_INTERVAL = 3;
const BLIGHT_STONE_HP = 1;

/* The walk is played out rather than jumped. The stone sets under the
   blight first, then the blight crawls across to the gem it picked and
   only shows up there once it has arrived. */
const BLIGHT_SET_SECONDS = 0.24;

   Sound: everything is synthesised, no audio files needed

/* Headroom trim on the whole effects bus. Every synth voice below was
   written and balanced against this figure, so the volume slider
   scales it rather than replacing it. */
const SFX_HEADROOM = 0.9;

const sound = {
  ctx: null,
  bus: null,
  enabled: true,
  volume: 1
};

function ensureAudio() {
  if (sound.ctx === null) {
    const Ctor = window.AudioContext;
    if (typeof Ctor !== "function") {
      sound.enabled = false;
      return;
    }
    sound.ctx = new Ctor();

    /* Every voice runs through one compressor. A twenty five gem break
       fires the crack, nine shards, an eight note run and a thump at
       the same moment, and straight into the destination that sums
       past full scale and clips. */
    const now = sound.ctx.currentTime;

    const limiter = sound.ctx.createDynamicsCompressor();
    limiter.threshold.setValueAtTime(-10, now);
    limiter.knee.setValueAtTime(6, now);
    limiter.ratio.setValueAtTime(12, now);
    limiter.attack.setValueAtTime(0.003, now);
    limiter.release.setValueAtTime(0.18, now);

    const master = sound.ctx.createGain();
    master.gain.setValueAtTime(SFX_HEADROOM * sound.volume, now);

    master.connect(limiter);
    limiter.connect(sound.ctx.destination);
    sound.bus = master;
  }
  if (sound.ctx.state === "suspended") {
    sound.ctx.resume();
  }
}

/* Where every voice connects. Only ever called once the context is up,
   so the bus is always there by the time anything asks for it. */
function soundBus() {
  return sound.bus;
}

/* The slider moves while gems are still ringing out. Ramping over a
   few milliseconds instead of jumping keeps the change from clicking
   through whatever is mid note. Silent until the context exists,
   because ensureAudio reads the volume when it builds the bus. */
function applySfxVolume() {
  if (sound.ctx === null) return;

  sound.bus.gain.setTargetAtTime(SFX_HEADROOM * sound.volume, sound.ctx.currentTime, 0.02);
}

function playTone(frequency, duration, type, volume) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;
  const osc = sound.ctx.createOscillator();
  const gain = sound.ctx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(frequency, now);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(volume, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

  osc.connect(gain);
  gain.connect(soundBus());
  osc.start(now);
  osc.stop(now + duration + 0.02);
}

/* Each extra gem in a link steps the note up a semitone, so a long
   chain plays as a rising run. */
function playLinkNote(step) {
  const base = 294;
  const frequency = base * Math.pow(2, step / 12);
  playTone(frequency, 0.16, "triangle", 0.16);
}

function playNoiseHit(volume) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;
  const length = Math.floor(sound.ctx.sampleRate * 0.22);
  const buffer = sound.ctx.createBuffer(1, length, sound.ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < length; i++) {
    const fade = 1 - i / length;
    data[i] = (Math.random() * 2 - 1) * fade * fade;
  }

  const source = sound.ctx.createBufferSource();
  const gain = sound.ctx.createGain();
  source.buffer = buffer;
  gain.gain.setValueAtTime(volume, now);

  source.connect(gain);
  gain.connect(soundBus());
  source.start(now);
}

function playFanfare() {
  const notes = [392, 494, 587, 784];
  for (let i = 0; i < notes.length; i++) {
    window.setTimeout(function () {
      playTone(notes[i], 0.3, "triangle", 0.15);
    }, i * 110);
  }
}

function playFailure() {
  const notes = [330, 262, 196, 147];
  for (let i = 0; i < notes.length; i++) {
    window.setTimeout(function () {
      playTone(notes[i], 0.42, "sawtooth", 0.12);
    }, i * 150);
  }
}

/* ---- SHATTER SOUND: BEGIN ---- */

/* A break is a spray of glass, so the sound is built the same way: a
   short noise crack for the impact, a handful of high shards ringing
   off it at random pitches, a rising run underneath, and from the
   bigger tiers a low thump for weight. Everything scales with how many
   gems went, so a five gem link and a twenty five gem sweep are
   recognisably the same sound at different sizes. */

const SHATTER_MIN_SHARDS = 3;
const SHATTER_MAX_SHARDS = 9;

/* A major pentatonic run, so any number of notes off the front of it
   still sounds like it belongs together. */
const SHATTER_RUN = [0, 2, 4, 7, 9, 12, 14, 16, 19];

function shatterShardCount(count) {
  const growth = Math.min(1, count / 26);
  const extra = Math.round((SHATTER_MAX_SHARDS - SHATTER_MIN_SHARDS) * growth);
  return SHATTER_MIN_SHARDS + extra;
}

/* The glassy part: short, high, slightly detuned sines that decay fast
   and land a few milliseconds apart, so they scatter instead of
   arriving as one chord. */
function playShards(count) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const shards = shatterShardCount(count);
  const now = sound.ctx.currentTime;

  for (let i = 0; i < shards; i++) {
    const spread = 1 + Math.random() * 1.6;
    const frequency = 1400 * spread;
    const startAt = now + i * 0.012 + Math.random() * 0.01;
    const length = 0.07 + Math.random() * 0.09;

    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(frequency, startAt);
    osc.frequency.exponentialRampToValueAtTime(frequency * 0.72, startAt + length);

    gain.gain.setValueAtTime(0, startAt);
    gain.gain.linearRampToValueAtTime(0.075, startAt + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + length);

    osc.connect(gain);
    gain.connect(soundBus());
    osc.start(startAt);
    osc.stop(startAt + length + 0.02);
  }
}

/* The crack: filtered noise, brighter and longer the bigger the break. */
function playShatterCrack(count) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const growth = Math.min(1, count / 26);
  const now = sound.ctx.currentTime;
  const length = 0.16 + growth * 0.2;
  const samples = Math.floor(sound.ctx.sampleRate * length);

  const buffer = sound.ctx.createBuffer(1, samples, sound.ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < samples; i++) {
    const fade = 1 - i / samples;
    data[i] = (Math.random() * 2 - 1) * fade * fade;
  }

  const source = sound.ctx.createBufferSource();
  source.buffer = buffer;

  /* Sweeping the filter down turns a flat hiss into something that
     reads as glass falling away. */
  const filter = sound.ctx.createBiquadFilter();
  filter.type = "highpass";
  filter.frequency.setValueAtTime(2600 + growth * 1800, now);
  filter.frequency.exponentialRampToValueAtTime(900, now + length);

  const gain = sound.ctx.createGain();
  gain.gain.setValueAtTime(0.11 + growth * 0.09, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + length);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(soundBus());
  source.start(now);
}

/* The run underneath. More gems means more of the scale, which is what
   makes a big break feel like it is still climbing after a small one
   would have finished. */
function playShatterRun(count) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const growth = Math.min(1, count / 26);
  const notes = 3 + Math.round(growth * 5);
  const step = 0.055 - growth * 0.015;

  for (let i = 0; i < notes; i++) {
    const semitone = SHATTER_RUN[i];
    const frequency = 330 * Math.pow(2, semitone / 12);

    window.setTimeout(function () {
      playTone(frequency, 0.2, "triangle", 0.09);
    }, i * step * 1000);
  }
}

/* Weight under the big ones only. A five gem link does not need it and
   would sound muddy with it. */
function playShatterThump(count) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;
  if (count < 15) return;

  const now = sound.ctx.currentTime;
  const osc = sound.ctx.createOscillator();
  const gain = sound.ctx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(96, now);
  osc.frequency.exponentialRampToValueAtTime(52, now + 0.18);

  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.2, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);

  osc.connect(gain);
  gain.connect(soundBus());
  osc.start(now);
  osc.stop(now + 0.24);
}

/* The bell that lands with the word itself, one octave per tier so the
   five milestones are telling apart with your eyes shut. */
function playMilestoneChime(tierIndex) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const base = 523 * Math.pow(2, tierIndex / 12);
  const now = sound.ctx.currentTime;

  for (let i = 0; i < 2; i++) {
    const detune = i === 0 ? 1 : 1.005;
    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(base * 2 * detune, now);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.07, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);

    osc.connect(gain);
    gain.connect(soundBus());
    osc.start(now);
    osc.stop(now + 0.75);
  }
}

/* One call for the whole break. */
function playShatter(count) {
  playShatterCrack(count);
  playShards(count);
  playShatterRun(count);
  playShatterThump(count);
}

/* ---- SHATTER SOUND: END ---- */


/* ---- LOOP SPECIAL SOUNDS: BEGIN ---- */

/* Drawing a ring around a special is the biggest thing the player can
   do, so each one gets its own voice. They all sit on the same
   pentatonic as the shatter run, so they land in key with whatever
   else is firing at the same moment. */

/* A short noise burst shaped by a filter. The workhorse under the
   heavier effects: swept down it reads as rubble, swept up it reads as
   air being pulled in. */
function playFilteredNoise(seconds, volume, filterType, startHz, endHz) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;
  const samples = Math.floor(sound.ctx.sampleRate * seconds);
  const buffer = sound.ctx.createBuffer(1, samples, sound.ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < samples; i++) {
    const fade = 1 - i / samples;
    data[i] = (Math.random() * 2 - 1) * fade;
  }

  const source = sound.ctx.createBufferSource();
  source.buffer = buffer;

  const filter = sound.ctx.createBiquadFilter();
  filter.type = filterType;
  filter.frequency.setValueAtTime(startHz, now);
  filter.frequency.exponentialRampToValueAtTime(endHz, now + seconds);

  const gain = sound.ctx.createGain();
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + seconds);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(soundBus());
  source.start(now);
}

/* A sine dropping in pitch. Weight under a blast. */
function playSubDrop(fromHz, toHz, seconds, volume) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;
  const osc = sound.ctx.createOscillator();
  const gain = sound.ctx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(fromHz, now);
  osc.frequency.exponentialRampToValueAtTime(toHz, now + seconds);

  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(volume, now + 0.014);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + seconds);

  osc.connect(gain);
  gain.connect(soundBus());
  osc.start(now);
  osc.stop(now + seconds + 0.03);
}

/* Notes off the pentatonic, played in order a fixed gap apart. */
function playRisingRun(baseHz, semitones, gapSeconds, noteSeconds, type, volume) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;

  for (let i = 0; i < semitones.length; i++) {
    const frequency = baseHz * Math.pow(2, semitones[i] / 12);
    const startAt = now + i * gapSeconds;

    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(frequency, startAt);

    gain.gain.setValueAtTime(0, startAt);
    gain.gain.linearRampToValueAtTime(volume, startAt + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + noteSeconds);

    osc.connect(gain);
    gain.connect(soundBus());
    osc.start(startAt);
    osc.stop(startAt + noteSeconds + 0.03);
  }
}

/* The ring has just closed and there is something in the middle of it.
   Three notes climbing tell the player the move is worth more than the
   loop they were expecting. */
function playLoopArmed() {
  playRisingRun(392, [0, 4, 7], 0.07, 0.26, "triangle", 0.12);
}

/* A bomb going off with three cells of reach. Same shape as the plain
   blast, longer and deeper, with the rubble arriving after the crack. */
function playTripleBlast() {
  playFilteredNoise(0.42, 0.3, "lowpass", 5200, 500);
  playSubDrop(150, 38, 0.5, 0.3);
  playRisingRun(147, [0, -5], 0.09, 0.4, "square", 0.1);
}

/* Every stone on the board going at once. All bottom end and grit, no
   melody, because stone is the one thing on this board that is not
   made of glass. */
function playStonesShatter() {
  playFilteredNoise(0.55, 0.26, "bandpass", 1800, 260);
  playSubDrop(110, 44, 0.45, 0.24);

  /* A second crunch a beat later, so it reads as a boardful of them. */
  window.setTimeout(function () {
    playFilteredNoise(0.4, 0.18, "bandpass", 1400, 220);
  }, 90);
}

/* Every blight cured. It starts as the blight's own sour sawtooth and
   resolves onto a clean bell, so the sound itself is the cure. */
/* The gem under the blight hardening: a short dull knock with the pitch
   falling away, which is what a thing setting solid sounds like. */
function playBlightSet() {
  playSubDrop(170, 52, 0.22, 0.11);
  playNoiseHit(0.13);
}

/* The crawl across. A band of noise sliding up gives the scrape of
   something dragging itself, and the wavering low tone under it is the
   creature carrying its own weight. */
function playBlightCrawl() {
  playFilteredNoise(BLIGHT_CRAWL_SECONDS, 0.08, "bandpass", 260, 1150);

  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;
  const osc = sound.ctx.createOscillator();
  const wobble = sound.ctx.createOscillator();
  const wobbleDepth = sound.ctx.createGain();
  const gain = sound.ctx.createGain();

  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(74, now);
  osc.frequency.linearRampToValueAtTime(102, now + BLIGHT_CRAWL_SECONDS);

  /* A slow warble on the pitch, so the note never sits still. */
  wobble.type = "sine";
  wobble.frequency.setValueAtTime(11, now);
  wobbleDepth.gain.setValueAtTime(7, now);
  wobble.connect(wobbleDepth);
  wobbleDepth.connect(osc.frequency);

  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.075, now + 0.06);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + BLIGHT_CRAWL_SECONDS);

  osc.connect(gain);
  gain.connect(soundBus());

  osc.start(now);
  wobble.start(now);
  osc.stop(now + BLIGHT_CRAWL_SECONDS + 0.03);
  wobble.stop(now + BLIGHT_CRAWL_SECONDS + 0.03);
}

/* Landing on the next gem: a wet little slap. */
function playBlightLand() {
  playTone(64, 0.16, "sawtooth", 0.1);
  playFilteredNoise(0.14, 0.06, "lowpass", 900, 220);
}

function playBlightPurge() {
  playRisingRun(98, [0, 1], 0.06, 0.3, "sawtooth", 0.11);
  playFilteredNoise(0.5, 0.12, "highpass", 400, 3400);

  window.setTimeout(function () {
    playRisingRun(523, [0, 7, 12], 0.06, 0.55, "sine", 0.1);
  }, 150);
}

/* The prism nova. Air pulled in, a sub under it, seven notes climbing
   the pentatonic, then a detuned pair left ringing over the top while
   the board empties. This is the loudest thing in the game and it is
   meant to be. */
function playPrismNova() {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  playFilteredNoise(0.75, 0.16, "highpass", 300, 6000);
  playSubDrop(170, 40, 0.7, 0.3);
  playRisingRun(523, [0, 2, 4, 7, 9, 12, 16], 0.062, 0.42, "triangle", 0.11);

  const now = sound.ctx.currentTime;
  const tailStart = now + 0.44;

  for (let i = 0; i < 3; i++) {
    const detune = 1 + i * 0.004;
    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(1046 * detune, tailStart);

    gain.gain.setValueAtTime(0, tailStart);
    gain.gain.linearRampToValueAtTime(0.055, tailStart + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, tailStart + 1.5);

    osc.connect(gain);
    gain.connect(soundBus());
    osc.start(tailStart);
    osc.stop(tailStart + 1.55);
  }
}

/* ---- LOOP SPECIAL SOUNDS: END ---- */


/* ------------------------------------------------------------------
   Music

   The effects above are synthesised on the fly. Music is a real file,
   so it is handled on its own terms: one <audio> element per track,
   played through the element's own volume instead of the Web Audio
   graph. That is deliberate. Opening this game as a file on a phone
   gives the page an opaque origin, where fetch and
   createMediaElementSource both fall over and a plain audio element
   still plays. The effects bus would not want music through its
   limiter anyway, or a big gem break would duck the soundtrack every
   time it went off.

   To add music for a level later:
     1. Put the file in audio/ and add an entry to MUSIC_TRACKS.
     2. Return its id from musicTrackForLevel for the levels it covers.
   Nothing else needs touching. Every level start already asks for the
   right track, and swapping one track for another runs through the
   same one-at-a-time machinery used here.
   ------------------------------------------------------------------ */

const MUSIC_TRACKS = {
  ambient: {
    url: "audio/prism-path-ambient.ogg",

    /* Per track attenuation between 0 and 1, so a loud track added
       later can be pulled back to sit level with a quiet one without
       the player having to move their slider. */
    trim: 1
  }
};

function musicTrackForLevel(level) {
  /* One bed for the whole run today. The level is passed in already so
     that per level music is a matter of branching here and nothing
     else. */
  return "ambient";
}

const music = {
  enabled: true,
  volume: 0.6,

  /* Built once per track and kept. An element is a single stream and
     cannot play itself twice over, which is the first of the two
     things keeping the music from doubling up. */
  elements: {},

  /* What the game wants playing, and what is actually playing. Callers
     set the first and let syncMusic reconcile. Nothing anywhere else
     starts or stops a track directly. */
  wantedTrackId: null,
  playingTrackId: null,

  /* Counts the starts. Pausing an element rejects the play promise it
     had in the air, so a quick off and on leaves an old rejection
     arriving after the new start has already succeeded. The number the
     start took is checked when its rejection lands, and only the
     newest start is allowed to act on one. */
  attempt: 0,

  fileFailed: false
};

function musicElement(trackId) {
  const existing = music.elements[trackId];
  if (existing !== undefined) return existing;

  const track = MUSIC_TRACKS[trackId];
  if (track === undefined) {
    throw new Error("Prism Path: asked for a music track called '" + trackId +
      "' that is not in MUSIC_TRACKS.");
  }

  const element = new Audio();
  element.loop = true;
  element.preload = "auto";
  element.volume = 0;

  /* A missing or unplayable file is a real thing that happens, and a
     silent game with no explanation is the worst way to meet it. The
     reason goes to the console and onto the settings panel. */
  element.addEventListener("error", function () {
    music.fileFailed = true;
    console.error("Prism Path could not load the music file at " + track.url +
      ". The game will run without music.");
    refreshMusicNote();
  });

  element.src = track.url;

  music.elements[trackId] = element;
  return element;
}

/* The only place a track is allowed to start or stop. It compares what
   the game wants against what is sounding and moves one to the other,
   so calling it twice, ten times, or in the middle of its own work
   changes nothing after the first call. Every restart, refresh, resume,
   continue, retry and trip back to the menu comes through here, which
   is why none of them can leave two copies playing. */
function syncMusic() {
  const wanted = music.enabled === true ? music.wantedTrackId : null;

  if (wanted === music.playingTrackId) {
    applyMusicVolume();
    return;
  }

  if (music.playingTrackId !== null) {
    const leaving = musicElement(music.playingTrackId);

    /* Pausing rejects whatever play promise this element still had
       running, so that promise stops speaking for the state here. */
    music.attempt++;
    leaving.pause();

    /* Stopped means stopped. The next start is from the top, so the
       state a track is left in never depends on how it was left. */
    leaving.currentTime = 0;
    music.playingTrackId = null;
  }

  if (wanted === null) return;

  const element = musicElement(wanted);

  /* Claimed up front, before play is even asked for. play settles a
     tick later, and a second syncMusic landing in that gap has to find
     the track already taken. */
  music.playingTrackId = wanted;
  const attempt = ++music.attempt;
  applyMusicVolume();

  const started = element.play();

  /* Browsers old enough to predate the promise returning play give back
     nothing here, so there is no rejection to wait on and the start has
     already either happened or not. */
  if (started === undefined) return;

  started.catch(function (refused) {
    /* Every path that starts music sits behind a button press, so the
       autoplay rules should never bite. If they ever do, the claim
       above is untrue and has to be handed back, or the track could
       never start again.

       Only the newest start may hand it back. An older one rejecting
       just means it was paused on the way, and the track sounding now
       is not the one it was trying to begin. */
    if (music.attempt !== attempt) return;
    if (music.playingTrackId !== wanted) return;

    music.playingTrackId = null;
    console.error("Prism Path could not start the music.", refused);
  });
}

function applyMusicVolume() {
  if (music.playingTrackId === null) return;

  const track = MUSIC_TRACKS[music.playingTrackId];
  const element = musicElement(music.playingTrackId);
  element.volume = music.volume * track.trim;
}

/* Called wherever a level begins: a new run, the next level, a retry
   on a continue, and a saved run picked back up. */
function setMusicForLevel(level) {
  music.wantedTrackId = musicTrackForLevel(level);
  syncMusic();
}

/* The run has ended or the player has gone back to the title. Music
   never plays over a game that has not been started. */
function stopMusic() {
  music.wantedTrackId = null;
  syncMusic();
}


/* ------------------------------------------------------------------
   Board helpers
   ------------------------------------------------------------------ */

function insideBoard(row, col) {
  return row >= 0 && row < ROWS && col >= 0 && col < COLS;
}

function cellAt(row, col) {
  return game.board[row][col];
}

function randomColour() {
  const range = coloursForLevel(game.level);
  return Math.floor(Math.random() * range);
}

function buildBoard() {
  game.board = [];
  for (let row = 0; row < ROWS; row++) {
    const line = [];
    for (let col = 0; col < COLS; col++) {
      const gem = makeGem(randomColour());
      gem.scale = 1;
      line.push(gem);
    }
    game.board.push(line);
  }
}

/* Scatter stones for the levels that ask for them. Stones never sit on
   the top row so they cannot wall off fresh spawns. */
function scatterStones(count, toughness) {
  const placeable = (ROWS - 1) * COLS;
  if (count > placeable) {
    throw new Error("asked for " + count + " stones but only " + placeable + " cells can hold one");
  }

  let placed = 0;
  let attempts = 0;

  while (placed < count && attempts < 4000) {
    attempts++;
    const row = 1 + Math.floor(Math.random() * (ROWS - 1));
    const col = Math.floor(Math.random() * COLS);

    if (cellAt(row, col).kind === "gem") {
      const stone = makeStone(toughness);
      stone.scale = 1;
      game.board[row][col] = stone;
      placed++;
    }
  }

  /* Placing fewer than asked would hand the player a level whose goal
     cannot be reached, so it fails here where the cause is obvious. */
  if (placed < count) {
    throw new Error("only placed " + placed + " of " + count + " stones");
  }
}

/* ------------------------------------------------------------------
   Level goals
   ------------------------------------------------------------------ */

function makeGoalForLevel(level) {
  const kindIndex = (level - 1) % 3;

  if (kindIndex === 0) {
    const colour = Math.floor(Math.random() * coloursForLevel(level));
    const target = 14 + level;
    return {
      kind: "colour",
      colour: colour,
      target: target,
      progress: 0,
      label: "Burst " + target
    };
  }

  if (kindIndex === 1) {
    const target = 600 + level * 550;
    return {
      kind: "score",
      colour: -1,
      target: target,
      progress: 0,
      label: "Score " + target + " points"
    };
  }

  const target = stoneCountForLevel(level);
  return {
    kind: "stone",
    colour: -1,
    target: target,
    progress: 0,
    label: "Shatter " + target
  };
}

/* Stones are capped at roughly a third of the board. Past that point
   the level gets harder by making each stone tougher, which costs
   moves without eating the space you need to play in. */
function stoneCountForLevel(level) {
  const wanted = 3 + Math.floor(level / 2);
  const cap = Math.floor(ROWS * COLS * 0.3);
  return Math.min(wanted, cap);
}

/* A stone level costs about 1.85 moves per hit point and does not care
   how many stones there are, because a denser board damages more of
   them per burst. Toughness rising once every twelve levels therefore
   costs 0.154 moves per level, well under the budget's 0.333. It has
   no cap, which is what keeps stone levels meaningful at any depth. */
function stoneToughnessForLevel(level) {
  return 2 + Math.floor(level / 12);
}

/* The budget stops shrinking at level 10 and then creeps back up by
   one move every three levels, which is 0.333 moves per level.

   Measured cost of each goal type per level:
     colour  0.258   (3.88 goal gems cleared per move)
     score   0.230
     stone   0.154   (1.85 moves per hit point, +1 hp every 12 levels)

   All three are below the budget's growth, so the gap widens forever
   and no level can outrun the moves you are given to clear it. */
function movesForLevel(level) {
  if (level <= 2) return 22;
  if (level <= 5) return 20;
  if (level <= 9) return 18;
  return 16 + Math.floor((level - 10) / 3);
}

/* Blight starts appearing on level three and quickens as you climb. */
function blightIntervalForLevel(level) {
  if (level < 3) return 0;
  if (level < 6) return 4;
  if (level < 10) return 3;
  return 2;
}

/* ------------------------------------------------------------------
   Starting and advancing a run
   ------------------------------------------------------------------ */

function startRun() {
  game.score = 0;
  game.level = 1;
  game.charge = 0;
  game.aiming = "none";
  game.continues = CONTINUES_AT_START;
  game.blightCarry = 0;
  startLevel();
}

/* Lay out a fresh level. Called for a new level, for a retry after a
   continue, and after loading a save. */
function startLevel() {
  game.moves = movesForLevel(game.level);
  game.goal = makeGoalForLevel(game.level);
  game.movesSinceBlight = 0;
  game.path = [];
  game.pathColour = -1;
  game.loopClosed = false;
  game.aiming = "none";
  game.scoreAtLevelStart = game.score;
  particles.length = 0;
  floaters.length = 0;
  shockwaves.length = 0;
  blightCrawls.length = 0;
  screenFlash = null;
  milestoneWord = null;

  buildBoard();

  const toughness = stoneToughnessForLevel(game.level);
  if (game.goal.kind === "stone") {
    scatterStones(game.goal.target, toughness);
  } else if (game.level >= 4) {
    scatterStones(2, toughness);
  }

  seedBlight();
  ensureSolvableBoard();
  clearHint();

  game.phase = "idle";
  setMusicForLevel(game.level);
  refreshHud();
  saveGame();
}

/* The blight you failed to clear last level follows you into this one.
   New levels also get their own seeds, and whichever is larger wins so
   the two do not compound into an unplayable opening. */
function seedBlight() {
  const ownSeeds = game.level >= 4 ? Math.min(3, 1 + Math.floor(game.level / 5)) : 0;
  const cap = blightCarryCap();
  const carried = Math.min(game.blightCarry, cap);
  const total = Math.min(Math.max(ownSeeds, carried), cap);

  for (let i = 0; i < total; i++) {
    infectRandomCell();
  }
}

/* ------------------------------------------------------------------
   The Blight
   ------------------------------------------------------------------ */

function countBlight() {
  let total = 0;
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      if (cellAt(row, col).blighted === true) total++;
    }
  }
  return total;
}

function infectRandomCell() {
  const candidates = [];
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cell = cellAt(row, col);
      if (cell.kind === "gem" && cell.blighted === false) {
        candidates.push({ row: row, col: col });
      }
    }
  }
  if (candidates.length === 0) return;

  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  cellAt(pick.row, pick.col).blighted = true;
  cellAt(pick.row, pick.col).blightAge = 0;
  cellAt(pick.row, pick.col).blightShow = 1;
  spawnBlightPuff(pick.row, pick.col);
}

/* Existing blight reaches into a neighbouring gem. */
function spreadBlight() {
  const sources = [];
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      if (cellAt(row, col).blighted === true) {
        sources.push({ row: row, col: col });
      }
    }
  }
  if (sources.length === 0) {
    infectRandomCell();
    return;
  }

  const from = sources[Math.floor(Math.random() * sources.length)];
  const targets = [];
  const steps = [[-1, 0], [1, 0], [0, -1], [0, 1]];

  for (let i = 0; i < steps.length; i++) {
    const row = from.row + steps[i][0];
    const col = from.col + steps[i][1];
    if (insideBoard(row, col)) {
      const cell = cellAt(row, col);
      if (cell.kind === "gem" && cell.blighted === false) {
        targets.push({ row: row, col: col });
      }
    }
  }

  if (targets.length === 0) {
    infectRandomCell();
    return;
  }

  const pick = targets[Math.floor(Math.random() * targets.length)];
  cellAt(pick.row, pick.col).blighted = true;
  cellAt(pick.row, pick.col).blightAge = 0;
  cellAt(pick.row, pick.col).blightShow = 1;
  spawnBlightPuff(pick.row, pick.col);
  playTone(90, 0.3, "sawtooth", 0.09);
}

function advanceBlight() {
  const interval = blightIntervalForLevel(game.level);
  if (interval === 0) return;

  game.movesSinceBlight++;
  if (game.movesSinceBlight < interval) return;

  game.movesSinceBlight = 0;
  spreadBlight();
}

/* Where a blight can walk to: a clean gem straight up, down, left or
   right of it. Diagonals are left out, the same way spreadBlight leaves
   them out, so a blight can be walled off by blocking four sides.

   Cells already bursting are no good at either end of the walk. They
   are on their way off the board, and building a stone on top of one
   would cancel a clear that is already under way. */
function blightWalkTargets(spot) {
  const steps = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  const targets = [];

  for (let i = 0; i < steps.length; i++) {
    const row = spot.row + steps[i][0];
    const col = spot.col + steps[i][1];
    if (insideBoard(row, col) === false) continue;

    const cell = cellAt(row, col);
    if (cell.kind !== "gem") continue;
    if (cell.blighted === true) continue;
    if (cell.doomed === true) continue;

    targets.push({ row: row, col: col });
  }

  return targets;
}

/* Walled in on all four sides, the blight stays where it is and waits
   for its next turn to come round.

   The board is changed here and now, so nothing downstream has to deal
   with a blight that is halfway between two cells. What the player sees
   is a crawl laid over the top: the gem it left sets as stone, the
   blight travels across, and the gem it is heading for keeps its blight
   hidden until the crawl lands on it. */
function moveBlightFrom(spot) {
  const targets = blightWalkTargets(spot);
  if (targets.length === 0) return;

  const pick = targets[Math.floor(Math.random() * targets.length)];
  const next = cellAt(pick.row, pick.col);
  next.blighted = true;
  next.blightAge = 0;
  next.blightShow = -(BLIGHT_SET_SECONDS + BLIGHT_CRAWL_SECONDS);

  const stone = makeStone(BLIGHT_STONE_HP);
  game.board[spot.row][spot.col] = stone;

  spawnBlightCrawl(stone, next);
  spawnStoneSetRing(spot.row, spot.col);
  playBlightSet();
}

/* One blight on its way from the gem it turned to stone to the gem it
   picked. Both ends are held as cell objects because gravity can drop
   them into different rows while the crawl is still playing, and the
   blob has to land where the blight actually ended up. */
function spawnBlightCrawl(fromCell, toCell) {
  blightCrawls.push({
    fromCell: fromCell,
    toCell: toCell,
    age: 0,
    trailTimer: 0,
    crawlSoundPlayed: false,
    landed: false
  });
}

/* Where a cell object is sitting on the board right now. */
function findCellSpot(target) {
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      if (game.board[row][col] === target) return { row: row, col: col };
    }
  }
  return null;
}

/* The point the blob is at, and how far along it is. A lift on the way
   over turns the slide into a lunge. */
function blightCrawlPoint(crawl) {
  const from = findCellSpot(crawl.fromCell);
  const to = findCellSpot(crawl.toCell);
  if (from === null || to === null) return null;

  const start = cellCentre(from.row, from.col);
  const end = cellCentre(to.row, to.col);

  const travelled = crawl.age - BLIGHT_SET_SECONDS;
  if (travelled <= 0) {
