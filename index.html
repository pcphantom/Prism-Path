function spawnFloater(row, col, text, colour) {
  const centre = cellCentre(row, col);
  floaters.push({
    x: centre.x,
    y: centre.y,
    text: text,
    colour: colour,
    life: 0.95,
    maxLife: 0.95
  });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    if (p.delay > 0) {
      p.delay -= dt;
      continue;
    }

    p.life -= dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    p.vy += p.gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }

  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt;
    if (f.life <= 0) {
      floaters.splice(i, 1);
      continue;
    }
    f.y -= 52 * dt;
  }
}

/* ------------------------------------------------------------------
   Shockwaves and screen flash

   The loop effects hit the whole board at once, and a board wide spray
   of particles reads as mush. A ring travelling out from the middle of
   the loop is what makes the size of it legible: you can see where it
   started and watch it arrive.
   ------------------------------------------------------------------ */

const shockwaves = [];
let screenFlash = null;

function spawnShockwave(x, y, colour, maxRadius, life, width, delay) {
  shockwaves.push({
    x: x,
    y: y,
    colour: colour,
    maxRadius: maxRadius,
    life: life,
    maxLife: life,
    width: width,
    delay: delay
  });
}

function startScreenFlash(colour, seconds) {
  screenFlash = {
    colour: colour,
    life: seconds,
    maxLife: seconds
  };
}

function updateShockwaves(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const wave = shockwaves[i];

    if (wave.delay > 0) {
      wave.delay -= dt;
      continue;
    }

    wave.life -= dt;
    if (wave.life <= 0) {
      shockwaves.splice(i, 1);
    }
  }

  if (screenFlash !== null) {
    screenFlash.life -= dt;
    if (screenFlash.life <= 0) {
      screenFlash = null;
    }
  }
}

function drawShockwaves() {
  if (shockwaves.length === 0) return;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  for (let i = 0; i < shockwaves.length; i++) {
    const wave = shockwaves[i];
    if (wave.delay > 0) continue;

    /* Out fast, then easing off, which is how a real front behaves and
       also keeps the ring on screen long enough to be seen. */
    const age = 1 - wave.life / wave.maxLife;
    const eased = 1 - Math.pow(1 - age, 3);
    const radius = wave.maxRadius * eased;

    ctx.globalAlpha = (1 - age) * 0.85;
    ctx.strokeStyle = wave.colour;
    ctx.lineWidth = wave.width * (1 - age * 0.65);
    ctx.beginPath();
    ctx.arc(wave.x, wave.y, radius, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawScreenFlash() {
  if (screenFlash === null) return;

  const left = screenFlash.life / screenFlash.maxLife;

  ctx.save();
  ctx.globalAlpha = left * left * 0.9;
  ctx.fillStyle = screenFlash.colour;
  ctx.fillRect(0, 0, layout.width, layout.height);
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------------
   Toast messages
   ------------------------------------------------------------------ */

let toastTimer = 0;

/* Celebration messages that fire during a burst. A milestone word owns
   the middle of the screen while it is loud, and two messages at once
   read as neither, so these wait their turn and the word speaks for
   the break. Instructions and warnings still go through showToast
   directly, because those the player has to see. */
function showBurstToast(text, colour) {
  if (milestoneWord !== null && milestoneWord.age < WORD_HOLD_UNTIL) return;
  showToast(text, colour);
}

function showToast(text, colour) {
  toast.textContent = text;
  toast.style.color = colour;
  toastTimer = 1.1;
}

function updateToast(dt) {
  if (toastTimer <= 0) {
    toast.style.opacity = "0";
    return;
  }
  toastTimer -= dt;

  const t = Math.max(0, toastTimer / 1.1);
  const rise = (1 - t) * 26;
  toast.style.opacity = String(Math.min(1, t * 2.2));
  toast.style.transform = "translate(-50%, " + (-rise) + "px) scale(" + (0.9 + t * 0.25) + ")";
}

/* ---- MILESTONE WORDS: BEGIN ---- */

/* Bubble letters, built the way the approved mockup builds them: one
   heavy face drawn five times over, each pass a little narrower than
   the one under it.

     1. a dark copy dropped below   = shadow
     2. a fat dark stroke + fill    = the outer outline
     3. a thinner white stroke+fill = the bubble rim
     4. a gradient fill             = the body
     5. a white-to-clear fill       = the gloss

   Canvas paints a stroke over its own fill, so each pass strokes first
   and fills second. That ordering is the whole trick. */

const WORD_FONT_STACK = '"Arial Black", "Arial Bold", "Segoe UI Black", Gadget, sans-serif';
const WORD_INK = "#150e28";

/* Taken straight off the mockup, where a 112px face carried a 36px
   outline and a 17px rim. */
const WORD_OUTLINE_RATIO = 0.32;
const WORD_RIM_RATIO = 0.152;
const WORD_SHADOW_RATIO = 0.11;

/* The five milestones. widthFraction is how much of the board the word
   spans, and it climbs with the tier because size sells the escalation
   as much as colour does. It stops short of 1 because the sprite also
   has to fit its outline and its drop shadow inside the board. */
const MILESTONES = [
  {
    threshold: 5,
    text: "GOOD",
    widthFraction: 0.5,
    tilt: -2,
    body: ["#ffffff", "#a9dcff", "#2f9bef"],
    glow: "#3fb0ff",
    rayColour: "#6cc6ff",
    rays: 0,
    sparkles: 3
  },
  {
    threshold: 10,
    text: "GREAT",
    widthFraction: 0.61,
    tilt: -3,
    body: ["#f2fff2", "#6bf0a6", "#0f9d59"],
    glow: "#45e08a",
    rayColour: "#8dffc4",
    rays: 10,
    sparkles: 5
  },
  {
    threshold: 15,
    text: "AMAZING",
    widthFraction: 0.76,
    tilt: -4,
    body: ["#fffbe0", "#ffcf5c", "#f4770a"],
    glow: "#ffab35",
    rayColour: "#ffd06a",
    rays: 14,
    sparkles: 7
  },
  {
    threshold: 20,
    text: "UNBELIEVABLE",
    widthFraction: 0.88,
    tilt: -4,
    body: ["#fbf0ff", "#c79bff", "#7b2bff"],
    glow: "#b07cff",
    rayColour: "#d9b6ff",
    rays: 18,
    sparkles: 9
  },
  {
    threshold: 25,
    text: "OMG WOW!",
    widthFraction: 0.86,
    tilt: -5,
    body: ["#fff3a0", "#ffc22e", "#ff6f4d", "#ff3f9c", "#8a5bff"],
    glow: "#ff5fb0",
    rayColour: "#ffd23f",
    rays: 22,
    sparkles: 12
  }
];

/* Timings, in seconds. The whole thing is over in just over two. */
const WORD_PUNCH_IN = 0.13;
const WORD_SETTLE = 0.24;
const WORD_OVERSHOOT = 0.35;
const WORD_AT_REST = 0.46;
const WORD_GLINT_START = 0.28;
const WORD_GLINT_END = 0.66;

/* The whole thing is done inside a second. Settled at 0.46, a quarter
   second sitting still, then off in another quarter. The punch itself
   is untouched: it was only ever the tail that dragged. */
const WORD_HOLD_UNTIL = 0.72;
const WORD_GONE_AT = 1.00;

/* One live word at a time. A bigger break replaces a smaller one that
   is still on screen, because the player earned the louder message. */
let milestoneWord = null;

/* Sprites are expensive to build and cheap to blit, so each word is
   drawn once and kept until the board changes size. */
const milestoneSprites = new Map();
let milestoneSpriteWidth = 0;

function milestoneForCount(count) {
  let found = null;
  for (let i = 0; i < MILESTONES.length; i++) {
    if (count >= MILESTONES[i].threshold) {
      found = MILESTONES[i];
    }
  }
  return found;
}

/* Pick the point size that makes this word land on the target width.
   Text width is linear in point size, so one measurement is enough.
   Scaling the drawing instead would squash the outline along with the
   letters and leave the edges uneven. */
function fontSizeForWidth(measurePaint, text, targetWidth) {
  const reference = 100;

  measurePaint.font = "900 " + reference + "px " + WORD_FONT_STACK;
  const naturalWidth = measurePaint.measureText(text).width;

  return (reference * targetWidth) / naturalWidth;
}

function applyWordFont(paint, fontSize) {
  paint.font = "900 " + fontSize + "px " + WORD_FONT_STACK;
  paint.textAlign = "center";
  paint.textBaseline = "middle";
  paint.lineJoin = "round";
  paint.lineCap = "round";
}

/* Stroke then fill, so the stroke sits behind the letter and reads as
   an outline rather than a border painted on top of it. */
function strokeAndFill(paint, text, colour, lineWidth, x, y) {
  paint.strokeStyle = colour;
  paint.fillStyle = colour;
  paint.lineWidth = lineWidth;
  paint.strokeText(text, x, y);
  paint.fillText(text, x, y);
}

function buildWordSprite(milestone, boardWidth, pixelRatio) {
  const targetWidth = boardWidth * milestone.widthFraction * pixelRatio;

  const gauge = document.createElement("canvas").getContext("2d");
  const fontSize = fontSizeForWidth(gauge, milestone.text, targetWidth);

  const outlineWidth = fontSize * WORD_OUTLINE_RATIO;
  const rimWidth = fontSize * WORD_RIM_RATIO;
  const shadowDrop = fontSize * WORD_SHADOW_RATIO;

  applyWordFont(gauge, fontSize);
  const metrics = gauge.measureText(milestone.text);
  const above = metrics.actualBoundingBoxAscent;
  const below = metrics.actualBoundingBoxDescent;

  const margin = Math.ceil(outlineWidth / 2 + shadowDrop + fontSize * 0.06);
  const spriteWidth = Math.ceil(targetWidth) + margin * 2;
  const spriteHeight = Math.ceil(above + below) + margin * 2;

  const centreX = spriteWidth / 2;
  const baseline = margin + above - (above - below) / 2;

  const capTop = baseline - above;
  const capBottom = baseline + below;

  const sprite = document.createElement("canvas");
  sprite.width = spriteWidth;
  sprite.height = spriteHeight;

  const paint = sprite.getContext("2d");
  applyWordFont(paint, fontSize);

  /* 1. Shadow: the outline shape again, dropped and dimmed. */
  paint.globalAlpha = 0.45;
  strokeAndFill(paint, milestone.text, "#000000", outlineWidth, centreX, baseline + shadowDrop);
  paint.globalAlpha = 1;

  /* 2. Outline, 3. rim. */
  strokeAndFill(paint, milestone.text, WORD_INK, outlineWidth, centreX, baseline);
  strokeAndFill(paint, milestone.text, "#ffffff", rimWidth, centreX, baseline);

  /* 4. Body. */
  const bodyGradient = paint.createLinearGradient(0, capTop, 0, capBottom);
  for (let i = 0; i < milestone.body.length; i++) {
    bodyGradient.addColorStop(i / (milestone.body.length - 1), milestone.body[i]);
  }
  paint.fillStyle = bodyGradient;
  paint.fillText(milestone.text, centreX, baseline);

  /* 5. Gloss, gone by mid height. */
  const gloss = paint.createLinearGradient(0, capTop, 0, capBottom);
  gloss.addColorStop(0, "rgba(255, 255, 255, 0.66)");
  gloss.addColorStop(0.34, "rgba(255, 255, 255, 0.4)");
  gloss.addColorStop(0.55, "rgba(255, 255, 255, 0)");
  paint.fillStyle = gloss;
  paint.fillText(milestone.text, centreX, baseline);

  /* A plain white copy of the letters, used as the mask the glint
     sweeps inside so the shine never spills onto the background. */
  const mask = document.createElement("canvas");
  mask.width = spriteWidth;
  mask.height = spriteHeight;

  const cut = mask.getContext("2d");
  applyWordFont(cut, fontSize);
  cut.fillStyle = "#ffffff";
  cut.fillText(milestone.text, centreX, baseline);

  return {
    image: sprite,
    mask: mask,
    width: spriteWidth,
    height: spriteHeight
  };
}

/* Rays are drawn once into their own blurred sprite. Blurring per frame
   is far too slow on a phone, and the shape never changes: only its
   size and its opacity do. */
function buildRaySprite(milestone, spread, pixelRatio) {
  const reach = spread * 0.46;
  const inner = spread * 0.13;
  const blur = spread * 0.022;
  const halfWidth = ((Math.PI * 2) / milestone.rays) * 0.22;

  const radius = Math.ceil((reach + blur * 3) * pixelRatio);
  const size = radius * 2;

  const sprite = document.createElement("canvas");
  sprite.width = size;
  sprite.height = size;

  const paint = sprite.getContext("2d");
  paint.translate(radius, radius);
  paint.scale(pixelRatio, pixelRatio);
  paint.filter = "blur(" + (blur * pixelRatio).toFixed(1) + "px)";
  paint.fillStyle = milestone.rayColour;

  for (let i = 0; i < milestone.rays; i++) {
    const angle = (Math.PI * 2 * i) / milestone.rays;

    paint.beginPath();
    paint.moveTo(Math.cos(angle) * reach, Math.sin(angle) * reach);
    paint.lineTo(Math.cos(angle - halfWidth) * inner, Math.sin(angle - halfWidth) * inner);
    paint.lineTo(Math.cos(angle + halfWidth) * inner, Math.sin(angle + halfWidth) * inner);
    paint.closePath();
    paint.fill();
  }

  return { image: sprite, radius: radius / pixelRatio };
}

function milestoneSpriteFor(milestone, boardWidth, pixelRatio) {
  if (milestoneSpriteWidth !== boardWidth) {
    milestoneSprites.clear();
    milestoneSpriteWidth = boardWidth;
  }

  if (milestoneSprites.has(milestone.text) === false) {
    const spread = boardWidth * milestone.widthFraction;
    milestoneSprites.set(milestone.text, {
      word: buildWordSprite(milestone, boardWidth, pixelRatio),
      rays: milestone.rays === 0 ? null : buildRaySprite(milestone, spread, pixelRatio)
    });
  }

  return milestoneSprites.get(milestone.text);
}

/* Fire a word for a break of this size. Anything under the smallest
   threshold is silent, which keeps ordinary three and four gem links
   free of chatter. */
function showMilestoneWord(count) {
  const milestone = milestoneForCount(count);
  if (milestone === null) return null;

  /* A louder word always wins. A quieter one waits until the louder
     one has had its moment rather than cutting it off. */
  if (milestoneWord !== null) {
    const live = milestoneWord.milestone.threshold;
    if (live > milestone.threshold && milestoneWord.age < WORD_HOLD_UNTIL) {
      return null;
    }
  }

  const sparkles = [];
  for (let i = 0; i < milestone.sparkles; i++) {
    const angle = (Math.PI * 2 * i) / milestone.sparkles + Math.random() * 0.4;
    sparkles.push({
      angle: angle,
      distance: 0.82 + Math.random() * 0.34,
      size: 0.55 + Math.random() * 0.5,
      spin: Math.random() * Math.PI
    });
  }

  milestoneWord = { milestone: milestone, age: 0, sparkles: sparkles };
  return milestone;
}

function updateMilestoneWord(dt) {
  if (milestoneWord === null) return;

  milestoneWord.age += dt;
  if (milestoneWord.age >= WORD_GONE_AT) {
    milestoneWord = null;
  }
}

function easeOutBack(t) {
  const overshoot = 1.9;
  const shifted = t - 1;
  return 1 + (overshoot + 1) * shifted * shifted * shifted + overshoot * shifted * shifted;
}

/* Read the pop curve at a given age: how big, how tilted, how faded,
   and how far it has drifted on the way out. */
function milestonePose(age) {
  let scale = 1;
  let spin = 0;

  if (age < WORD_PUNCH_IN) {
    const t = age / WORD_PUNCH_IN;
    scale = 0.22 + (1.22 - 0.22) * easeOutBack(t);
    spin = -16 + 19 * t;
  } else if (age < WORD_SETTLE) {
    const t = (age - WORD_PUNCH_IN) / (WORD_SETTLE - WORD_PUNCH_IN);
    scale = 1.22 + (0.93 - 1.22) * t;
    spin = 3 + (-2 - 3) * t;
  } else if (age < WORD_OVERSHOOT) {
    const t = (age - WORD_SETTLE) / (WORD_OVERSHOOT - WORD_SETTLE);
    scale = 0.93 + (1.04 - 0.93) * t;
    spin = -2 + 3 * t;
  } else if (age < WORD_AT_REST) {
    const t = (age - WORD_OVERSHOOT) / (WORD_AT_REST - WORD_OVERSHOOT);
    scale = 1.04 - 0.04 * t;
    spin = 1 - t;
  }

  let fade = 1;
  let drift = 0;

  if (age > WORD_HOLD_UNTIL) {
    const t = (age - WORD_HOLD_UNTIL) / (WORD_GONE_AT - WORD_HOLD_UNTIL);
    fade = 1 - t;
    drift = -t * 54;
    scale = 1 + t * 0.14;
  }

  let appear = 1;
  if (age < 0.05) {
    appear = age / 0.05;
  }

  return { scale: scale, spin: spin, fade: fade * appear, drift: drift };
}

function drawMilestoneRays(paint, rays, age) {
  if (rays === null) return;

  let opacity = 0;
  let growth = 0.45;

  if (age < WORD_PUNCH_IN) {
    const t = age / WORD_PUNCH_IN;
    opacity = t;
    growth = 0.45 + 0.6 * t;
  } else if (age < WORD_HOLD_UNTIL) {
    const t = (age - WORD_PUNCH_IN) / (WORD_HOLD_UNTIL - WORD_PUNCH_IN);
    opacity = 1 - t * 0.5;
    growth = 1.05 + 0.4 * t;
  } else {
    const t = (age - WORD_HOLD_UNTIL) / (WORD_GONE_AT - WORD_HOLD_UNTIL);
    opacity = 0.5 * (1 - t);
    growth = 1.45 + 0.1 * t;
  }

  if (opacity <= 0) return;

  const drawnRadius = rays.radius * growth;

  paint.save();
  paint.globalAlpha = opacity * 0.85;
  paint.scale(1.75, 1);
  paint.drawImage(rays.image, -drawnRadius, -drawnRadius, drawnRadius * 2, drawnRadius * 2);
  paint.restore();
}

function traceSparkle(paint, radius) {
  const waist = radius * 0.16;

  paint.beginPath();
  paint.moveTo(0, -radius);
  paint.quadraticCurveTo(waist, -waist, radius, 0);
  paint.quadraticCurveTo(waist, waist, 0, radius);
  paint.quadraticCurveTo(-waist, waist, -radius, 0);
  paint.quadraticCurveTo(-waist, -waist, 0, -radius);
  paint.closePath();
}

function drawMilestoneSparkles(paint, word, age, spread) {
  if (age < WORD_SETTLE) return;

  let opacity = 1;
  let pop = 1;

  if (age < WORD_AT_REST) {
    const t = (age - WORD_SETTLE) / (WORD_AT_REST - WORD_SETTLE);
    pop = 1.35 - 0.35 * t;
  }
  if (age > WORD_HOLD_UNTIL) {
    const t = (age - WORD_HOLD_UNTIL) / (WORD_GONE_AT - WORD_HOLD_UNTIL);
    opacity = 1 - t;
    pop = 1 - t * 0.4;
  }

  paint.save();
  paint.globalAlpha = opacity;
  paint.fillStyle = "#ffffff";

  for (let i = 0; i < word.sparkles.length; i++) {
    const spark = word.sparkles[i];
    const x = Math.cos(spark.angle) * spread * 0.66 * spark.distance;
    const y = Math.sin(spark.angle) * spread * 0.24 * spark.distance;

    paint.save();
    paint.translate(x, y);
    paint.rotate(spark.spin);
    traceSparkle(paint, spread * 0.035 * spark.size * pop);
    paint.fill();
    paint.restore();
  }

  paint.restore();
}

/* The glint: a soft white bar sweeping across, kept inside the letters
   by painting it through the letter mask. */
function drawMilestoneGlint(paint, sprite, age) {
  if (age < WORD_GLINT_START || age > WORD_GLINT_END) return;

  const travel = (age - WORD_GLINT_START) / (WORD_GLINT_END - WORD_GLINT_START);
  const bandWidth = sprite.width * 0.2;
  const centreX = sprite.width * (-0.1 + travel * 1.2);

  const glint = document.createElement("canvas");
  glint.width = sprite.width;
  glint.height = sprite.height;

  const shine = glint.getContext("2d");
  shine.drawImage(sprite.mask, 0, 0);
  shine.globalCompositeOperation = "source-in";

  const sweep = shine.createLinearGradient(centreX - bandWidth, 0, centreX + bandWidth, 0);
  sweep.addColorStop(0, "rgba(255, 255, 255, 0)");
  sweep.addColorStop(0.5, "rgba(255, 255, 255, 0.7)");
  sweep.addColorStop(1, "rgba(255, 255, 255, 0)");

  shine.fillStyle = sweep;
  shine.fillRect(0, 0, sprite.width, sprite.height);

  paint.drawImage(glint, -sprite.width / 2, -sprite.height / 2);
}

/* Draw the live word centred on the board. */
function drawMilestoneWord(paint, boardWidth, boardHeight, pixelRatio) {
  if (milestoneWord === null) return;

  const milestone = milestoneWord.milestone;
  const cached = milestoneSpriteFor(milestone, boardWidth, pixelRatio);
  const sprite = cached.word;
  const pose = milestonePose(milestoneWord.age);
  const spread = boardWidth * milestone.widthFraction;

  paint.save();
  paint.translate(boardWidth / 2, boardHeight * 0.42 + pose.drift);
  paint.globalAlpha = pose.fade;

  drawMilestoneRays(paint, cached.rays, milestoneWord.age);

  paint.save();
  paint.rotate(((milestone.tilt + pose.spin) * Math.PI) / 180);
  paint.scale(pose.scale / pixelRatio, pose.scale / pixelRatio);

  paint.drawImage(sprite.image, -sprite.width / 2, -sprite.height / 2);
  drawMilestoneGlint(paint, sprite, milestoneWord.age);

  paint.restore();

  drawMilestoneSparkles(paint, milestoneWord, milestoneWord.age, spread);
  paint.restore();
}

/* ---- MILESTONE WORDS: END ---- */


/* ------------------------------------------------------------------
   Drawing
   ------------------------------------------------------------------ */

function chooseRowCount(rect) {
  const cellByWidth = Math.floor(rect.width / COLS);
  const rowsThatFit = Math.floor(rect.height / cellByWidth);

  ROWS = Math.max(8, Math.min(12, rowsThatFit));
}

function resizeCanvas() {
  const rect = stage.getBoundingClientRect();
  const dpr = window.devicePixelRatio;

  const cellByWidth = Math.floor(rect.width / COLS);
  const cellByHeight = Math.floor(rect.height / ROWS);
  const cell = Math.max(24, Math.min(cellByWidth, cellByHeight));

  layout.cell = cell;
  layout.width = cell * COLS;
  layout.height = cell * ROWS;
  layout.originX = 0;
  layout.originY = 0;
  layout.pixelRatio = dpr;

  /* Word sprites are built for one board width. A resize invalidates
     every one of them. */
  milestoneSprites.clear();
  milestoneSpriteWidth = 0;

  canvas.style.width = layout.width + "px";
  canvas.style.height = layout.height + "px";
  canvas.width = Math.round(layout.width * dpr);
  canvas.height = Math.round(layout.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function tracePolygon(cx, cy, radius, sides, rotation) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const angle = rotation + (Math.PI * 2 * i) / sides;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  }
  ctx.closePath();
}

function traceGemShape(shape, cx, cy, radius, spin) {
  if (shape === "circle") {
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    return;
  }
  if (shape === "diamond") {
    tracePolygon(cx, cy, radius * 1.12, 4, spin - Math.PI / 2);
    return;
  }
  if (shape === "square") {
    tracePolygon(cx, cy, radius * 1.06, 4, spin + Math.PI / 4);
    return;
  }
  if (shape === "triangle") {
    tracePolygon(cx, cy, radius * 1.15, 3, spin - Math.PI / 2);
    return;
  }
  tracePolygon(cx, cy, radius * 1.05, 6, spin);
}

function drawBackdrop() {
  const hueShift = (game.level - 1) * 26;
  const gradient = ctx.createLinearGradient(0, 0, 0, layout.height);
  gradient.addColorStop(0, "hsl(" + ((262 + hueShift) % 360) + ", 44%, 12%)");
  gradient.addColorStop(1, "hsl(" + ((228 + hueShift) % 360) + ", 50%, 7%)");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, layout.width, layout.height);

  ctx.strokeStyle = "rgba(255, 255, 255, 0.045)";
  ctx.lineWidth = 1;
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const x = layout.originX + col * layout.cell;
      const y = layout.originY + row * layout.cell;
      roundedRect(x + 2, y + 2, layout.cell - 4, layout.cell - 4, layout.cell * 0.18);
      ctx.stroke();
    }
  }
}

function drawStone(cell, cx, cy, radius) {
  const size = radius * 1.7;
  ctx.save();
  ctx.translate(cx, cy);

  const gradient = ctx.createLinearGradient(-size / 2, -size / 2, size / 2, size / 2);
  gradient.addColorStop(0, "#7d7597");
  gradient.addColorStop(1, "#433d5c");

  roundedRect(-size / 2, -size / 2, size, size, size * 0.22);
  ctx.fillStyle = gradient;
  ctx.fill();
  ctx.strokeStyle = "rgba(255, 255, 255, 0.18)";
  ctx.lineWidth = 2;
  ctx.stroke();

  /* One crack mark per hit taken, so a tough stone reads as tough. */
  ctx.strokeStyle = "rgba(0, 0, 0, 0.55)";
  ctx.lineWidth = Math.max(1.6, radius * 0.1);

  const crackPaths = [
    [[-0.30, -0.26], [-0.05,  0.00], [-0.18,  0.30]],
    [[ 0.32, -0.30], [ 0.08,  0.05], [ 0.30,  0.32]],
    [[-0.30,  0.32], [-0.02,  0.18], [ 0.22,  0.34]],
    [[-0.32, -0.06], [ 0.00, -0.20], [ 0.30, -0.10]],
    [[-0.10, -0.34], [ 0.04, -0.06], [-0.06,  0.30]]
  ];

  const cracks = Math.min(crackPaths.length, cell.maxHp - cell.hp);
  for (let i = 0; i < cracks; i++) {
    const points = crackPaths[i];
    ctx.beginPath();
    ctx.moveTo(points[0][0] * size, points[0][1] * size);
    ctx.lineTo(points[1][0] * size, points[1][1] * size);
    ctx.lineTo(points[2][0] * size, points[2][1] * size);
    ctx.stroke();
  }

  /* Tough stones get a brighter rim so you can tell at a glance that
     they will take more than the usual two hits. */
  if (cell.maxHp > 2) {
    ctx.strokeStyle = "rgba(255, 214, 120, " + Math.min(0.85, 0.25 + cell.maxHp * 0.1) + ")";
    ctx.lineWidth = Math.max(1.5, radius * 0.08);
    roundedRect(-size / 2 + 3, -size / 2 + 3, size - 6, size - 6, size * 0.18);
    ctx.stroke();
  }

  /* Past three hit points the cracks stop being countable, so the hits
     remaining are written on the stone instead. */
  if (cell.maxHp > 3) {
    ctx.font = "bold " + Math.round(radius * 0.85) + "px Trebuchet MS, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineWidth = Math.max(2, radius * 0.14);
    ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
    ctx.strokeText(String(cell.hp), 0, 0);
    ctx.fillStyle = "#ffe0a8";
    ctx.fillText(String(cell.hp), 0, 0);
  }

  ctx.restore();
}

function drawGem(cell, cx, cy, radius) {
  const palette = GEM_COLOURS[cell.colour];

  ctx.save();

  /* Body */
  ctx.shadowColor = palette.glow;
  ctx.shadowBlur = radius * 0.7;
  traceGemShape(palette.shape, cx, cy, radius, cell.spin);

  const body = ctx.createLinearGradient(cx - radius, cy - radius, cx + radius, cy + radius);
  body.addColorStop(0, palette.rim);
  body.addColorStop(0.45, palette.core);
  body.addColorStop(1, palette.glow);
  ctx.fillStyle = body;
  ctx.fill();
  ctx.shadowBlur = 0;

  /* Rim light */
  ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
  ctx.lineWidth = Math.max(1.5, radius * 0.09);
  traceGemShape(palette.shape, cx, cy, radius * 0.97, cell.spin);
  ctx.stroke();

  /* Highlight blob */
  ctx.beginPath();
  ctx.ellipse(cx - radius * 0.3, cy - radius * 0.36, radius * 0.26, radius * 0.16, -0.7, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
  ctx.fill();

  if (cell.special === "bomb") {
    drawBombMarks(cx, cy, radius);
  }
  if (cell.special === "prism") {
    drawPrismMarks(cx, cy, radius);
  }
  if (cell.blighted === true) {
    drawBlight(cx, cy, radius);
  }

  ctx.restore();
}

function drawBombMarks(cx, cy, radius) {
  const pulse = 0.7 + Math.sin(game.time * 7) * 0.3;

  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.44, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(20, 12, 28, 0.85)";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.2 * pulse, 0, Math.PI * 2);
  ctx.fillStyle = "#ffd47a";
  ctx.fill();

  ctx.strokeStyle = "rgba(255, 212, 122, " + pulse + ")";
  ctx.lineWidth = Math.max(1.5, radius * 0.08);
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.62, 0, Math.PI * 2);
  ctx.stroke();
}

function drawPrismMarks(cx, cy, radius) {
  const spin = game.time * 1.6;

  for (let i = 0; i < GEM_COLOURS.length; i++) {
    const angle = spin + (Math.PI * 2 * i) / GEM_COLOURS.length;
    ctx.beginPath();
    ctx.arc(
      cx + Math.cos(angle) * radius * 0.5,
      cy + Math.sin(angle) * radius * 0.5,
      radius * 0.17,
      0,
      Math.PI * 2
    );
    ctx.fillStyle = GEM_COLOURS[i].core;
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
}

function drawBlight(cx, cy, radius) {
  const wobble = Math.sin(game.time * 3) * radius * 0.05;

  ctx.beginPath();
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12;
    const jag = radius * (0.86 + (i % 2 === 0 ? 0.14 : -0.1)) + wobble;
    const x = cx + Math.cos(angle) * jag;
    const y = cy + Math.sin(angle) * jag;
    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  }
  ctx.closePath();
  /* Kept translucent so the gem colour underneath still reads. You
     have to be able to see what you are matching to cure it. */
  ctx.fillStyle = "rgba(18, 4, 30, 0.58)";
  ctx.fill();
  ctx.strokeStyle = "rgba(190, 90, 255, 0.75)";
  ctx.lineWidth = Math.max(1.5, radius * 0.09);
  ctx.stroke();

  /* Two small eyes give the blight a face. */
  const eyeGlow = 0.55 + Math.sin(game.time * 5) * 0.35;
  ctx.fillStyle = "rgba(255, 120, 220, " + eyeGlow + ")";
  ctx.beginPath();
  ctx.arc(cx - radius * 0.24, cy - radius * 0.05, radius * 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + radius * 0.24, cy - radius * 0.05, radius * 0.1, 0, Math.PI * 2);
  ctx.fill();
}

function drawCells() {
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cell = cellAt(row, col);
      const centre = cellCentre(row, col);
      const y = centre.y + cell.offsetY;

      let scale = cell.scale;
      /* A doomed cell waiting for the wave to reach it is still drawn
         as a live gem. It only pops once its delay has run out. */
      if (cell.doomed === true && cell.dyingDelay <= 0) {
        const t = Math.max(0, cell.dying / cell.dyingMax);
        scale = t * 1.35;
      }
      if (scale <= 0.01) continue;

      const radius = layout.cell * 0.38 * scale;

      if (cell.kind === "stone") {
        drawStone(cell, centre.x, y, radius);
      } else {
        drawGem(cell, centre.x, y, radius);
      }
    }
  }
}

/* ------------------------------------------------------------------
   The inside of a closed loop

   Drawn in two halves. The tint goes under the gems so it reads as the
   ground the ring has claimed, and the marks go over them so whatever
   was caught is never hidden by its own highlight.
   ------------------------------------------------------------------ */

function drawLoopInteriorGlow() {
  if (game.loopClosed === false) return;
  if (game.pathColour === -1) return;

  const summary = loopInteriorSummary();
  const palette = GEM_COLOURS[game.pathColour];
  const pulse = 0.5 + Math.sin(game.time * 9) * 0.5;

  let alpha = 0.14 + pulse * 0.12;
  if (loopCaughtSomething(summary) === true) {
    alpha = 0.24 + pulse * 0.22;
  }

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = palette.core;

  for (let i = 0; i < summary.cells.length; i++) {
    const spot = summary.cells[i];
    const x = layout.originX + spot.col * layout.cell;
    const y = layout.originY + spot.row * layout.cell;
    roundedRect(x + 2, y + 2, layout.cell - 4, layout.cell - 4, layout.cell * 0.18);
    ctx.fill();
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

/* Every special caught in the middle gets a halo, and the effects are
   listed once above the ring. Labelling every cell put two words on
   top of each other the moment two specials sat side by side, which is
   exactly the case worth showing off. */
function drawLoopCatchMarks() {
  if (game.loopClosed === false) return;
  if (game.pathColour === -1) return;

  const summary = loopInteriorSummary();
  if (loopCaughtSomething(summary) === false) return;

  /* Radius per kind, so a gem that is both blighted and a bomb draws
     two rings nested, one inside the other. */
  const haloed = [];
  const lines = [];

  for (let i = 0; i < summary.bombs.length; i++) {
    haloed.push({ spot: summary.bombs[i], colour: "#ffd47a", radius: 0.5 });
  }
  if (summary.bombs.length > 0) lines.push({ text: "x3 BLAST", colour: "#ffd47a" });

  for (let i = 0; i < summary.stones.length; i++) {
    haloed.push({ spot: summary.stones[i], colour: "#cfc7e6", radius: 0.5 });
  }
  if (summary.stones.length > 0) lines.push({ text: "ALL STONES", colour: "#cfc7e6" });

  for (let i = 0; i < summary.blighted.length; i++) {
    haloed.push({ spot: summary.blighted[i], colour: "#45e08a", radius: 0.58 });
  }
  if (summary.blighted.length > 0) lines.push({ text: "ALL BLIGHT", colour: "#45e08a" });

  for (let i = 0; i < summary.prisms.length; i++) {
    haloed.push({ spot: summary.prisms[i], colour: "#ffffff", radius: 0.44 });
  }
  if (summary.prisms.length > 0) lines.push({ text: "WHOLE BOARD", colour: "#ffffff" });

  const spin = game.time * 3;
  const pulse = 1 + Math.sin(game.time * 11) * 0.08;

  ctx.save();

  for (let i = 0; i < haloed.length; i++) {
    const mark = haloed[i];
    const centre = cellCentre(mark.spot.row, mark.spot.col);

    /* A dashed ring, turning, so the halo cannot be mistaken for the
       plain white ring the linked gems already wear. */
    ctx.setLineDash([layout.cell * 0.14, layout.cell * 0.1]);
    ctx.lineDashOffset = -spin * layout.cell * 0.3;
    ctx.strokeStyle = mark.colour;
    ctx.lineWidth = Math.max(2, layout.cell * 0.07);
    ctx.shadowColor = mark.colour;
    ctx.shadowBlur = layout.cell * 0.35;
    ctx.beginPath();
    ctx.arc(centre.x, centre.y, layout.cell * mark.radius * pulse, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.setLineDash([]);
  ctx.shadowBlur = 0;
  drawLoopCatchLegend(summary, lines);
  ctx.restore();
}

/* The list of what is about to happen, stacked over the ring. It sits
   above the trapped cells, and drops below them when the ring is close
   enough to the top of the board that there is no room up there. */
function drawLoopCatchLegend(summary, lines) {
  let leftCol = COLS;
  let rightCol = 0;
  let topRow = ROWS;
  let bottomRow = 0;

  for (let i = 0; i < summary.cells.length; i++) {
    const spot = summary.cells[i];
    if (spot.col < leftCol) leftCol = spot.col;
    if (spot.col > rightCol) rightCol = spot.col;
    if (spot.row < topRow) topRow = spot.row;
    if (spot.row > bottomRow) bottomRow = spot.row;
  }

  const middleX = layout.originX + ((leftCol + rightCol) / 2 + 0.5) * layout.cell;
  const lineHeight = layout.cell * 0.3;
  const aboveRing = layout.originY + topRow * layout.cell - layout.cell * 0.3;
  const belowRing = layout.originY + (bottomRow + 1) * layout.cell + layout.cell * 0.3;

  /* Where the top line goes. Stacked upward from the ring by default. */
  let firstLineY = aboveRing - (lines.length - 1) * lineHeight;
  if (firstLineY < lineHeight) {
    firstLineY = belowRing;
  }

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold " + Math.round(layout.cell * 0.24) + "px Trebuchet MS, sans-serif";
  ctx.lineWidth = 3.5;

  for (let i = 0; i < lines.length; i++) {
    const y = firstLineY + i * lineHeight;
    ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
    ctx.strokeText(lines[i].text, middleX, y);
    ctx.fillStyle = lines[i].colour;
    ctx.fillText(lines[i].text, middleX, y);
  }
}

function drawPath() {
  if (game.path.length === 0) return;

  const colourIndex = game.pathColour === -1 ? 4 : game.pathColour;
  const palette = GEM_COLOURS[colourIndex];

  ctx.save();
  ctx.lineWidth = layout.cell * 0.16;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.shadowColor = palette.glow;
  ctx.shadowBlur = layout.cell * 0.4;
  ctx.strokeStyle = game.loopClosed === true ? "#ffffff" : palette.rim;
  ctx.globalAlpha = 0.9;

  ctx.beginPath();
  for (let i = 0; i < game.path.length; i++) {
    const spot = game.path[i];
    const centre = cellCentre(spot.row, spot.col);
    const cell = cellAt(spot.row, spot.col);
    const y = centre.y + cell.offsetY;
    if (i === 0) {
      ctx.moveTo(centre.x, y);
    } else {
      ctx.lineTo(centre.x, y);
    }
  }

  if (game.loopClosed === true) {
    const first = game.path[0];
    const centre = cellCentre(first.row, first.col);
    ctx.lineTo(centre.x, centre.y);
  }
  ctx.stroke();
  ctx.restore();

  /* Rings around every linked gem. */
  ctx.save();
  ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
  ctx.lineWidth = Math.max(2, layout.cell * 0.05);
  const pulse = 1 + Math.sin(game.time * 12) * 0.06;

  for (let i = 0; i < game.path.length; i++) {
    const spot = game.path[i];
    const centre = cellCentre(spot.row, spot.col);
    const cell = cellAt(spot.row, spot.col);
    ctx.beginPath();
    ctx.arc(centre.x, centre.y + cell.offsetY, layout.cell * 0.46 * pulse, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  /* Link counter floating by the head of the path. */
  if (game.path.length >= 2) {
    const head = game.path[game.path.length - 1];
    const centre = cellCentre(head.row, head.col);
    ctx.save();
    ctx.font = "bold " + Math.round(layout.cell * 0.34) + "px Trebuchet MS, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = game.path.length >= MIN_LINK ? "#ffffff" : "rgba(255,255,255,0.5)";
    ctx.strokeStyle = "rgba(0,0,0,0.7)";
    ctx.lineWidth = 3;
    const label = String(game.path.length);
    const ty = centre.y - layout.cell * 0.52;
    ctx.strokeText(label, centre.x, ty);
    ctx.fillText(label, centre.x, ty);
    ctx.restore();
  }

  drawLoopCatchMarks();
}

function drawAimHint() {
  if (game.aiming === "none") return;

  const alpha = 0.15 + Math.sin(game.time * 6) * 0.08;
  ctx.fillStyle = "rgba(69, 224, 138, " + alpha + ")";
  ctx.fillRect(0, 0, layout.width, layout.height);

  const text = game.aiming === "bomb" ? "TAP A GEM TO PLANT" : "TAP A COLOUR TO PURGE";

  ctx.save();
  ctx.font = "bold " + Math.round(layout.cell * 0.32) + "px Trebuchet MS, sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff";
  ctx.strokeStyle = "rgba(0,0,0,0.75)";
  ctx.lineWidth = 4;
  ctx.strokeText(text, layout.width / 2, layout.height / 2);
  ctx.fillText(text, layout.width / 2, layout.height / 2);
  ctx.restore();
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (p.delay > 0) continue;
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.colour;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloaters() {
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for (let i = 0; i < floaters.length; i++) {
    const f = floaters[i];
    const t = f.life / f.maxLife;
    ctx.globalAlpha = Math.min(1, t * 1.6);
    ctx.font = "bold " + Math.round(layout.cell * 0.42) + "px Trebuchet MS, sans-serif";
    ctx.strokeStyle = "rgba(0, 0, 0, 0.75)";
    ctx.lineWidth = 4;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.colour;
    ctx.fillText(f.text, f.x, f.y);
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBlightMeter() {
  const blight = countBlight();
  if (blight === 0) return;

  const barHeight = 5;
  const fraction = Math.min(1, blight / blightLossThreshold());

  ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
  ctx.fillRect(0, layout.height - barHeight, layout.width, barHeight);

  const danger = fraction > 0.7;
  ctx.fillStyle = danger === true ? "#ff5470" : "#a24dff";
  ctx.fillRect(0, layout.height - barHeight, layout.width * fraction, barHeight);
}

function render() {
  ctx.save();

  if (game.shake > 0.2) {
    const dx = (Math.random() * 2 - 1) * game.shake;
    const dy = (Math.random() * 2 - 1) * game.shake;
    ctx.translate(dx, dy);
  }

  drawBackdrop();
  drawLoopInteriorGlow();
  drawCells();
  drawShockwaves();
  drawPath();
  drawParticles();
  drawFloaters();
  drawAimHint();
  drawBlightMeter();
  drawMilestoneWord(ctx, layout.width, layout.height, layout.pixelRatio);
  drawScreenFlash();

  ctx.restore();
}

/* ------------------------------------------------------------------
   Main loop
   ------------------------------------------------------------------ */

let lastFrame = 0;

function frame(now) {
  if (lastFrame === 0) lastFrame = now;

  /* Clamp dt so a backgrounded tab does not teleport the animation. */
  let dt = (now - lastFrame) / 1000;
  if (dt > 0.05) dt = 0.05;
  lastFrame = now;

  window.requestAnimationFrame(frame);

  /* Nothing to draw until the stage has a measured size. */
  if (boardReady === false) return;

  game.time += dt;
  update(dt);
  render();
}

function update(dt) {
  if (game.shake > 0) {
    game.shake -= dt * 34;
    if (game.shake < 0) game.shake = 0;
  }

  updateParticles(dt);
  updateShockwaves(dt);
  updateToast(dt);
  updateMilestoneWord(dt);
  updateCellAnimations(dt);

  if (game.phase === "bursting") {
    game.burstTimer -= dt;
    if (game.burstTimer <= 0) {
      removeDeadCells();
      applyGravity();
      game.phase = "falling";
    }
  } else if (game.phase === "falling") {
    if (boardIsSettled() === true) {
      checkLevelState();
    }
  }
}

function updateCellAnimations(dt) {
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cell = cellAt(row, col);
      if (cell === null) continue;

      if (cell.dyingDelay > 0) {
        cell.dyingDelay -= dt;
        if (cell.dyingDelay < 0) cell.dyingDelay = 0;
      } else if (cell.dying > 0) {
        cell.dying -= dt;
        if (cell.dying < 0) cell.dying = 0;
      }

      if (cell.offsetY < 0) {
        cell.fallSpeed += 3600 * dt;
        cell.offsetY += cell.fallSpeed * dt;
        if (cell.offsetY >= 0) {
          cell.offsetY = 0;
          cell.fallSpeed = 0;
          cell.scale = 1.16;
        }
      }

      if (cell.scale > 1) {
        cell.scale -= dt * 2.4;
        if (cell.scale < 1) cell.scale = 1;
      }
      if (cell.scale < 1) {
        cell.scale += dt * 4;
        if (cell.scale > 1) cell.scale = 1;
      }
    }
  }
}

/* ------------------------------------------------------------------
   Input
   ------------------------------------------------------------------ */

function pointToCell(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;

  const col = Math.floor(x / layout.cell);
  const row = Math.floor(y / layout.cell);

  if (insideBoard(row, col) === false) return null;

  /* The live part of a cell is a disc around its middle. Corners stay
     dead so a diagonal drag cannot clip the two cells either side of
     the corner it passes through: those centres sit 0.707 of a cell
     away from the diagonal, comfortably outside this radius. */
  const centre = cellCentre(row, col);
  const dx = x - centre.x;
  const dy = y - centre.y;
  const distance = Math.sqrt(dx * dx + dy * dy);

  if (distance > layout.cell * HIT_RADIUS) return null;

  return { row: row, col: col };
}

let pointerDown = false;
let lastPointerX = 0;
let lastPointerY = 0;

function onPointerDown(event) {
  ensureAudio();

  if (game.phase !== "idle") return;
  event.preventDefault();

  const spot = pointToCell(event.clientX, event.clientY);
  if (spot === null) return;

  if (game.aiming !== "none") {
    fireArmedItemAt(spot.row, spot.col);
    return;
  }

  pointerDown = true;
  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
  beginPath(spot.row, spot.col);
}

function onPointerMove(event) {
  if (pointerDown === false) return;
  if (game.phase !== "idle") return;
  event.preventDefault();

  /* A moving finger reports positions that can be more than a cell
     apart, and a link only extends to a neighbour of its head. Walking
     the route between two samples in small steps visits every cell
     along the way, so a fast drag registers the same chain a slow one
     does. */
  const dx = event.clientX - lastPointerX;
  const dy = event.clientY - lastPointerY;
  const distance = Math.sqrt(dx * dx + dy * dy);
  const steps = Math.max(1, Math.ceil(distance / (layout.cell * 0.25)));

  for (let i = 1; i <= steps; i++) {
    const x = lastPointerX + (dx * i) / steps;
    const y = lastPointerY + (dy * i) / steps;
    const spot = pointToCell(x, y);
    if (spot !== null) {
      extendPath(spot.row, spot.col);
    }
  }

  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
}

function onPointerUp(event) {
  if (pointerDown === false) return;
  pointerDown = false;
  event.preventDefault();

  if (game.phase !== "idle") {
    game.path = [];
    return;
  }

  resolvePath();
}

/* Move and release are watched on the window so a drag that wanders
   off the edge of the board still tracks and still resolves. */
canvas.addEventListener("pointerdown", onPointerDown);
window.addEventListener("pointermove", onPointerMove, { passive: false });
window.addEventListener("pointerup", onPointerUp);
window.addEventListener("pointercancel", onPointerUp);
canvas.addEventListener("contextmenu", function (event) { event.preventDefault(); });

/* ------------------------------------------------------------------
   HUD updates
   ------------------------------------------------------------------ */

function refreshHud() {
  scoreValue.textContent = String(game.score);
  movesValue.textContent = String(Math.max(0, game.moves));
  levelValue.textContent = String(game.level);

  if (game.moves <= 4) {
    movesStat.classList.add("low");
  } else {
    movesStat.classList.remove("low");
  }

  goalText.textContent = game.goal.label;

  const shown = Math.min(game.goal.progress, game.goal.target);
  goalCount.textContent = shown + "/" + game.goal.target;
  goalFill.style.width = (shown / game.goal.target) * 100 + "%";

  updateItemBar();
}

/* The item row is built once and then only restyled, so the buttons
   keep their identity across redraws. */
function buildItemBar() {
  /* A notch on the charge bar for every item, so you can see how far
     off the next one is without doing the arithmetic. */
  for (let i = 0; i < ITEMS.length; i++) {
    const item = ITEMS[i];
    if (item.cost >= CHARGE_MAX) continue;

    const tick = document.createElement("div");
    tick.className = "chargeTick";
    tick.dataset.cost = String(item.cost);
    tick.style.left = (item.cost / CHARGE_MAX) * 100 + "%";
    chargeTicks.appendChild(tick);
  }

  for (let i = 0; i < ITEMS.length; i++) {
    const item = ITEMS[i];
    const button = document.createElement("button");
    button.className = "itemBtn";
    button.dataset.item = item.id;
    button.innerHTML =
      "<span class='glyph'>" + item.glyph + "</span>" +
      "<span class='name'>" + item.label + " " + item.cost + "</span>";

    button.addEventListener("click", function () {
      ensureAudio();
      selectItem(item.id);
    });

    itemRow.appendChild(button);
  }
}

function updateItemBar() {
  chargeFill.style.width = (game.charge / CHARGE_MAX) * 100 + "%";
  chargeValue.textContent = game.charge + "/" + CHARGE_MAX;

  const ticks = chargeTicks.querySelectorAll(".chargeTick");
  for (let i = 0; i < ticks.length; i++) {
    const cost = parseInt(ticks[i].dataset.cost, 10);
    if (game.charge >= cost) {
      ticks[i].classList.add("reached");
    } else {
      ticks[i].classList.remove("reached");
    }
  }

  const buttons = itemRow.querySelectorAll(".itemBtn");
  for (let i = 0; i < buttons.length; i++) {
    const button = buttons[i];
    const id = button.dataset.item;

    button.classList.remove("ready");
    button.classList.remove("armed");

    if (game.aiming === id) {
      button.classList.add("armed");
    } else if (canAfford(id) === true) {
      button.classList.add("ready");
    }
  }
}

/* ------------------------------------------------------------------
   Card overlay
   ------------------------------------------------------------------ */

let cardAction = null;
let cardAltAction = null;

function showCard(title, subtitle, bodyHtml, buttonText, action, altText, altAction) {
  cardTitle.textContent = title;
  cardSub.textContent = subtitle;
  cardBody.innerHTML = bodyHtml;
  cardBtn.textContent = buttonText;
  cardAction = action;

  if (altText === undefined) {
    cardAltAction = null;
    cardBtnAlt.classList.add("hidden");
  } else {
    cardAltAction = altAction;
    cardBtnAlt.textContent = altText;
    cardBtnAlt.classList.remove("hidden");
  }

  overlay.classList.remove("hidden");
}

function hideCard() {
  overlay.classList.add("hidden");
  cardAction = null;
  cardAltAction = null;
  cardBtnAlt.classList.add("hidden");
}

cardBtn.addEventListener("click", function () {
  ensureAudio();
  if (boardReady === false) {
    measureStage();
  }
  if (cardAction === null) return;
  const action = cardAction;
  cardAction = null;
  action();
});

cardBtnAlt.addEventListener("click", function () {
  ensureAudio();
  if (cardAltAction === null) return;
  const action = cardAltAction;
  cardAltAction = null;
  action();
});

function howToPlayHtml() {
  return "" +
  "<div class='rule'><span class='pip'>&#9679;</span><span><b>Drag</b> across touching gems of the same colour. Release with <b>3 or more</b> to burst them.</span></div>" +
  "<div class='rule'><span class='pip'>&#8634;</span><span>Cross your own trail to <b>close a loop</b> and wipe every gem of that colour off the board.</span></div>" +
  "<div class='rule'><span class='pip'>&#10039;</span><span>Link <b>5</b> to forge a <b>Bomb</b>, link <b>7</b> to forge a <b>Prism</b> that torches a whole colour.</span></div>" +
  "<div class='rule'><span class='pip'>&#9678;</span><span>Loop <b>around</b> something without linking it and it goes off far harder. A bomb blasts <b>three cells</b> in every direction, a stone takes <b>every stone</b> with it, a blight <b>cures the board</b>, and a Prism clears the <b>whole board</b>.</span></div>" +
  "<div class='rule'><span class='pip'>&#9632;</span><span><b>Stones</b> crack when a gem bursts beside them and take a full hit from any bomb blast.</span></div>" +
  "<div class='rule'><span class='pip'>&#9760;</span><span>The <b>Blight</b> creeps in from level three and follows you between levels. Link a blighted gem to cure it. " + blightLossThreshold() + " blighted cells ends the level.</span></div>" +
  "<div class='rule'><span class='pip'>&#9878;</span><span>Bursting fills your <b>charge</b>. Spend it on Shuffle, Bomb, +2 Moves or a full colour Purge.</span></div>" +
  "<div class='rule'><span class='pip'>&#10010;</span><span>You start with <b>3 continues</b> and earn one every 10 levels. A continue replays the level and rewinds the score you made on it.</span></div>";
}

/* Shown at the top of the title card when the browser will not save, so
   the player finds out before the run rather than after it. */
function storageWarningHtml() {
  if (storageWorks === true) return "";

  return "<div class='rule'><span class='pip' style='color:var(--danger)'>&#9888;</span>" +
    "<span style='color:var(--danger)'>This browser will not let the game save. Your run and your " +
    "best score are gone when you close the page. Opening the game from a web address instead of a " +
    "file on the device fixes it.</span></div>";
}

function showTitleCard() {
  cardStats.style.display = "none";

  const saved = readSave();

  if (saved === null) {
    showCard("Prism Path", "Link. Loop. Purge the blight.",
      storageWarningHtml() + howToPlayHtml(), "Play",
      function () { startRun(); hideCard(); });
    return;
  }

  showCard(
    "Prism Path",
    "You have a run in progress.",
    storageWarningHtml() +
    "<div class='rule'><span class='pip'>&#9670;</span><span>Saved on <b>level " + saved.level + "</b> with <b>" + saved.score + "</b> points and <b>" + saved.continues + "</b> continues.</span></div>" +
    howToPlayHtml(),
    "Resume Level " + saved.level,
    function () { loadGame(saved); hideCard(); },
    "New Run",
    function () { clearSave(); startRun(); hideCard(); }
  );
}

/* ------------------------------------------------------------------
   Menu
   ------------------------------------------------------------------ */

function menuIsOpen() {
  return menuPanel.classList.contains("hidden") === false;
}

/* The panel is two pages in the one card. Opening it and closing it
   both land on the main page, so it never comes back halfway inside a
   submenu the player walked away from. */
function showMenuMain() {
  menuTitle.textContent = "Paused";
  soundsPage.classList.add("hidden");
  menuMain.classList.remove("hidden");
}

function showSoundsPage() {
  menuTitle.textContent = "Sounds";
  menuMain.classList.add("hidden");
  soundsPage.classList.remove("hidden");
  refreshSoundsPage();
}

function soundsPageIsOpen() {
  return soundsPage.classList.contains("hidden") === false;
}

/* Pushes the current settings onto the controls. Called when the page
   opens and after anything changes them, so the toggles, the sliders
   and the numbers beside them can never end up disagreeing. */
function refreshSoundsPage() {
  const sfxPercent = Math.round(sound.volume * 100);
  const musicPercent = Math.round(music.volume * 100);

  sfxToggle.textContent = sound.enabled === true ? "SFX: On" : "SFX: Off";
  sfxSlider.value = String(sfxPercent);
  sfxReadout.textContent = sfxPercent + "%";
  setChannelMuted(sfxGroup, sound.enabled === false);

  musicToggle.textContent = music.enabled === true ? "Music: On" : "Music: Off";
  musicSlider.value = String(musicPercent);
  musicReadout.textContent = musicPercent + "%";
  setChannelMuted(musicGroup, music.enabled === false);

  refreshMusicNote();
}

function setChannelMuted(group, muted) {
  if (muted === true) {
    group.classList.add("off");
  } else {
    group.classList.remove("off");
  }
}

function refreshMusicNote() {
  if (music.fileFailed === false) {
    musicNote.classList.add("hidden");
    return;
  }

  musicNote.textContent = "The music file would not load, so the game is running " +
    "without it. Opening the game from a web address instead of a file on the " +
    "device usually fixes it.";
  musicNote.classList.remove("hidden");
}

function openMenu() {
  if (game.phase === "title") return;
  if (overlay.classList.contains("hidden") === false) return;

  ensureAudio();
  showMenuMain();
  menuFull.textContent = document.fullscreenElement === null ? "Fullscreen" : "Leave Fullscreen";
  menuFull.style.display = fullscreenSupported === true ? "block" : "none";
  menuPanel.classList.remove("hidden");
}

function closeMenu() {
  menuPanel.classList.add("hidden");
  showMenuMain();
}

function toggleMenu() {
  if (menuIsOpen() === true) {
    closeMenu();
  } else {
    openMenu();
  }
}

menuBtn.addEventListener("click", toggleMenu);
menuResume.addEventListener("click", closeMenu);

menuSounds.addEventListener("click", showSoundsPage);
soundsBack.addEventListener("click", showMenuMain);

sfxToggle.addEventListener("click", function () {
  sound.enabled = sound.enabled === false;
  refreshSoundsPage();
  saveAudioSettings();

  /* Switching effects back on plays one, so the player hears the level
     they are set to instead of taking the label's word for it. */
  if (sound.enabled === true) playTone(660, 0.12, "triangle", 0.14);
});

sfxSlider.addEventListener("input", function () {
  sound.volume = Number(sfxSlider.value) / 100;
  sfxReadout.textContent = sfxSlider.value + "%";
  applySfxVolume();
});

/* The sample tone and the write to storage both wait for the finger to
   come off. A drag fires input on every pixel it crosses, and neither
   a burst of beeps nor a burst of writes is wanted. */
sfxSlider.addEventListener("change", function () {
  saveAudioSettings();
  if (sound.enabled === true) playTone(660, 0.12, "triangle", 0.14);
});

musicToggle.addEventListener("click", function () {
  music.enabled = music.enabled === false;
  refreshSoundsPage();
  saveAudioSettings();

  /* Switching music off stops the track outright and switching it back
     on starts whatever the level asked for. With nothing wanted, which
     is the case on the title card, both do nothing. */
  syncMusic();
});

musicSlider.addEventListener("input", function () {
  music.volume = Number(musicSlider.value) / 100;
  musicReadout.textContent = musicSlider.value + "%";
  applyMusicVolume();
});

musicSlider.addEventListener("change", saveAudioSettings);

menuFull.addEventListener("click", function () {
  if (document.fullscreenElement === null) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
  closeMenu();
});

menuHelp.addEventListener("click", function () {
  closeMenu();
  showCard("How to Play", "Prism Path", howToPlayHtml(), "Back", function () { hideCard(); });
});

menuSave.addEventListener("click", function () {
  saveGame();
  closeMenu();
  showToast("SAVED", "#45e08a");
});

menuSaveQuit.addEventListener("click", function () {
  saveGame();
  closeMenu();
  stopMusic();
  game.phase = "title";
  showTitleCard();
});

menuQuit.addEventListener("click", function () {
  clearSave();
  closeMenu();
  stopMusic();
  game.phase = "title";
  showTitleCard();
});

/* Escape on a keyboard, the menu button anywhere, and the Android back
   gesture all reach the same panel. Back needs a history entry of its
   own to have something to pop. */
window.addEventListener("keydown", function (event) {
  if (event.key !== "Escape") return;
  event.preventDefault();
  menuBack();
});

window.history.pushState({ prismPath: true }, "");
window.addEventListener("popstate", function () {
  window.history.pushState({ prismPath: true }, "");
  menuBack();
});

/* Escape and the back gesture both mean "up one level". Standing in the
   sounds page, one level up is the main menu. */
function menuBack() {
  if (menuIsOpen() === true && soundsPageIsOpen() === true) {
    showMenuMain();
    return;
  }
  toggleMenu();
}

const fullscreenSupported = typeof document.documentElement.requestFullscreen === "function";

document.addEventListener("fullscreenchange", function () {
  window.setTimeout(measureStage, 120);
});

/* ------------------------------------------------------------------
   Boot
   ------------------------------------------------------------------ */

/* The stage can measure zero while the page is still laying out or
   while the tab is hidden, so the board is built on the first real
   measurement. */
let boardReady = false;

function measureStage() {
  const rect = stage.getBoundingClientRect();
  if (rect.width < 1 || rect.height < 1) return;

  if (boardReady === false) {
    chooseRowCount(rect);
    resizeCanvas();
    buildBoard();
    game.goal = makeGoalForLevel(1);
    boardReady = true;
    refreshHud();
    return;
  }

  /* A resize after the run started only rescales. The board itself is
     left alone. */

  resizeCanvas();
}

const stageObserver = new ResizeObserver(measureStage);
stageObserver.observe(stage);

window.addEventListener("orientationchange", function () {
  window.setTimeout(measureStage, 200);
});

/* Blocks the pinch-zoom and double tap zoom that ruin drag controls. */
document.addEventListener("gesturestart", function (event) { event.preventDefault(); });
document.addEventListener("dblclick", function (event) { event.preventDefault(); });

game.bestScore = loadBest();
loadAudioSettings();
refreshSoundsPage();
buildItemBar();
measureStage();
showTitleCard();
window.requestAnimationFrame(frame);

</script>
