    customControls.stonesNote.textContent = "Stone goals are skipped.";
  } else {
    customControls.stonesNote.textContent = "";
  }

  refreshToggle(customControls.loopsToggle, picks.loopsEnabled, false);
  if (picks.loopsEnabled === false) {
    customControls.loopsNote.textContent = "Crossing back to the first gem does nothing.";
  } else {
    customControls.loopsNote.textContent = "";
  }

  refreshToggle(customControls.carryToggle, picks.specialsCarryOver, false);
  if (picks.baseModeId === "endless") {
    customControls.carryNote.textContent = "The board carries on anyway.";
  } else {
    customControls.carryNote.textContent = "Bombs, prisms and chromatics on the board follow you onto the next one.";
  }

  const minWindow = minLinkWindow();
  refreshStepper(customControls.minLinkStepper, links.minLink, minWindow.lowest, minWindow.highest, false);

  refreshTierRow(customControls.bombToggle, customControls.bombStepper, customControls.bombNote,
    "bombEnabled", "bombLink", "a bomb");
  refreshTierRow(customControls.prismToggle, customControls.prismStepper, customControls.prismNote,
    "prismEnabled", "prismLink", "a prism");
  refreshTierRow(customControls.chromaticToggle, customControls.chromaticStepper, customControls.chromaticNote,
    "chromaticEnabled", "chromaticLink", "a chromatic");

  customControls.baseNote.classList.remove("hidden");
  const notes = [customControls.blightNote, customControls.stonesNote, customControls.loopsNote,
    customControls.carryNote, customControls.bombNote, customControls.prismNote, customControls.chromaticNote];
  for (let i = 0; i < notes.length; i++) {
    if (notes[i].textContent === "") {
      notes[i].classList.add("hidden");
    } else {
      notes[i].classList.remove("hidden");
    }
  }
}

/* A tier's toggle, its stepper, and a note when the toggle cannot be
   switched on because the tiers either side leave it no room. */
function refreshTierRow(toggle, stepper, note, enabledField, lengthField, what) {
  const links = customPicks.links;
  const window = tierWindow(lengthField);
  const isOn = links[enabledField] === true;
  const noRoom = isOn === false && window.lowest > window.highest;

  refreshToggle(toggle, isOn, noRoom);
  refreshStepper(stepper, links[lengthField], window.lowest, window.highest, isOn === false);

  if (noRoom === true) {
    note.textContent = "No room for " + what + " between the tiers either side of it.";
  } else {
    note.textContent = "";
  }
}

/* =====================================================================
   SettingsTour
   Owns: the one time walkthrough a new player gets before their first
   game, and the live comparison panels it shows.
   Stays out of: the settings panel itself, which keeps owning the real
   controls, and every setting's storage, which stays where it was.

   Why it exists: a player whose eyes hurt from the shimmer, or whose
   phone struggles with HD, stops playing long before they go digging
   through a menu to find out whether a fix exists. Most games do not
   offer these settings, so most players never look. This asks instead.

   Every step shows the choice being made rather than describing it. The
   panels are the game's own drawing routines running live, so the two
   sides of a comparison are the real thing and not a picture of it.
   ===================================================================== */

const tour = {
  done: false,
  stepIndex: 0
};

/* Whether anything was ever written to the settings key. A player who has
   already changed a setting has made their choices and is left alone. */
let settingsWereStored = false;

const prefersReducedMotion =
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Each panel is drawn every frame while the tour is up, which is what
   lets the shimmer step show a shimmer. Held here between frames. */
const tourPanelCanvases = [];

const TOUR_PANEL_WIDTH = 150;
const TOUR_PANEL_ROWS = 3;
const TOUR_PANEL_COLS = 3;

/* One fixed arrangement, so the two sides of a comparison differ by the
   setting under test and by nothing else. */
const TOUR_PANEL_GEMS = [
  [0, 2, 4],
  [3, 0, 1],
  [1, 4, 2]
];

function alwaysApplies() {
  return true;
}

function onlyWithHd() {
  return graphics.mode === GRAPHICS_HD;
}

/* The steps, walked in order. A step that does not apply is stepped over
   in both directions, which is how the shimmer question disappears for a
   player who chose Standard. Adding a setting later means adding one
   entry here. */
const TOUR_STEPS = [
  {
    id: "graphics",
    applies: alwaysApplies,
    title: "How should the gems look?",
    copy: "Standard draws flat, calm gems. It is easier on sensitive eyes and " +
          "it runs on anything. HD cuts every gem as a faceted stone with light " +
          "moving across it, which is sharper to look at and asks more of the device.",
    panels: { labels: ["Standard", "HD"] },
    options: [
      { label: "Standard", choose: chooseStandardGraphics, isPicked: standardIsPicked },
      { label: "HD", choose: chooseHdGraphics, isPicked: hdIsPicked }
    ],
    note: graphicsNoteForTour
  },

  {
    id: "shimmer",
    applies: onlyWithHd,
    title: "Should the gems move?",
    copy: "HD stones catch the light: a bar sweeps across each one, the highlight " +
          "breathes, and the colours inside wander. On a board of sixty gems that " +
          "is a lot of motion, and it gives some players a headache.",
    panels: { labels: ["Still", "Moving"] },
    options: [
      { label: "Still", choose: chooseShimmerOff, isPicked: shimmerIsOff },
      { label: "Moving", choose: chooseShimmerOn, isPicked: shimmerIsOn }
    ],
    note: shimmerNoteForTour
  },

  {
    id: "sfx",
    applies: alwaysApplies,
    title: "Sound effects?",
    copy: "Every break, blast and shatter is played as it happens. Nothing here " +
          "is a file: the game builds each sound as it needs it.",
    panels: null,
    options: [
      { label: "Off", choose: chooseSfxOff, isPicked: sfxIsOff },
      { label: "On", choose: chooseSfxOn, isPicked: sfxIsOn }
    ],
    note: sfxNoteForTour
  },

  {
    id: "music",
    applies: musicCanBeHeard,
    title: "Music?",
    copy: "A quiet ambient bed that plays under the whole run.",
    panels: null,
    options: [
      { label: "Off", choose: chooseMusicOff, isPicked: musicIsOff },
      { label: "On", choose: chooseMusicOn, isPicked: musicIsOn }
    ],
    note: musicNoteForTour
  },

  {
    id: "hints",
    applies: alwaysApplies,
    title: "Should the game offer hints?",
    copy: "Sit still for a while and the game will point out a move it likes. " +
          "The hint button is always there either way, so turning this off only " +
          "stops it offering unasked.",
    panels: null,
    options: [
      { label: "Off", choose: chooseHintsOff, isPicked: hintsAreOff },
      { label: "On", choose: chooseHintsOn, isPicked: hintsAreOn }
    ],
    note: hintsNoteForTour
  }
];

/* ---- what each choice does, and what it says afterwards ---- */

function chooseStandardGraphics() {
  graphics.mode = GRAPHICS_STANDARD;
  applyGraphicsMode();
  saveSettings();
}

function chooseHdGraphics() {
  graphics.mode = GRAPHICS_HD;
  applyGraphicsMode();
  saveSettings();
}

function standardIsPicked() {
  return graphics.mode === GRAPHICS_STANDARD;
}

function hdIsPicked() {
  return graphics.mode === GRAPHICS_HD;
}

function graphicsNoteForTour() {
  if (graphics.mode === GRAPHICS_HD) {
    return "HD it is. If the board ever feels slow, this is the first thing to change back.";
  }
  return "Standard it is. The game plays exactly the same either way.";
}

function chooseShimmerOff() {
  shimmer.enabled = false;
  saveSettings();
}

function chooseShimmerOn() {
  shimmer.enabled = true;
  saveSettings();
}

function shimmerIsOff() {
  return shimmer.enabled === false;
}

function shimmerIsOn() {
  return shimmer.enabled === true;
}

function shimmerNoteForTour() {
  if (shimmer.enabled === true) return "The stones will catch the light as you play.";
  return "The stones will hold still. They are still cut stones, with the movement taken out.";
}

function chooseSfxOff() {
  sound.enabled = false;
  saveSettings();
}

function chooseSfxOn() {
  sound.enabled = true;
  saveSettings();
}

function sfxIsOff() {
  return sound.enabled === false;
}

function sfxIsOn() {
  return sound.enabled === true;
}

function sfxNoteForTour() {
  if (sound.enabled === true) return "Volume lives in the settings menu if you want it lower.";
  return "Silent. Nothing in the game needs sound to be played.";
}

/* A music file that will not load is a real thing that happens, and
   asking somebody to choose between silence and silence is worse than
   not asking. */
function musicCanBeHeard() {
  return music.fileFailed === false;
}

function chooseMusicOff() {
  music.enabled = false;
  syncMusic();
  saveSettings();
}

function chooseMusicOn() {
  ensureAudio();
  music.enabled = true;

  /* The screen this is asked from already knows which track it wants,
     so turning music on only has to let it be heard. */
  syncMusic();
  saveSettings();
}

function musicIsOff() {
  return music.enabled === false;
}

function musicIsOn() {
  return music.enabled === true;
}

function musicNoteForTour() {
  if (music.enabled === true) return "Playing now. Volume lives in the settings menu.";
  return "No music. The sound effects are unaffected by this.";
}

function chooseHintsOff() {
  hints.enabled = false;
  saveSettings();
}

function chooseHintsOn() {
  hints.enabled = true;
  saveSettings();
}

function hintsAreOff() {
  return hints.enabled === false;
}

function hintsAreOn() {
  return hints.enabled === true;
}

function hintsNoteForTour() {
  if (hints.enabled === true) return "The game will offer one when you have been still a while.";
  return "No unprompted hints. The bulb at the top still works whenever you tap it.";
}

/* ---- walking the steps ---- */

function tourShouldRun() {
  if (tour.done === true) return false;

  /* Nothing can be remembered without storage, so a one time walkthrough
     would be a walkthrough every time. */
  if (storageWorks === false) return false;

  return settingsWereStored === false;
}

function tourStepsThatApply() {
  const live = [];
  for (let i = 0; i < TOUR_STEPS.length; i++) {
    if (TOUR_STEPS[i].applies() === true) live.push(TOUR_STEPS[i]);
  }
  return live;
}

function startSettingsTour() {
  tour.stepIndex = 0;

  /* A player who has asked their system for less movement is asked the
     shimmer question with the answer already leaning their way. */
  if (prefersReducedMotion === true) {
    shimmer.enabled = false;
  }

  refreshTourStep();
  showScreen("settingsTour");
}

function finishSettingsTour() {
  tour.done = true;
  saveSettings();
  tourPanelCanvases.length = 0;
  showModeSelect();
}

function stepTour(direction) {
  const live = tourStepsThatApply();
  const next = tour.stepIndex + direction;

  if (next < 0) {
    showMainMenu();
    return;
  }
  if (next >= live.length) {
    finishSettingsTour();
    return;
  }

  tour.stepIndex = next;
  refreshTourStep();
}

/* Built fresh on every step, because what a step shows differs enough
   between them that restyling one layout would be the harder thing to
   read. */
function refreshTourStep() {
  const live = tourStepsThatApply();

  /* Choosing Standard on the first step takes the shimmer question away,
     which can leave the walk standing past the end of it. */
  if (tour.stepIndex >= live.length) {
    tour.stepIndex = live.length - 1;
  }

  const step = live[tour.stepIndex];

  tourTitle.textContent = step.title;
  tourProgress.textContent = "Setting up. Step " + (tour.stepIndex + 1) + " of " + live.length +
    ". All of this can be changed later.";
  tourCopy.textContent = step.copy;
  tourNote.textContent = step.note();

  tourPanels.innerHTML = "";
  tourPanelCanvases.length = 0;

  if (step.panels !== null) {
    for (let i = 0; i < step.panels.labels.length; i++) {
      tourPanels.appendChild(buildTourPanel(step, i));
    }
  }

  /* A step with panels puts its choice under the pictures, where the
     button sits with the thing it is choosing. Only a step without them
     needs a row of its own. */
  tourChoices.innerHTML = "";

  if (step.panels === null) {
    tourChoices.classList.remove("hidden");
    for (let i = 0; i < step.options.length; i++) {
      tourChoices.appendChild(buildTourChoice(step.options[i]));
    }
  } else {
    tourChoices.classList.add("hidden");
  }

  tourNext.textContent = tour.stepIndex === live.length - 1 ? "Start Playing" : "Next";
  tourBack.textContent = tour.stepIndex === 0 ? "Back to Menu" : "Back";
}

function buildTourChoice(option) {
  const button = document.createElement("button");

  button.className = option.isPicked() === true ? "pickBtn picked" : "pickBtn";
  button.textContent = option.label;

  button.addEventListener("click", function () {
    ensureAudio();
    option.choose();
    refreshTourStep();
  });

  return button;
}

function buildTourPanel(step, index) {
  const cell = TOUR_PANEL_WIDTH / TOUR_PANEL_COLS;
  const height = cell * TOUR_PANEL_ROWS;
  const dpr = window.devicePixelRatio;

  const holder = document.createElement("div");

  const panelCanvas = document.createElement("canvas");
  panelCanvas.className = "tourPanelArt";
  panelCanvas.width = Math.round(TOUR_PANEL_WIDTH * dpr);
  panelCanvas.height = Math.round(height * dpr);
  panelCanvas.style.width = TOUR_PANEL_WIDTH + "px";
  panelCanvas.style.height = height + "px";

  holder.appendChild(panelCanvas);
  tourPanelCanvases.push({ canvas: panelCanvas, stepId: step.id, index: index, cell: cell, height: height });

  const label = document.createElement("button");
  label.className = step.options[index].isPicked() === true ? "pickBtn picked" : "pickBtn";
  label.textContent = step.panels.labels[index];
  label.addEventListener("click", function () {
    ensureAudio();
    step.options[index].choose();
    refreshTourStep();
  });

  const stack = document.createElement("div");
  stack.style.display = "flex";
  stack.style.flexDirection = "column";
  stack.style.gap = "6px";
  stack.appendChild(panelCanvas);
  stack.appendChild(label);
  return stack;
}

/* ---- the live panels ---- */

/* The board's own routines paint through the module level ctx and read
   the module level appearance settings, so both are pointed at what this
   panel is meant to show for one synchronous run and put straight back.
   Nothing else runs in between. */
function drawTourPanel(panel) {
  const boardCtx = ctx;
  const wasMode = graphics.mode;
  const wasShimmer = shimmer.enabled;

  if (panel.stepId === "graphics") {
    graphics.mode = panel.index === 0 ? GRAPHICS_STANDARD : GRAPHICS_HD;
  }
  if (panel.stepId === "shimmer") {
    shimmer.enabled = panel.index === 1;
  }

  ctx = panel.canvas.getContext("2d");
  ctx.save();
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  const tray = {
    originX: 0,
    originY: 0,
    cell: panel.cell,
    rows: TOUR_PANEL_ROWS,
    cols: TOUR_PANEL_COLS,
    width: TOUR_PANEL_WIDTH,
    height: panel.height,
    level: TILE_LEVEL
  };

  drawBackdrop(tray);

  const radius = panel.cell * 0.38;
  for (let row = 0; row < TOUR_PANEL_ROWS; row++) {
    for (let col = 0; col < TOUR_PANEL_COLS; col++) {
      const sample = {
        colour: TOUR_PANEL_GEMS[row][col],
        spin: 0,
        special: "none",
        blighted: false,
        glintPhase: (row * TOUR_PANEL_COLS + col) * 0.4
      };
      const centreX = col * panel.cell + panel.cell / 2;
      const centreY = row * panel.cell + panel.cell / 2;
      drawGem(sample, centreX, centreY, radius, true);
    }
  }

  ctx.restore();
  ctx = boardCtx;
  graphics.mode = wasMode;
  shimmer.enabled = wasShimmer;
}

function drawTourPanels() {
  for (let i = 0; i < tourPanelCanvases.length; i++) {
    drawTourPanel(tourPanelCanvases[i]);
  }
}

tourNext.addEventListener("click", function () { ensureAudio(); stepTour(1); });
tourBack.addEventListener("click", function () { ensureAudio(); stepTour(-1); });
tourSkip.addEventListener("click", function () { ensureAudio(); finishSettingsTour(); });

/* The rules are long enough to need their own screen. Reached from the
   main menu and from a paused game, so it remembers which way is back. */
let helpReturnsTo = "mainMenu";

/* Reached from a paused game it shows that mode's rules, because those
   are the rules the player is actually under. Reached from the main
   menu there is no mode in play, so it shows what is true in all of
   them. */
function showHelpScreen(returnTo) {
  helpReturnsTo = returnTo;

  if (returnTo === "pauseMenu") {
    const mode = activeMode();
    helpSubtitle.textContent = mode.name;
    helpRules.innerHTML = mode.rulesHtml();
  } else {
    helpSubtitle.textContent = "PRISM PURGE";
    helpRules.innerHTML = howToPlayHtml(STANDARD_LINK_RULES, true);
  }

  helpRules.scrollTop = 0;
  showScreen("help");
}

function leaveHelpScreen() {
  if (helpReturnsTo === "pauseMenu") {
    showScreen("playing");
    openMenu();
    return;
  }
  showMainMenu();
}

/* Leaving a run, however it ended. The board is left standing behind the
   screen because nothing looks at it again until the next run builds a
   fresh one. */
function quitToMainMenu() {
  closeMenu();
  showMainMenu();
}

function enterRun(modeId, difficulty) {
  startRun(modeId, difficulty);
  showScreen("playing");
}

function enterSavedRun(payload) {
  loadGame(payload);
  showScreen("playing");
}

/* Both the front end and the pause menu offer fullscreen, and the label
   has to say which way the button goes on each of them. */
function refreshFullscreenLabels() {
  const label = document.fullscreenElement === null ? "Fullscreen" : "Leave Fullscreen";
  const shown = fullscreenSupported === true ? "block" : "none";

  mainFull.textContent = label;
  mainFull.style.display = shown;
  menuFull.textContent = label;
  menuFull.style.display = shown;
}

mainPlay.addEventListener("click", function () {
  ensureAudio();

  /* The board is built on its first real measurement, and starting a run
     from a screen that has never been laid out would find no board to
     start it on. */
  if (boardReady === false) {
    measureStage();
  }

  /* Once, before the first game, and never again. */
  if (tourShouldRun() === true) {
    startSettingsTour();
    return;
  }

  showModeSelect();
});

mainSettings.addEventListener("click", function () {
  ensureAudio();
  showSettingsPage("mainMenu");
  menuPanel.classList.remove("hidden");
});

mainHelp.addEventListener("click", function () { showHelpScreen("mainMenu"); });
mainFull.addEventListener("click", toggleFullscreen);

modeSelectBack.addEventListener("click", showMainMenu);
modeStartBack.addEventListener("click", showModeSelect);
helpBack.addEventListener("click", leaveHelpScreen);

modeContinue.addEventListener("click", function () {
  ensureAudio();
  enterSavedRun(modeStartSave);
});

/* Both buttons act on the picked difficulty, which is the one whose run
   Continue is offering and the one New Game would replace. The other two
   difficulties keep whatever they were holding. */
modeNewGame.addEventListener("click", function () {
  ensureAudio();

  if (modeStartSave !== null && modeStartConfirming === false) {
    modeStartConfirming = true;
    refreshModeStartButtons();
    return;
  }

  clearSaveFor(modeStartMode, pickedDifficulty);
  enterRun(modeStartMode, pickedDifficulty);
});

modeNewGameCancel.addEventListener("click", function () {
  ensureAudio();
  modeStartConfirming = false;
  refreshModeStartButtons();
});

/* ------------------------------------------------------------------
   Menu
   ------------------------------------------------------------------ */

function menuIsOpen() {
  return menuPanel.classList.contains("hidden") === false;
}

/* The panel's pages share one card. Opening it and closing it
   both land on the main page, so it never comes back halfway inside a
   submenu the player walked away from. */
function showMenuMain() {
  BackgroundHandler.close();
  menuTitle.textContent = "Paused";
  settingsPage.classList.add("hidden");
  menuMain.classList.remove("hidden");
}

/* Where Back leads out of the settings page. The pause menu and the main
   menu both open it, and each needs its own way out. */
let settingsReturnsTo = "pauseMenu";

function showSettingsPage(returnTo) {
  BackgroundHandler.close();
  settingsReturnsTo = returnTo;
  setMusicForScreen("settings");
  menuTitle.textContent = "Settings";
  menuMain.classList.add("hidden");
  settingsPage.classList.remove("hidden");
  refreshSettingsPage();
}

/* Reached from the main menu, the panel is floating over a screen and
   Back simply drops it. Reached from a paused game, Back is one level up
   into the pause menu it came from. */
function leaveSettingsPage() {
  if (settingsReturnsTo === "mainMenu") {
    menuPanel.classList.add("hidden");
    setMusicForScreen("mainMenu");
    return;
  }
  showMenuMain();
}

async function toggleFullscreen() {
  if (document.fullscreenElement === null) {
    await document.documentElement.requestFullscreen();
    await requestPortraitLock();
    measureStageAfterTurn();
  } else {
    await document.exitFullscreen();
  }
}

function settingsPageIsOpen() {
  return settingsPage.classList.contains("hidden") === false;
}

/* Pushes the current settings onto the controls. Called when the page
   opens and after anything changes them, so the toggles, the sliders
   and the numbers beside them can never end up disagreeing. */
function refreshSettingsPage() {
  const sfxPercent = Math.round(sound.volume * 100);
  const musicPercent = Math.round(music.volume * 100);

  if (graphics.mode === GRAPHICS_HD) {
    graphicsToggle.textContent = "Graphics: HD";
    graphicsNote.textContent = "Cut gems with facets, dispersion and glints.";
  } else {
    graphicsToggle.textContent = "Graphics: Standard";
    graphicsNote.textContent = "Flat gems. Lighter work for an older device.";
  }

  /* The shimmer is HD's alone, so on Standard the button goes quiet and
     the note says why, in place of a switch that would do nothing. */
  shimmerToggle.textContent = shimmer.enabled === true ? "Shimmer: On" : "Shimmer: Off";
  shimmerToggle.disabled = graphics.mode !== GRAPHICS_HD;

  if (graphics.mode === GRAPHICS_HD) {
    shimmerNote.textContent = "Sweeping light and a breathing highlight on every stone.";
  } else {
    shimmerNote.textContent = "Standard gems hold still already.";
  }

  /* Until the player picks a number, the slider shows the one the level
     is using and says where it came from. */
  hintToggle.textContent = hints.enabled === true ? "Hints: On" : "Hints: Off";
  hintSlider.value = String(hintDelaySeconds());
  hintReadout.textContent = hintDelaySeconds() + "s" + (hints.delayChosen === true ? "" : " auto");
  setChannelMuted(hintGroup, hints.enabled === false);

  sfxToggle.textContent = sound.enabled === true ? "SFX: On" : "SFX: Off";
  sfxSlider.value = String(sfxPercent);
  sfxReadout.textContent = sfxPercent + "%";
  setChannelMuted(sfxGroup, sound.enabled === false);

  musicToggle.textContent = music.enabled === true ? "Music: On" : "Music: Off";
  musicSlider.value = String(musicPercent);
  musicReadout.textContent = musicPercent + "%";
  setChannelMuted(musicGroup, music.enabled === false);

  refreshMusicNote();
}

function setChannelMuted(group, muted) {
  if (muted === true) {
    group.classList.add("off");
  } else {
    group.classList.remove("off");
  }
}

function refreshMusicNote() {
  if (music.fileFailed === false) {
    musicNote.classList.add("hidden");
    return;
  }

  musicNote.textContent = "The music file would not load, so the game is running " +
    "without it. Opening the game from a web address instead of a file on the " +
    "device usually fixes it.";
  musicNote.classList.remove("hidden");
}

function openMenu() {
  if (screens.current !== "playing") return;
  if (overlay.classList.contains("hidden") === false) return;

  ensureAudio();
  showMenuMain();
  refreshFullscreenLabels();
  menuPanel.classList.remove("hidden");
}

function closeMenu() {
  menuPanel.classList.add("hidden");
  showMenuMain();
}

function toggleMenu() {
  if (menuIsOpen() === true) {
    closeMenu();
  } else {
    openMenu();
  }
}

menuBtn.addEventListener("click", toggleMenu);
menuResume.addEventListener("click", closeMenu);

/* Asking for a hint works whatever the setting says. Turning hints off
   stops the game offering them unprompted; it does not take the button
   away from a player who has just tapped it. */
hintBtn.addEventListener("click", function () {
  ensureAudio();

  /* Tapping while the trail is up puts it away and leaves the bulb on:
     the move has not gone anywhere, it is just off the board. */
  if (hints.showing === true) {
    hints.showing = false;
    hints.idleSeconds = 0;
    updateItemBar();
    return;
  }

  showHint();
});

hintToggle.addEventListener("click", function () {
  hints.enabled = hints.enabled === false;
  refreshSettingsPage();
  saveSettings();
});

/* Moving the slider at all is the player taking the delay over from the
   level, so it stays where they put it from then on. */
hintSlider.addEventListener("input", function () {
  hints.delayChosen = true;
  hints.delaySeconds = Number(hintSlider.value);
  hints.idleSeconds = 0;
  hintReadout.textContent = hints.delaySeconds + "s";
});

hintSlider.addEventListener("change", saveSettings);

menuSettings.addEventListener("click", function () { showSettingsPage("pauseMenu"); });
settingsBack.addEventListener("click", leaveSettingsPage);

/* The chrome is a class on #app, so switching appearance is one class
   and the whole stylesheet follows. The board is redrawn every frame so
   the stones and the tray change on their own; the HUD is DOM and has
   to be asked, which is what refreshHud does. It rebuilds the goal line
   from the icon cache, which is keyed by appearance, and puts the fuel
   and the stripe back where the new appearance wants them. */
function applyGraphicsMode() {
  if (graphics.mode === GRAPHICS_HD) {
    app.classList.add("hdChrome");
  } else {
    app.classList.remove("hdChrome");
  }

  /* Nothing to refresh before the board exists. Startup calls refreshHud
     itself once it does. */
  if (boardReady === true) refreshHud();
}

graphicsToggle.addEventListener("click", function () {
  if (graphics.mode === GRAPHICS_HD) {
    graphics.mode = GRAPHICS_STANDARD;
  } else {
    graphics.mode = GRAPHICS_HD;
  }

  applyGraphicsMode();
  refreshSettingsPage();
  saveSettings();
});

shimmerToggle.addEventListener("click", function () {
  shimmer.enabled = shimmer.enabled === false;

  /* The goal line icon is cached under the shimmer setting, so the line
     has to be rebuilt to pick up the picture drawn under the new one.
     Nothing to rebuild before the board exists. */
  if (boardReady === true) refreshHud();

  refreshSettingsPage();
  saveSettings();
});

sfxToggle.addEventListener("click", function () {
  sound.enabled = sound.enabled === false;
  refreshSettingsPage();
  saveSettings();

  /* Switching effects back on plays one, so the player hears the level
     they are set to instead of taking the label's word for it. */
  if (sound.enabled === true) playTone(660, 0.12, "triangle", 0.14);
});

sfxSlider.addEventListener("input", function () {
  sound.volume = Number(sfxSlider.value) / 100;
  sfxReadout.textContent = sfxSlider.value + "%";
  applySfxVolume();
});

/* The sample tone and the write to storage both wait for the finger to
   come off. A drag fires input on every pixel it crosses, and neither
   a burst of beeps nor a burst of writes is wanted. */
sfxSlider.addEventListener("change", function () {
  saveSettings();
  if (sound.enabled === true) playTone(660, 0.12, "triangle", 0.14);
});

musicToggle.addEventListener("click", function () {
  music.enabled = music.enabled === false;
  refreshSettingsPage();
  saveSettings();

  /* Turning music back on starts the track selected by the current
     screen or Settings overlay. */
  syncMusic();
});

musicSlider.addEventListener("input", function () {
  music.volume = Number(musicSlider.value) / 100;
  musicReadout.textContent = musicSlider.value + "%";
  applyMusicVolume();
});

musicSlider.addEventListener("change", saveSettings);

menuFull.addEventListener("click", function () {
  toggleFullscreen();
  closeMenu();
});

menuHelp.addEventListener("click", function () {
  closeMenu();
  showHelpScreen("pauseMenu");
});

menuSave.addEventListener("click", function () {
  saveGame();
  closeMenu();
  showToast("SAVED", "#45e08a");
});

menuSaveQuit.addEventListener("click", function () {
  saveGame();
  quitToMainMenu();
});

menuQuit.addEventListener("click", function () {
  clearSaveFor(game.modeId, game.difficulty);
  quitToMainMenu();
});

/* Escape on a keyboard, the menu button anywhere, and the Android back
   gesture all reach the same panel. Back needs a history entry of its
   own to have something to pop. */
window.addEventListener("keydown", function (event) {
  if (event.key !== "Escape") return;
  event.preventDefault();
  menuBack();
});

window.history.pushState({ prismPath: true }, "");
window.addEventListener("popstate", function () {
  window.history.pushState({ prismPath: true }, "");
  menuBack();
});

/* Escape and the back gesture both mean "up one level", and what one
   level up is depends on where the player is standing. The main menu is
   the top, so there is nowhere further to go from it. */
function menuBack() {
  if (menuIsOpen() === true && BackgroundHandler.isOpen()) {
    showSettingsPage(settingsReturnsTo);
    return;
  }
  if (menuIsOpen() === true && settingsPageIsOpen() === true) {
    leaveSettingsPage();
    return;
  }
  if (menuIsOpen() === true) {
    closeMenu();
    return;
  }

  if (screens.current === "help") { leaveHelpScreen(); return; }
  if (screens.current === "settingsTour") { stepTour(-1); return; }
  if (screens.current === "modeStart") {
    if (modeStartConfirming === true) {
      modeStartConfirming = false;
      refreshModeStartButtons();
      return;
    }
    showModeSelect();
    return;
  }
  if (screens.current === "modeSelect") { showMainMenu(); return; }
  if (screens.current === "mainMenu") return;

  openMenu();
}

/* =====================================================================
   OrientationHandler
   Owns: a portrait-only request after fullscreen entry, and a delayed
   measurement after orientation changes. Portrait includes the reverse
   orientation on devices that support it. A refused request leaves the
   browser's orientation behavior alone.
   Stays out of: startup, layout, drawing, input and on-screen messages.
   ===================================================================== */

const GAME_ORIENTATION = "portrait";

const screenOrientationSupported = window.screen.orientation !== undefined &&
  window.screen.orientation !== null;
const orientationLockSupported = screenOrientationSupported === true &&
  typeof window.screen.orientation.lock === "function";

async function requestPortraitLock() {
  if (orientationLockSupported === false) return;
  // Fullscreen may have ended while its entry promise was settling.
  if (document.fullscreenElement === null) return;

  try {
    await window.screen.orientation.lock(GAME_ORIENTATION);
  } catch (refusal) {
    /* Unsupported requests and a document leaving fullscreen need no UI.
       Unexpected programming failures still reach developer tools. */
    if (refusal.name === "NotSupportedError" || refusal.name === "SecurityError" ||
        refusal.name === "AbortError" || refusal.name === "InvalidStateError") return;
    throw refusal;
  }
}

/* Preserve the original delayed measurement as well as ResizeObserver.
   Both orientation events can report the same turn, so share one timer. */
let orientationMeasureTimer = null;

function measureStageAfterTurn() {
  window.clearTimeout(orientationMeasureTimer);
  orientationMeasureTimer = window.setTimeout(function () {
    orientationMeasureTimer = null;
    measureStage();
  }, 200);
}

window.addEventListener("orientationchange", measureStageAfterTurn);
if (screenOrientationSupported === true) {
  window.screen.orientation.addEventListener("change", measureStageAfterTurn);
}

const fullscreenSupported = typeof document.documentElement.requestFullscreen === "function";

document.addEventListener("fullscreenchange", function () {
  window.setTimeout(measureStage, 120);
  refreshFullscreenLabels();
});

/* ------------------------------------------------------------------
   Boot
   ------------------------------------------------------------------ */

/* The stage can measure zero while the page is still laying out or
   while the tab is hidden, so the board is built on the first real
   measurement. */
let boardReady = false;

/* How tall the top of the screen comes out in each of its two layouts.
   Both are read once, by wearing each in turn, so that choosing between
   them later is arithmetic rather than a round of measure, swap and
   measure again. */
let tallHudHeight = 0;
let compactHudHeight = 0;

function measureHudHeights() {
  const wasCompact = app.classList.contains("compactHud");

  app.classList.remove("compactHud");
  tallHudHeight = hud.getBoundingClientRect().height;

  app.classList.add("compactHud");
  compactHudHeight = hud.getBoundingClientRect().height;

  if (wasCompact === false) app.classList.remove("compactHud");
}

/* The board is nine rows of seven, and on a tall phone it is its width
   that decides how big a cell can be: there is height left over that no
   number of rows can use. Where that is true the roomy layout is free,
   because the height it takes was never going to reach the board.

   So the question is only ever whether the board would still be as wide
   as it can be. If it would, wear the roomy one. If the extra height
   would start eating into cell size, drop to the compact one.

   The test is written against the roomy layout whichever one is being
   worn at the time, so it lands on the same answer either way and
   cannot flip back and forth between the two. */
function chooseHudSize() {
  const rect = stage.getBoundingClientRect();
  const worn = app.classList.contains("compactHud") ? compactHudHeight : tallHudHeight;
  const stageIfTall = rect.height + worn - tallHudHeight;

  const cellByWidth = Math.floor(rect.width / COLS);
  const cellByHeightIfTall = Math.floor(stageIfTall / ROWS);

  if (cellByHeightIfTall >= cellByWidth) {
    app.classList.remove("compactHud");
  } else {
    app.classList.add("compactHud");
  }
}

function measureStage() {
  const rect = stage.getBoundingClientRect();
  if (rect.width < 1 || rect.height < 1) return;

  chooseHudSize();

  if (boardReady === false) {
    resizeCanvas();
    buildBoard();
    game.goal = activeMode().makeGoalForLevel(1);
    boardReady = true;
    refreshHud();
    return;
  }

  /* A resize after the run started only rescales. The board itself is
     left alone. */

  resizeCanvas();
}

const stageObserver = new ResizeObserver(measureStage);
stageObserver.observe(stage);

/* Blocks the pinch-zoom and double tap zoom that ruin drag controls. */
document.addEventListener("gesturestart", function (event) { event.preventDefault(); });
document.addEventListener("dblclick", function (event) { event.preventDefault(); });

migrateLegacyStorage();
migratePerModeSaves();
loadSettings();
BackgroundHandler.init();
applyGraphicsMode();
refreshSettingsPage();
buildDifficultyRow();
buildCustomEditor();
measureHudHeights();
measureStage();
showMainMenu();
window.requestAnimationFrame(frame);

</script>
</body>
