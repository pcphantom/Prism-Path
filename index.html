<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0714">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Prism Path</title>
<style>
  :root {
    --bg-deep: #08061199;
    --panel: rgba(24, 18, 44, 0.82);
    --panel-edge: rgba(150, 120, 255, 0.28);
    --ink: #efe9ff;
    --ink-dim: #a99fc9;
    --accent: #b07cff;
    --danger: #ff5470;
    --good: #45e08a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #06040d;
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: calc(6px + var(--safe-top)) 8px calc(6px + var(--safe-bottom)) 8px;
    gap: 6px;
  }

  /* ---------------------------------------------------------------- HUD */

  #hud {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  #topRow {
    display: flex;
    align-items: stretch;
    gap: 6px;
  }

  .stat {
    flex: 1 1 0;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 5px 8px;
    min-width: 0;
  }

  .stat .label {
    font-size: 10px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .stat .value {
    font-size: 20px;
    font-weight: bold;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stat .value.small { font-size: 15px; }

  #movesStat.low .value { color: var(--danger); }

  #goalBar {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 0 0 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
  }

  #goalText {
    font-size: 13px;
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #goalCount {
    font-size: 13px;
    font-weight: bold;
    color: var(--accent);
    flex: 0 0 auto;
  }

  #goalTrack {
    flex: 0 0 90px;
    height: 8px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }

  #goalFill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #7c5cff, #45e08a);
    transition: width 0.25s ease-out;
  }

  /* -------------------------------------------------------------- stage */

  #stage {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #board {
    display: block;
    touch-action: none;
  }

  /* ----------------------------------------------------------- controls */

  #controls {
    flex: 0 0 auto;
    display: flex;
    gap: 6px;
    align-items: stretch;
  }

  button {
    font-family: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 9px 6px;
    font-size: 12px;
    letter-spacing: 0.6px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
  }

  button:active { transform: scale(0.94); }

  .iconBtn {
    flex: 0 0 52px;
    font-size: 18px;
    padding: 8px 0;
  }

  /* Full height of the goal bar, and wide enough to hit with a
     thumb without looking. */
  #menuBtn {
    flex: 0 0 auto;
    align-self: stretch;
    width: 52px;
    padding: 0;
    font-size: 21px;
    line-height: 1;
    border-radius: 0 11px 11px 0;
    border: 0;
    border-left: 1px solid var(--panel-edge);
    background: rgba(255, 255, 255, 0.07);
  }

  #menuBtn:active { background: rgba(255, 255, 255, 0.16); }

  #controls {
    flex-direction: column;
    gap: 4px;
  }

  #chargeRow {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 2px;
  }

  #chargeLabel,
  #chargeValue {
    flex: 0 0 auto;
    font-size: 10px;
    letter-spacing: 1.2px;
    color: var(--ink-dim);
  }

  #chargeValue {
    font-weight: bold;
    color: var(--ink);
    min-width: 44px;
    text-align: right;
  }

  #chargeTrack {
    position: relative;
    flex: 1 1 auto;
    height: 14px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  #chargeFill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #7c5cff, #4fd6ff, #45e08a);
    transition: width 0.25s ease-out;
  }

  /* One notch per item, so the bar shows how close the next one is. */
  #chargeTicks {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .chargeTick {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    margin-left: -1px;
    background: rgba(10, 6, 20, 0.75);
  }

  .chargeTick.reached { background: rgba(255, 255, 255, 0.85); }

  #itemRow {
    display: flex;
    gap: 5px;
  }

  .itemBtn {
    flex: 1 1 0;
    min-width: 0;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 2px;
    opacity: 0.4;
  }

  .itemBtn .glyph { font-size: 22px; line-height: 1; }

  .itemBtn .name {
    font-size: 10px;
    line-height: 1;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .itemBtn .cost { display: none; }

  .itemBtn.ready {
    opacity: 1;
    border-color: rgba(176, 124, 255, 0.6);
    background: rgba(124, 92, 255, 0.16);
  }

  .itemBtn.armed {
    opacity: 1;
    color: #fff;
    border-color: var(--good);
    background: rgba(69, 224, 138, 0.22);
    animation: pulse 1.1s ease-in-out infinite;
  }

  /* ------------------------------------------------------------ menu */

  #menuPanel {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(6, 4, 13, 0.9);
    backdrop-filter: blur(3px);
    z-index: 20;
  }

  #menuPanel.hidden { display: none; }

  #menuCard {
    width: 100%;
    max-width: 300px;
    background: linear-gradient(160deg, rgba(40, 28, 74, 0.96), rgba(18, 12, 34, 0.96));
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
  }

  #menuCard h2 {
    margin: 0 0 12px 0;
    font-size: 19px;
    text-align: center;
    letter-spacing: 1px;
    color: var(--ink);
  }

  .menuItem {
    display: block;
    width: 100%;
    margin-bottom: 7px;
    padding: 11px;
    font-size: 14px;
    text-align: center;
  }

  .menuItem.danger { color: var(--danger); border-color: rgba(255, 84, 112, 0.4); }

  /* ------------------------------------------------- sounds submenu */

  #menuMain.hidden, #soundsPage.hidden { display: none; }

  /* One channel per box, so the toggle and the slider that belong
     together read as a pair. */
  .soundGroup {
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    padding: 10px;
    margin-bottom: 9px;
  }

  .soundGroup .menuItem { margin-bottom: 0; }

  .sliderRow {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 10px;
  }

  .sliderLabel {
    flex: 0 0 auto;
    font-size: 10px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .sliderRow output {
    flex: 0 0 36px;
    text-align: right;
    font-size: 12px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  /* A muted channel keeps its slider on screen so the level stays
     readable, and dims it to say it is doing nothing right now. */
  .soundGroup.off .sliderRow { opacity: 0.38; }

  input[type="range"] {
    flex: 1 1 auto;
    min-width: 0;
    height: 22px;
    margin: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid var(--panel-edge);
  }

  input[type="range"]::-webkit-slider-thumb {
    width: 18px;
    height: 18px;
    margin-top: -7px;
    border-radius: 50%;
    background: var(--accent);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 8px rgba(176, 124, 255, 0.55);
    -webkit-appearance: none;
    appearance: none;
  }

  input[type="range"]::-moz-range-track {
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid var(--panel-edge);
  }

  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 8px rgba(176, 124, 255, 0.55);
  }

  /* Printed in the sounds panel when the music file will not load, so
     the player learns why it is silent instead of guessing. */
  #musicNote {
    margin: 0 0 10px 0;
    font-size: 11px;
    line-height: 1.4;
    text-align: center;
    color: var(--danger);
  }

  #musicNote.hidden { display: none; }

  #cardBtnAlt {
    width: 100%;
    margin-top: 8px;
    padding: 11px;
    font-size: 14px;
  }

  #cardBtnAlt.hidden { display: none; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(176, 124, 255, 0.5); }
    50%      { box-shadow: 0 0 16px 3px rgba(176, 124, 255, 0.5); }
  }

  /* ---------------------------------------------------------- overlays */

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(6, 4, 13, 0.86);
    backdrop-filter: blur(3px);
    z-index: 10;
  }

  #overlay.hidden { display: none; }

  #card {
    width: 100%;
    max-width: 340px;
    background: linear-gradient(160deg, rgba(40, 28, 74, 0.96), rgba(18, 12, 34, 0.96));
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 20px 18px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
  }

  #cardTitle {
    font-size: 27px;
    margin: 0 0 4px 0;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff6ea9, #b07cff, #4fd6ff, #45e08a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  #cardSub {
    font-size: 13px;
    color: var(--ink-dim);
    margin: 0 0 14px 0;
  }

  #cardBody {
    font-size: 13px;
    line-height: 1.55;
    text-align: left;
    color: #d9d2f2;
    margin-bottom: 16px;
  }

  #cardBody b { color: #fff; }

  #cardBody .rule {
    display: flex;
    gap: 8px;
    margin-bottom: 7px;
    align-items: baseline;
  }

  #cardBody .rule .pip {
    flex: 0 0 auto;
    font-size: 14px;
  }

  #cardBtn {
    width: 100%;
    padding: 13px;
    font-size: 16px;
    font-weight: bold;
    background: linear-gradient(90deg, #7c5cff, #b07cff);
    border-color: transparent;
  }

  #cardStats {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-bottom: 15px;
  }

  #cardStats div { text-align: center; }
  #cardStats .n { font-size: 23px; font-weight: bold; }
  #cardStats .k {
    font-size: 10px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }

  #toast {
    position: absolute;
    left: 50%;
    top: 14%;
    transform: translate(-50%, 0);
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;
    pointer-events: none;
    opacity: 0;
    z-index: 5;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    white-space: nowrap;
  }

  @media (min-width: 620px) {
    #app { max-width: 520px; margin: 0 auto; }
  }
</style>
</head>
<body>

<div id="app">

  <div id="hud">
    <div id="topRow">
      <div class="stat">
        <div class="label">Score</div>
        <div class="value" id="scoreValue">0</div>
      </div>
      <div class="stat" id="movesStat">
        <div class="label">Moves</div>
        <div class="value" id="movesValue">20</div>
      </div>
      <div class="stat">
        <div class="label">Level</div>
        <div class="value" id="levelValue">1</div>
      </div>
    </div>
    <div id="goalBar">
      <div id="goalText">Link 20 red gems</div>
      <div id="goalTrack"><div id="goalFill"></div></div>
      <div id="goalCount">0/20</div>
      <button id="menuBtn" title="Menu" aria-label="Menu">&#9776;</button>
    </div>
  </div>

  <div id="stage">
    <canvas id="board"></canvas>
    <div id="toast"></div>
    <div id="menuPanel" class="hidden">
      <div id="menuCard">
        <h2 id="menuTitle">Paused</h2>

        <div id="menuMain">
          <button class="menuItem" id="menuResume">Resume</button>
          <button class="menuItem" id="menuSounds">Sounds</button>
          <button class="menuItem" id="menuFull">Fullscreen</button>
          <button class="menuItem" id="menuHelp">How to Play</button>
          <button class="menuItem" id="menuSave">Save</button>
          <button class="menuItem" id="menuSaveQuit">Save and Quit</button>
          <button class="menuItem danger" id="menuQuit">Quit without Saving</button>
        </div>

        <div id="soundsPage" class="hidden">
          <p id="musicNote" class="hidden"></p>

          <div class="soundGroup" id="sfxGroup">
            <button class="menuItem" id="sfxToggle">SFX: On</button>
            <div class="sliderRow">
              <span class="sliderLabel">Vol</span>
              <input type="range" id="sfxSlider" min="0" max="100" step="1" value="100" aria-label="SFX volume">
              <output id="sfxReadout">100%</output>
            </div>
          </div>

          <div class="soundGroup" id="musicGroup">
            <button class="menuItem" id="musicToggle">Music: On</button>
            <div class="sliderRow">
              <span class="sliderLabel">Vol</span>
              <input type="range" id="musicSlider" min="0" max="100" step="1" value="60" aria-label="Music volume">
              <output id="musicReadout">60%</output>
            </div>
          </div>

          <button class="menuItem" id="soundsBack">Back</button>
        </div>
      </div>
    </div>

    <div id="overlay" class="hidden">
      <div id="card">
        <h1 id="cardTitle"></h1>
        <p id="cardSub"></p>
        <div id="cardStats" style="display:none">
          <div><div class="n" id="finalScore">0</div><div class="k">Score</div></div>
          <div><div class="n" id="bestScore">0</div><div class="k">Best</div></div>
        </div>
        <div id="cardBody"></div>
        <button id="cardBtn"></button>
        <button id="cardBtnAlt" class="hidden"></button>
      </div>
    </div>
  </div>

  <div id="controls">
    <div id="chargeRow">
      <span id="chargeLabel">CHARGE</span>
      <div id="chargeTrack">
        <div id="chargeFill"></div>
        <div id="chargeTicks"></div>
      </div>
      <span id="chargeValue">0/36</span>
    </div>
    <div id="itemRow"></div>
  </div>

</div>

<script>
"use strict";

/* ==================================================================
   Prism Path
   A single file connect-and-purge puzzle game.

   Rules in short:
     - Drag across touching gems of the same colour to link them.
     - Release with 3 or more linked and they burst.
     - Cross your own path to close a loop: every gem of that colour
       on the board is wiped out.
     - 5 or 6 linked forges a Bomb. 7 or more forges a Prism.
     - The Blight creeps across the board and ends the run if it
       takes fifteen cells. Linking a blighted gem cures it.
   ================================================================== */

/* ------------------------------------------------------------------
   Board constants
   ------------------------------------------------------------------ */

const COLS = 7;

/* Rows are chosen once at boot so a tall phone gets a taller board
   and fills the height it has. Everything that could otherwise drift
   with board size is proportional to it: the stone cap and the blight
   threshold both scale. */
let ROWS = 8;

const GEM_COLOURS = [
  { name: "red",    core: "#ff5470", rim: "#ffb3c0", glow: "#ff2f55", shape: "circle"   },
  { name: "amber",  core: "#ffab35", rim: "#ffe0a8", glow: "#ff8a00", shape: "diamond"  },
  { name: "green",  core: "#45e08a", rim: "#b6ffd6", glow: "#12c568", shape: "square"   },
  { name: "blue",   core: "#3fb0ff", rim: "#b8e4ff", glow: "#0d84e8", shape: "triangle" },
  { name: "violet", core: "#b07cff", rim: "#e2ccff", glow: "#8b4dff", shape: "hexagon"  }
];

/* Fraction of a cell that responds to a touch. Anything below 0.707
   keeps diagonal drags from clipping their neighbours. */
const HIT_RADIUS = 0.55;

const MIN_LINK = 3;
const BOMB_LINK = 5;      // linking this many forges a bomb
const PRISM_LINK = 7;     // linking this many forges a prism

/* How long a gem spends bursting before it leaves the board. */
const BURST_SECONDS = 0.24;

/* A board wide clear does not go off all at once. Every cell waits
   this long per cell of distance from the middle of the loop, so the
   clear reads as a wave rolling outwards. */
const WAVE_SECONDS_PER_CELL = 0.05;

/* A bomb clears the eight cells around it and cracks a stone once. A
   bomb caught inside a closed loop reaches three cells in every
   direction and cracks a stone three times. */
const BOMB_BLAST_RADIUS = 1;
const TRIPLE_BLAST_RADIUS = 3;
const BOMB_STONE_DAMAGE = 1;
const TRIPLE_STONE_DAMAGE = 3;
/* The board is between 8 and 12 rows depending on the screen, so a
   flat blight threshold would make small phones harder than large
   ones. Scaling it keeps the pressure the same everywhere. */
function blightLossThreshold() {
  return Math.max(8, Math.round(ROWS * COLS * 0.14));
}

/* Blight carried between levels always leaves headroom, so a new level
   can never open already lost. */
function blightCarryCap() {
  return blightLossThreshold() - 3;
}

/* One shared meter pays for every item. The differing costs are the
   whole decision: spend small and often, or bank for the big one. */
const CHARGE_MAX = 36;
const ITEMS = [
  { id: "shuffle", cost: 8,  glyph: "↻", label: "Shuffle", aims: false },
  { id: "bomb",    cost: 12, glyph: "✹", label: "Bomb",    aims: true  },
  { id: "moves",   cost: 20, glyph: "⇧", label: "+2 Move", aims: false },
  { id: "purge",   cost: 36, glyph: "◈", label: "Purge",   aims: true  }
];

const CONTINUES_AT_START = 3;
const CONTINUE_EVERY_LEVELS = 10;

const SAVE_KEY = "prismPathSave";
const BEST_KEY = "prismPathBest";
const SETTINGS_KEY = "prismPathAudio";

/* How many colours are in play at each level. Fewer colours early on
   makes the opening levels forgiving. */
function coloursForLevel(level) {
  if (level <= 1) return 4;
  return 5;
}

/* ------------------------------------------------------------------
   Cell factories
   ------------------------------------------------------------------ */

function makeGem(colourIndex) {
  return {
    kind: "gem",
    colour: colourIndex,
    special: "none",     // "none" | "bomb" | "prism"
    blighted: false,
    hp: 0,
    offsetY: 0,          // pixels above its resting place while falling
    fallSpeed: 0,
    scale: 0,            // grows to 1 on spawn
    spin: 0,
    doomed: false,       // marked for removal once the burst finishes
    dying: 0,            // seconds left in the burst animation
    dyingMax: BURST_SECONDS,
    dyingDelay: 0        // seconds to wait before that burst starts
  };
}

function makeStone(hp) {
  return {
    kind: "stone",
    colour: -1,
    special: "none",
    blighted: false,
    hp: hp,
    maxHp: hp,
    offsetY: 0,
    fallSpeed: 0,
    scale: 0,
    spin: 0,
    doomed: false,
    dying: 0,
    dyingMax: BURST_SECONDS,
    dyingDelay: 0
  };
}

/* ------------------------------------------------------------------
   Global game state
   ------------------------------------------------------------------ */

const game = {
  board: [],
  phase: "title",        // "title" | "idle" | "bursting" | "falling" | "over" | "levelDone"
  path: [],              // list of {row, col} making up the current link
  pathColour: -1,
  loopClosed: false,
  score: 0,
  level: 1,
  moves: 20,
  bestScore: 0,
  charge: 0,
  aiming: "none",        // "none" | an item id awaiting a tap on the board
  movesSinceBlight: 0,
  goal: null,
  burstTimer: 0,
  shake: 0,
  time: 0,
  continues: CONTINUES_AT_START,
  scoreAtLevelStart: 0,  // what a continue rewinds your score to
  blightCarry: 0         // blight that follows you into the next level
};

const particles = [];
const floaters = [];

/* ------------------------------------------------------------------
   DOM handles
   ------------------------------------------------------------------ */

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const scoreValue = document.getElementById("scoreValue");
const movesValue = document.getElementById("movesValue");
const movesStat = document.getElementById("movesStat");
const levelValue = document.getElementById("levelValue");

/* ------------------------------------------------------------------
   Sound: everything is synthesised, no audio files needed
   ------------------------------------------------------------------ */

/* Headroom trim on the whole effects bus. Every synth voice below was
   written and balanced against this figure, so the volume slider
   scales it rather than replacing it. */
const SFX_HEADROOM = 0.9;

const sound = {
  ctx: null,
  bus: null,
  enabled: true,
  volume: 1
};

function ensureAudio() {
  if (sound.ctx === null) {
    const Ctor = window.AudioContext;
    if (typeof Ctor !== "function") {
      sound.enabled = false;
      return;
    }
    sound.ctx = new Ctor();

    /* Every voice runs through one compressor. A twenty five gem break
       fires the crack, nine shards, an eight note run and a thump at
       the same moment, and straight into the destination that sums
       past full scale and clips. */
    const now = sound.ctx.currentTime;

    const limiter = sound.ctx.createDynamicsCompressor();
    limiter.threshold.setValueAtTime(-10, now);
    limiter.knee.setValueAtTime(6, now);
    limiter.ratio.setValueAtTime(12, now);
    limiter.attack.setValueAtTime(0.003, now);
    limiter.release.setValueAtTime(0.18, now);

    const master = sound.ctx.createGain();
    master.gain.setValueAtTime(SFX_HEADROOM * sound.volume, now);

    master.connect(limiter);
    limiter.connect(sound.ctx.destination);
    sound.bus = master;
  }
  if (sound.ctx.state === "suspended") {
    sound.ctx.resume();
  }
}

/* Where every voice connects. Only ever called once the context is up,
   so the bus is always there by the time anything asks for it. */
function soundBus() {
  return sound.bus;
}

/* The slider moves while gems are still ringing out. Ramping over a
   few milliseconds instead of jumping keeps the change from clicking
   through whatever is mid note. Silent until the context exists,
   because ensureAudio reads the volume when it builds the bus. */
function applySfxVolume() {
  if (sound.ctx === null) return;

  sound.bus.gain.setTargetAtTime(SFX_HEADROOM * sound.volume, sound.ctx.currentTime, 0.02);
}

function playTone(frequency, duration, type, volume) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;
  const osc = sound.ctx.createOscillator();
  const gain = sound.ctx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(frequency, now);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(volume, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

  osc.connect(gain);
  gain.connect(soundBus());
  osc.start(now);
  osc.stop(now + duration + 0.02);
}

/* Each extra gem in a link steps the note up a semitone, so a long
   chain plays as a rising run. */
function playLinkNote(step) {
  const base = 294;
  const frequency = base * Math.pow(2, step / 12);
  playTone(frequency, 0.16, "triangle", 0.16);
}

function playNoiseHit(volume) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;
  const length = Math.floor(sound.ctx.sampleRate * 0.22);
  const buffer = sound.ctx.createBuffer(1, length, sound.ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < length; i++) {
    const fade = 1 - i / length;
    data[i] = (Math.random() * 2 - 1) * fade * fade;
  }

  const source = sound.ctx.createBufferSource();
  const gain = sound.ctx.createGain();
  source.buffer = buffer;
  gain.gain.setValueAtTime(volume, now);

  source.connect(gain);
  gain.connect(soundBus());
  source.start(now);
}

function playFanfare() {
  const notes = [392, 494, 587, 784];
  for (let i = 0; i < notes.length; i++) {
    window.setTimeout(function () {
      playTone(notes[i], 0.3, "triangle", 0.15);
    }, i * 110);
  }
}

function playFailure() {
  const notes = [330, 262, 196, 147];
  for (let i = 0; i < notes.length; i++) {
    window.setTimeout(function () {
      playTone(notes[i], 0.42, "sawtooth", 0.12);
    }, i * 150);
  }
}

/* ---- SHATTER SOUND: BEGIN ---- */

/* A break is a spray of glass, so the sound is built the same way: a
   short noise crack for the impact, a handful of high shards ringing
   off it at random pitches, a rising run underneath, and from the
   bigger tiers a low thump for weight. Everything scales with how many
   gems went, so a five gem link and a twenty five gem sweep are
   recognisably the same sound at different sizes. */

const SHATTER_MIN_SHARDS = 3;
const SHATTER_MAX_SHARDS = 9;

/* A major pentatonic run, so any number of notes off the front of it
   still sounds like it belongs together. */
const SHATTER_RUN = [0, 2, 4, 7, 9, 12, 14, 16, 19];

function shatterShardCount(count) {
  const growth = Math.min(1, count / 26);
  const extra = Math.round((SHATTER_MAX_SHARDS - SHATTER_MIN_SHARDS) * growth);
  return SHATTER_MIN_SHARDS + extra;
}

/* The glassy part: short, high, slightly detuned sines that decay fast
   and land a few milliseconds apart, so they scatter instead of
   arriving as one chord. */
function playShards(count) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const shards = shatterShardCount(count);
  const now = sound.ctx.currentTime;

  for (let i = 0; i < shards; i++) {
    const spread = 1 + Math.random() * 1.6;
    const frequency = 1400 * spread;
    const startAt = now + i * 0.012 + Math.random() * 0.01;
    const length = 0.07 + Math.random() * 0.09;

    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(frequency, startAt);
    osc.frequency.exponentialRampToValueAtTime(frequency * 0.72, startAt + length);

    gain.gain.setValueAtTime(0, startAt);
    gain.gain.linearRampToValueAtTime(0.075, startAt + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + length);

    osc.connect(gain);
    gain.connect(soundBus());
    osc.start(startAt);
    osc.stop(startAt + length + 0.02);
  }
}

/* The crack: filtered noise, brighter and longer the bigger the break. */
function playShatterCrack(count) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const growth = Math.min(1, count / 26);
  const now = sound.ctx.currentTime;
  const length = 0.16 + growth * 0.2;
  const samples = Math.floor(sound.ctx.sampleRate * length);

  const buffer = sound.ctx.createBuffer(1, samples, sound.ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < samples; i++) {
    const fade = 1 - i / samples;
    data[i] = (Math.random() * 2 - 1) * fade * fade;
  }

  const source = sound.ctx.createBufferSource();
  source.buffer = buffer;

  /* Sweeping the filter down turns a flat hiss into something that
     reads as glass falling away. */
  const filter = sound.ctx.createBiquadFilter();
  filter.type = "highpass";
  filter.frequency.setValueAtTime(2600 + growth * 1800, now);
  filter.frequency.exponentialRampToValueAtTime(900, now + length);

  const gain = sound.ctx.createGain();
  gain.gain.setValueAtTime(0.11 + growth * 0.09, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + length);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(soundBus());
  source.start(now);
}

/* The run underneath. More gems means more of the scale, which is what
   makes a big break feel like it is still climbing after a small one
   would have finished. */
function playShatterRun(count) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const growth = Math.min(1, count / 26);
  const notes = 3 + Math.round(growth * 5);
  const step = 0.055 - growth * 0.015;

  for (let i = 0; i < notes; i++) {
    const semitone = SHATTER_RUN[i];
    const frequency = 330 * Math.pow(2, semitone / 12);

    window.setTimeout(function () {
      playTone(frequency, 0.2, "triangle", 0.09);
    }, i * step * 1000);
  }
}

/* Weight under the big ones only. A five gem link does not need it and
   would sound muddy with it. */
function playShatterThump(count) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;
  if (count < 15) return;

  const now = sound.ctx.currentTime;
  const osc = sound.ctx.createOscillator();
  const gain = sound.ctx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(96, now);
  osc.frequency.exponentialRampToValueAtTime(52, now + 0.18);

  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.2, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);

  osc.connect(gain);
  gain.connect(soundBus());
  osc.start(now);
  osc.stop(now + 0.24);
}

/* The bell that lands with the word itself, one octave per tier so the
   five milestones are telling apart with your eyes shut. */
function playMilestoneChime(tierIndex) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const base = 523 * Math.pow(2, tierIndex / 12);
  const now = sound.ctx.currentTime;

  for (let i = 0; i < 2; i++) {
    const detune = i === 0 ? 1 : 1.005;
    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(base * 2 * detune, now);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.07, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);

    osc.connect(gain);
    gain.connect(soundBus());
    osc.start(now);
    osc.stop(now + 0.75);
  }
}

/* One call for the whole break. */
function playShatter(count) {
  playShatterCrack(count);
  playShards(count);
  playShatterRun(count);
  playShatterThump(count);
}

/* ---- SHATTER SOUND: END ---- */


/* ---- LOOP SPECIAL SOUNDS: BEGIN ---- */

/* Drawing a ring around a special is the biggest thing the player can
   do, so each one gets its own voice. They all sit on the same
   pentatonic as the shatter run, so they land in key with whatever
   else is firing at the same moment. */

/* A short noise burst shaped by a filter. The workhorse under the
   heavier effects: swept down it reads as rubble, swept up it reads as
   air being pulled in. */
function playFilteredNoise(seconds, volume, filterType, startHz, endHz) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;
  const samples = Math.floor(sound.ctx.sampleRate * seconds);
  const buffer = sound.ctx.createBuffer(1, samples, sound.ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < samples; i++) {
    const fade = 1 - i / samples;
    data[i] = (Math.random() * 2 - 1) * fade;
  }

  const source = sound.ctx.createBufferSource();
  source.buffer = buffer;

  const filter = sound.ctx.createBiquadFilter();
  filter.type = filterType;
  filter.frequency.setValueAtTime(startHz, now);
  filter.frequency.exponentialRampToValueAtTime(endHz, now + seconds);

  const gain = sound.ctx.createGain();
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + seconds);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(soundBus());
  source.start(now);
}

/* A sine dropping in pitch. Weight under a blast. */
function playSubDrop(fromHz, toHz, seconds, volume) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;
  const osc = sound.ctx.createOscillator();
  const gain = sound.ctx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(fromHz, now);
  osc.frequency.exponentialRampToValueAtTime(toHz, now + seconds);

  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(volume, now + 0.014);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + seconds);

  osc.connect(gain);
  gain.connect(soundBus());
  osc.start(now);
  osc.stop(now + seconds + 0.03);
}

/* Notes off the pentatonic, played in order a fixed gap apart. */
function playRisingRun(baseHz, semitones, gapSeconds, noteSeconds, type, volume) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;

  for (let i = 0; i < semitones.length; i++) {
    const frequency = baseHz * Math.pow(2, semitones[i] / 12);
    const startAt = now + i * gapSeconds;

    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(frequency, startAt);

    gain.gain.setValueAtTime(0, startAt);
    gain.gain.linearRampToValueAtTime(volume, startAt + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + noteSeconds);

    osc.connect(gain);
    gain.connect(soundBus());
    osc.start(startAt);
    osc.stop(startAt + noteSeconds + 0.03);
  }
}

/* The ring has just closed and there is something in the middle of it.
   Three notes climbing tell the player the move is worth more than the
   loop they were expecting. */
function playLoopArmed() {
  playRisingRun(392, [0, 4, 7], 0.07, 0.26, "triangle", 0.12);
}

/* A bomb going off with three cells of reach. Same shape as the plain
   blast, longer and deeper, with the rubble arriving after the crack. */
function playTripleBlast() {
  playFilteredNoise(0.42, 0.3, "lowpass", 5200, 500);
  playSubDrop(150, 38, 0.5, 0.3);
  playRisingRun(147, [0, -5], 0.09, 0.4, "square", 0.1);
}

/* Every stone on the board going at once. All bottom end and grit, no
   melody, because stone is the one thing on this board that is not
   made of glass. */
function playStonesShatter() {
  playFilteredNoise(0.55, 0.26, "bandpass", 1800, 260);
  playSubDrop(110, 44, 0.45, 0.24);

  /* A second crunch a beat later, so it reads as a boardful of them. */
  window.setTimeout(function () {
    playFilteredNoise(0.4, 0.18, "bandpass", 1400, 220);
  }, 90);
}

/* Every blight cured. It starts as the blight's own sour sawtooth and
   resolves onto a clean bell, so the sound itself is the cure. */
function playBlightPurge() {
  playRisingRun(98, [0, 1], 0.06, 0.3, "sawtooth", 0.11);
  playFilteredNoise(0.5, 0.12, "highpass", 400, 3400);

  window.setTimeout(function () {
    playRisingRun(523, [0, 7, 12], 0.06, 0.55, "sine", 0.1);
  }, 150);
}

/* The prism nova. Air pulled in, a sub under it, seven notes climbing
   the pentatonic, then a detuned pair left ringing over the top while
   the board empties. This is the loudest thing in the game and it is
   meant to be. */
function playPrismNova() {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  playFilteredNoise(0.75, 0.16, "highpass", 300, 6000);
  playSubDrop(170, 40, 0.7, 0.3);
  playRisingRun(523, [0, 2, 4, 7, 9, 12, 16], 0.062, 0.42, "triangle", 0.11);

  const now = sound.ctx.currentTime;
  const tailStart = now + 0.44;

  for (let i = 0; i < 3; i++) {
    const detune = 1 + i * 0.004;
    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(1046 * detune, tailStart);

    gain.gain.setValueAtTime(0, tailStart);
    gain.gain.linearRampToValueAtTime(0.055, tailStart + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, tailStart + 1.5);

    osc.connect(gain);
    gain.connect(soundBus());
    osc.start(tailStart);
    osc.stop(tailStart + 1.55);
  }
}
