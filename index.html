/* ---- SHATTER SOUND: BEGIN ---- */

/* A break is a spray of glass, so the sound is built the same way: a
   short noise crack for the impact, a handful of high shards ringing
   off it at random pitches, a rising run underneath, and from the
   bigger tiers a low thump for weight. Everything scales with how many
   gems went, so a five gem link and a twenty five gem sweep are
   recognisably the same sound at different sizes. */

const SHATTER_MIN_SHARDS = 3;
const SHATTER_MAX_SHARDS = 9;

/* A major pentatonic run, so any number of notes off the front of it
   still sounds like it belongs together. */
const SHATTER_RUN = [0, 2, 4, 7, 9, 12, 14, 16, 19];

function shatterShardCount(count) {
  const growth = Math.min(1, count / 26);
  const extra = Math.round((SHATTER_MAX_SHARDS - SHATTER_MIN_SHARDS) * growth);
  return SHATTER_MIN_SHARDS + extra;
}

/* The glassy part: short, high, slightly detuned sines that decay fast
   and land a few milliseconds apart, so they scatter instead of
   arriving as one chord. */
function playShards(count) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const shards = shatterShardCount(count);
  const now = sound.ctx.currentTime;

  for (let i = 0; i < shards; i++) {
    const spread = 1 + Math.random() * 1.6;
    const frequency = 1400 * spread;
    const startAt = now + i * 0.012 + Math.random() * 0.01;
    const length = 0.07 + Math.random() * 0.09;

    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(frequency, startAt);
    osc.frequency.exponentialRampToValueAtTime(frequency * 0.72, startAt + length);

    gain.gain.setValueAtTime(0, startAt);
    gain.gain.linearRampToValueAtTime(0.075, startAt + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + length);

    osc.connect(gain);
    gain.connect(soundBus());
    osc.start(startAt);
    osc.stop(startAt + length + 0.02);
  }
}

/* The crack: filtered noise, brighter and longer the bigger the break. */
function playShatterCrack(count) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const growth = Math.min(1, count / 26);
  const now = sound.ctx.currentTime;
  const length = 0.16 + growth * 0.2;
  const samples = Math.floor(sound.ctx.sampleRate * length);

  const buffer = sound.ctx.createBuffer(1, samples, sound.ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < samples; i++) {
    const fade = 1 - i / samples;
    data[i] = (Math.random() * 2 - 1) * fade * fade;
  }

  const source = sound.ctx.createBufferSource();
  source.buffer = buffer;

  /* Sweeping the filter down turns a flat hiss into something that
     reads as glass falling away. */
  const filter = sound.ctx.createBiquadFilter();
  filter.type = "highpass";
  filter.frequency.setValueAtTime(2600 + growth * 1800, now);
  filter.frequency.exponentialRampToValueAtTime(900, now + length);

  const gain = sound.ctx.createGain();
  gain.gain.setValueAtTime(0.11 + growth * 0.09, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + length);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(soundBus());
  source.start(now);
}

/* The run underneath. More gems means more of the scale, which is what
   makes a big break feel like it is still climbing after a small one
   would have finished. */
function playShatterRun(count) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const growth = Math.min(1, count / 26);
  const notes = 3 + Math.round(growth * 5);
  const step = 0.055 - growth * 0.015;

  for (let i = 0; i < notes; i++) {
    const semitone = SHATTER_RUN[i];
    const frequency = 330 * Math.pow(2, semitone / 12);

    window.setTimeout(function () {
      playTone(frequency, 0.2, "triangle", 0.09);
    }, i * step * 1000);
  }
}

/* Weight under the big ones only. A five gem link does not need it and
   would sound muddy with it. */
function playShatterThump(count) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;
  if (count < 15) return;

  const now = sound.ctx.currentTime;
  const osc = sound.ctx.createOscillator();
  const gain = sound.ctx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(96, now);
  osc.frequency.exponentialRampToValueAtTime(52, now + 0.18);

  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.2, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);

  osc.connect(gain);
  gain.connect(soundBus());
  osc.start(now);
  osc.stop(now + 0.24);
}

/* The bell that lands with the word itself, one octave per tier so the
   five milestones are telling apart with your eyes shut. */
function playMilestoneChime(tierIndex) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const base = 523 * Math.pow(2, tierIndex / 12);
  const now = sound.ctx.currentTime;

  for (let i = 0; i < 2; i++) {
    const detune = i === 0 ? 1 : 1.005;
    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(base * 2 * detune, now);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.07, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);

    osc.connect(gain);
    gain.connect(soundBus());
    osc.start(now);
    osc.stop(now + 0.75);
  }
}

/* One call for the whole break. */
function playShatter(count) {
  playShatterCrack(count);
  playShards(count);
  playShatterRun(count);
  playShatterThump(count);
}

/* ---- SHATTER SOUND: END ---- */


/* ---- LOOP SPECIAL SOUNDS: BEGIN ---- */

/* Drawing a ring around a special is the biggest thing the player can
   do, so each one gets its own voice. They all sit on the same
   pentatonic as the shatter run, so they land in key with whatever
   else is firing at the same moment. */

/* A short noise burst shaped by a filter. The workhorse under the
   heavier effects: swept down it reads as rubble, swept up it reads as
   air being pulled in. */
function playFilteredNoise(seconds, volume, filterType, startHz, endHz) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;
  const samples = Math.floor(sound.ctx.sampleRate * seconds);
  const buffer = sound.ctx.createBuffer(1, samples, sound.ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < samples; i++) {
    const fade = 1 - i / samples;
    data[i] = (Math.random() * 2 - 1) * fade;
  }

  const source = sound.ctx.createBufferSource();
  source.buffer = buffer;

  const filter = sound.ctx.createBiquadFilter();
  filter.type = filterType;
  filter.frequency.setValueAtTime(startHz, now);
  filter.frequency.exponentialRampToValueAtTime(endHz, now + seconds);

  const gain = sound.ctx.createGain();
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + seconds);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(soundBus());
  source.start(now);
}

/* A sine dropping in pitch. Weight under a blast. */
function playSubDrop(fromHz, toHz, seconds, volume) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;
  const osc = sound.ctx.createOscillator();
  const gain = sound.ctx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(fromHz, now);
  osc.frequency.exponentialRampToValueAtTime(toHz, now + seconds);

  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(volume, now + 0.014);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + seconds);

  osc.connect(gain);
  gain.connect(soundBus());
  osc.start(now);
  osc.stop(now + seconds + 0.03);
}

/* Notes off the pentatonic, played in order a fixed gap apart. */
function playRisingRun(baseHz, semitones, gapSeconds, noteSeconds, type, volume) {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;

  for (let i = 0; i < semitones.length; i++) {
    const frequency = baseHz * Math.pow(2, semitones[i] / 12);
    const startAt = now + i * gapSeconds;

    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(frequency, startAt);

    gain.gain.setValueAtTime(0, startAt);
    gain.gain.linearRampToValueAtTime(volume, startAt + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + noteSeconds);

    osc.connect(gain);
    gain.connect(soundBus());
    osc.start(startAt);
    osc.stop(startAt + noteSeconds + 0.03);
  }
}

/* The ring has just closed and there is something in the middle of it.
   Three notes climbing tell the player the move is worth more than the
   loop they were expecting. */
function playLoopArmed() {
  playRisingRun(392, [0, 4, 7], 0.07, 0.26, "triangle", 0.12);
}

/* A bomb going off with three cells of reach. Same shape as the plain
   blast, longer and deeper, with the rubble arriving after the crack. */
function playTripleBlast() {
  playFilteredNoise(0.42, 0.3, "lowpass", 5200, 500);
  playSubDrop(150, 38, 0.5, 0.3);
  playRisingRun(147, [0, -5], 0.09, 0.4, "square", 0.1);
}

/* Every stone on the board going at once. All bottom end and grit, no
   melody, because stone is the one thing on this board that is not
   made of glass. */
function playStonesShatter() {
  playFilteredNoise(0.55, 0.26, "bandpass", 1800, 260);
  playSubDrop(110, 44, 0.45, 0.24);

  /* A second crunch a beat later, so it reads as a boardful of them. */
  window.setTimeout(function () {
    playFilteredNoise(0.4, 0.18, "bandpass", 1400, 220);
  }, 90);
}

/* Every blight cured. It starts as the blight's own sour sawtooth and
   resolves onto a clean bell, so the sound itself is the cure. */
/* The gem under the blight hardening: a short dull knock with the pitch
   falling away, which is what a thing setting solid sounds like. */
function playBlightSet() {
  playSubDrop(170, 52, 0.22, 0.11);
  playNoiseHit(0.13);
}

/* The crawl across. A band of noise sliding up gives the scrape of
   something dragging itself, and the wavering low tone under it is the
   creature carrying its own weight. */
function playBlightCrawl() {
  playFilteredNoise(BLIGHT_CRAWL_SECONDS, 0.08, "bandpass", 260, 1150);

  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  const now = sound.ctx.currentTime;
  const osc = sound.ctx.createOscillator();
  const wobble = sound.ctx.createOscillator();
  const wobbleDepth = sound.ctx.createGain();
  const gain = sound.ctx.createGain();

  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(74, now);
  osc.frequency.linearRampToValueAtTime(102, now + BLIGHT_CRAWL_SECONDS);

  /* A slow warble on the pitch, so the note never sits still. */
  wobble.type = "sine";
  wobble.frequency.setValueAtTime(11, now);
  wobbleDepth.gain.setValueAtTime(7, now);
  wobble.connect(wobbleDepth);
  wobbleDepth.connect(osc.frequency);

  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.075, now + 0.06);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + BLIGHT_CRAWL_SECONDS);

  osc.connect(gain);
  gain.connect(soundBus());

  osc.start(now);
  wobble.start(now);
  osc.stop(now + BLIGHT_CRAWL_SECONDS + 0.03);
  wobble.stop(now + BLIGHT_CRAWL_SECONDS + 0.03);
}

/* Landing on the next gem: a wet little slap. */
function playBlightLand() {
  playTone(64, 0.16, "sawtooth", 0.1);
  playFilteredNoise(0.14, 0.06, "lowpass", 900, 220);
}

function playBlightPurge() {
  playRisingRun(98, [0, 1], 0.06, 0.3, "sawtooth", 0.11);
  playFilteredNoise(0.5, 0.12, "highpass", 400, 3400);

  window.setTimeout(function () {
    playRisingRun(523, [0, 7, 12], 0.06, 0.55, "sine", 0.1);
  }, 150);
}

/* The prism nova. Air pulled in, a sub under it, seven notes climbing
   the pentatonic, then a detuned pair left ringing over the top while
   the board empties. This is the loudest thing in the game and it is
   meant to be. */
function playPrismNova() {
  if (sound.enabled === false) return;
  if (sound.ctx === null) return;

  playFilteredNoise(0.75, 0.16, "highpass", 300, 6000);
  playSubDrop(170, 40, 0.7, 0.3);
  playRisingRun(523, [0, 2, 4, 7, 9, 12, 16], 0.062, 0.42, "triangle", 0.11);

  const now = sound.ctx.currentTime;
  const tailStart = now + 0.44;

  for (let i = 0; i < 3; i++) {
    const detune = 1 + i * 0.004;
    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(1046 * detune, tailStart);

    gain.gain.setValueAtTime(0, tailStart);
    gain.gain.linearRampToValueAtTime(0.055, tailStart + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, tailStart + 1.5);

    osc.connect(gain);
    gain.connect(soundBus());
    osc.start(tailStart);
    osc.stop(tailStart + 1.55);
  }
}

/* ---- LOOP SPECIAL SOUNDS: END ---- */


/* ------------------------------------------------------------------
   Music

   The effects above are synthesised on the fly. Music is a real file,
   so it is handled on its own terms: one <audio> element per track,
   played through the element's own volume instead of the Web Audio
   graph. That is deliberate. Opening this game as a file on a phone
   gives the page an opaque origin, where fetch and
   createMediaElementSource both fall over and a plain audio element
   still plays. The effects bus would not want music through its
   limiter anyway, or a big gem break would duck the soundtrack every
   time it went off.

   To add music later:
     1. Put the file in audio/ and add an entry to MUSIC_TRACKS.
     2. Return its id from musicTrackForLevel for the levels it covers,
        or from musicTrackForScreen for the screens it covers.
   Nothing else needs touching. Every level start and every screen
   change already asks for the right track, and swapping one track for
   another runs through the same one-at-a-time machinery used here.

   Two tracks can never sound at once. syncMusic is the only thing in
   the game that starts or stops a track, and it pauses the outgoing
   element before it asks the incoming one to play. Everything else,
   here and elsewhere, only ever says what it wants and leaves the
   reconciling to it.
   ------------------------------------------------------------------ */

const MUSIC_TRACKS = {
  title: {
    url: "audio/prism-path-title.ogg",

    /* Per track attenuation between 0 and 1, so a loud track added
       later can be pulled back to sit level with a quiet one without
       the player having to move their slider. */
    trim: 1
  },
  menu: {
    url: "audio/prism-path-menu.ogg",
    trim: 1
  },
  ambient: {
    url: "audio/prism-path-ambient.ogg",
    trim: 1
  }
};

function musicTrackForLevel(level) {
  /* One bed for the whole run today. The level is passed in already so
     that per level music is a matter of branching here and nothing
     else. */
  return "ambient";
}

/* Which track a screen wants. The title card has its own. A run plays
   whatever its level asks for. Every other screen is a menu with no
   game behind it, and they share one track so walking between them
   does not chop the music in and out.

   Help and Settings can also open over a paused run. Those keep the
   run's music; opened from the title, they use menu music. */
function musicTrackForScreen(name) {
  if (name === "mainMenu") return "title";
  if (name === "playing") return musicTrackForLevel(game.level);
  if (name === "help" && helpReturnsTo === "pauseMenu") return musicTrackForLevel(game.level);
  if (name === "settings" && settingsReturnsTo === "pauseMenu") return musicTrackForLevel(game.level);

  return "menu";
}

const music = {
  enabled: true,
  volume: 0.6,

  /* Built once per track and kept. An element is a single stream and
     cannot play itself twice over, which is the first of the two
     things keeping the music from doubling up. */
  elements: {},

  /* A pending play request is separate from confirmed playback. Both
     are checked against the element when reconciling, since the
     browser can pause audio without a screen change. */
  wantedTrackId: null,
  pendingTrackId: null,
  playingTrackId: null,

  /* Counts the starts. Pausing an element rejects the play promise it
     had in the air, so a quick off and on leaves an old rejection
     arriving after the new start has already succeeded. The number the
     start took is checked when its rejection lands, and only the
     newest start is allowed to act on one. */
  attempt: 0,

  fileFailed: false
};

function musicElement(trackId) {
  const existing = music.elements[trackId];
  if (existing !== undefined) return existing;

  const track = MUSIC_TRACKS[trackId];
  if (track === undefined) {
    throw new Error("PRISM PURGE: asked for a music track called '" + trackId +
      "' that is not in MUSIC_TRACKS.");
  }

  const element = new Audio();
  element.loop = true;
  element.volume = 0;

  /* Nothing is fetched until a play request asks for it. The title
     screen asks the moment it opens, so a browser that allows autoplay
     still starts the download straight away, which is right because the
     track is about to sound. A browser that refuses autoplay, which is
     every phone, now downloads nothing until the player's first tap,
     and the title artwork gets the connection to itself until then.
     retryMusicAfterInput is what turns that tap back into a request. */
  element.preload = "none";

  /* A missing or unplayable file is a real thing that happens, and a
     silent game with no explanation is the worst way to meet it. The
     reason goes to the console and onto the settings panel. */
  element.addEventListener("error", function () {
    music.fileFailed = true;
    console.error("PRISM PURGE could not load the music file at " + track.url +
      ". The game will run without music.");
    refreshMusicNote();
  });

  element.src = track.url;

  music.elements[trackId] = element;
  return element;
}

/* Stop the outgoing track before starting its replacement. Repeated
   requests preserve playback in progress, but a browser pause leaves
   the selected track eligible to resume at its current position. */
function syncMusic() {
  const wanted = music.enabled === true ? music.wantedTrackId : null;
  const active = music.pendingTrackId !== null ? music.pendingTrackId : music.playingTrackId;

  if (active !== null && active !== wanted) {
    const leaving = musicElement(active);

    /* Pausing rejects whatever play promise this element still had
       running, so that promise stops speaking for the state here. */
    music.attempt++;
    leaving.pause();

    /* Stopped means stopped. The next start is from the top, so the
       state a track is left in never depends on how it was left. */
    leaving.currentTime = 0;
    music.pendingTrackId = null;
    music.playingTrackId = null;
  }

  if (wanted === null) return;

  const element = musicElement(wanted);

  if (active === wanted && element.paused === false) {
    applyMusicVolume();
    return;
  }

  music.playingTrackId = null;
  music.pendingTrackId = wanted;
  const attempt = ++music.attempt;
  applyMusicVolume();

  const started = element.play();

  function confirmPlayback() {
    if (music.attempt !== attempt) return;
    music.pendingTrackId = null;
    if (element.paused === false) music.playingTrackId = wanted;
  }

  /* Older browsers return no promise; their element state still tells
     us whether the request left the track paused. */
  if (started === undefined) {
    confirmPlayback();
    return;
  }

  started.then(confirmPlayback, function (refused) {
    /* A stopped or superseded request cannot change the current track. */
    if (music.attempt !== attempt) return;

    music.pendingTrackId = null;
    music.playingTrackId = null;

    /* Autoplay refusal waits for another user interaction. Other
       failures remain visible in the console. */
    if (refused.name === "NotAllowedError") return;

    console.error("PRISM PURGE could not start the music.", refused);
  });
}

function applyMusicVolume() {
  const active = music.pendingTrackId !== null ? music.pendingTrackId : music.playingTrackId;
  if (active === null) return;

  const track = MUSIC_TRACKS[active];
  const element = musicElement(active);
  element.volume = music.volume * track.trim;
}

/* Called wherever a level begins: a new run, the next level, a retry
   on a continue, and a saved run picked back up. */
function setMusicForLevel(level) {
  music.wantedTrackId = musicTrackForLevel(level);
  syncMusic();
}

/* Screens and the Settings overlay select music through the same path. */
function setMusicForScreen(name) {
  music.wantedTrackId = musicTrackForScreen(name);
  syncMusic();
}

/* Keep interaction retries available after autoplay refusal and later
   browser interruptions. Bubbling lets the button select its destination
   track first; an element already running needs no new play request. */
function retryMusicAfterInput() {
  syncMusic();
}

window.addEventListener("click", retryMusicAfterInput);
window.addEventListener("keydown", retryMusicAfterInput);
window.addEventListener("pageshow", syncMusic);
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") syncMusic();
});

/* End the current music request when a run ends. The next screen or
   level supplies its own request. */
function stopMusic() {
  music.wantedTrackId = null;
  syncMusic();
}


/* ------------------------------------------------------------------
   Board helpers
   ------------------------------------------------------------------ */

function insideBoard(row, col) {
  return row >= 0 && row < ROWS && col >= 0 && col < COLS;
}

function cellAt(row, col) {
  return game.board[row][col];
}

function randomColour() {
  const range = coloursForLevel(game.level);
  return Math.floor(Math.random() * range);
}

function buildBoard() {
  game.board = [];
  for (let row = 0; row < ROWS; row++) {
    const line = [];
    for (let col = 0; col < COLS; col++) {
      const gem = makeGem(randomColour());
      gem.scale = 1;
      line.push(gem);
    }
    game.board.push(line);
  }
}

/* Scatter stones for the levels that ask for them. Stones never sit on
   the top row so they cannot wall off fresh spawns. */
function scatterStones(count, toughness) {
  const placeable = (ROWS - 1) * COLS;
  if (count > placeable) {
    throw new Error("asked for " + count + " stones but only " + placeable + " cells can hold one");
  }

  let placed = 0;
  let attempts = 0;

  while (placed < count && attempts < 4000) {
    attempts++;
    const row = 1 + Math.floor(Math.random() * (ROWS - 1));
    const col = Math.floor(Math.random() * COLS);

    if (cellAt(row, col).kind === "gem") {
      const stone = makeStone(toughness);
      stone.scale = 1;
      game.board[row][col] = stone;
      placed++;
    }
  }

  /* Placing fewer than asked would hand the player a level whose goal
     cannot be reached, so it fails here where the cause is obvious. */
  if (placed < count) {
    throw new Error("only placed " + placed + " of " + count + " stones");
  }
}

/* ------------------------------------------------------------------
   Level goals
   ------------------------------------------------------------------ */

/* Colour, score, stone, round and round. */
function makeGoalForLevel(level) {
  const kindIndex = (level - 1) % 3;

  if (kindIndex === 0) return makeColourGoal(level);
  if (kindIndex === 1) return makeScoreGoal(level);
  return makeStoneGoal(level);
}

/* Colour, score, colour, score, for a board that has no stones to ask
   for. A stone goal on such a board would be a goal of zero, met on the
   first link. */
function makeGoalWithoutStones(level) {
  const kindIndex = (level - 1) % 2;

  if (kindIndex === 0) return makeColourGoal(level);
  return makeScoreGoal(level);
}

function makeColourGoal(level) {
  const colour = Math.floor(Math.random() * coloursForLevel(level));
  const target = 14 + level;
  return {
    kind: "colour",
    colour: colour,
    target: target,
    progress: 0,
    label: "Burst " + target
  };
}

function makeScoreGoal(level) {
  const target = 600 + level * 550;
  return {
    kind: "score",
    colour: -1,
    target: target,
    progress: 0,
    label: "Score " + target + " points"
  };
}

function makeStoneGoal(level) {
  const target = stoneCountForLevel(level);
  return {
    kind: "stone",
    colour: -1,
    target: target,
    progress: 0,
    label: "Shatter " + target
  };
}

/* Stones climb with the level and stop at the difficulty's cap. Past
   that point the level gets harder by making each stone tougher, which
   costs moves without eating the space you need to play in. */
function stoneCountForLevel(level) {
  const wanted = 3 + Math.floor(level / 2);
  return Math.min(wanted, activeHazards().maxStones);
}

/* A stone level costs about 1.85 moves per hit point and does not care
   how many stones there are, because a denser board damages more of
   them per burst. Hard grows a hit point every twelve levels, which
   costs 0.154 moves per level, well under the budget's 0.333. Easy and
   Normal grow slower still.

   All three stop at a cap. A curve with no ceiling reads fine at level
   thirty and turns a stone into a twelve hit wall at level a hundred
   and twenty, which is a difficulty nobody chose. */
function stoneToughnessForLevel(level) {
  const hazards = activeHazards();
  const grown = hazards.stoneToughnessBase + Math.floor(level / hazards.stoneToughnessEvery);
  return Math.min(grown, hazards.stoneToughnessCap);
}

/* The budget stops shrinking at level 10 and then creeps back up by
   one move every three levels, which is 0.333 moves per level.

   Measured cost of each goal type per level:
     colour  0.258   (3.88 goal gems cleared per move)
     score   0.230
     stone   0.154   (1.85 moves per hit point, +1 hp every 12 levels)

   All three are below the budget's growth, so the gap widens forever
   and no level can outrun the moves you are given to clear it. */
function movesForLevel(level) {
  const tuning = activeTuning();

  if (level <= 2) return tuning.movesEarly;
  if (level <= 5) return tuning.movesMid;
  if (level <= 9) return tuning.movesLate;
  return tuning.movesDeep + Math.floor((level - 10) / 3);
}

/* Blight starts appearing at the difficulty's first level and quickens
   as you climb. Zero means it is not in play yet. */
function blightIntervalForLevel(level) {
  const hazards = activeHazards();

  if (level < hazards.blightFirstLevel) return 0;
  if (level < 6) return hazards.blightIntervalEarly;
  if (level < 10) return hazards.blightIntervalMid;
  return hazards.blightIntervalLate;
}

/* =====================================================================
   GameModes
   Owns: the list of playable modes and the rules each one changes.
   Stays out of: rendering, audio, storage, the DOM.

   Registering a mode here is the whole of what puts it on the mode
   select screen and gives it a save slot of its own. The engine asks the
   active mode the questions below instead of assuming Classic, so a new
   mode is a new entry here rather than a new branch inside the engine.

   Classic is the game as it has always played, so most of its answers
   point straight at the rules written above this module.
   ===================================================================== */

/* A cell a mode's tile picture leaves empty. Classic has none; a mode
   whose board drains is the reason this exists. */
const TILE_EMPTY = -1;

/* ---- what the board itself does, tuned by difficulty ---- */

/* What the board does to you, keyed by difficulty. A mode names the
   table it plays under, so modes on the same footing share one and a
   mode that needs its own says so.

   Classic and Time Attack share this one: same board, same stones, same
   blight, and they differ only on what runs out. A mode where the board
   never resets cannot share it, because blight that is never swept away
   needs a different ceiling to be fair.

   Normal is the game exactly as it has always played, with one
   deliberate exception: maxStones comes down from 18 to 12, because that
   cap was set before blight could turn a gem to stone and a stone level
   now runs well over the count it was balanced for. */
const CLASSIC_HAZARDS = {
  easy: {
    /* Blight on Easy is a nuisance and never an ending. It still bites,
       because a blight that walks leaves a stone behind it, so it eats
       board even though it cannot finish you. */
    maxBlightOnBoard: 3,
    blightEndsLevel: false,
    blightCarryCap: 2,
    blightFirstLevel: 3,
    blightIntervalEarly: 4,
    blightIntervalMid: 4,
    blightIntervalLate: 3,
    blightSeedsFromLevel: 4,
    blightSeedsEvery: 5,
    blightSeedsCap: 1,

    maxStones: 6,
    stoneToughnessBase: 2,
    stoneToughnessEvery: 20,
    stoneToughnessCap: 3
  },

  normal: {
    maxBlightOnBoard: 9,
    blightEndsLevel: true,
    blightCarryCap: 6,
    blightFirstLevel: 3,
    blightIntervalEarly: 4,
    blightIntervalMid: 3,
    blightIntervalLate: 2,
    blightSeedsFromLevel: 4,
    blightSeedsEvery: 5,
    blightSeedsCap: 3,

    maxStones: 12,
    stoneToughnessBase: 2,
    stoneToughnessEvery: 16,
    stoneToughnessCap: 4
  },

  hard: {
    maxBlightOnBoard: 9,
    blightEndsLevel: true,
    blightCarryCap: 6,
    blightFirstLevel: 2,
    blightIntervalEarly: 3,
    blightIntervalMid: 2,
    blightIntervalLate: 2,
    blightSeedsFromLevel: 3,
    blightSeedsEvery: 4,
    blightSeedsCap: 4,

    maxStones: 18,
    stoneToughnessBase: 2,
    stoneToughnessEvery: 12,
    stoneToughnessCap: 6
  }
};

/* ---- what Classic answers ---- */

/* The picture on Classic's tile: a full board with nothing missing, and
   a run of one colour down the middle so it reads as a board you could
   link. Numbers are indexes into GEM_COLOURS. Written out by hand and
   never generated, so the tile is the same picture every time it is
   drawn, whatever prompted the redraw. */
const CLASSIC_TILE_GEMS = [
  [0, 0, 2, 4, 1],
  [3, 0, 0, 2, 4],
  [1, 3, 0, 1, 2],
  [4, 1, 3, 3, 0]
];

/* What Classic is really about is the number in the corner running out. */
function drawClassicTileMark(tray) {
  drawTileChip(tray, "16");
}

/* Classic's three settings. Normal is the game exactly as it has always
   played, with one deliberate exception: maxStones comes down from 18 to
   12, because that cap was set before blight could turn a gem to stone
   and a stone level now runs well over the count it was balanced for.

   Every block carries the same field names so the three read as one
   table down the page. The four moves numbers are the same curve at
   three heights: the first three are flat bands and the fourth is where
   the budget bottoms out before creeping back up one move every three
   levels. */
const CLASSIC_DIFFICULTIES = {
  easy: {
    movesEarly: 26,
    movesMid: 24,
    movesLate: 22,
    movesDeep: 20,
    continuesAtStart: 5
  },

  normal: {
    movesEarly: 22,
    movesMid: 20,
    movesLate: 18,
    movesDeep: 16,
    continuesAtStart: 3
  },

  hard: {
    movesEarly: 20,
    movesMid: 18,
    movesLate: 16,
    movesDeep: 14,
    continuesAtStart: 1
  }
};

/* One line under the selector saying what the player is picking, so the
   three words are a choice instead of a guess. */
function classicDifficultySummary(difficultyId) {
  return classicBudgetPhrase(difficultyId) + " " + hazardPhrase(CLASSIC_HAZARDS, difficultyId);
}

/* What runs out and how many continues you hold, which is the half of
   the summary Custom borrows when it plays on this base. */
function classicBudgetPhrase(difficultyId) {
  const tuning = CLASSIC_DIFFICULTIES[difficultyId];
  return tuning.movesEarly + " moves to start, " + continuePhrase(tuning.continuesAtStart) + ".";
}

/* Both of these are said on every mode's start screen that has them, so
   they are written once and read the same way each time. */
function continuePhrase(count) {
  if (count === 1) return "one continue";
  return count + " continues";
}

function hazardPhrase(hazardTable, difficultyId) {
  const hazards = hazardTable[difficultyId];
  const stones = "Up to " + hazards.maxStones + " stones";

  if (hazards.blightEndsLevel === false) {
    return stones + ", and blight cannot end a level.";
  }
  return stones + ", and " + hazards.maxBlightOnBoard + " blighted cells ends the level.";
}

function spendOneMove() {
  game.budget--;
}

function leftoverMovesBonus() {
  return { amount: game.budget * 40, label: "Leftover move bonus" };
}

function movesToSpareLine() {
  return "Goal met with " + game.budget + " moves to spare.";
}

/* Stones for the level that asks for them, a pair from level four on for
   every level that does not, then whatever blight followed you here. */
function layOutClassicHazards() {
  const toughness = stoneToughnessForLevel(game.level);

  if (game.goal.kind === "stone") {
    scatterStones(game.goal.target, toughness);
  } else if (game.level >= 4) {
    scatterStones(2, toughness);
  }

  seedBlight();
}

function advanceClassicHazards() {
  advanceBlight();
  advanceBlightMoves();
}

/* The two losses, kept apart because of when each one is asked.

   Blight is asked before the goal, so a board the blight has swallowed
   is lost even on the move that would have cleared the level. Running
   out is asked after it, so spending your last move to finish the level
   is a win. Both return null when they have nothing to say. */
function blightHasWonLoss() {
  if (activeHazards().blightEndsLevel === false) return null;
  if (countBlight() < blightLossThreshold()) return null;
  return { title: "The Blight Wins", subtitle: "It swallowed the board." };
}

function outOfMovesLoss() {
  if (game.budget > 0) return null;
  return { title: "Out of Moves", subtitle: "The board held out this time." };
}

/* What the third box at the top of the screen reads, and how close that
   reading is to ending the level. */
function movesLimitText() {
  return String(Math.max(0, game.budget));
}

function movesLimitIsCritical() {
  return game.budget <= 4;
}

/* Cold with the budget full, alarm with it empty, and it only starts
   moving once there are MOVES_WARN_FROM left. */
function movesLimitPressure() {
  const spent = MOVES_WARN_FROM - Math.max(0, game.budget);
  return Math.max(0, Math.min(1, spent / MOVES_WARN_FROM));
}

/* Classic's budget is spent by moving, so nothing runs down between
   moves and there is no clock to advance. */
function classicSpendsNoTime() {
}

/* On the last move, buying more comes before anything else the board
   could offer. */
function movesAreCritical() {
  return game.budget <= 1;
}

/* What the hint offers when the thing running out is nearly gone: which
   item buys more, what to call it, and when it has become urgent. A mode
   where nothing runs out says null instead. */
const CLASSIC_BUDGET_RESCUE = {
  itemId: "moves",
  caption: "BUY MORE MOVES",
  isCritical: movesAreCritical
};

/* Retrying the level on a fresh board, which is what a continue has
   always meant on a mode that lays out a new board every level. */
function retryLevelOnContinue() {
  game.score = game.scoreAtLevelStart;
  game.charge = 0;
  game.blightCarry = 0;
  startLevel(true);
}

function retryLevelDescription() {
  return "Retrying level " + game.level + " costs the <b>" +
    (game.score - game.scoreAtLevelStart) + "</b> points you scored on it.";
}

/* ---- what Time Attack answers ---- */

/* Classic with the move budget swapped for a clock. Same board, same
   hazards, same goals: what changes is that thinking costs you. */

/* Under this many seconds the box goes red and the HD stripe reaches
   alarm, which is the same job MOVES_WARN_FROM does for Classic. */
const SECONDS_WARN_FROM = 20;

/* A level clear pays 20 a second against Classic's 40 a move, because a
   level leaves far more seconds spare than it does moves. */
const SECONDS_BONUS_EACH = 20;

const TIME_ATTACK_DIFFICULTIES = {
  easy: {
    secondsEarly: 180,
    secondsMid: 170,
    secondsLate: 145,
    secondsDeep: 135,
    secondsDeepStep: 7,
    secondsPerBoost: 45,
    continuesAtStart: 5
  },

  normal: {
    secondsEarly: 130,
    secondsMid: 120,
    secondsLate: 105,
    secondsDeep: 95,
    secondsDeepStep: 5,
    secondsPerBoost: 30,
    continuesAtStart: 3
  },

  hard: {
    secondsEarly: 90,
    secondsMid: 85,
    secondsLate: 75,
    secondsDeep: 65,
    secondsDeepStep: 4,
    secondsPerBoost: 20,
    continuesAtStart: 1
  }
};

/* The same shape movesForLevel has: generous at the start, tightening to
   a floor around level ten, then creeping back up. */
function secondsForLevel(level) {
  const tuning = activeTuning();

  if (level <= 2) return tuning.secondsEarly;
  if (level <= 5) return tuning.secondsMid;
  if (level <= 9) return tuning.secondsLate;
  return tuning.secondsDeep + Math.floor((level - 10) / 3) * tuning.secondsDeepStep;
}

/* A link costs nothing here. The clock is already running and running is
   what spends it. */
function spendNothingOnLink() {
}

/* Called every frame the player is looking at a board they could act on,
   which is what keeps a pause menu, a card and a board still bursting
   from costing anybody time.

   The HUD is refreshed on the second rather than on the frame, because
   refreshHud measures text to fit it and doing that sixty times a second
   for a number that changes once is work nobody sees. */
function advanceTimeAttackClock(dt) {
  if (game.budget <= 0) return;

  const wasReading = Math.ceil(game.budget);
  game.budget -= dt;

  if (game.budget <= 0) {
    game.budget = 0;
    refreshHud();
    checkLevelState();
    return;
  }

  if (Math.ceil(game.budget) !== wasReading) {

  return minutes + ":" + rest;
}

function blightLimitPressure() {

/* Retrying the level would mean nothing here, because the level is only
   a number and the board is the run. A continue buys the one thing that
   matters instead: the board comes back clean and play carries on. */
function cureBoardOnContinue() {
  game.score = game.scoreAtLevelStart;
  game.charge = 0;

  /* Lifted off the gems rather than burst out of them. Bursting would
     pay out score for every cured cell, which is the opposite of a
     continue that costs you the level's points, and it would leave the
     board mid explosion with nothing driving it. */
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cell = cellAt(row, col);
      cell.blighted = false;
      cell.blightAge = 0;
      cell.blightShow = 1;
    }
  }

  /* A blight halfway between two cells has nowhere to land now. */
  blightCrawls.length = 0;
  game.movesSinceBlight = 0;

  playBlightPurge();
  game.phase = "idle";
  clearHint();
  refreshHud();
  saveGame();
}

   thing. A bomb caught by it goes off, as a bought bomb does. */

  const cell = cellAt(row, col);

    showToast("PICK A GEM", "#ff5470");
    return;

  const clearSet = new Map();
  addToClearSet(clearSet, row, col);
  const bombStoneDamage = expandBombs(clearSet, new Set());

  game.aiming = "none";
  showToast("SNIPED", "#4fd6ff");
  playTone(880, 0.16, "square", 0.12);
  playNoiseHit(0.14);

  applyClear(clearSet, clearSet.size, bombStoneDamage, null);

  spendCharge("snipe");
  refreshHud();
}

  normal: { maxBlightOnBoard: 0, blightEndsLevel: false, maxStones: 0 },

/* How many gems the level asks you to clear, climbing with the level and
   stopping at a cap. The cap matters: 63 gems start on the board and a
   three gem minimum link always strands a few, so a quota that kept
   climbing would eventually ask for more than the board can give.

   Past the cap the difficulty carries on through coloursForLevel, where
   more colours mean shorter links and more stranded gems. That is the
   same shape Classic uses when its stone count caps and toughness takes

  normal: { quotaBase: 28, quotaPerLevel: 1.5, quotaCap: 46, continuesAtStart: 3 },
  hard:   { quotaBase: 32, quotaPerLevel: 2,   quotaCap: 52, continuesAtStart: 1 }
};

/* The practical ceiling is somewhere near 56 of the 63, so a perfect

/* The minimum link, as the rules sentence says it. Custom allows two to

function eliminationQuotaForLevel(level) {
  const tuning = activeTuning();
  const climbed = tuning.quotaBase + Math.floor(level * tuning.quotaPerLevel);
  return Math.min(climbed, tuning.quotaCap);

function gemsLeftOnBoard() {

}

/* ---- what Custom answers ---- */

/* Custom is a base mode with overrides. The base gives everything the
   four modes differ on: what runs out, how a link is paid for, the loss
   tests, the third HUD box, the item row, the goal maker, whether the
   board persists and refills, and the continue. The picks then remove
   blight, remove stones, remove loops, change what a link forges, and
   carry specials across.

   The rules object below is the whole of what the player chooses. The
   difficulty is picked on the same selector every other mode has. */
const CUSTOM_BASE_MODE_IDS = ["classic", "timeattack", "endless", "elimination"];

/* A six link minimum on a five colour board is unplayable, and the exact
   link search is priced for five. */
const CUSTOM_MIN_LINK_LOWEST = 2;
const CUSTOM_MIN_LINK_HIGHEST = 5;

const CUSTOM_THRESHOLD_LOWEST = 2;
const CUSTOM_THRESHOLD_HIGHEST = 20;

/* The standard game, which is where every pick starts. */
function defaultCustomRules() {
  return {
    baseModeId: "classic",
    blightEnabled: true,
    stonesEnabled: true,
    loopsEnabled: true,
    specialsCarryOver: false,
    links: {
      minLink: MIN_LINK,
      bombEnabled: true,
      bombLink: BOMB_LINK,
      prismEnabled: true,
      prismLink: PRISM_LINK,
      chromaticEnabled: true,
      chromaticLink: CHROMATIC_LINK
    }
  };
}

/* A copy with nothing shared, so the run's rules and the setup screen's
   picks can never edit each other. */
function cloneCustomRules(rules) {
  return {
    baseModeId: rules.baseModeId,
    blightEnabled: rules.blightEnabled,
    stonesEnabled: rules.stonesEnabled,
    loopsEnabled: rules.loopsEnabled,
    specialsCarryOver: rules.specialsCarryOver,
    links: {
      minLink: rules.links.minLink,
      bombEnabled: rules.links.bombEnabled,
      bombLink: rules.links.bombLink,
      prismEnabled: rules.links.prismEnabled,
      prismLink: rules.links.prismLink,
      chromaticEnabled: rules.links.chromaticEnabled,
      chromaticLink: rules.links.chromaticLink
    }
  };
}

/* What the setup screen edits, and what settings remember between
   sessions. A run takes a copy when it starts. */
let customPicks = defaultCustomRules();

/* Every rule a Custom rules object has to carry, and the ranges each one
   is allowed. A rules object that fails this is a bug wherever it came
   from, so the failure names the field. */
function checkCustomRules(rules, where) {
  if (CUSTOM_BASE_MODE_IDS.indexOf(rules.baseModeId) === -1) {
    throw new Error("PRISM PURGE: " + where + " names a base mode of " +
      JSON.stringify(rules.baseModeId) + ", which is not one Custom can play.");
  }

  checkRuleSwitch(rules.blightEnabled, where, "blightEnabled");
  checkRuleSwitch(rules.stonesEnabled, where, "stonesEnabled");
  checkRuleSwitch(rules.loopsEnabled, where, "loopsEnabled");
  checkRuleSwitch(rules.specialsCarryOver, where, "specialsCarryOver");

  if (rules.baseModeId === "elimination") {
    if (rules.blightEnabled === true || rules.stonesEnabled === true) {
      throw new Error("PRISM PURGE: " + where + " has blight or stones on an Elimination base, " +
        "which plays without either.");
    }
  }

  const links = rules.links;
  checkRuleSwitch(links.bombEnabled, where, "links.bombEnabled");
  checkRuleSwitch(links.prismEnabled, where, "links.prismEnabled");
  checkRuleSwitch(links.chromaticEnabled, where, "links.chromaticEnabled");
  checkRuleNumber(links.minLink, where, "links.minLink", CUSTOM_MIN_LINK_LOWEST, CUSTOM_MIN_LINK_HIGHEST);
  checkRuleNumber(links.bombLink, where, "links.bombLink", CUSTOM_THRESHOLD_LOWEST, CUSTOM_THRESHOLD_HIGHEST);
  checkRuleNumber(links.prismLink, where, "links.prismLink", CUSTOM_THRESHOLD_LOWEST, CUSTOM_THRESHOLD_HIGHEST);
  checkRuleNumber(links.chromaticLink, where, "links.chromaticLink", CUSTOM_THRESHOLD_LOWEST, CUSTOM_THRESHOLD_HIGHEST);

  /* Every enabled threshold, in tier order, has to sit strictly above
     the enabled one before it, so the longest link always forges the
     strongest gem. A disabled tier is skipped. */
  let previousName = "links.minLink";
  let previous = links.minLink;
  const tiers = enabledLinkTiers(links);
  for (let i = 0; i < tiers.length; i++) {
    if (tiers[i].length <= previous) {
      throw new Error("PRISM PURGE: " + where + " sets " + tiers[i].name + " to " + tiers[i].length +
        ", which is not above " + previousName + " at " + previous + ".");
    }
    previousName = tiers[i].name;
    previous = tiers[i].length;
  }
}

/* The forge tiers the rules have on, in order, each with the length it
   needs. The setup screen walks the same list to keep the steppers in
   order. */
function enabledLinkTiers(links) {
  const tiers = [];
  if (links.bombEnabled === true) tiers.push({ name: "links.bombLink", length: links.bombLink });
  if (links.prismEnabled === true) tiers.push({ name: "links.prismLink", length: links.prismLink });
  if (links.chromaticEnabled === true) tiers.push({ name: "links.chromaticLink", length: links.chromaticLink });
  return tiers;
}

function checkRuleSwitch(value, where, fieldName) {
  if (value === true || value === false) return;
  throw new Error("PRISM PURGE: " + where + " should have " + fieldName + " on or off and has " +
    JSON.stringify(value) + ".");
}

function checkRuleNumber(value, where, fieldName, lowest, highest) {
  const inRange = Number.isInteger(value) === true && value >= lowest && value <= highest;
  if (inRange === true) return;
  throw new Error("PRISM PURGE: " + where + " should have " + fieldName + " from " + lowest +
    " to " + highest + " and has " + JSON.stringify(value) + ".");
}

/* Blight and stones off are expressed as zeros in the hazard table, the
   way Elimination's already are. infectRandomCell and spreadBlight refuse
   at the cap, so a cap of zero is a board that cannot be infected, and
   blightHasWonLoss already returns null where blight cannot end a level.
   Every other field is the base's, so blight that is on is the base
   mode's blight at that difficulty.

   The Elimination base has no hazard numbers to compose from and plays
   with both off, so its table is used as it stands. */
function composeCustomHazards(base, rules) {
  if (rules.baseModeId === "elimination") return base.hazards;

  return {
    easy: composeCustomHazardBlock(base.hazards.easy, rules),
    normal: composeCustomHazardBlock(base.hazards.normal, rules),
    hard: composeCustomHazardBlock(base.hazards.hard, rules)
  };
}

function composeCustomHazardBlock(baseBlock, rules) {
  const block = {
    maxBlightOnBoard: baseBlock.maxBlightOnBoard,
    blightEndsLevel: baseBlock.blightEndsLevel,
    blightCarryCap: baseBlock.blightCarryCap,
    blightFirstLevel: baseBlock.blightFirstLevel,
    blightIntervalEarly: baseBlock.blightIntervalEarly,
    blightIntervalMid: baseBlock.blightIntervalMid,
    blightIntervalLate: baseBlock.blightIntervalLate,
    blightSeedsFromLevel: baseBlock.blightSeedsFromLevel,
    blightSeedsEvery: baseBlock.blightSeedsEvery,
    blightSeedsCap: baseBlock.blightSeedsCap,

    maxStones: baseBlock.maxStones,
    stoneToughnessBase: baseBlock.stoneToughnessBase,
    stoneToughnessEvery: baseBlock.stoneToughnessEvery,
    stoneToughnessCap: baseBlock.stoneToughnessCap
  };

  if (rules.blightEnabled === false) {
    block.maxBlightOnBoard = 0;
    block.blightEndsLevel = false;
    block.blightCarryCap = 0;
    block.blightSeedsCap = 0;
  }
  if (rules.stonesEnabled === false) {
    block.maxStones = 0;
  }
  return block;
}

/* The base mode the run's rules name. */
function customBaseMode() {
  return modeById(game.customRules.baseModeId);
}

/* Two places do not read the hazard table and are gated here by hand:
   the pair of stones Classic scatters from level four whether or not the
   cap allows it, and the stone goals in the goal cycle. */
function makeCustomGoal(level) {
  const rules = game.customRules;
  if (rules.baseModeId === "elimination") return makeEliminationGoal(level);
  if (rules.stonesEnabled === true) return makeGoalForLevel(level);
  return makeGoalWithoutStones(level);
}

function layOutCustomHazards() {
  const rules = game.customRules;
  if (rules.baseModeId === "elimination") return;

  if (rules.stonesEnabled === true) {
    const toughness = stoneToughnessForLevel(game.level);
    if (game.goal.kind === "stone") {
      scatterStones(game.goal.target, toughness);
    } else if (rules.baseModeId !== "endless" && game.level >= 4) {
      scatterStones(2, toughness);
    }
  }

  if (rules.blightEnabled === true) {
    seedBlight();
  }
}

/* Fills the Custom entry's play time fields from a rules object, one
   assignment per field so a reader sees where each answer comes from.
   Called at boot with the defaults, whenever the setup screen changes a
   pick, and when a Custom run starts or loads, so the entry always holds
   the rules that matter right now. */
function applyCustomRules(rules, where) {
  checkCustomRules(rules, where);
  customRulesApplied = rules;

  const base = modeById(rules.baseModeId);
  const custom = modeById("custom");

  custom.items = base.items;
  custom.difficulties = base.difficulties;
  custom.hazards = composeCustomHazards(base, rules);
  custom.linkRules = rules.links;
  custom.loopsEnabled = rules.loopsEnabled;
  custom.carriesSpecials = rules.specialsCarryOver;

  custom.rebuildsBoardEachLevel = base.rebuildsBoardEachLevel;
  custom.refillsClearedCells = base.refillsClearedCells;
  custom.rerollsDeadBoard = base.rerollsDeadBoard;
  custom.showsLevelClearCard = base.showsLevelClearCard;

  custom.goalIsMet = base.goalIsMet;
  custom.makeGoalForLevel = makeCustomGoal;
  custom.layOutHazards = layOutCustomHazards;
  custom.advanceHazards = base.advanceHazards;
  custom.startBudget = base.startBudget;
  custom.levelClearBonus = base.levelClearBonus;
  custom.levelClearSubtitle = base.levelClearSubtitle;
  custom.nextLevelWarning = base.nextLevelWarning;

  custom.spendOnLink = base.spendOnLink;
  custom.lossBeforeGoal = base.lossBeforeGoal;
  custom.lossAfterGoal = base.lossAfterGoal;

  custom.advanceTime = base.advanceTime;
  custom.budgetRescue = base.budgetRescue;
  custom.takeContinue = base.takeContinue;
  custom.continueDescription = base.continueDescription;

  custom.limitLabel = base.limitLabel;
  custom.limitText = base.limitText;
  custom.limitIsCritical = base.limitIsCritical;
  custom.limitPressure = base.limitPressure;
}

/* The rules text for the entry as it currently stands: the shared rules
   printed from its link rules, each hazard only where it is on, then the
   base mode's own lines. */
function customRulesHtml() {
  const custom = modeById("custom");
  const base = modeById(customRulesApplied.baseModeId);
  const hazards = custom.hazards.normal;

  let text = howToPlayHtml(custom.linkRules, custom.loopsEnabled);
  if (hazards.maxStones > 0) text += stoneRuleHtml(custom.loopsEnabled);
  if (hazards.maxBlightOnBoard > 0) text += blightRuleHtml(custom.loopsEnabled);
  text += base.ownRulesHtml(hazards, custom.linkRules);
  return text;
}

/* The rules object the entry was last filled from. The setup screen
   fills it from the picks and a run fills it from its own copy, so this
   is whichever of the two is standing. */
let customRulesApplied = null;

function customDifficultySummary(difficultyId) {
  const rules = customRulesApplied;
  const base = modeById(rules.baseModeId);
  const links = rules.links;

  let text = base.name + " on " + difficultyName(difficultyId) + ": " +
    base.budgetPhrase(difficultyId) + " ";

  /* The Elimination base has no hazards to switch, so its sentence
     starts at the loops. */
  const switches = [];
  if (rules.baseModeId !== "elimination") {
    switches.push(rules.blightEnabled === true ? "blight on" : "blight off");
    switches.push(rules.stonesEnabled === true ? "stones on" : "stones off");
  }
  switches.push(rules.loopsEnabled === true ? "loops on" : "loops off");
  const switchesText = switches.join(", ") + ". ";
  text += switchesText.charAt(0).toUpperCase() + switchesText.slice(1);

  text += "Links of " + links.minLink;
  text += ", bomb " + (links.bombEnabled === true ? "at " + links.bombLink : "off");
  text += ", prism " + (links.prismEnabled === true ? "at " + links.prismLink : "off");
  text += ", chromatic " + (links.chromaticEnabled === true ? "at " + links.chromaticLink : "off") + ".";

  if (rules.specialsCarryOver === true) text += " Specials carry over.";
  return text;
}

/* Chosen when a new game starts and never mid run. Every mode carries a
   tuning block under each of these ids, and what those blocks hold is
   the mode's own business: Classic varies blight, stones and moves,
   where a mode with a clock varies the clock. */
const DIFFICULTIES = [
  { id: "easy",   name: "Easy" },
  { id: "normal", name: "Normal" },
  { id: "hard",   name: "Hard" }
];

const DEFAULT_DIFFICULTY = "normal";

function difficultyName(id) {
  for (let i = 0; i < DIFFICULTIES.length; i++) {
    if (DIFFICULTIES[i].id === id) return DIFFICULTIES[i].name;
  }
  throw new Error("PRISM PURGE: no difficulty called '" + id + "'.");
}

function modeById(id) {
  for (let i = 0; i < GAME_MODES.length; i++) {
    if (GAME_MODES[i].id === id) return GAME_MODES[i];
  }
  throw new Error("PRISM PURGE: no game mode called '" + id + "'.");
}

function activeMode() {
  return modeById(game.modeId);
}

/* What the mode itself is tuned to at the difficulty in play: what runs
   out, and how many continues you hold. */
function activeTuning() {
  const mode = activeMode();
  const tuning = mode.difficulties[game.difficulty];

  if (tuning === undefined) {
    throw new Error("PRISM PURGE: mode '" + mode.id + "' has no '" + game.difficulty +
      "' settings.");
  }
  return tuning;
}

/* What the board is doing to you at that difficulty: stones and blight.
   Shared by every mode that has them. */
function activeHazards() {
  const mode = activeMode();
  const hazards = mode.hazards[game.difficulty];

  if (hazards === undefined) {
    throw new Error("PRISM PURGE: the hazard table on mode '" + mode.id +
      "' has no '" + game.difficulty + "' settings.");
  }
  return hazards;
}

/* The link lengths in play: the minimum, and what forges at what length.
   Four modes name the standard set, and a mode that lets the player
   change them names its own. */
function activeLinkRules() {
  return activeMode().linkRules;
}

/* Every field above is required of every mode. This is a checklist for
   the entries, not a table anything reads at play time: a mode that
   forgets one says so at load, where it is a typo to fix, instead of at
   level twelve where it is a bug to hunt. */
const MODE_FIELDS = [
  "id", "name", "blurb", "rulesHtml", "ownRulesHtml", "difficulties", "difficultySummary", "budgetPhrase",
  "hazards", "tileGems", "drawTileMark", "items", "linkRules", "loopsEnabled", "carriesSpecials",
  "rebuildsBoardEachLevel",
  "refillsClearedCells", "rerollsDeadBoard", "showsLevelClearCard", "goalIsMet", "makeGoalForLevel",
  "layOutHazards", "advanceHazards", "startBudget",
  "levelClearBonus", "levelClearSubtitle", "nextLevelWarning", "spendOnLink",
  "lossBeforeGoal",
  "lossAfterGoal", "advanceTime", "budgetRescue", "takeContinue",
  "continueDescription", "limitLabel", "limitText", "limitIsCritical",
  "limitPressure"
];

/* A mode's three tuning blocks have to hold the same set of knobs as
   each other. Which knobs those are is the mode's business, so this
   compares the three against one another instead of against a list. A
   knob set on Normal and forgotten on Hard is the mistake being caught,
   and it is one that would otherwise read as undefined halfway up a run. */
function checkDifficultyBlocks(mode, where) {
  for (let i = 0; i < DIFFICULTIES.length; i++) {
    const difficultyId = DIFFICULTIES[i].id;

    if (mode.difficulties[difficultyId] === undefined) {
      throw new Error("PRISM PURGE: " + where + " has no '" + difficultyId + "' settings.");
    }
  }

  const reference = DIFFICULTIES[0].id;
  const referenceKnobs = Object.keys(mode.difficulties[reference]).sort();

  for (let i = 1; i < DIFFICULTIES.length; i++) {
    const difficultyId = DIFFICULTIES[i].id;
    const knobs = Object.keys(mode.difficulties[difficultyId]).sort();

    if (knobs.join(",") !== referenceKnobs.join(",")) {
      throw new Error("PRISM PURGE: on " + where + ", '" + difficultyId + "' and '" +
        reference + "' do not carry the same settings. " + reference + " has [" +
        referenceKnobs.join(", ") + "] and " + difficultyId + " has [" + knobs.join(", ") + "].");
    }
  }
}

function checkModeEntries() {
  for (let i = 0; i < GAME_MODES.length; i++) {
    const mode = GAME_MODES[i];
    const where = "game mode entry " + i + " (" + JSON.stringify(mode.id) + ")";

    for (let fieldIndex = 0; fieldIndex < MODE_FIELDS.length; fieldIndex++) {
      const field = MODE_FIELDS[fieldIndex];
      if (mode[field] === undefined) {
        throw new Error("PRISM PURGE: " + where + " is missing '" + field + "'.");
      }
    }

    checkDifficultyBlocks(mode, where);

    for (let itemIndex = 0; itemIndex < mode.items.length; itemIndex++) {
      const item = mode.items[itemIndex];
      const needed = item.aims === true ? "fireAt" : "fire";

      if (typeof item[needed] !== "function") {
        throw new Error("PRISM PURGE: item '" + item.id + "' on " + where +
          " aims " + item.aims + ", so it needs a '" + needed + "' function.");
      }
    }
  }
}

   BackgroundHandler
   Owns: background catalog, per-mode choices, image loading, and the
   background picker. Storage and run transitions call its public API.
   Stays out of: game rules, gem drawing, and Standard/HD menu styling.
   ===================================================================== */
const BACKGROUND_CATALOG = [
  { id: "cave", name: "Cave", path: "images/ingame_bg_cave.webp", position: "center" },
  { id: "ambient", name: "Ambient", path: "images/ingame_bg_ambient.webp", position: "center" },
  { id: "vibrant", name: "Vibrant", path: "images/ingame_bg_vibrant.webp", position: "center" },
  { id: "depth", name: "Depth", path: "images/ingame_bg_depth.webp", position: "center" },
  { id: "emerald", name: "Emerald", path: "images/ingame_bg_emerald.webp", position: "center" },
  { id: "ruby", name: "Ruby", path: "images/ingame_bg_ruby.webp", position: "center" },
  { id: "loop", name: "Loop", path: "images/ingame_bg_loop.webp", position: "center" }
];

const BackgroundHandler = (function () {
  const preferences = {};
  const catalog = new Map();
  const imageCache = new Map();
  const modeButtons = new Map();
  const choiceButtons = new Map();
  const backdrop = document.getElementById("gameBackdrop");
  const errorNote = document.getElementById("backgroundError");
  const page = document.getElementById("backgroundPage");
  const preview = document.getElementById("backgroundPreview");
  const description = document.getElementById("backgroundDescription");
  let selectedMode = "classic";
  let randomId = null;
  let visible = false;
  let imageReady = false;
  let imageError = "";
  let imageRequest = 0;
  let previewRequest = 0;

  for (const entry of BACKGROUND_CATALOG) {
    if (catalog.has(entry.id)) throw new Error("Duplicate background: " + entry.id);
    catalog.set(entry.id, entry);
  }
  for (const mode of GAME_MODES) {
    entryFor(mode.defaultBackground);
    preferences[mode.id] = "default";
  }

  function entryFor(id) {
    if (!catalog.has(id)) throw new Error("PRISM PURGE: unknown background " + JSON.stringify(id));
    return catalog.get(id);
  }

  function validateChoice(choice) {
    if (choice === "default" || choice === "none" || choice === "random") return choice;
    entryFor(choice);
    return choice;
  }

  function resolveImage(modeId) {
    const choice = preferences[modeId];
    if (choice === "none") return null;
    if (choice === "default") return modeById(modeId).defaultBackground;
    if (choice === "random") return randomId;
    return choice;
  }

  function chooseRandom(previous) {
    const candidates = BACKGROUND_CATALOG.filter(function (entry) { return entry.id !== previous; });
    if (candidates.length === 0) throw new Error("Random backgrounds require at least two images.");
    const index = Math.floor(Math.random() * candidates.length);
    return candidates[index].id;
  }

  /* Only two decoded images are retained by this module. In-flight
     requests may finish later, but their request number prevents them
     from replacing the player's more recent choice. */
  function loadImage(id) {
    const entry = entryFor(id);
    if (imageCache.has(id)) {
      const cached = imageCache.get(id);
      imageCache.delete(id);
      imageCache.set(id, cached);
      return cached;
    }
    const image = new Image();
    image.src = entry.path;
    const pending = image.decode().then(function () { return image; });
    imageCache.set(id, pending);
    if (imageCache.size > 2) imageCache.delete(imageCache.keys().next().value);
    return pending;
  }

  function syncVisibility() {
    backdrop.classList.toggle("hidden", visible === false || imageReady === false);
    errorNote.textContent = imageError;
    errorNote.classList.toggle("hidden", visible === false || imageError === "");
  }

  function fitImage() {
    const bounds = app.getBoundingClientRect();
    const ratio = bounds.width / bounds.height;
    const fit = ratio <= 0.4 || ratio >= 0.8 ? "contain" : "cover";
    backdrop.style.backgroundSize = "100% 100%, " + fit;
  }

  async function applyImage() {
    const request = ++imageRequest;
    const id = resolveImage(game.modeId);
    imageError = "";
    if (id === null) {
      imageReady = false;
      backdrop.style.backgroundImage = "none";
      syncVisibility();
      return;
    }
    const entry = entryFor(id);
    syncVisibility();
    try {
      const image = await loadImage(id);
      if (request !== imageRequest) return;
      backdrop.style.backgroundImage = 'linear-gradient(rgba(8, 6, 17, 0.30), rgba(8, 6, 17, 0.30)), url("' + image.src + '")';
      backdrop.style.backgroundPosition = "center, " + entry.position;
      imageReady = true;
      fitImage();
    } catch (failure) {
      if (request !== imageRequest) return;
      imageCache.delete(id);
      imageReady = false;
      imageError = entry.name + " background could not load. The plain board is shown. Your choice is still saved.";
      console.error("PRISM PURGE: background failed at " + entry.path, failure);
    }
    syncVisibility();
  }

  function choiceLabel(choice) {
    if (choice === "default") return "Mode Default (" + entryFor(modeById(selectedMode).defaultBackground).name + ")";
    if (choice === "none") return "No Background";
    if (choice === "random") return "Random Each Level";
    return entryFor(choice).name;
  }

  async function refreshPreview() {
    const request = ++previewRequest;
    const choice = preferences[selectedMode];
    preview.classList.add("hidden");
    preview.removeAttribute("src");
    if (choice === "none" || choice === "random") {
      description.textContent = choice === "none"
        ? "Uses the plain board in your chosen graphics style."
        : "A different image each level. Retries keep the same background.";
      return;
    }
    const id = choice === "default" ? modeById(selectedMode).defaultBackground : choice;
    const entry = entryFor(id);
    description.textContent = "Loading " + entry.name + " preview.";
    try {
      const image = await loadImage(id);
      if (request !== previewRequest) return;
      preview.src = image.src;
      preview.alt = entry.name + " background preview";
      preview.classList.remove("hidden");
      description.textContent = modeById(selectedMode).name + ": " + choiceLabel(choice);
    } catch (failure) {
      if (request !== previewRequest) return;
      imageCache.delete(id);
      description.textContent = entry.name + " preview could not load. Your choice is still saved.";
      console.error("PRISM PURGE: background preview failed at " + entry.path, failure);
    }
  }

  function refreshPicker() {
    for (const [id, button] of modeButtons) {
      button.classList.toggle("picked", id === selectedMode);
      button.setAttribute("aria-pressed", String(id === selectedMode));
    }
    for (const [choice, button] of choiceButtons) {
      button.textContent = choiceLabel(choice);
      button.classList.toggle("picked", choice === preferences[selectedMode]);
      button.setAttribute("aria-pressed", String(choice === preferences[selectedMode]));
    }
    refreshPreview();
  }

  function selectChoice(choice) {
    if (preferences[selectedMode] === choice) return;
    preferences[selectedMode] = validateChoice(choice);
    saveSettings();
    if (screens.current === "playing" && selectedMode === game.modeId) {
      randomId = choice === "random" ? chooseRandom(randomId) : null;
      applyImage();
      saveGame();
    }
    refreshPicker();
  }

  function addChoice(choice) {
    const button = document.createElement("button");
    button.className = "menuItem pickBtn";
    button.addEventListener("click", function () { selectChoice(choice); });
    document.getElementById("backgroundChoices").appendChild(button);
    choiceButtons.set(choice, button);
  }

  function close() {
    previewRequest++;
    page.classList.add("hidden");
  }

  return {
    init: function () {
      for (const mode of GAME_MODES) {
        const button = document.createElement("button");
        button.className = "pickBtn";
        button.textContent = mode.name;
        button.addEventListener("click", function () {
          selectedMode = mode.id;
          refreshPicker();
        });
        document.getElementById("backgroundModes").appendChild(button);
        modeButtons.set(mode.id, button);
      }
      addChoice("default");
      addChoice("none");
      addChoice("random");
      for (const entry of BACKGROUND_CATALOG) addChoice(entry.id);
      document.getElementById("backgroundSettings").addEventListener("click", function () {
        selectedMode = game.modeId;
        settingsPage.classList.add("hidden");
        page.classList.remove("hidden");
        menuTitle.textContent = "Backgrounds";
        refreshPicker();
        modeButtons.get(selectedMode).focus();
      });
      document.getElementById("backgroundBack").addEventListener("click", function () {
        showSettingsPage(settingsReturnsTo);
        document.getElementById("backgroundSettings").focus();
      });
      new ResizeObserver(fitImage).observe(app);
    },
    preferences: function () { return { ...preferences }; },
    restorePreferences: function (stored) {
      if (stored === null || typeof stored !== "object" || Array.isArray(stored)) {
        throw new Error("PRISM PURGE: background preferences must be an object.");
      }
      for (const mode of GAME_MODES) preferences[mode.id] = validateChoice(stored[mode.id]);
    },
    beginRun: function () {
      randomId = preferences[game.modeId] === "random" ? chooseRandom(null) : null;
      imageReady = false;
      applyImage();
    },
    nextLevel: function () {
      if (preferences[game.modeId] !== "random") return;
      randomId = chooseRandom(randomId);
      applyImage();
    },
    restoreRun: function (savedId) {
      if (savedId !== null) entryFor(savedId);
      randomId = savedId;
      // Old runs have no random image; pick once on their first restore.
      if (preferences[game.modeId] === "random" && randomId === null) randomId = chooseRandom(null);
      if (preferences[game.modeId] !== "random") randomId = null;
      imageReady = false;
      applyImage();
    },
    randomId: function () { return randomId; },
    setVisible: function (shown) { visible = shown; syncVisibility(); },
    isVisible: function () { return visible && imageReady; },
    isOpen: function () { return page.classList.contains("hidden") === false; },
    close: close
  };
})();

/* ------------------------------------------------------------------
   Starting and advancing a run
   ------------------------------------------------------------------ */

function startRun(modeId, difficulty) {
  game.modeId = modeId;
  game.difficulty = difficulty;

  /* A Custom run plays the picks as they stood when it began, on its own
     copy, so the setup screen can be changed underneath it. */
  if (modeId === "custom") {
    game.customRules = cloneCustomRules(customPicks);
    applyCustomRules(game.customRules, "the rules this Custom run was begun on");
  } else {
    game.customRules = null;
  }
  game.specialCarry = { bomb: 0, prism: 0, chromatic: 0 };

  game.bestScore = loadBest(modeId, difficulty);

  /* The row belongs to the mode, so it is built once the mode is known
     and rebuilt whenever that answer changes. */
  buildItemBar();
  game.score = 0;
  game.level = 1;
  game.charge = 0;
  game.aiming = "none";
  game.continues = activeTuning().continuesAtStart;
  game.blightCarry = 0;
  BackgroundHandler.beginRun();
  startLevel(true);
}

/* One level up, on whatever board the mode says this level should get. */
function advanceToNextLevel() {
  game.level++;
  BackgroundHandler.nextLevel();
  startLevel(activeMode().rebuildsBoardEachLevel);
}

/* Lay out a level. Called for a new run, for a new level, and for a
   retry after a continue.

   rebuildBoard is the one thing those three do not agree on. A run
   always opens on a fresh board. A new level gets one only if the mode
   asks for it, which is what lets a mode carry a single board through a
   whole run. */
function startLevel(rebuildBoard) {
  const mode = activeMode();

  game.budget = mode.startBudget(game.level);
  game.goal = mode.makeGoalForLevel(game.level);
  game.movesSinceBlight = 0;
  game.path = [];
  game.pathColour = -1;
  game.pathColours = [];
  game.loopClosed = false;
  game.aiming = "none";
  game.scoreAtLevelStart = game.score;
  particles.length = 0;
  floaters.length = 0;
  shockwaves.length = 0;
  blightCrawls.length = 0;
  screenFlash = null;
  milestoneWord = null;

  if (rebuildBoard === true) {
    buildBoard();
    placeCarriedSpecials();
  }

  /* Always, because a mode that keeps its board still gets a new goal
     each level and a goal that asks for stones has to put them
     somewhere. */
  mode.layOutHazards();

  ensureSolvableBoard();
  clearHint();

  game.phase = "idle";
  setMusicForLevel(game.level);
  refreshHud();
  saveGame();
}

/* The bombs, prisms and chromatics standing when the last level cleared,
   on a mode that carries them. Uncapped, because they were earned. */
function countSpecials() {
  const counts = { bomb: 0, prism: 0, chromatic: 0 };

  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cell = cellAt(row, col);
      if (cell.kind !== "gem") continue;
      if (cell.special === "bomb") counts.bomb++;
      if (cell.special === "prism") counts.prism++;
      if (cell.special === "chromatic") counts.chromatic++;
    }
  }

  return counts;
}

/* Puts the carried specials onto a fresh board, each on a random plain
   gem, and empties the count so nothing is placed twice. */
function placeCarriedSpecials() {
  placeSpecialsOfKind("bomb", game.specialCarry.bomb);
  placeSpecialsOfKind("prism", game.specialCarry.prism);
  placeSpecialsOfKind("chromatic", game.specialCarry.chromatic);
  game.specialCarry = { bomb: 0, prism: 0, chromatic: 0 };
}

function placeSpecialsOfKind(special, count) {
  for (let placed = 0; placed < count; placed++) {
    const plainGems = [];
    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        const cell = cellAt(row, col);
        if (cell.kind === "gem" && cell.special === "none") {
          plainGems.push(cell);
        }
      }
    }
    if (plainGems.length === 0) return;

    const pick = plainGems[Math.floor(Math.random() * plainGems.length)];
    pick.special = special;
  }
}

/* The blight you failed to clear last level follows you into this one.
   New levels also get their own seeds, and whichever is larger wins so
   the two do not compound into an unplayable opening. */
function seedBlight() {
  const hazards = activeHazards();

  let ownSeeds = 0;
  if (game.level >= hazards.blightSeedsFromLevel) {
    const grown = 1 + Math.floor(game.level / hazards.blightSeedsEvery);
    ownSeeds = Math.min(hazards.blightSeedsCap, grown);
  }

  /* The carry cap doubles as the opening ceiling, which is what keeps a
     level from starting at or near the number that ends it. */
  const carried = Math.min(game.blightCarry, hazards.blightCarryCap);
  const total = Math.min(Math.max(ownSeeds, carried), hazards.blightCarryCap);

  for (let i = 0; i < total; i++) {
    infectRandomCell();
  }
}

/* ------------------------------------------------------------------
   The Blight
   ------------------------------------------------------------------ */

function countBlight() {
  let total = 0;
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      if (cellAt(row, col).blighted === true) total++;
    }
  }
  return total;
}

function infectRandomCell() {
  if (blightIsAtCap() === true) return;

  const candidates = [];
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cell = cellAt(row, col);
      if (cell.kind === "gem" && cell.blighted === false) {
        candidates.push({ row: row, col: col });
      }
    }
  }
  if (candidates.length === 0) return;

  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  cellAt(pick.row, pick.col).blighted = true;
  cellAt(pick.row, pick.col).blightAge = 0;
  cellAt(pick.row, pick.col).blightShow = 1;
  spawnBlightPuff(pick.row, pick.col);
}

/* Existing blight reaches into a neighbouring gem. */
function spreadBlight() {
  if (blightIsAtCap() === true) return;

  const sources = [];
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      if (cellAt(row, col).blighted === true) {
        sources.push({ row: row, col: col });
      }
    }
  }
  if (sources.length === 0) {
    infectRandomCell();
    return;
  }

  const from = sources[Math.floor(Math.random() * sources.length)];
  const targets = [];
  const steps = [[-1, 0], [1, 0], [0, -1], [0, 1]];

  for (let i = 0; i < steps.length; i++) {
    const row = from.row + steps[i][0];
    const col = from.col + steps[i][1];
    if (insideBoard(row, col)) {
      const cell = cellAt(row, col);
      if (cell.kind === "gem" && cell.blighted === false) {
        targets.push({ row: row, col: col });
      }
    }
  }

  if (targets.length === 0) {
    infectRandomCell();
    return;
  }

  const pick = targets[Math.floor(Math.random() * targets.length)];
  cellAt(pick.row, pick.col).blighted = true;
  cellAt(pick.row, pick.col).blightAge = 0;
  cellAt(pick.row, pick.col).blightShow = 1;
  spawnBlightPuff(pick.row, pick.col);
  playTone(90, 0.3, "sawtooth", 0.09);
}

function advanceBlight() {
  const interval = blightIntervalForLevel(game.level);
  if (interval === 0) return;

  game.movesSinceBlight++;
  if (game.movesSinceBlight < interval) return;

  game.movesSinceBlight = 0;
  spreadBlight();
}

/* Where a blight can walk to: a clean gem straight up, down, left or
   right of it. Diagonals are left out, the same way spreadBlight leaves
   them out, so a blight can be walled off by blocking four sides.

   Cells already bursting are no good at either end of the walk. They
   are on their way off the board, and building a stone on top of one
   would cancel a clear that is already under way. */
function blightWalkTargets(spot) {
  const steps = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  const targets = [];

  for (let i = 0; i < steps.length; i++) {
    const row = spot.row + steps[i][0];
    const col = spot.col + steps[i][1];
    if (insideBoard(row, col) === false) continue;

    const cell = cellAt(row, col);
    if (cell.kind !== "gem") continue;
    if (cell.blighted === true) continue;
    if (cell.doomed === true) continue;

    targets.push({ row: row, col: col });
  }

  return targets;
}

/* Walled in on all four sides, the blight stays where it is and waits
   for its next turn to come round.

   The board is changed here and now, so nothing downstream has to deal
   with a blight that is halfway between two cells. What the player sees
   is a crawl laid over the top: the gem it left sets as stone, the
   blight travels across, and the gem it is heading for keeps its blight
   hidden until the crawl lands on it. */
function moveBlightFrom(spot) {
  const targets = blightWalkTargets(spot);
  if (targets.length === 0) return;

  const pick = targets[Math.floor(Math.random() * targets.length)];
  const next = cellAt(pick.row, pick.col);
  next.blighted = true;
  next.blightAge = 0;
  next.blightShow = -(BLIGHT_SET_SECONDS + BLIGHT_CRAWL_SECONDS);

  const stone = makeStone(BLIGHT_STONE_HP);
  game.board[spot.row][spot.col] = stone;

  spawnBlightCrawl(stone, next);
  spawnStoneSetRing(spot.row, spot.col);
  playBlightSet();
}

/* One blight on its way from the gem it turned to stone to the gem it
   picked. Both ends are held as cell objects because gravity can drop
   them into different rows while the crawl is still playing, and the
   blob has to land where the blight actually ended up. */
function spawnBlightCrawl(fromCell, toCell) {
  blightCrawls.push({
    fromCell: fromCell,
    toCell: toCell,
    age: 0,
    trailTimer: 0,
    crawlSoundPlayed: false,
    landed: false
  });
}

/* Where a cell object is sitting on the board right now. */
function findCellSpot(target) {
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      if (game.board[row][col] === target) return { row: row, col: col };
    }
  }
  return null;
}

/* The point the blob is at, and how far along it is. A lift on the way
   over turns the slide into a lunge. */
function blightCrawlPoint(crawl) {
  const from = findCellSpot(crawl.fromCell);
  const to = findCellSpot(crawl.toCell);
  if (from === null || to === null) return null;

  const start = cellCentre(from.row, from.col);
  const end = cellCentre(to.row, to.col);

  const travelled = crawl.age - BLIGHT_SET_SECONDS;
  if (travelled <= 0) {
    return { x: start.x, y: start.y, progress: 0 };
  }

  let progress = travelled / BLIGHT_CRAWL_SECONDS;
  if (progress > 1) progress = 1;

  /* Slow off the mark, quick across the middle, settling as it lands. */
  const eased = progress < 0.5
    ? 4 * progress * progress * progress
    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

  const lift = Math.sin(progress * Math.PI) * layout.cell * 0.38;

  return {
    x: start.x + (end.x - start.x) * eased,
    y: start.y + (end.y - start.y) * eased - lift,
    progress: progress
  };
}

function updateBlightCrawls(dt) {
  for (let i = blightCrawls.length - 1; i >= 0; i--) {
    const crawl = blightCrawls[i];
    crawl.age += dt;

    const point = blightCrawlPoint(crawl);
